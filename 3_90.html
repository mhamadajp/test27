<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統計検定3級学習ドリル（実践編）</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen">
    <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl md:text-3xl font-extrabold mb-2 text-center text-gray-800 tracking-tight">統計検定3級学習ドリル</h1>
        <p class="text-center text-sm md:text-base text-gray-500 mb-8 font-medium">出題範囲完全網羅（全90問）</p>
        
        <div id="menu" class="space-y-4">
            <h2 class="text-xl font-bold border-b-2 border-gray-200 pb-2 text-gray-700">学習モードを選択</h2>
            
            <button onclick="loadMode('data')" class="w-full bg-blue-500 text-white p-5 rounded-xl shadow-md hover:bg-blue-600 hover:shadow-lg transition-all text-left">
                <div class="font-bold text-lg mb-1">1. データの種類と集計、時系列 (全30問)</div>
                <div class="text-xs md:text-sm font-normal opacity-90">尺度の種類、標本と実験、多様なグラフ（バブル、ローソク足、モザイク図等）、クロス集計、移動平均など</div>
            </button>
            
            <button onclick="loadMode('graph')" class="w-full bg-green-500 text-white p-5 rounded-xl shadow-md hover:bg-green-600 hover:shadow-lg transition-all text-left">
                <div class="font-bold text-lg mb-1">2. 代表値、散らばり、相関と回帰 (全30問)</div>
                <div class="text-xs md:text-sm font-normal opacity-90">平均・分散の計算、箱ひげ図、幹葉図、共分散、相関係数と擬相関、回帰直線（最小二乗法）など</div>
            </button>
            
            <button onclick="loadMode('prob')" class="w-full bg-yellow-600 text-white p-5 rounded-xl shadow-md hover:bg-yellow-700 hover:shadow-lg transition-all text-left">
                <div class="font-bold text-lg mb-1">3. 確率分布と統計的な推測 (全30問)</div>
                <div class="text-xs md:text-sm font-normal opacity-90">条件付き確率、期待値、二項分布、正規分布、標本分布、区間推定、仮説検定の基礎など</div>
            </button>
            
            <button onclick="loadMode('mock')" class="w-full bg-purple-600 text-white p-5 rounded-xl shadow-md hover:bg-purple-700 hover:shadow-lg transition-all text-center mt-6 border-b-4 border-purple-800">
                <div class="font-black text-xl">模擬試験モード</div>
                <div class="text-sm opacity-90 mt-1">全分野からランダムに30問出題</div>
            </button>
        </div>

        <div id="quiz-container" class="hidden">
            <div class="flex justify-between items-center mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                <div id="progress" class="text-sm md:text-base text-gray-700 font-bold"></div>
                <button onclick="location.reload()" class="text-sm text-red-500 hover:text-red-700 font-bold flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    終了する
                </button>
            </div>
            
            <div id="question" class="text-lg md:text-xl font-bold mb-6 text-gray-800 leading-relaxed border-l-4 border-blue-500 pl-4 py-1"></div>
            
            <div id="options" class="space-y-3"></div>
            
            <div id="feedback" class="mt-6 p-5 rounded-lg hidden transition-all"></div>
            
            <button id="next-btn" onclick="nextQuestion()" class="hidden mt-6 w-full bg-gray-800 text-white p-4 rounded-xl font-bold text-lg hover:bg-gray-700 transition-colors shadow-lg active:scale-95">次の問題へ進む</button>
        </div>
        
        <div id="result-container" class="hidden text-center py-10">
            <h2 class="text-3xl font-black mb-6 text-gray-800">試験結果</h2>
            <div id="score" class="mb-10"></div>
            <button onclick="location.reload()" class="bg-gray-800 text-white p-4 rounded-xl w-full max-w-md mx-auto font-bold text-lg hover:bg-gray-700 transition shadow-lg block">トップメニューへ戻る</button>
        </div>
    </div>

    <script>
        const quizData = {
            data: [
                {q: "ある市が、市民の健康状態を調査するために、住民基本台帳から無作為に1000人を選んでアンケートを郵送した。このときの「1000人」を何と呼ぶか。", options: ["母集団", "標本", "有意抽出", "全数"], correct: 1, explanation: "調査で本当に知りたい対象全体（この場合は「全市民」）を『母集団』と呼びます。しかし、全員を調べることは難しいため、そこから一部を取り出して調べます。この取り出された一部の集団（1000人）を『標本（サンプル）』と呼びます。"},
                {q: "質的変数（カテゴリカルデータ）であり、かつ「名義尺度」に該当するものはどれか。", options: ["社員の役職（平社員、主任、課長、部長）", "マラソン大会のゼッケン番号", "気温（摂氏）", "アンケートの満足度（1〜5の5段階）"], correct: 1, explanation: "名義尺度は「単に区別するためだけに付けられた名前や番号」です。ゼッケン番号は大小関係に意味がありません。一方、役職や満足度は大小関係（順位）に意味があるので『順序尺度』、気温は間隔が等しい『間隔尺度』に分類されます。"},
                {q: "「身長、体重、距離」などのように、0が「絶対に何もない状態（絶対零点）」を意味し、値の差だけでなく「比率（AはBの2倍など）」にも意味があるデータを何尺度と呼ぶか。", options: ["名義尺度", "順序尺度", "間隔尺度", "比例（比率）尺度"], correct: 3, explanation: "比例尺度は、四則演算（＋、－、×、÷）すべてに意味を持つ最も情報量の多いデータです。例えば体重が「60kgは30kgの2倍重い」と言えるのは、0kgが「全く重さがない」ことを意味するからです。"},
                {q: "ある農学者が、新しい肥料の効果を調べるため、同じ条件の畑を2つ用意し、一方の畑には新肥料を与え、もう一方の畑には従来の肥料を与えてトマトの収穫量を比較した。この研究手法を何というか。", options: ["観察研究", "実験研究", "国勢調査", "層化抽出法"], correct: 1, explanation: "研究者が意図的に対象へ介入（この場合は「新肥料を与える」という処理）を行い、その結果生じる違いを比較・分析する手法を『実験研究』と呼びます。単に現状をありのままに観察するだけの『観察研究』とは明確に区別されます。"},
                {q: "上記の実験研究において、新しい肥料を与えられた畑を「処理群」と呼ぶのに対し、比較の基準とするために従来の肥料を与えられた畑を何と呼ぶか。", options: ["実験群", "対照群（コントロール群）", "標本群", "有意群"], correct: 1, explanation: "新しい処理（介入）を施したグループを『処理群』、比較の基準とするために処理を施さない（または従来の処理や偽薬を施す）グループを『対照群（コントロール群）』と呼びます。この2つを比較することで、処理の真の効果を測ります。"},
                {q: "ある高校で、1年生、2年生、3年生の生徒数の比率が 3：3：4 である。生徒の意識調査を行うため、全体のサンプルサイズが100人になるように、1年生から30人、2年生から30人、3年生から40人を無作為に選んだ。この抽出方法を何というか。", options: ["単純無作為抽出法", "層化抽出法", "集落抽出法", "系統抽出法"], correct: 1, explanation: "母集団（全校生徒）をあらかじめいくつかのグループ（層：この場合は学年）に分け、各層の大きさに比例するようにそれぞれの層から無作為に標本を抽出する方法を『層化（そうか）抽出法』と呼びます。母集団の構成比を正確に反映できるため精度が高くなります。"},
                {q: "日本に住むすべての人と世帯を対象として、5年ごとに国が行う「国勢調査」は、次のうちどの調査方法にあたるか。", options: ["標本調査", "実験研究", "全数調査（センサス）", "観察研究"], correct: 2, explanation: "母集団のすべて（全員）を漏れなく調べる調査を『全数調査』または『センサス』と呼びます。時間とコストが膨大にかかるため、国勢調査などの非常に重要な統計調査に限られます。"},
                {q: "アンケートで、「あなたはスマートフォンを持っていますか？また、毎日3時間以上使いますか？」と1つの質問で聞くことの問題点を表す統計の用語はどれか。", options: ["誘導尋問", "キャリーオーバー効果", "ダブルバーレル質問", "社会的望ましさバイアス"], correct: 2, explanation: "1つの質問文の中に2つ以上の論点（「スマホを持っているか」と「3時間以上使うか」）が含まれている質問を『ダブルバーレル質問』と呼びます。回答者がどちらに対して答えていいか分からず、正確なデータが取れなくなるため避けるべきです。"},
                {q: "ヒストグラムと棒グラフの見た目の違いとして、最も適切な説明はどれか。", options: ["棒グラフは縦書き、ヒストグラムは横書きである。", "棒グラフは棒の間に隙間を空けるが、ヒストグラムは隙間を空けずに描く。", "棒グラフは色を付けるが、ヒストグラムは白黒で描く。", "違いは全くない。"], correct: 1, explanation: "棒グラフはカテゴリ別（質的データ：血液型など）なので、独立した項目であることを示すために棒の間に隙間を空けます。一方、ヒストグラムは連続する区間（量的データ：身長など）を表すため、データが繋がっていることを示すために棒と棒をくっつけて描きます。"},
                {q: "「商品の売上金額」と「販売個数」、「気温」など、単位や尺度が全く異なる2つのデータ（指標）を同時に1つのグラフ上で比較したい場合、最も適したグラフはどれか。", options: ["円グラフ", "モザイク図", "複合グラフ", "レーダーチャート"], correct: 2, explanation: "例えば「売上金額」を棒グラフで、「気温」を折れ線グラフで描き、左右に異なる目盛り（軸）を設定して重ね合わせたグラフを『複合グラフ』と呼びます。異なる性質のデータ間の関係性を視覚的に探るのに便利です。"},
                {q: "あるRPGゲームのキャラクターについて、「攻撃力」「防御力」「素早さ」「賢さ」「運」の5つの能力値を比較したい。中心からの放射状の軸に各値をプロットして結び、バランスや特徴をひと目で把握するのに適したグラフはどれか。", options: ["散布図", "レーダーチャート", "バブルチャート", "箱ひげ図"], correct: 1, explanation: "複数の評価項目（変数）を多角形で表したものを『レーダーチャート』と呼びます。面積が広いほど総合力が高く、形がいびつなほど特定の特徴に偏っていることが直感的にわかります。"},
                {q: "散布図は通常、縦軸と横軸で2つのデータの関係を表すが、さらに各プロットの「円の大きさ（面積）」という3つ目の要素を加えて、3つの変数の関係を同時に表現したグラフを何というか。", options: ["モザイク図", "積み上げ棒グラフ", "バブルチャート", "ローソク足"], correct: 2, explanation: "例えば、横軸を「人口」、縦軸を「平均寿命」、円の大きさを「GDP」として描くことで、3つの指標の関係性を1枚の図で表現できるグラフを『バブルチャート』と呼びます。"},
                {q: "株価や為替レートの推移を表す際、「始値（はじめね）」「高値」「安値」「終値（おわりね）」の4つの情報を1つの図形で表し、それを時系列に並べたグラフを何というか。", options: ["モザイク図", "ローソク足", "箱ひげ図", "幹葉図"], correct: 1, explanation: "1日（または一定期間）の価格の動きを、実体（四角い部分）とヒゲ（上下の線）で表現したものを『ローソク足（キャンドルチャート）』と呼びます。金融分野で非常によく使われるグラフです。"},
                {q: "2つの質的変数（例：「性別」と「支持政党」）のクロス集計表を視覚化したもので、全体の大きな長方形を縦と横の割合で分割し、各四角形の「面積」で人数の多さ（割合）を表した図を何というか。", options: ["バブルチャート", "積み上げ棒グラフ", "モザイク図", "散布図"], correct: 2, explanation: "縦の変数（性別など）と横の変数（支持政党など）の比率で面積を分割していくグラフを『モザイク図』と呼びます。視覚的に2つの変数に関連性（独立性があるかないか）を見るのに便利です。"},
                {q: "度数分布表において、ある階級が「20以上〜30未満」であるとき、この階級の「階級値」はいくらか。", options: ["20", "25", "30", "50"], correct: 1, explanation: "階級値とは、その階級（区間）を代表する値のことで、通常は階級の「ちょうど真ん中の値」を用います。計算式は（下限値＋上限値）÷ 2 なので、(20＋30) ÷ 2 ＝ 25 となります。"},
                {q: "度数分布表において、ある階級の度数（人数など）を、全体の度数の合計で割った値（つまり全体に対する割合）を何と呼ぶか。", options: ["累積度数", "階級値", "相対度数", "平均度数"], correct: 2, explanation: "全体に対するその階級の割合を示したものが『相対度数』です。たとえば全体が50人で、その階級に10人いれば、相対度数は 10 ÷ 50 ＝ 0.20 となります。すべての階級の相対度数を足すと必ず 1 になります。"},
                {q: "度数分布表において、最初の階級からある階級までの「相対度数」を次々と足し合わせたものを何と呼ぶか。", options: ["累積度数", "限界相対度数", "累積相対度数", "合計相対度数"], correct: 2, explanation: "順に足し上げていくことで、「〇〇点以下の人が全体で何％いるか」がすぐに分かる指標を『累積相対度数』と呼びます。最後の階級の累積相対度数は必ず 1 になります。"},
                {q: "「性別（男女）」と「好きな科目（国・数・英）」のように、2つの質的変数を縦と横に配置して、それぞれに該当する人数を集計した表を何と呼ぶか。", options: ["度数分布表", "クロス集計表（分割表）", "相関表", "乱数表"], correct: 1, explanation: "2つの項目を掛け合わせて（クロスさせて）集計した表を『クロス集計表』、または『分割表（2元表）』と呼びます。2つの変数の間に関連があるかどうかを分析する基本となります。"},
                {q: "クロス集計表において、表の右端や下端に計算される、各変数単独の「合計欄」の分布を何と呼ぶか。", options: ["周辺分布", "条件付き分布", "正規分布", "同時分布"], correct: 0, explanation: "クロス集計表の「周辺（端っこ）」に書かれる、全体の男女比や、全体の好きな科目の比率など、合計値の分布を『周辺分布』と呼びます。"},
                {q: "クロス集計表において、「女子」という行だけに注目し、女子の中での「好きな科目の割合」を計算したものを何分布と呼ぶか。", options: ["周辺分布", "条件付き分布", "同時分布", "累積分布"], correct: 1, explanation: "「女子である」という特定の条件を満たすグループの中だけで計算した分布を『条件付き分布』と呼びます。男子の条件付き分布と比較することで、性別による好みの違いを分析できます。"},
                {q: "毎月の売上データなど（時系列データ）において、季節や曜日による周期的な変動や細かい不規則な変動をなめらかにして、長期的な「トレンド（傾向）」を見やすくする計算手法を何というか。", options: ["指数化", "標準化", "移動平均", "最小二乗法"], correct: 2, explanation: "たとえば「過去7日間の平均」を毎日ズラしながら計算してグラフに描くことで、日々のギザギザした変化を滑らかにする手法を『移動平均』と呼びます。"},
                {q: "時系列データにおいて、ある特定の基準となる時点（基準時）のデータ値を「100」とし、他の時点のデータが基準時の何倍（何%）にあたるかを計算して表した数値を何というか。", options: ["偏差値", "Zスコア", "指数（インデックス）", "変動係数"], correct: 2, explanation: "消費者物価指数（CPI）や日経平均株価のように、基準からの変化率を分かりやすくするために100を基準として算出した数値を『指数（インデックス）』と呼びます。"},
                {q: "時系列データが持つ4つの変動要因は、「傾向変動（トレンド）」「循環変動」「不規則変動」と、もう一つは何か。", options: ["気候変動", "価格変動", "季節変動", "為替変動"], correct: 2, explanation: "1年ごとの周期（例：夏にアイスが売れる、冬に暖房器具が売れる）や、1週間の周期（例：土日に来客が増える）など、決まった周期で繰り返される変化を『季節変動』と呼びます。"},
                {q: "データの一部が回答忘れや測定ミスで欠けている値を「欠損値」という。欠損値の処理として、一般的に**不適切**なものはどれか。", options: ["欠損値を含むデータ行を分析から除外する。", "過去のデータや平均値などを用いて、もっともらしい値で欠損値を埋める（補完する）。", "なぜ欠損したのか理由を推測し、それに応じて対応を変える。", "欠損値は計算できないので、何も考えずにすべて「0」として扱う。"], correct: 3, explanation: "体重のデータが欠けているのに一律に「0kg」として平均を計算すると、結果が大きく歪んでしまいます。欠損値を0として扱うのは非常に危険であり、原則としてやってはいけません。"},
                {q: "アンケート調査において、調査対象者が回答しなかったり、不在で調査できなかったりすることで生じる、データの偏り（バイアス）を何というか。", options: ["標本誤差", "測定誤差", "無回答誤差", "入力誤差"], correct: 2, explanation: "「回答しなかった人」に共通の特徴（例：忙しい人、そのテーマに全く興味がない人）がある場合、集まったデータだけを分析すると、母集団の真の姿からズレてしまいます。これを『無回答誤差』と呼びます。"},
                {q: "調査において、母集団から標本を抽出する際に、偶然の要素（くじ引きの運など）によって生じる、母集団の真の値と標本から得られた値とのズレを何というか。", options: ["標本誤差", "非標本誤差", "測定誤差", "系統誤差"], correct: 0, explanation: "どんなに正しく無作為抽出を行っても、一部しか調べない以上、全体との間には必ず偶然によるズレが生じます。これを『標本誤差』と呼びます。サンプルサイズ（調査人数）を増やすことで、この誤差は小さくなります。"},
                {q: "階級の幅が等しくない（例えば「0〜10」「10〜30」など）ヒストグラムを作成する際、縦軸には度数ではなく何をプロットすべきか。", options: ["累積度数", "相対度数", "単位幅あたりの度数（度数密度）", "階級値"], correct: 2, explanation: "ヒストグラムは「長方形の面積＝度数（割合）」となるように描くのが原則です。幅が広い階級で単に人数を高さにしてしまうと、面積が不当に大きくなり視覚的に嘘をつくことになります。そのため、縦軸は「度数 ÷ 階級の幅（単位幅あたりの度数）」にする必要があります。"},

                {q: "ある事象Aが起こる確率をP(A)とする。「Aが起こらない確率（余事象の確率）」を表す式はどれか。", options: ["1 + P(A)", "P(A) - 1", "1 - P(A)", "0"], correct: 2, explanation: "全事象の確率は1（100%）です。したがって、Aが起こらない確率（余事象）は、全体からAが起こる確率を引いた 1 - P(A) となります。"},
                {q: "コインを3回続けて投げるとき、「少なくとも1回は表」が出る確率は？", options: ["1/8", "3/8", "7/8", "1"], correct: 2, explanation: "「少なくとも〜」は余事象を考えます。すべて裏が出る確率は (1/2)×(1/2)×(1/2) = 1/8。よって少なくとも1回表が出る確率は 1 - 1/8 = 7/8 です。"},
                {q: "1回100円で引けるくじがある。10%の確率で500円が当たり、90%の確率で外れ(0円)となる。このくじの賞金の期待値（平均値）はいくらか。", options: ["10円", "50円", "100円", "500円"], correct: 1, explanation: "期待値は（値 × その確率）を全て足して求めます。 500円 × 0.1 ＋ 0円 × 0.9 ＝ 50円。1回引くごとに平均50円もらえる計算になります（参加費100円なので損ですね）。"},
                {q: "「サイコロを1回投げて偶数の目が出た」という条件のもとで、「その目が4以上である」確率（条件付き確率）はいくらか。", options: ["1/6", "1/3", "1/2", "2/3"], correct: 3, explanation: "「偶数が出た」という情報によって、分母は {2, 4, 6} の3通りに絞られます。そのうち4以上なのは {4, 6} の2通り。したがって確率は 2/3 です。"},
                {q: "同じ条件でサイコロを何度も繰り返し投げると、1の目が出る割合（相対度数）はだんだん理論上の確率である 1/6 に近づいていく。この法則を何というか。", options: ["大数の法則", "中心極限定理", "正規分布", "ベイズの定理"], correct: 0, explanation: "試行回数を無限に多くすればするほど、実際に起こる割合が理論上の確率に収束していくことを『大数の法則（たいすうのほうそく）』と呼びます。"},
                {q: "次のうち、離散型の確率変数として適切なものはどれか。", options: ["明日降る雨の量", "あるクラスの生徒の体重", "10回シュートをしてゴールに入る回数", "駅から学校までにかかる時間"], correct: 2, explanation: "離散型とは「1回、2回」のようにとびとびの値をとるものです。降水量や体重、時間は 1.52... のように連続的などんな値でもとりうるため連続型の確率変数です。"},
                {q: "確率変数 X の期待値（平均）を E(X) と表す。新しい確率変数 Y = 2X + 3 の期待値 E(Y) を表す式として正しいものはどれか。", options: ["E(X) + 3", "2E(X)", "2E(X) + 3", "4E(X) + 3"], correct: 2, explanation: "期待値には線形性と呼ばれる性質があり、データ全体を a倍して bを足したものの平均は、元の平均を a倍して bを足したものと等しくなります。したがって E(aX+b) = aE(X) + b が成り立ちます。"},
                {q: "確率変数 X の分散 V(X) を表す式として、期待値 E を用いた正しいものはどれか。ただし μ は X の期待値（平均）とする。", options: ["E(X^2)", "E(|X - μ|)", "E((X - μ)^2)", "(E(X - μ))^2"], correct: 2, explanation: "分散は「データと平均の差（偏差）の2乗の平均」です。確率変数の場合、「平均」は「期待値」になるため、偏差 (X - μ) の2乗の期待値、すなわち E((X - μ)²) が分散の定義となります。"},
                {q: "独立な2つの確率変数 X と Y について、和 X + Y の分散 V(X+Y) はどのように計算できるか。", options: ["V(X) + V(Y)", "V(X) × V(Y)", "V(X) + V(Y) + 2", "(V(X) + V(Y))^2"], correct: 0, explanation: "XとYが互いに独立である場合のみ、和の分散はそれぞれの分散の足し算になります（分散の加法性）。 V(X+Y) = V(X) + V(Y)。期待値とは異なり、独立でない場合は成り立たないことに注意が必要です。"},
                {q: "「1回の試行で成功する確率が p である実験を n 回独立に繰り返したときの成功回数」が従う確率分布を何というか。", options: ["一様分布", "ポアソン分布", "正規分布", "二項分布"], correct: 3, explanation: "「コインを10回投げて表が出る回数」や「打率3割の打者が5打席でヒットを打つ回数」などは、『二項分布（記号 B(n, p)）』に従います。"},
                {q: "1つのサイコロを5回投げるとき、ちょうど2回「1の目」が出る確率を求める式はどれか。", options: ["(1/6)² × (5/6)³", "5C2 × (1/6)² × (5/6)³", "5P2 × (1/6)² × (5/6)³", "5C2 × (1/6)⁵"], correct: 1, explanation: "反復試行の確率です。5回のうち「どの2回」で1が出るかの組み合わせ（5C2）を掛け、1が出る確率(1/6)を2乗、1以外が出る確率(5/6)を3乗して掛け合わせます。"},
                {q: "確率変数 X が 二項分布 B(n, p) に従うとき、X の期待値（平均）を求める式はどれか。", options: ["n / p", "n + p", "n × p", "n × p × (1-p)"], correct: 2, explanation: "試行回数 n と成功確率 p を掛けたものが期待値になります。例えばコインを10回（n=10）、表の確率1/2（p=0.5）なら、期待値は 10 × 0.5 = 5回です。"},
                {q: "身長やテストの点数など、自然界や社会のデータの多くが従う、平均値付近が最も多く左右対称な釣鐘型の連続型確率分布を何というか。", options: ["一様分布", "二項分布", "正規分布", "指数分布"], correct: 2, explanation: "平均値付近が最も多く、離れるほどなだらかに減る「釣鐘型」の分布を『正規分布（ガウス分布）』に従うことが多いです。"},
                {q: "正規分布を扱いやすくするために、平均を 0、標準偏差を 1 に変換（標準化）した分布を何と呼ぶか。", options: ["標準正規分布", "対数正規分布", "T分布", "カイ二乗分布"], correct: 0, explanation: "データを標準化（Zスコア化）すると、どのような正規分布も「平均0、標準偏差1」の『標準正規分布』になり、確率の計算が容易になります。"},
                {q: "正規分布において、「平均 ± 標準偏差（1σ）」の範囲には、全データの約何％が含まれるか。", options: ["約50%", "約68%", "約95%", "約99.7%"], correct: 1, explanation: "正規分布の有名な性質です。±1σに約68%、±2σに約95%、±3σに約99.7%が含まれます。統計学で非常によく使われる数値です。"},
                {q: "二項分布 B(n, p) は、試行回数 n が十分に大きいとき、どのような分布に近づく（近似できる）か。", options: ["一様分布", "ポアソン分布", "正規分布", "幾何分布"], correct: 2, explanation: "ド・モアブル＝ラプラスの定理と呼ばれ、nが大きい場合、二項分布は「平均 np、分散 np(1-p) の正規分布」とみなして計算することができます（二項分布の正規近似）。"},
                {q: "母集団（平均μ、分散σ²）から大きさ n の標本を無作為抽出した。このとき「標本平均」の期待値はどうなるか。", options: ["μ / n", "μ", "μ × n", "0"], correct: 1, explanation: "標本平均の期待値（何度も標本抽出したときの標本平均の平均）は、元の母集団の平均（母平均 μ）にピタリと一致します。これを推定量が持つ「不偏性」と呼びます。"},
                {q: "上記と同じ条件において、「標本平均」の分散はどうなるか。", options: ["σ²", "σ² × n", "σ² / n", "σ² / √n"], correct: 2, explanation: "標本平均の分散は、元の母集団の分散を「サンプルサイズ n」で割ったもの（σ²/n）になります。nが大きい（たくさん調査する）ほど分散が小さくなり、母平均に近い値が出やすくなります。"},
                {q: "母集団がどんな分布であっても、サンプルサイズ n が十分に大きいとき、「標本平均の分布」は正規分布に近づく。この定理を何というか。", options: ["大数の法則", "中心極限定理", "ベイズの定理", "ピタゴラスの定理"], correct: 1, explanation: "元のデータがいびつな分布でも、「平均値の分布」はサンプル数が多いほど綺麗な正規分布（釣鐘型）になるという、推測統計学の根幹をなす定理が『中心極限定理』です。"},
                {q: "標本から得られたデータを用いて、母集団の平均（母平均）などの真の値が含まれる「範囲」を確率的に推定することを何というか。", options: ["点推定", "区間推定", "仮説検定", "回帰分析"], correct: 1, explanation: "「母平均はズバリ50だ（点推定）」ではなく、「母平均は48〜52の間にあるだろう（区間推定）」と、誤差を考慮して幅を持たせて推定する方法です。"},
                {q: "「信頼度95%の信頼区間」の意味として最も適切なものはどれか。", options: ["その区間内に母平均が含まれる確率が95%である", "同じ抽出と推定を100回繰り返したとき、約95回の割合でその区間に母平均が含まれる", "母集団のデータの95%がその区間に収まっている", "計算結果が95%の確率で間違っていない"], correct: 1, explanation: "母平均は動かない固定された値です。動くのは標本から計算した区間の方なので、「何度も調査して区間を作れば、100回中95回くらいは真の母平均を捉えられている」という意味になります。"},
                {q: "標本の大きさ（サンプルサイズ n）を大きくすると、信頼区間の幅はどう変化するか。", options: ["広くなる", "狭くなる", "変わらない", "nに依存しない"], correct: 1, explanation: "調査する人数（n）を増やすほど、標本平均の分散（ブレ）が小さくなるため、推定の精度が上がり、信頼区間の幅は「狭く」なります。"},
                {q: "「新しい薬は古い薬より効果がある」というような主張を、データに基づいて客観的に判定する統計学の手法を何というか。", options: ["区間推定", "仮説検定", "相関分析", "主成分分析"], correct: 1, explanation: "ある仮説を立て、手元のデータから「それが単なる偶然で起きたとは考えにくい」ことを確率的に示して結論を導く手法を『仮説検定』と呼びます。"},
                {q: "仮説検定において、「差がない」「効果がない」など、本来棄却（否定）したい目的で設定される仮説を何と呼ぶか。", options: ["対立仮説", "帰無仮説", "有意仮説", "作業仮説"], correct: 1, explanation: "「無（差がない）に帰する」という意味で『帰無仮説（H0）』と呼びます。これを「偶然とは考えにくい（確率が低い）」として否定（棄却）することで、本当に言いたいこと（対立仮説）を証明します。"},
                {q: "仮説検定において、帰無仮説を棄却するかどうかの基準となる確率（通常は5%や1%に設定される）を何というか。", options: ["p値", "有意水準 (α)", "信頼区間", "検出力"], correct: 1, explanation: "「計算された確率（p値）がこの値（例えば0.05＝5%）より小さければ、偶然じゃないと判断して帰無仮説を棄却しよう」とあらかじめ決めておく基準が『有意水準（危険率）』です。"},
                {q: "ある検査で「本当は健康（陰性）なのに、誤って病気（陽性）と判定される」ように、帰無仮説が正しいのに誤って棄却してしまう過ちを何というか。", options: ["第一種の過誤 (偽陽性)", "第二種の過誤 (偽陰性)", "標準誤差", "標本誤差"], correct: 0, explanation: "「ないものをある」と間違える（あわてんぼうのエラー）を『第一種の過誤』、「あるものをない」と見逃す（ぼんやりもののエラー）を『第二種の過誤』と呼びます。"}
            ]
        };

        let currentQuiz = [];
        let index = 0;
        let score = 0;
        let isAnswered = false;

        function loadMode(mode) {
            index = 0;
            score = 0;
            
            if (mode === 'mock') {
                let allQuestions = [...quizData.data, ...quizData.graph, ...quizData.prob];
                // フィッシャー・イェーツのシャッフル
                for (let i = allQuestions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allQuestions[i], allQuestions[j]] = [allQuestions[j], allQuestions[i]];
                }
                currentQuiz = allQuestions.slice(0, 30); // ランダム30問
            } else {
                currentQuiz = quizData[mode]; // カテゴリ別30問
            }

            document.getElementById('menu').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            showQuestion();
            window.scrollTo(0, 0);
        }

        function showQuestion() {
            isAnswered = false;
            const q = currentQuiz[index];
            
            document.getElementById('progress').innerText = `第 ${index + 1} 問 / 全 ${currentQuiz.length} 問`;
            document.getElementById('question').innerText = q.q;
            
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            q.options.forEach((o, i) => {
                const btn = document.createElement('button');
                btn.innerText = o;
                btn.className = "w-full p-4 md:p-5 border-2 border-gray-300 rounded-xl text-left hover:bg-blue-50 transition-colors font-medium bg-white text-gray-700 shadow-sm text-base md:text-lg";
                btn.onclick = () => checkAnswer(i, btn);
                optDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const q = currentQuiz[index];
            const isCorrect = selectedIndex === q.correct;
            
            const buttons = document.getElementById('options').children;
            
            if (isCorrect) {
                score++;
                btnElement.classList.replace('border-gray-300', 'border-green-500');
                btnElement.classList.replace('hover:bg-blue-50', 'bg-green-100');
                btnElement.classList.add('bg-green-100', 'text-green-900', 'font-bold');
            } else {
                btnElement.classList.replace('border-gray-300', 'border-red-500');
                btnElement.classList.replace('hover:bg-blue-50', 'bg-red-100');
                btnElement.classList.add('bg-red-100', 'text-red-900');
                
                // 正解を目立たせる
                buttons[q.correct].classList.replace('border-gray-300', 'border-green-500');
                buttons[q.correct].classList.add('bg-green-50', 'text-green-800', 'font-bold', 'ring-2', 'ring-green-400', 'ring-inset');
            }

            for(let i=0; i<buttons.length; i++){
                if(i !== selectedIndex && i !== q.correct) {
                    buttons[i].classList.add('opacity-40');
                }
                buttons[i].disabled = true; // ボタン無効化
            }

            const fb = document.getElementById('feedback');
            fb.innerHTML = `
                <div class="font-black text-xl mb-3 flex items-center ${isCorrect ? 'text-green-700' : 'text-red-700'}">
                    ${isCorrect ? '<span class="text-3xl mr-2">⭕</span> 正解！' : '<span class="text-3xl mr-2">❌</span> 不正解... (正解: ' + q.options[q.correct] + ')'}
                </div>
                <div class="text-gray-800 leading-relaxed text-base md:text-lg border-t-2 border-gray-200 pt-3 mt-2">
                    <span class="inline-block bg-gray-700 text-white text-xs font-bold px-2 py-1 rounded mb-2 shadow">解説</span><br>
                    ${q.explanation}
                </div>
            `;
            fb.className = "mt-6 p-5 md:p-6 rounded-xl shadow-inner border-2 " + (isCorrect ? "bg-green-50 border-green-200" : "bg-red-50 border-red-200");
            fb.classList.remove('hidden');
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerText = (index === currentQuiz.length - 1) ? "結果を見る" : "次の問題へ進む";
            nextBtn.classList.remove('hidden');
            
            // 解説部分まで少しスクロール
            fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function nextQuestion() {
            index++;
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            if(index < currentQuiz.length) {
                showQuestion();
                window.scrollTo(0, 0);
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-container').classList.add('hidden');
            const resultContainer = document.getElementById('result-container');
            resultContainer.classList.remove('hidden');
            window.scrollTo(0, 0);
            
            const scoreElement = document.getElementById('score');
            const percentage = Math.round((score / currentQuiz.length) * 100);
            
            let message = "";
            let colorClass = "";
            
            if (percentage >= 80) {
                message = "素晴らしい！統計検定3級合格圏内です。この調子で本番に臨みましょう！🎉";
                colorClass = "text-green-600 bg-green-50 border-green-200";
            } else if (percentage >= 60) {
                message = "合格まであと一歩！間違えた問題の解説をしっかり復習すれば確実です。💪";
                colorClass = "text-blue-600 bg-blue-50 border-blue-200";
            } else {
                message = "基礎知識の確認が必要です。用語の意味や基本的な計算方法をもう一度見直しましょう。📚";
                colorClass = "text-yellow-700 bg-yellow-50 border-yellow-200";
            }

            scoreElement.innerHTML = `
                <div class="inline-block bg-white border-4 border-gray-100 rounded-2xl p-8 shadow-sm mb-6">
                    <div class="text-gray-500 font-bold mb-2">あなたの正解数</div>
                    <span class="text-6xl font-black text-gray-800">${score}</span>
                    <span class="text-3xl text-gray-400 font-bold"> / ${currentQuiz.length}</span>
                    <div class="mt-4 text-2xl font-black ${percentage >= 70 ? 'text-green-500' : 'text-blue-500'}">正答率: ${percentage}%</div>
                </div>
                <div class="p-6 border-2 rounded-xl text-lg font-bold leading-relaxed ${colorClass}">
                    ${message}
                </div>
            `;
        }
    </script>
</body>
</html>
