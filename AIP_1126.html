<!DOCTYPE html>

  <style>

    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes popIn {
      0% { transform: translateY(16px) scale(0.95); opacity: 0; }

      animation: popIn 0.25s ease-out forwards;

</head>
<body class="min-h-screen bg-slate-50 text-slate-800 selection:bg-indigo-100 selection:text-indigo-900 pb-20">

      { id: 'T7', tag: 'ワークシート T7', category: '公平性・AI倫理', question: '透明性とアカウンタビリティの実践として適切なのはどれか。', options: ['個人情報も含め全入力を公開する。', 'AIの回答だと示せば責任を負わない。', '判断の理由は記録せず結果だけ示す。', '利用箇所や確認過程を適切に説明し、理由を記録する。'], answer: 3, explanation: '透明性は必要な説明を適切な範囲で示すことであり、アカウンタビリティは判断理由を記録して質問に答え修正する責任を果たすことです。' },
      { id: 'T8', tag: 'ワークシート T8', category: 'ガバナンス・法規', question: 'シャドーAIの例はどれか。', options: ['学校承認済みのツールを規則に従い使う。', 'AIを使わず校内で手作業する。', '未承認AIへ生徒会の非公開資料を送る。', '新ツールの承認を担当者に申請する。'], answer: 2, explanation: 'シャドーAIとは、組織や学校の承認を得ていないAIツールを無断で業務や活動に利用する行為を指します。' },
      { id: 'T9', tag: 'ワークシート T9', category: 'ガバナンス・法規', question: '情報を誤送信した直後の対応として適切なのはどれか。', options: ['追加送信を止め、必要な記録を保ち担当者へ報告する。', '履歴を消して誰にも知らせない。', '友人全員へ送信画面を拡散する。', 'AIに問題ないと言われれば対応不要。'], answer: 0, explanation: '追加送信・公開を止め、送信内容・時刻・相手先の記録を残した上で、速やかに担当者へ報告することが正しい初動対応です。' },
      { id: 'T10', tag: 'ワークシート T10', category: 'ガバナンス・法規', question: '日本のAI法と既存の法律の関係として適切なのはどれか。', options: ['AI法があれば著作権法は不要になる。', 'AI法があっても既存法令の確認は必要である。', 'AIに関する問題はすべて校内ルールだけで決まる。', 'ガイドラインと法律はすべて同じ強制力を持つ。'], answer: 1, explanation: '日本のAI推進法（人工知能関連技術の研究開発及び活用の推進に関する法律）があっても、著作権法や個人情報保護法などの既存法令の遵守は必要です。' },
      { id: 'T11', tag: 'ワークシート T11', category: '公平性・AI倫理', question: 'リスクに応じた対応として適切なのはどれか。', options: ['AIの用途によらず確認の程度を同一にする。', '国産AIなら権利確認を省略する。', '影響が大きい用途ほど人の検証や監督を丁寧にする。', '便利さが高ければリスクを考えなくてよい。'], answer: 2, explanation: 'リスクベースアプローチに基づき、人の進路や権利に与える影響が大きい用途ほど、人間による慎重な検証と監督が必要です。' },
      { id: 'T12', tag: 'ワークシート T12', category: '著作権・知的財産', question: '商用利用可のAIサービスで生成した画像について正しいのはどれか。', options: ['第三者の権利を侵害していないことまで保証される。', '商標や人物の権利は一切関係しない。', '人の創作的関与は検討不要になる。', '規約の許可と第三者の権利を分けて確認する。'], answer: 3, explanation: 'AIサービスの利用規約で「商用利用可」とされていても、著作権・商標権・肖像権など第三者の権利侵害の有無は利用者自身が確認しなければなりません。' },
      { id: 'EX1', tag: 'シラバス発展 1', category: '著作権・知的財産', question: '著作権法第30条の4（情報解析等の非享受目的利用）と、生成AIの利用段階の関係として最も適切なものはどれか。', options: ['AIの学習段階で認められる利用があることは、生徒が既存画像をAIに入力し生成物を公開する行為もすべて自由であることを意味する。', '著作権法第30条の4は、学校公式サイトでのポスター公開にそのまま適用される。', 'AIの学習段階で情報解析として認められる場合と、利用者が既存作品に類似・依拠した生成物を公開・利用する段階は区別して判断する。', '営利目的でなければ、著作権者の利益を不当に害する場合であっても無制限に利用できる。'], answer: 2, explanation: '学習（情報解析）段階の規定と、生成物を公開・利用する段階の著作権侵害判断（類似性・依拠性）は切り分けて考える必要があります。' },
      { id: 'EX2', tag: 'シラバス発展 2', category: '著作権・知的財産', question: '企業ロゴや著名人の肖像を無断でAI生成ポスターに組み込んで宣伝に利用した場合、著作権以外に侵害するおそれがある権利の組合せとして最も適切なものはどれか。', options: ['商標権・パブリシティ権', '個人識別符号・要配慮個人情報', '仮名加工情報・ソフトロー', 'リスキリング・多要素認証'], answer: 0, explanation: '商品・サービスを区別する名称やマークは「商標権」、著名人の氏名・肖像が持つ顧客吸引力は「パブリシティ権」によって保護されます。' },
      { id: 'EX3', tag: 'シラバス発展 3', category: '個人情報・秘密保持', question: '個人情報保護法における「個人識別符号」と「要配慮個人情報」の説明として最も適切なものはどれか。', options: ['マイナンバーや一定の顔認証データは個人識別符号に該当し、病歴や障害などは要配慮個人情報に該当する。', 'ニックネームや好きな食べ物は個人識別符号に該当し、通学時間は要配慮個人情報に該当する。', '個人識別符号は生存する個人だけでなく、歴史上の人物にも適用される。', '要配慮個人情報は、本人の同意がなくても外部のAIサービスに自由に提供できる。'], answer: 0, explanation: '個人識別符号はマイナンバーや生体認証データなど単体で個人を識別できるもの、要配慮個人情報は病歴・障害・人種・信条など差別や偏見を防ぐため特に配慮が必要な情報です。' },
      { id: 'EX4', tag: 'シラバス発展 4', category: '公平性・AI倫理', question: 'AI活用に伴う倫理的・法的・社会的課題をまとめて捉える概念「ELSI」の観点から、生徒が課題をすべてAIに丸投げすることの問題点として適切なものはどれか。', options: ['短期的には効率的でも、自分で考えて説明する力が育ちにくくなり、また有料ツールの有無などによる学習機会の格差にもつながる。', 'ELSIは法律の条文のみを指す言葉であるため、学習機会や環境負荷については考慮しない。', 'AIに課題を丸投げすれば、すべての生徒に全く同じ思考力が身につくため公平である。', 'ELSIの観点からは、電力消費を気にせず大量に生成を繰り返すことが推奨されている。'], answer: 0, explanation: 'ELSIはEthical（倫理的）・Legal（法的）・Social（社会的）Issuesの略で、学びの質や機会の格差、環境負荷なども含めて望ましさを考えます。' },
      { id: 'EX5', tag: 'シラバス発展 5', category: '公平性・AI倫理', question: 'データ分析における「相関関係」と「因果関係」の区別として、最も適切なものはどれか。', options: ['「過去に表彰された生徒に読書好きが多い」という相関があれば、「読書をさせれば必ず表彰される」という因果関係が証明されたと言える。', '相関は二つの事柄が一緒に変化する関係であり、一方の属性だけで能力や結果の原因（因果）と断定してはいけない。', 'AIは相関関係だけでなく、データの背後にある因果関係も常に100%正確に判定できる。', '選考においては、能力を直接測るよりも、相関がありそうな家庭環境や出身地域を代理指標として使う方が公平である。'], answer: 1, explanation: '相関と因果の混同はAIバイアスや不公平な選考の大きな原因です。一緒に見られる傾向（相関）だけで能力や原因と断定してはいけません。' },
      { id: 'EX6', tag: 'シラバス発展 6', category: 'ガバナンス・法規', question: '人間がAIのプロセスに介在して確認する仕組み「Human-in-the-Loop」を形骸化させないために必要な条件はどれか。', options: ['確認者が内容を読まずに素早く承認ボタンだけを押せるようにすること。', '判断に必要な資料と十分な時間、そしてAIの利用を止めたり修正したりする権限を持つ人が確認すること。', '人間が介在すると遅くなるため、最終承認も別のAIに任せること。', '一度承認システムを作ったら、規約変更や問題事例が起きても見直さないこと。'], answer: 1, explanation: 'Human-in-the-Loopは単なる形式的な承認ではなく、適切な資料・時間・停止権限を持つ人間が実質的に確認・判断できる体制が必要です。' },
      { id: 'EX7', tag: 'シラバス発展 7', category: 'ガバナンス・法規', question: 'AIが悪用された身近なセキュリティ脅威である「フィッシング」への対策として、最も適切なものはどれか。', options: ['文章の日本語が不自然なメールだけを疑い、自然な敬語で書かれたメールのリンクはすべて信頼する。', 'メール内のリンクから直接ログイン画面へ進み、パスワードとAPIキーを入力する。', 'AIで自然な文章が作られる前提に立ち、メール内のリンクに頼らず学校の既知の公式窓口で確認し、多要素認証を有効にする。', 'フィッシングメールが届いたら、内容をAIにそのまま貼り付けて本物かどうか質問する。'], answer: 2, explanation: '生成AIの普及により非常に自然な文面のフィッシングメールが作られます。公式窓口からの確認と多要素認証（MFA）の設定が有効です。' },
      { id: 'EX8', tag: 'シラバス発展 8', category: 'ガバナンス・法規', question: '国際的なAIルールの動向（G7広島AIプロセス、EU AI Act）に関する説明として最も適切なものはどれか。', options: ['G7広島AIプロセスでは、高度なAIシステムに関する国際的な指針や行動規範などの取組が進められている。', 'EU AI Actでは、医療や教育を含むすべてのAI技術の開発と利用が全面的に禁止されている。', '日本のAI法とEU AI Actは完全に同一の罰則規定を持つ法律である。', '国際的なガイドラインはソフトローであるため、企業が内容を把握する必要は一切ない。'], answer: 0, explanation: 'G7広島AIプロセスでは国際指針・行動規範が策定され、EU AI Actではリスクの程度に応じた規制枠組みが採用されています。日本とEUの制度は異なります。' }
    ];

    // ==========================================
    // 3. アプリケーション状態管理
    // ==========================================
    const state = {
      activeTab: 'lecture',
      xp: 0,
      completedChapters: [],
      completedCaseTasks: {},
      selectedChapterId: 1,
      chapterQuizSelection: null,
      chapterQuizSubmitted: false,
      flippedCards: {},
      mobileMenuOpen: false,
      selectedCaseId: 'C1',
      caseSelections: {},
      caseSubmitted: {},
      examMode: 'select', // 'select' | 'running' | 'result'
      examQuestions: [],
      currentExamIdx: 0,
      examAnswers: {},
      examChecked: {},
      bestExamScore: null
    };

    let toastTimer = null;
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const textEl = document.getElementById('toast-text');
      textEl.textContent = msg;
      container.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        container.classList.add('hidden');
      }, 3200);
    }

    function updateHeaderStats() {
      const totalCaseTasks = CASE_STUDIES.reduce((acc, c) => acc + c.tasks.length, 0);
      const doneCaseTasks = Object.keys(state.completedCaseTasks).length;

      document.getElementById('header-lecture-count').textContent = `講義: ${state.completedChapters.length}/${CHAPTERS.length}章`;
      document.getElementById('header-case-count').textContent = `審査: ${doneCaseTasks}/${totalCaseTasks}問`;
      document.getElementById('tab-badge-lecture').textContent = `${state.completedChapters.length}/${CHAPTERS.length}`;
      document.getElementById('tab-badge-cases').textContent = `${doneCaseTasks}/${totalCaseTasks}`;
      document.getElementById('xp-display').textContent = `${state.xp} XP`;

      if (state.bestExamScore !== null) {
        const examBadge = document.getElementById('tab-badge-exam');
        examBadge.textContent = `最高 ${state.bestExamScore}%`;
        examBadge.classList.remove('hidden');
      }

      const rankTitleEl = document.getElementById('rank-title');
      const rankBadgeBg = document.getElementById('rank-badge-bg');
      if (state.xp >= 1200) {
        rankTitleEl.textContent = 'Lv.4 AIガバナンス・グランドマスター';
        rankBadgeBg.textContent = '🏆';
        rankBadgeBg.className = 'w-7 h-7 rounded-lg bg-gradient-to-br from-amber-500 to-yellow-400 flex items-center justify-center shrink-0 text-sm';
      } else if (state.xp >= 750) {
        rankTitleEl.textContent = 'Lv.3 上級AI審査官';
        rankBadgeBg.textContent = '🛡️';
        rankBadgeBg.className = 'w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center shrink-0 text-sm';
      } else if (state.xp >= 300) {
        rankTitleEl.textContent = 'Lv.2 ジュニア倫理アナリスト';
        rankBadgeBg.textContent = '🔍';
        rankBadgeBg.className = 'w-7 h-7 rounded-lg bg-gradient-to-br from-emerald-600 to-teal-500 flex items-center justify-center shrink-0 text-sm';
      } else {
        rankTitleEl.textContent = 'Lv.1 見習いAIユーザー';
        rankBadgeBg.textContent = '🧭';
        rankBadgeBg.className = 'w-7 h-7 rounded-lg bg-gradient-to-br from-slate-600 to-slate-500 flex items-center justify-center shrink-0 text-sm';
      }
    }

    function switchTab(tab) {
      state.activeTab = tab;
      const tabs = ['lecture', 'cases', 'exam'];
      const activeColors = {
        lecture: 'bg-indigo-600 text-white shadow-sm',
        cases: 'bg-emerald-600 text-white shadow-sm',
        exam: 'bg-amber-600 text-white shadow-sm'
      };
      tabs.forEach((t) => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tab) {
          btn.className = `flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeColors[t]}`;
        } else {
          btn.className = 'flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap text-slate-600 hover:bg-white hover:text-slate-900';
        }
      });
      render();
    }

    // ==========================================
    // 4. イベントハンドラ（講義・ケース・模擬試験）
    // ==========================================
    function selectChapter(id) {
      state.selectedChapterId = id;
      state.chapterQuizSelection = null;
      state.chapterQuizSubmitted = false;
      state.mobileMenuOpen = false;
      render();
    }

    function toggleMobileMenu() {
      state.mobileMenuOpen = !state.mobileMenuOpen;
      render();
    }

    function selectChapterQuizOption(idx) {
      if (state.chapterQuizSubmitted) return;
      state.chapterQuizSelection = idx;
      render();
    }

    function submitChapterQuiz() {
      if (state.chapterQuizSelection === null) return;
      state.chapterQuizSubmitted = true;
      const chap = CHAPTERS.find((c) => c.id === state.selectedChapterId);
      if (state.chapterQuizSelection === chap.quiz.answer) {
        if (!state.completedChapters.includes(chap.id)) {
          state.completedChapters.push(chap.id);
          state.xp += 50;
          showToast(`🎉 第${chap.id}章クリア！ +50 XP 獲得！`);
        } else {
          showToast('✨ 正解です！（クリア済み）');
        }
      }
      render();
    }

    function toggleFlipCard(idx) {
      state.flippedCards[idx] = !state.flippedCards[idx];
      render();
    }

    function selectCase(caseId) {
      state.selectedCaseId = caseId;
      render();
    }

    function selectCaseOption(taskKey, optIdx, type) {
      if (state.caseSubmitted[taskKey]) return;
      if (type === 'single') {
        state.caseSelections[taskKey] = [optIdx];
      } else {
        const cur = state.caseSelections[taskKey] || [];
        if (cur.includes(optIdx)) {
          state.caseSelections[taskKey] = cur.filter((i) => i !== optIdx);
        } else {
          state.caseSelections[taskKey] = [...cur, optIdx];
        }
      }
      render();
    }

    function submitCaseTask(caseId, taskIdx) {
      const taskKey = `${caseId}-${taskIdx}`;
      const selected = state.caseSelections[taskKey] || [];
      if (selected.length === 0) return;

      const cs = CASE_STUDIES.find((c) => c.id === caseId);
      const task = cs.tasks[taskIdx];
      state.caseSubmitted[taskKey] = true;

      let isCorrect = false;
      if (task.type === 'single') {
        isCorrect = selected[0] === task.correctIndex;
      } else {
        const s1 = [...selected].sort().join(',');
        const s2 = [...task.correctIndices].sort().join(',');
        isCorrect = s1 === s2;
      }

      if (isCorrect && !state.completedCaseTasks[taskKey]) {
        state.completedCaseTasks[taskKey] = true;
        state.xp += 60;
        showToast('🛡️ ミッション判定成功！ +60 XP 獲得！');
      } else if (isCorrect) {
        showToast('✨ 正解です！');
      }
      render();
    }

    function startMockExam(count) {
      state.examQuestions = count === 12 ? MOCK_QUESTIONS.slice(0, 12) : [...MOCK_QUESTIONS];
      state.currentExamIdx = 0;
      state.examAnswers = {};
      state.examChecked = {};
      state.examMode = 'running';
      render();
    }

    function selectExamOption(optIdx) {
      if (state.examChecked[state.currentExamIdx]) return;
      state.examAnswers[state.currentExamIdx] = optIdx;
      render();
    }

    function confirmExamOption() {
      if (state.examAnswers[state.currentExamIdx] === undefined) return;
      state.examChecked[state.currentExamIdx] = true;
      render();
    }

    function nextExamQuestion() {
      state.currentExamIdx += 1;
      render();
    }

    function finishMockExam() {
      let correctCount = 0;
      state.examQuestions.forEach((q, idx) => {
        if (state.examAnswers[idx] === q.answer) correctCount++;
      });
      const earned = correctCount * 25;
      state.xp += earned;
      const pct = Math.round((correctCount / state.examQuestions.length) * 100);
      if (state.bestExamScore === null || pct > state.bestExamScore) {
        state.bestExamScore = pct;
      }
      state.examMode = 'result';
      showToast(`🏆 模擬テスト完了！正答率 ${pct}%（+${earned} XP）`);
      render();
    }

    function resetExamToSelect() {
      state.examMode = 'select';
      render();
    }

    // ==========================================
    // 5. レンダリング関数
    // ==========================================
    function renderLecture() {
      const chap = CHAPTERS.find((c) => c.id === state.selectedChapterId);
      const isChapDone = state.completedChapters.includes(chap.id);
      const pct = Math.round((state.completedChapters.length / CHAPTERS.length) * 100);

      const sidebarItems = CHAPTERS.map((c) => {
        const done = state.completedChapters.includes(c.id);
        const sel = c.id === state.selectedChapterId;
        return `
          <button onclick="selectChapter(${c.id})" class="w-full text-left p-3.5 transition-colors flex items-start gap-3 ${sel ? 'bg-indigo-50/90 border-l-4 border-indigo-600' : 'hover:bg-slate-50'}">
            <div class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${done ? 'bg-emerald-500 text-white' : sel ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">
              ${done ? '✓' : c.id}
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-[11px] font-semibold text-slate-400">${c.category}</div>

      let flipHTML = '';

      const quizOptionsHTML = chap.quiz.options.map((opt, idx) => {

                      <div class="font-extrabold text-sm">

                          : '<span class="text-rose-400">❌ おしい！解説を確認してポイントを押さえましょう。</span>'}

                      <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">${chap.quiz.explanation}</p>

                <!-- 前後ナビ -->

                  ${chap.id < CHAPTERS.length ? `

    function renderCases() {
      const cs = CASE_STUDIES.find((c) => c.id === state.selectedCaseId);
      const caseButtons = CASE_STUDIES.map((item) => {
        const isSel = item.id === state.selectedCaseId;
        const allDone = item.tasks.every((_, idx) => state.completedCaseTasks[`${item.id}-${idx}`]);
        return `
          <button onclick="selectCase('${item.id}')" class="text-left p-3.5 rounded-xl border-2 transition-all ${isSel ? 'bg-emerald-50 border-emerald-600 shadow-xs' : 'bg-slate-50 border-slate-200 hover:bg-white'}">

                <span class="px-2.5 py-1 rounded-lg bg-rose-600 text-white text-xs font-extrabold">AI回答 A</span>
                <span class="text-xs font-semibold text-rose-700">要注意候補</span>
              </div>
              <p class="text-xs sm:text-sm text-slate-800 leading-relaxed font-medium pt-1">「${cs.aiA}」</p>

            <div class="bg-emerald-50/50 border-2 border-emerald-200 rounded-2xl p-5 space-y-2">
              <div class="flex items-center justify-between">
                <span class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-extrabold">AI回答 B</span>
                <span class="text-xs font-semibold text-emerald-700">慎重検討候補</span>
              </div>
              <p class="text-xs sm:text-sm text-slate-800 leading-relaxed font-medium pt-1">「${cs.aiB}」</p>
            </div>
          </div>
        </div>` : '';

      const tasksHTML = cs.tasks.map((task, tIdx) => {
        const taskKey = `${cs.id}-${tIdx}`;
        const selected = state.caseSelections[taskKey] || [];
        const isSub = !!state.caseSubmitted[taskKey];

        const optsHTML = task.options.map((opt, oIdx) => {
          const checked = selected.includes(oIdx);
          const isCorrectOpt = task.type === 'single' ? task.correctIndex === oIdx : task.correctIndices.includes(oIdx);
          let cardClass = 'bg-slate-800 border-slate-700 hover:bg-slate-700 text-slate-100';
          if (isSub) {
            if (isCorrectOpt) cardClass = 'bg-emerald-900/80 border-emerald-400 text-emerald-100';
            else if (checked && !isCorrectOpt) cardClass = 'bg-rose-900/80 border-rose-400 text-rose-100';
            else cardClass = 'bg-slate-800/40 border-slate-700/40 text-slate-400';
          } else if (checked) {
            cardClass = 'bg-emerald-700/50 border-emerald-400 text-white';
          }

          return `
            <button onclick="selectCaseOption('${taskKey}', ${oIdx}, '${task.type}')" class="w-full text-left p-3.5 rounded-xl border-2 text-xs sm:text-sm font-medium transition-all flex items-start gap-3 ${cardClass}">
              <div class="mt-0.5 shrink-0 font-bold text-emerald-400">${checked ? '☑️' : '⬜'}</div>

            <h4 class="font-bold text-sm sm:text-base leading-relaxed">${task.q}</h4>
            <div class="space-y-2.5">${optsHTML}</div>
            ${!isSub ? `
              <button onclick="submitCaseTask('${cs.id}', ${tIdx})" ${selected.length === 0 ? 'disabled' : ''} class="px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-700 disabled:text-slate-500 text-slate-950 font-extrabold text-sm transition-colors">

      return `

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">${refsHTML}</div>

      if (state.examMode === 'running') {
        const q = state.examQuestions[state.currentExamIdx];
        const isChecked = !!state.examChecked[state.currentExamIdx];
        const selIdx = state.examAnswers[state.currentExamIdx];
        const progressPct = Math.round(((state.currentExamIdx + 1) / state.examQuestions.length) * 100);

        const optsHTML = q.options.map((opt, idx) => {
          const isSel = selIdx === idx;
          const isCor = q.answer === idx;
          let style = 'bg-white border-slate-200 hover:border-indigo-400 text-slate-800';
          if (isChecked) {
            if (isCor) style = 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-2 ring-emerald-200';
            else if (isSel && !isCor) style = 'bg-rose-50 border-rose-500 text-rose-950';
            else style = 'bg-slate-50 border-slate-200 text-slate-400';
          } else if (isSel) {
            style = 'bg-indigo-50 border-indigo-600 text-indigo-950 ring-2 ring-indigo-100';
          }

          return `
            <button onclick="selectExamOption(${idx})" class="w-full text-left p-4 rounded-2xl border-2 font-bold text-sm sm:text-base transition-all flex items-start gap-3.5 ${style}">
              <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${isChecked && isCor ? 'bg-emerald-600 text-white' : isSel ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">
                ${idx + 1}
              </span>
              <span class="flex-1 leading-snug">${opt}</span>
              ${isChecked && isCor ? '<span class="text-emerald-600 text-lg">⭕</span>' : ''}
              ${isChecked && isSel && !isCor ? '<span class="text-rose-600 text-lg">❌</span>' : ''}
            </button>`;
        }).join('');

        return `
          <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-extrabold text-xs">
                  第 ${state.currentExamIdx + 1} 問 / 全 ${state.examQuestions.length} 問
                </span>
                <span class="text-xs text-slate-300 font-semibold hidden sm:inline">分野：${q.category}</span>
              </div>
              <button onclick="resetExamToSelect()" class="text-xs text-slate-400 hover:text-white underline">コース選択へ戻る</button>
            </div>
            <div class="w-full bg-slate-200 h-2">
              <div class="bg-amber-500 h-2 transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>
            <div class="p-6 sm:p-8 space-y-6">
              <div>
                <span class="inline-block text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded mb-2">${q.tag} ・ ${q.category}</span>
                <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 leading-relaxed">${q.question}</h3>
              </div>
              <div class="space-y-3">${optsHTML}</div>
              ${!isChecked ? `
                <div class="pt-2">
                  <button onclick="confirmExamOption()" ${selIdx === undefined ? 'disabled' : ''} class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-extrabold text-sm transition-colors shadow-xs">
                    この選択肢で解答する
                  </button>
                </div>
              ` : `
                <div class="bg-slate-900 text-white rounded-2xl p-5 sm:p-6 space-y-3">
                  <div class="font-extrabold text-base">
                    ${selIdx === q.answer
                      ? `<span class="text-emerald-400">⭕ 正解！（選択肢 ${q.answer + 1}）</span>`
                      : `<span class="text-rose-400">❌ 不正解（正解は選択肢 ${q.answer + 1}）</span>`}
                  </div>
                  <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${q.explanation}</p>
                  <div class="pt-2 flex justify-end">
                    ${state.currentExamIdx < state.examQuestions.length - 1 ? `
                      <button onclick="nextExamQuestion()" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm">
                        次の問題へ →
                      </button>
                    ` : `
                      <button onclick="finishMockExam()" class="px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm">
                        成績レポートを見る 🏆
                      </button>
                    `}
                  </div>
                </div>
              `}
            </div>
          </div>`;
      }

      if (state.examMode === 'result') {
        let totalCorrect = 0;
        const catStats = {};
        state.examQuestions.forEach((q, idx) => {
          if (!catStats[q.category]) catStats[q.category] = { total: 0, correct: 0 };
          catStats[q.category].total += 1;
          if (state.examAnswers[idx] === q.answer) {
            totalCorrect += 1;
            catStats[q.category].correct += 1;
          }
        });
        const scorePct = Math.round((totalCorrect / state.examQuestions.length) * 100);
        const passed = scorePct >= 80;

        const catBars = Object.entries(catStats).map(([cat, st]) => {
          const cPct = Math.round((st.correct / st.total) * 100);
          return `
            <div class="space-y-1">
              <div class="flex justify-between text-xs sm:text-sm font-bold">
                <span class="text-slate-800">${cat}</span>
                <span class="${cPct >= 80 ? 'text-emerald-600' : 'text-amber-600'}">${st.correct} / ${st.total} 問（${cPct}%）</span>
              </div>
              <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                <div class="h-2.5 rounded-full ${cPct >= 80 ? 'bg-emerald-500' : 'bg-amber-500'}" style="width: ${cPct}%"></div>
              </div>
            </div>`;
        }).join('');

        const reviewList = state.examQuestions.map((q, idx) => {
          const isRight = state.examAnswers[idx] === q.answer;
          return `
            <div class="p-4 bg-white flex items-start gap-3">
              <div class="mt-0.5 shrink-0 font-bold">${isRight ? '⭕' : '❌'}</div>
              <div class="space-y-1 text-xs sm:text-sm">
                <div class="font-bold text-slate-900">問${idx + 1}（${q.category}）：${q.question}</div>
                <div class="text-slate-600">正解：<span class="font-bold text-emerald-700">${q.options[q.answer]}</span></div>
                <p class="text-slate-500 text-xs leading-relaxed">${q.explanation}</p>
              </div>
            </div>`;
        }).join('');

        return `
          <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-xs p-6 sm:p-10 space-y-8">
            <div class="text-center space-y-3">
              <div class="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl ${passed ? 'bg-amber-100' : 'bg-indigo-100'}">🏆</div>
              <div class="inline-block px-3.5 py-1 rounded-full text-xs font-extrabold bg-slate-900 text-amber-400">
                ${passed ? '🎉 合格ライン突破！素晴らしい理解度です' : '📚 あと一歩！苦手分野を復習しよう'}
              </div>
              <h2 class="text-3xl sm:text-4xl font-black text-slate-900">
                正答率 ${scorePct}% <span class="text-lg font-bold text-slate-500">（${totalCorrect} / ${state.examQuestions.length} 問正解）</span>
              </h2>
            </div>

            <div class="bg-slate-50 rounded-2xl p-6 border border-slate-200 space-y-4">
              <h3 class="text-sm font-extrabold text-slate-900">📊 分野別マスター度分析</h3>
              <div class="space-y-3.5">${catBars}</div>
            </div>

            <div class="space-y-3">
              <h3 class="text-sm font-extrabold text-slate-900">📝 解答一覧と復習チェック</h3>
              <div class="divide-y divide-slate-200 border border-slate-200 rounded-2xl overflow-hidden">${reviewList}</div>
            </div>

            <div class="flex flex-wrap justify-center gap-3 pt-2">
              <button onclick="resetExamToSelect()" class="px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm">
                もう一度模擬テストに挑戦する
              </button>
              <button onclick="switchTab('lecture')" class="px-6 py-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-extrabold text-sm">
                ビジュアル講義で復習する
              </button>
            </div>
          </div>`;
      }
    }

    function render() {
      updateHeaderStats();
      const mainEl = document.getElementById('app-main');
      if (state.activeTab === 'lecture') {
        mainEl.innerHTML = renderLecture();
      } else if (state.activeTab === 'cases') {
        mainEl.innerHTML = renderCases();
      } else if (state.activeTab === 'exam') {
        mainEl.innerHTML = renderExam();
      }
    }

    // 初期描画
    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
