<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITパスポート 第6回 実践シミュレーター｜文化祭DXプロジェクト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            background-color: #f0fdfa; /* teal-50 */
            -webkit-tap-highlight-color: transparent;
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-in { animation: slideIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .option-btn { transition: all 0.2s; }
        .option-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(13, 148, 136, 0.2); }
        .option-btn:active:not(:disabled) { transform: translateY(0); }
        .category-card { transition: all 0.2s; }
        .category-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(13, 148, 136, 0.2); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- Header -->
    <header class="bg-teal-700 text-white p-4 shadow-md z-10 shrink-0 flex justify-between items-center relative">
        <div class="flex items-center gap-2 cursor-pointer" onclick="showCategoryScreen()">
            <span class="text-2xl">📱</span>
            <div>
                <h1 class="font-bold text-sm md:text-base leading-tight">文化祭DXプロジェクト</h1>
                <p class="text-xs text-teal-200">ITパスポート 実践シミュレーター</p>
            </div>
        </div>
        <div class="text-right hidden" id="header-progress">
            <div class="text-xs text-teal-200 font-bold mb-1" id="progress-text">STAGE 1/5</div>
            <div class="flex gap-1 justify-end" id="progress-dots"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col items-center relative pb-24">
        <div id="app-container" class="w-full max-w-2xl mx-auto space-y-6">
            
            <!-- Category Selection Screen -->
            <div id="category-screen" class="slide-in w-full space-y-6">
                <div class="bg-white rounded-3xl p-6 shadow-sm border-t-4 border-teal-500 text-center mb-6">
                    <h2 class="text-xl font-bold text-slate-800 mb-2">挑戦するミッションを選択</h2>
                    <p class="text-sm text-slate-600">各カテゴリーの現場で起こりうる課題を解決し、違いを理解しましょう。</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="category-list">
                    <!-- Categories generated by JS -->
                </div>
            </div>

            <!-- Stage Screen (Hidden by default) -->
            <div id="stage-screen" class="hidden flex-col w-full gap-4">
                <button onclick="showCategoryScreen()" class="text-teal-700 text-sm font-bold flex items-center gap-1 mb-2 hover:text-teal-900 transition-colors w-fit">
                    ← カテゴリ選択に戻る
                </button>
                
                <div class="bg-teal-50 border border-teal-200 text-teal-800 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 slide-in" id="concept-label">
                    <span>📚</span> 学習テーマ
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 slide-in" id="scenario-card" style="animation-delay: 0.1s;">
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 leading-relaxed mb-4" id="scenario-title">
                        シナリオタイトル
                    </h3>
                    <div class="bg-slate-50 p-4 rounded-xl text-slate-700 text-sm md:text-base leading-relaxed border border-slate-100" id="scenario-text">
                        シナリオテキスト
                    </div>
                </div>

                <div class="space-y-3 slide-in" id="options-container" style="animation-delay: 0.2s;">
                    <!-- Options injected via JS -->
                </div>
            </div>

            <!-- Result Screen (Hidden by default) -->
            <div id="result-screen" class="hidden bg-white rounded-3xl p-8 shadow-xl text-center slide-in border-t-4 border-teal-500">
                <div class="text-6xl mb-4">🎉</div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">ミッション・コンプリート！</h2>
                <p class="text-sm md:text-base text-slate-600 mb-6 leading-relaxed">
                    このカテゴリーの課題をすべて解決しました。
                </p>
                
                <div class="bg-teal-50 p-5 rounded-2xl text-left mb-8 border border-teal-100">
                    <h3 class="font-bold text-teal-800 mb-3 flex items-center gap-2"><span class="text-xl">📝</span> 学習の振り返り</h3>
                    <ul class="text-sm text-teal-900 space-y-3" id="summary-list">
                        <!-- Summary injected via JS -->
                    </ul>
                </div>
                
                <button onclick="showCategoryScreen()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-xl transition-colors shadow-lg">
                    他のカテゴリーに挑戦する
                </button>
            </div>

        </div>
    </main>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-2xl p-0 max-w-xl w-full shadow-2xl transform transition-transform scale-95 overflow-hidden flex flex-col max-h-[90vh]" id="feedback-content">
            <!-- Header -->
            <div class="p-4 text-white flex items-center gap-3 shrink-0" id="feedback-header">
                <span class="text-3xl" id="feedback-icon">⭕️</span>
                <h2 id="feedback-title" class="text-xl font-bold">正解！</h2>
            </div>
            
            <!-- Body -->
            <div class="p-5 overflow-y-auto space-y-4">
                <div>
                    <h3 class="font-bold text-slate-800 mb-1 border-b border-slate-200 pb-1 text-sm">解説（なぜこの判断か？）</h3>
                    <p id="feedback-text" class="text-sm text-slate-700 leading-relaxed"></p>
                </div>
                
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100" id="feedback-compare-box">
                    <h3 class="font-bold text-blue-800 text-sm mb-2 flex items-center gap-1"><span class="text-lg">💡</span> 概念の違いを理解する</h3>
                    <div id="feedback-compare-text" class="text-sm text-blue-900 leading-relaxed space-y-2">
                        <!-- Comparison content -->
                    </div>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="p-4 bg-gray-50 border-t border-gray-100 shrink-0">
                <button id="next-stage-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md">
                    次のステージへ
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- カテゴリーと問題データ ---
        const categoriesData = [
            {
                id: 'cat1',
                title: '1. DXと業務改善',
                icon: '🚀',
                desc: '単なる電子化とDXの違い、KPI/KGIの考え方を見極める。',
                questions: [
                    {
                        title: "Q1. 模擬店の「紙の注文書」の改善",
                        scenario: "これまで模擬店では「紙の注文書」に手書きし、手計算で集計していました。\n実行委員から「これをタブレットでスキャンしてPDFにし、画面で見ながら計算しよう」と提案がありました。この提案のIT用語としての正確な位置づけはどれですか？",
                        options: [
                            { text: "DX（デジタルトランスフォーメーション）である", isCorrect: false },
                            { text: "デジタライゼーションである", isCorrect: false },
                            { text: "デジタイゼーションである", isCorrect: true }
                        ],
                        feedback: "PDFにするだけでは、集計の手間や業務の流れ（プロセス）は変わっていません。単に「物理的な紙」が「デジタルデータ」に置き換わっただけです。",
                        compare: "<b>デジタイゼーション：</b> アナログ情報をデジタル化すること。（例：紙をPDFにする）<br><b>デジタライゼーション：</b> 業務プロセスをデジタル化し効率化すること。<br><b>DX：</b> デジタルを活用して新しい価値やビジネスモデルを生み出すこと。"
                    },
                    {
                        title: "Q2. 発注業務のシステム化",
                        scenario: "前回の反省を踏まえ、今度は「Googleフォームで注文を受け付け、スプレッドシートで自動集計し、計算ミスと委員の残業をなくす」仕組みを作りました。\nこの改善の段階はどれですか？",
                        options: [
                            { text: "デジタイゼーション", isCorrect: false },
                            { text: "デジタライゼーション", isCorrect: true },
                            { text: "DX（デジタルトランスフォーメーション）", isCorrect: false }
                        ],
                        feedback: "自動集計により「委員の残業をなくす」という業務プロセスの効率化が実現しています。これはDXへの重要なステップですが、来場者（顧客）に対する新しい価値提供までには至っていません。",
                        compare: "フォーム導入による自動化は「デジタライゼーション」の典型例です。業務のやり方（プロセス）がデジタル前提に変化し、効率化されています。"
                    },
                    {
                        title: "Q3. 本当の「DX」とは何か？",
                        scenario: "さらに進展し、「スマホから事前注文・決済を行い、過去のデータから調理時間を予測して受取時間を指定する」アプリを開発しました。これにより来場者の待ち時間はゼロになりました。\nこの取り組みが「DX」と呼べる最大の理由は何ですか？",
                        options: [
                            { text: "最新のスマホアプリとクラウドデータベースを使ったから", isCorrect: false },
                            { text: "来場者に「待ち時間ゼロ」という新しい体験（顧客価値）を提供し、文化祭のあり方を変革したから", isCorrect: true },
                            { text: "実行委員の集計業務が完全に自動化されたから", isCorrect: false }
                        ],
                        feedback: "DXの本質は「最新技術を使うこと」ではなく、技術とデータを使って「提供する価値やビジネスの形を変革すること」です。",
                        compare: "<b>DXの目的：</b> 技術の導入は手段にすぎません。顧客体験（UX）の向上や、全く新しいサービスの創出など「価値の変革」が伴って初めてDXと呼べます。"
                    },
                    {
                        title: "Q4. KGIとKPIの設定",
                        scenario: "新システム導入にあたり、最終目標（KGI）を「来場者満足度を昨年の80%から95%に上げる」と設定しました。\nでは、この目標に向かって進捗を確認するための中間指標（KPI）として、適切なものはどれですか？",
                        options: [
                            { text: "新システムを開発するためにかかった総費用", isCorrect: false },
                            { text: "アプリを利用して事前注文を行った来場者の割合（利用率）", isCorrect: true },
                            { text: "文化祭の総来場者数", isCorrect: false }
                        ],
                        feedback: "満足度向上（待ち時間ゼロの実現）という最終目標を達成するには、まず「アプリを使ってもらう」必要があります。したがって、アプリの利用率は目標達成に向けた重要な中間指標（KPI）になります。",
                        compare: "<b>KGI (Key Goal Indicator):</b> 最終的な目標（例：満足度95%）。<br><b>KPI (Key Performance Indicator):</b> 最終目標を達成するためのプロセスの達成度を測る指標（例：アプリ利用率60%）。"
                    }
                ]
            },
            {
                id: 'cat2',
                title: '2. データ品質と統計',
                icon: '📊',
                desc: 'AI入力前のデータ整備の重要性と、統計の罠を見抜く。',
                questions: [
                    {
                        title: "Q1. データ分析前の罠",
                        scenario: "生徒のアンケートデータをAIで分析しようとしたところ、学年欄に「2年」「2」「二年生」が混在し、性別欄が空欄のデータもありました。\nそのままAIに入力するとどうなりますか？",
                        options: [
                            { text: "AIが自動的に表記の違いを理解し、完璧に分析してくれる。", isCorrect: false },
                            { text: "データの一貫性・完全性が低いため、誤った分析結果が出力される可能性が高い。", isCorrect: true },
                            { text: "空欄のデータはAIが自動的に平均値で埋めてくれるので問題ない。", isCorrect: false }
                        ],
                        feedback: "表記ゆれや欠損がある状態（データ品質が低い状態）で分析すると、「2年」と「二年生」が別の学年としてカウントされるなど、誤った結果を招きます。これを「Garbage In, Garbage Out（ゴミを入れたらゴミが出てくる）」と呼びます。",
                        compare: "<b>一貫性：</b> 「2年」「二年生」など表記や定義が統一されていること。<br><b>完全性：</b> 必要な項目に空欄（欠損）がないこと。"
                    },
                    {
                        title: "Q2. データクレンジングの正しい処理",
                        scenario: "アンケートの「年齢」欄が空欄（未回答）になっているデータが10件見つかりました。\n平均年齢を計算するため、データクレンジングを行う際の適切な対応はどれですか？",
                        options: [
                            { text: "空欄のままでは計算できないので、すべて「0」と入力して計算する。", isCorrect: false },
                            { text: "空欄のデータは異常値として扱い、計算から除外するか、全体の平均値で補完するなどのルールを決める。", isCorrect: true },
                            { text: "プログラムがエラーを起こさないよう、すべて「99」と入力する。", isCorrect: false }
                        ],
                        feedback: "未回答を安易に「0」や「99」で埋めると、平均年齢が極端に下がったり上がったりして統計が歪みます。データの性質に合わせて適切に処理するルール（除外など）が必要です。",
                        compare: "<b>データクレンジング：</b> データベースの中の重複、誤記、欠損などを見つけて、修正・削除する作業のこと。分析の精度を高めるための必須工程です。"
                    },
                    {
                        title: "Q3. 平均値の落とし穴",
                        scenario: "お化け屋敷の待ち時間を計測したところ、「5分、5分、6分、6分、48分（機材トラブルで停止）」でした。平均値は14分です。\nパンフレットに「待ち時間の目安」を記載する場合、適切な表現はどれですか？",
                        options: [
                            { text: "「平均待ち時間は14分です」と記載する。", isCorrect: false },
                            { text: "「トラブル発生時は48分かかります」と最長時間を強調する。", isCorrect: false },
                            { text: "「待ち時間の目安は6分です」と中央値を記載する。", isCorrect: true }
                        ],
                        feedback: "平均値は「極端に大きい/小さい値（外れ値）」に強く引っ張られる性質があります。大部分の人は5〜6分で入れるため、真ん中の値である「中央値」を使う方が実態を正確に表せます。",
                        compare: "<b>平均値：</b> 合計÷件数。外れ値に弱い。<br><b>中央値：</b> 順番に並べた真ん中の値。外れ値の影響を受けにくい。<br><b>最頻値：</b> 最も多く出現する値。"
                    },
                    {
                        title: "Q4. 相関関係と因果関係",
                        scenario: "データ分析の結果、「アイスクリームの売上が高い日は、お化け屋敷の入場者数も多い」という傾向（正の相関）が見つかりました。\nここから導き出される論理的な結論として、適切なものはどれですか？",
                        options: [
                            { text: "アイスを食べるとお化け屋敷に入りたくなるという「因果関係」がある。", isCorrect: false },
                            { text: "お化け屋敷の近くでアイスを売れば、確実に入場者が増える。", isCorrect: false },
                            { text: "気温が高い日は両方とも売れるという「別の要因（気温）」が隠れている可能性がある。", isCorrect: true }
                        ],
                        feedback: "2つのデータが一緒に変動する傾向（相関関係）があるからといって、片方が原因でもう片方が結果（因果関係）とは限りません。第三の要因（この場合は気温）を見落とさないことが重要です。",
                        compare: "<b>相関関係：</b> Aが増えるとBも増えるという「傾向」。<br><b>因果関係：</b> Aが原因でBが起こるという「理由」。<br>「相関関係は因果関係を意味しない」はデータ分析の鉄則です。"
                    }
                ]
            },
            {
                id: 'cat3',
                title: '3. クラウドとセキュリティ（BCP）',
                icon: '☁️',
                desc: 'クラウドの形態（SaaS/PaaS/IaaS）と復旧計画（RTO/RPO）の判断。',
                questions: [
                    {
                        title: "Q1. 最適なクラウド形態の選択",
                        scenario: "全校生徒へのお知らせを配信する「掲示板システム」を導入します。サーバーの構築やOSの管理をする技術者はおらず、今すぐ完成したシステムを使いたい状況です。\nどのサービス形態を選ぶべきですか？",
                        options: [
                            { text: "IaaS（Infrastructure as a Service）", isCorrect: false },
                            { text: "PaaS（Platform as a Service）", isCorrect: false },
                            { text: "SaaS（Software as a Service）", isCorrect: true }
                        ],
                        feedback: "SaaSは、ソフトウェアの機能そのものをインターネット経由で利用する形態です（例：Webメール、オンライン掲示板）。利用者はブラウザからアクセスするだけで済み、サーバー管理の手間がありません。",
                        compare: "<b>SaaS：</b> 完成したソフトを利用（手軽だがカスタマイズに制限あり）。<br><b>PaaS：</b> アプリを動かす基盤を利用（開発者向け）。<br><b>IaaS：</b> 仮想サーバー（インフラ）を利用（自由度が高いが管理の手間大）。"
                    },
                    {
                        title: "Q2. クラウドの責任分界点",
                        scenario: "SaaS型のファイル共有サービスを導入し、文化祭の機密資料を保存しました。\nある日、委員のパスワードが推測されやすく、第三者に不正ログインされて資料が漏洩しました。このセキュリティ事故の責任は主に誰にありますか？",
                        options: [
                            { text: "すべてクラウドサービス提供者（ベンダー）の責任である。", isCorrect: false },
                            { text: "アカウントとパスワードの管理を怠った利用者（実行委員）の責任である。", isCorrect: true },
                            { text: "インターネット回線を提供している通信事業者の責任である。", isCorrect: false }
                        ],
                        feedback: "クラウドを利用しても、ID/パスワードの管理や「誰にアクセス権限を与えるか」といったデータ自体の管理責任は利用者側にあります。これを「責任共有モデル（責任分界点）」と呼びます。",
                        compare: "SaaSであっても「丸投げ」はできません。インフラやソフトの脆弱性対策は提供者の責任ですが、<b>アクセス管理やデータの取り扱いルールは利用者の責任</b>です。"
                    },
                    {
                        title: "Q3. 外部機能の連携（API）",
                        scenario: "文化祭アプリの中で「学校周辺の天気予報」を表示したいと考えています。自前で気象観測システムを作るのは不可能です。\n外部の天気サービスからデータだけをもらってアプリに表示する仕組みを何と呼びますか？",
                        options: [
                            { text: "OSS（オープンソースソフトウェア）", isCorrect: false },
                            { text: "API（Application Programming Interface）", isCorrect: true },
                            { text: "RPA（Robotic Process Automation）", isCorrect: false }
                        ],
                        feedback: "APIを利用すると、別のソフトウェアが持つ機能やデータを、決められた手順で自分のアプリに呼び出して連携させることができます。再開発の手間を省く強力な仕組みです。",
                        compare: "<b>API：</b> ソフトウェア同士が連携するための窓口。<br><b>OSS：</b> ソースコードが公開されたソフトウェア。<br><b>RPA：</b> 人間の定型的なパソコン作業を自動化するロボット。"
                    },
                    {
                        title: "Q4. 障害時の目標（RTOとRPO）",
                        scenario: "文化祭の決済システムで障害が起きた場合を想定したBCP（事業継続計画）を策定しています。\n「障害発生から、遅くとも2時間後にはシステムを再稼働させる」という時間の目標値を何と呼びますか？",
                        options: [
                            { text: "RTO（目標復旧時間）", isCorrect: true },
                            { text: "RPO（目標復旧時点）", isCorrect: false },
                            { text: "KPI（重要業績評価指標）", isCorrect: false }
                        ],
                        feedback: "「いつまでに業務（システム）を再開するか」という時間の目標がRTOです。事故を防ぐ対策だけでなく、起きた後にいかに早く復旧させるか（レジリエンス）の計画が重要です。",
                        compare: "<b>RTO (Recovery Time Objective):</b> 障害発生から「何時間で」復旧させるかの目標。（時間）<br><b>RPO (Recovery Point Objective):</b> 過去の「どの時点の」データまで復旧させるか、つまり「失うデータをどこまで許容するか」の目標。（データ量）"
                    }
                ]
            }
        ];

        let currentCategory = null;
        let currentQuestionIndex = 0;
        let selectedOptionIsCorrect = false;

        // --- DOM Elements ---
        const categoryScreen = document.getElementById('category-screen');
        const stageScreen = document.getElementById('stage-screen');
        const resultScreen = document.getElementById('result-screen');
        const headerProgress = document.getElementById('header-progress');
        
        const progressText = document.getElementById('progress-text');
        const progressDots = document.getElementById('progress-dots');
        
        const conceptLabel = document.getElementById('concept-label');
        const scenarioTitle = document.getElementById('scenario-title');
        const scenarioText = document.getElementById('scenario-text');
        const optionsContainer = document.getElementById('options-container');
        
        // Modal
        const fbModal = document.getElementById('feedback-modal');
        const fbHeader = document.getElementById('feedback-header');
        const fbIcon = document.getElementById('feedback-icon');
        const fbTitle = document.getElementById('feedback-title');
        const fbText = document.getElementById('feedback-text');
        const fbCompareBox = document.getElementById('feedback-compare-box');
        const fbCompareText = document.getElementById('feedback-compare-text');
        const nextStageBtn = document.getElementById('next-stage-btn');

        // --- Initialization ---
        function init() {
            const catList = document.getElementById('category-list');
            catList.innerHTML = '';
            
            categoriesData.forEach(cat => {
                const btn = document.createElement('div');
                btn.className = 'category-card bg-white p-6 rounded-2xl border-2 border-slate-200 cursor-pointer flex flex-col h-full';
                btn.onclick = () => startCategory(cat.id);
                btn.innerHTML = `
                    <div class="text-4xl mb-3">${cat.icon}</div>
                    <h3 class="text-lg font-bold text-slate-800 mb-2">${cat.title}</h3>
                    <p class="text-sm text-slate-600 flex-1">${cat.desc}</p>
                    <div class="mt-4 text-sm font-bold text-teal-600 flex items-center justify-between">
                        <span>全${cat.questions.length}問</span>
                        <span>挑戦する ➔</span>
                    </div>
                `;
                catList.appendChild(btn);
            });
        }

        function showCategoryScreen() {
            stageScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            headerProgress.classList.add('hidden');
            categoryScreen.classList.remove('hidden');
        }

        function startCategory(catId) {
            currentCategory = categoriesData.find(c => c.id === catId);
            currentQuestionIndex = 0;
            
            categoryScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            stageScreen.classList.remove('hidden');
            stageScreen.classList.add('flex');
            headerProgress.classList.remove('hidden');
            
            loadStage();
        }

        function loadStage() {
            const q = currentCategory.questions[currentQuestionIndex];
            
            // Update Progress
            progressText.innerText = `Q${currentQuestionIndex + 1} / ${currentCategory.questions.length}`;
            progressDots.innerHTML = '';
            for(let i=0; i<currentCategory.questions.length; i++) {
                const dot = document.createElement('div');
                dot.className = `w-2 h-2 rounded-full ${i <= currentQuestionIndex ? 'bg-teal-200' : 'bg-teal-900/30'}`;
                progressDots.appendChild(dot);
            }

            // Set Content with animation
            stageScreen.classList.remove('slide-in');
            void stageScreen.offsetWidth; // trigger reflow
            stageScreen.classList.add('slide-in');

            conceptLabel.innerHTML = `<span>${currentCategory.icon}</span> ${currentCategory.title}`;
            scenarioTitle.innerText = q.title;
            scenarioText.innerHTML = q.scenario.replace(/\n/g, '<br>');
            
            // Generate Options
            optionsContainer.innerHTML = '';
            
            // シャッフルしたい場合はここで q.options をコピーしてシャッフルする
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full bg-white border-2 border-slate-200 hover:border-teal-500 text-slate-700 font-semibold py-4 px-5 rounded-xl text-left text-sm md:text-base flex items-center justify-between group';
                btn.innerHTML = `
                    <span class="w-11/12 pr-2 leading-relaxed">${opt.text}</span>
                    <span class="w-6 h-6 rounded-full border-2 border-slate-200 flex items-center justify-center transition-colors shrink-0 option-indicator"></span>
                `;
                btn.onclick = () => selectOption(opt, btn, q);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(option, btn, q) {
            // Disable all buttons
            const allBtns = optionsContainer.querySelectorAll('button');
            allBtns.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:border-teal-500');
                if(b !== btn) b.classList.add('opacity-50');
            });

            const indicator = btn.querySelector('.option-indicator');
            selectedOptionIsCorrect = option.isCorrect;

            if (option.isCorrect) {
                btn.classList.replace('border-slate-200', 'border-teal-500');
                btn.classList.add('bg-teal-50');
                indicator.classList.replace('border-slate-200', 'border-teal-500');
                indicator.classList.add('bg-teal-500');
                indicator.innerHTML = '✓';
                indicator.style.color = 'white';
            } else {
                btn.classList.replace('border-slate-200', 'border-rose-500');
                btn.classList.add('bg-rose-50');
                indicator.classList.replace('border-slate-200', 'border-rose-500');
                indicator.classList.add('bg-rose-500');
                indicator.innerHTML = '✕';
                indicator.style.color = 'white';
            }

            setTimeout(() => {
                showFeedbackModal(option, q);
            }, 400);
        }

        function showFeedbackModal(option, q) {
            fbText.innerHTML = q.feedback;
            fbCompareText.innerHTML = q.compare;

            if (option.isCorrect) {
                fbHeader.className = 'p-4 text-white flex items-center gap-3 shrink-0 bg-teal-600';
                fbIcon.innerText = '⭕️';
                fbTitle.innerText = '正解！的確な判断です';
                fbCompareBox.classList.remove('hidden');
                
                if (currentQuestionIndex === currentCategory.questions.length - 1) {
                    nextStageBtn.innerText = '結果を見る';
                    nextStageBtn.classList.replace('bg-teal-600', 'bg-slate-800');
                    nextStageBtn.classList.replace('hover:bg-teal-700', 'hover:bg-slate-700');
                } else {
                    nextStageBtn.innerText = '次のミッションへ';
                    nextStageBtn.classList.replace('bg-slate-800', 'bg-teal-600');
                    nextStageBtn.classList.replace('hover:bg-slate-700', 'hover:bg-teal-700');
                }
                
                nextStageBtn.onclick = () => {
                    closeFeedbackModal();
                    setTimeout(() => {
                        if (currentQuestionIndex < currentCategory.questions.length - 1) {
                            currentQuestionIndex++;
                            loadStage();
                        } else {
                            showResult();
                        }
                    }, 300);
                };
            } else {
                fbHeader.className = 'p-4 text-white flex items-center gap-3 shrink-0 bg-rose-600';
                fbIcon.innerText = '⚠️';
                fbTitle.innerText = 'ちょっと待って！';
                // 失敗時も解説と用語比較を見せる
                fbCompareBox.classList.remove('hidden');
                
                nextStageBtn.innerText = '戻って考え直す';
                nextStageBtn.classList.replace('bg-teal-600', 'bg-rose-600');
                nextStageBtn.classList.replace('hover:bg-teal-700', 'hover:bg-rose-700');

                nextStageBtn.onclick = () => {
                    closeFeedbackModal();
                    // Reset options state to try again
                    setTimeout(() => {
                        loadStage();
                    }, 300);
                };
            }

            fbModal.classList.remove('hidden');
            fbModal.classList.add('flex');
            setTimeout(() => {
                fbModal.classList.remove('opacity-0');
                document.getElementById('feedback-content').classList.remove('scale-95');
            }, 10);
        }

        function closeFeedbackModal() {
            fbModal.classList.add('opacity-0');
            document.getElementById('feedback-content').classList.add('scale-95');
            setTimeout(() => {
                fbModal.classList.add('hidden');
                fbModal.classList.remove('flex');
            }, 300);
        }

        function showResult() {
            stageScreen.classList.remove('flex');
            stageScreen.classList.add('hidden');
            headerProgress.classList.add('hidden');
            
            const summaryList = document.getElementById('summary-list');
            summaryList.innerHTML = '';
            
            currentCategory.questions.forEach((q, idx) => {
                const li = document.createElement('li');
                li.className = "flex items-start gap-2 border-b border-teal-100 pb-2 last:border-0";
                li.innerHTML = `
                    <span class="bg-teal-600 text-white text-xs font-bold px-2 py-0.5 rounded mt-0.5 shrink-0">Q${idx+1}</span>
                    <span class="font-medium text-sm">${q.title}</span>
                `;
                summaryList.appendChild(li);
            });

            resultScreen.classList.remove('hidden');
        }

        // Start
        window.onload = init;

    </script>
</body>
</html>
