  <script>
    // ==========================================
    // 1. カスタムSVGイラスト図解（詳細学習ガイド第1〜6節準拠）
    // ==========================================
    function getSectionIllustration(sectionId) {
      if (sectionId === 1) {

              <span class="text-xs text-blue-800 font-bold">「以上」はその境界値（1,000円・60点）を含む！</span>

                  <line x1="25" y1="50" x2="8" y2="50" stroke="#DC2626" stroke-width="2.5" />
                  <text x="16" y="43" font-size="8" font-weight="900" fill="#DC2626" text-anchor="middle">いいえ</text>

                  <text x="41" y="64" font-size="9" font-weight="bold" fill="#64748B" text-anchor="middle">そのまま支払</text>

      if (sectionId === 2) {
        return `
          <div class="bg-gradient-to-r from-emerald-50/90 to-teal-50/80 border-2 border-emerald-200 rounded-3xl p-5 sm:p-6 space-y-4">

              <span class="text-xs font-extrabold text-emerald-900 bg-white px-3 py-1 rounded-full border border-emerald-200 shadow-2xs">

              </span>
              <span class="text-xs text-emerald-800 font-bold">「合計 = 合計 + 点数」は変数の値を更新する操作！</span>

                  <text x="60" y="50" font-size="14" font-weight="900" fill="#DC2626" text-anchor="middle">0</text>
                </svg>
                <p class="text-xs font-bold text-slate-800">足し算を始める前に、入れ物（変数）の中身を空（0）にしておく</p>
              </div>

              <div class="bg-white rounded-2xl p-3.5 border-2 border-emerald-200 text-center flex flex-col items-center">
                <span class="inline-block whitespace-nowrap px-3 py-1 rounded-full bg-emerald-600 text-white text-xs font-extrabold">② 反復</span>
                <svg viewBox="0 0 130 75" class="w-32 h-16 mx-auto my-2">
                  <rect x="12" y="10" width="106" height="22" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
                  <text x="65" y="24" font-size="8.5" font-weight="bold" fill="#065F46" text-anchor="middle">配列 [80, 70, 90, 60, 100]</text>
                  <path d="M35 52 A16 12 0 1 1 95 52" fill="none" stroke="#059669" stroke-width="2.5" />
                  <polygon points="95,55 90,47 100,47" fill="#059669" />
                  <text x="65" y="64" font-size="8.5" font-weight="900" fill="#047857" text-anchor="middle">5回くり返す → 400</text>
                </svg>
                <p class="text-xs font-bold text-slate-800">配列から1人ずつ点数を取り出し、合計に順に加えていく</p>
              </div>

              <div class="bg-white rounded-2xl p-3.5 border-2 border-indigo-200 text-center flex flex-col items-center">
                <span class="inline-block whitespace-nowrap px-3 py-1 rounded-full bg-indigo-600 text-white text-xs font-extrabold">③ 終了条件</span>
                <svg viewBox="0 0 120 75" class="w-28 h-16 mx-auto my-2">

                  <text x="60" y="25" font-size="8.5" font-weight="bold" fill="#312E81" text-anchor="middle">✓ 1〜4人目</text>
                  <text x="60" y="40" font-size="8.5" font-weight="bold" fill="#312E81" text-anchor="middle">✓ 5人目完了</text>
                  <rect x="38" y="47" width="44" height="13" rx="3" fill="#4F46E5" />
                  <text x="60" y="56" font-size="8" font-weight="bold" fill="white" text-anchor="middle">ループ終了</text>
                </svg>
                <p class="text-xs font-bold text-slate-800">「5人分すべて足したか？」を判定し、終わらなければ無限ループに！</p>
              </div>

              <div class="bg-white rounded-2xl p-3.5 border-2 border-amber-200 text-center flex flex-col items-center">
                <span class="inline-block whitespace-nowrap px-3 py-1 rounded-full bg-amber-600 text-white text-xs font-extrabold">④ 出力</span>

        return `

              </span>

                <svg viewBox="0 0 140 85" class="w-32 h-20 mx-auto">

                  <text x="70" y="46" font-size="13" font-weight="900" fill="#60A5FA" text-anchor="middle">CPU</text>

                  <line x1="30" y1="42" x2="42" y2="42" stroke="#64748B" stroke-width="3" />
                  <line x1="30" y1="56" x2="42" y2="56" stroke="#64748B" stroke-width="3" />
                  <line x1="98" y1="28" x2="110" y2="28" stroke="#64748B" stroke-width="3" />

                <p class="text-xs text-slate-600 leading-relaxed">開いているアプリやブラウザのタブを一時的に置く高速な作業机。容量が足りないと動作が重くなり、<strong class="text-rose-600">電源を切ると消えます</strong>。</p>

              <!-- ストレージ -->

        ],
        answer: 0,
        explanation: '要件定義は開発の最初の工程であり、利用者側の要望をもとに「システムで何を実現するか（機能要件・非機能要件）」を合意・文書化する作業です。'
      },
      {
        id: 'CBT-20',
        category: '総合応用（CBT実践）',
        difficulty: '応用',
        question: 'ある高校の図書館貸出システムがハードウェア故障で停止した。その際の対応策 A〜C と、それぞれに対応するIT用語の組合せとして最も適切なものはどれか。\n\nA：あらかじめ用意していた予備サーバへ自動切り替えを行い、システムを再開した。\nB：切り替え完了までの30分間は、あらかじめ決めていた手順どおり紙の貸出簿で貸出業務を継続した。\nC：システムの修正作業後、貸出画面と蔵書データベースが正しく連携して在庫数が更新されるかテストした。',
        options: [
          'A：冗長化 ／ B：BCP（事業継続計画） ／ C：結合テスト',
          'A：バックアップ ／ B：単体テスト ／ C：受入テスト',
          'A：排他制御 ／ B：要件定義 ／ C：システムテスト',
          'A：冗長化 ／ B：受入テスト ／ C：単体テスト'
        ],
        answer: 0,
        explanation: 'Aは予備設備への切り替えによる「冗長化」、Bは緊急時でも業務を止めない代替手順である「BCP（事業継続計画）」、Cは画面とデータベースの連携を確かめる「結合テスト」です。'
      }
    ];

    // ==========================================
    // 5. 状態管理
    // ==========================================
    const state = {
      activeTab: 'lecture',
      xp: 0,
      completedSections: [],
      completedWorksheet: {},
      selectedSectionId: 1,
      sectionQuizSelection: null,
      sectionQuizSubmitted: false,
      mobileMenuOpen: false,
      wsSelections: {},
      wsSubmitted: {},
      wsShowHint: {},
      cbtMode: 'select', // 'select' | 'running' | 'result'
      cbtQuestions: [],
      currentCbtIdx: 0,
      cbtAnswers: {},
      cbtChecked: {},
      cbtFlags: {}, // CBT特有の「見直しフラグ」
      bestCbtScore: null
    };

    let toastTimer = null;
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const textEl = document.getElementById('toast-text');
      textEl.textContent = msg;
      container.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        container.classList.add('hidden');
      }, 3200);
    }

    function updateHeaderStats() {
      const doneWs = Object.keys(state.completedWorksheet).length;
      document.getElementById('header-lecture-count').textContent = `ガイド: ${state.completedSections.length}/${GUIDE_SECTIONS.length}節`;
      document.getElementById('header-ws-count').textContent = `ワーク: ${doneWs}/${WORKSHEET_QUESTIONS.length}問`;
      document.getElementById('tab-badge-lecture').textContent = `${state.completedSections.length}/${GUIDE_SECTIONS.length}`;
      document.getElementById('tab-badge-worksheet').textContent = `${doneWs}/${WORKSHEET_QUESTIONS.length}`;
      document.getElementById('xp-display').textContent = `${state.xp} XP`;

      if (state.bestCbtScore !== null) {
        const cbtBadge = document.getElementById('tab-badge-cbt');
        cbtBadge.textContent = `最高 ${state.bestCbtScore}%`;
        cbtBadge.classList.remove('hidden');
      }

      const rankTitleEl = document.getElementById('rank-title');
      const rankBadgeBg = document.getElementById('rank-badge-bg');
      if (state.xp >= 1200) {
        rankTitleEl.textContent = 'Lv.4 ITパスポート合格マスター';
        rankBadgeBg.textContent = '🏆';
        rankBadgeBg.className = 'w-7 h-7 rounded-lg bg-gradient-to-br from-amber-500 to-yellow-400 flex items-center justify-center shrink-0 text-sm';
      } else if (state.xp >= 700) {
        rankTitleEl.textContent = 'Lv.3 テクノロジ上級アナリスト';
        rankBadgeBg.textContent = '💻';
        rankBadgeBg.className = 'w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-600 to-blue-600 flex items-center justify-center shrink-0 text-sm';
      } else if (state.xp >= 250) {
        rankTitleEl.textContent = 'Lv.2 アルゴリズムチャレンジャー';
        rankBadgeBg.textContent = '⚙️';
        rankBadgeBg.className = 'w-7 h-7 rounded-lg bg-gradient-to-br from-emerald-600 to-teal-500 flex items-center justify-center shrink-0 text-sm';
      } else {
        rankTitleEl.textContent = 'Lv.1 ITビギナー';
        rankBadgeBg.textContent = '🧭';
        rankBadgeBg.className = 'w-7 h-7 rounded-lg bg-gradient-to-br from-slate-600 to-slate-500 flex items-center justify-center shrink-0 text-sm';
      }
    }

    function switchTab(tab) {
      state.activeTab = tab;
      const tabs = ['lecture', 'worksheet', 'cbt'];
      const activeColors = {
        lecture: 'bg-blue-600 text-white shadow-xs',
        worksheet: 'bg-emerald-600 text-white shadow-xs',
        cbt: 'bg-amber-600 text-white shadow-xs'
      };
      tabs.forEach((t) => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tab) {
          btn.className = `flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeColors[t]}`;
        } else {
          btn.className = 'flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap text-slate-600 hover:bg-white hover:text-slate-900';
        }
      });
      render();
    }

    // ==========================================
    // 6. インタラクティブ操作ハンドラ
    // ==========================================
    function selectSection(id) {
      state.selectedSectionId = id;
      state.sectionQuizSelection = null;
      state.sectionQuizSubmitted = false;
      state.mobileMenuOpen = false;
      render();
    }

    function toggleMobileMenu() {
      state.mobileMenuOpen = !state.mobileMenuOpen;
      render();
    }

    function selectSectionQuizOption(idx) {
      if (state.sectionQuizSubmitted) return;
      state.sectionQuizSelection = idx;
      render();
    }

    function submitSectionQuiz() {
      if (state.sectionQuizSelection === null) return;
      state.sectionQuizSubmitted = true;
      const sec = GUIDE_SECTIONS.find((s) => s.id === state.selectedSectionId);
      if (state.sectionQuizSelection === sec.quiz.answer) {
        if (!state.completedSections.includes(sec.id)) {
          state.completedSections.push(sec.id);
          state.xp += 60;
          showToast(`🎉 第${sec.id}節マスター！ +60 XP 獲得！`);
        } else {
          showToast('✨ 正解です！（マスター済み）');
        }
      }
      render();
    }

    // ワークシート操作
    function toggleWsHint(wsId) {
      state.wsShowHint[wsId] = !state.wsShowHint[wsId];
      render();
    }

    function selectWsOption(wsId, optIdx) {
      if (state.wsSubmitted[wsId]) return;
      state.wsSelections[wsId] = optIdx;
      render();
    }

    function submitWsQuestion(wsId) {
      const sel = state.wsSelections[wsId];
      if (sel === undefined) return;
      state.wsSubmitted[wsId] = true;
      const item = WORKSHEET_QUESTIONS.find((w) => w.id === wsId);
      if (sel === item.answer) {
        if (!state.completedWorksheet[wsId]) {
          state.completedWorksheet[wsId] = true;
          state.xp += 50;
          showToast(`✍️ ${item.num} 正解！ +50 XP 獲得！`);
        } else {
          showToast('✨ 正解です！');
        }
      }
      render();
    }

    // CBT模擬試験操作
    function startCbtExam(count) {
      state.cbtQuestions = count === 10 ? CBT_QUESTIONS.slice(0, 10) : [...CBT_QUESTIONS];
      state.currentCbtIdx = 0;
      state.cbtAnswers = {};
      state.cbtChecked = {};
      state.cbtFlags = {};
      state.cbtMode = 'running';
      render();
    }

    function jumpToCbtQuestion(idx) {
      state.currentCbtIdx = idx;
      render();
    }

    function toggleCbtFlag() {
      const idx = state.currentCbtIdx;
      state.cbtFlags[idx] = !state.cbtFlags[idx];
      render();
    }

    function selectCbtOption(optIdx) {
      if (state.cbtChecked[state.currentCbtIdx]) return;
      state.cbtAnswers[state.currentCbtIdx] = optIdx;
      render();
    }

    function confirmCbtOption() {
      if (state.cbtAnswers[state.currentCbtIdx] === undefined) return;
      state.cbtChecked[state.currentCbtIdx] = true;
      render();
    }

    function nextCbtQuestion() {
      if (state.currentCbtIdx < state.cbtQuestions.length - 1) {
        state.currentCbtIdx += 1;
        render();
      }
    }

    function prevCbtQuestion() {
      if (state.currentCbtIdx > 0) {
        state.currentCbtIdx -= 1;
        render();
      }
    }

    function finishCbtExam() {
      let correctCount = 0;
      state.cbtQuestions.forEach((q, idx) => {
        if (state.cbtAnswers[idx] === q.answer) correctCount++;
      });
      const earned = correctCount * 30;
      state.xp += earned;
      const pct = Math.round((correctCount / state.cbtQuestions.length) * 100);
      if (state.bestCbtScore === null || pct > state.bestCbtScore) {
        state.bestCbtScore = pct;
      }
      state.cbtMode = 'result';
      showToast(`🏆 CBT模擬試験完了！正答率 ${pct}%（+${earned} XP）`);
      render();
    }

    function resetCbtToSelect() {
      state.cbtMode = 'select';
      render();
    }

    // ==========================================
    // 7. 画面レンダリング関数
    // ==========================================
    function renderLecture() {
      const sec = GUIDE_SECTIONS.find((s) => s.id === state.selectedSectionId);
      const isDone = state.completedSections.includes(sec.id);
      const pct = Math.round((state.completedSections.length / GUIDE_SECTIONS.length) * 100);

      const sidebarItems = GUIDE_SECTIONS.map((s) => {
        const done = state.completedSections.includes(s.id);
        const sel = s.id === state.selectedSectionId;
        return `
          <button onclick="selectSection(${s.id})" class="w-full text-left p-3.5 transition-colors flex items-start gap-3 ${sel ? 'bg-blue-50/90 border-l-4 border-blue-600' : 'hover:bg-slate-50'}">
            <div class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${done ? 'bg-emerald-500 text-white' : sel ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}">
              ${done ? '✓' : s.id}
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-[11px] font-semibold text-slate-400">${s.category}</div>
              <div class="text-sm font-bold truncate ${sel ? 'text-blue-950' : 'text-slate-700'}">${s.id}．${s.title}</div>
            </div>
          </button>`;
      }).join('');

      const deepDiveHTML = (sec.deepDive || []).map((item, idx) => `
        <div class="bg-slate-50/90 border border-slate-200 rounded-2xl p-5 space-y-2">
          <h4 class="font-extrabold text-slate-900 text-sm sm:text-base flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-700 text-xs font-black flex items-center justify-center shrink-0">${idx + 1}</span>
            <span>${item.heading}</span>
          </h4>
          <p class="text-xs sm:text-sm text-slate-700 leading-relaxed pl-8">${item.body}</p>
        </div>
      `).join('');

      let tableHTML = '';
      if (sec.tableData) {
        const ths = sec.tableData.headers.map((h) => `<th class="p-3.5 font-extrabold whitespace-nowrap">${h}</th>`).join('');
        const trs = sec.tableData.rows.map((row) => {
          const tds = row.map((cell, cIdx) => `
            <td class="p-3.5 leading-relaxed ${cIdx === 0 ? 'font-extrabold text-slate-900 bg-slate-50/60 whitespace-nowrap' : 'text-slate-700'}">${cell}</td>
          `).join('');
          return `<tr class="hover:bg-slate-50/80">${tds}</tr>`;
        }).join('');
        tableHTML = `
          <div class="space-y-3">
            <h3 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
              <span>📋</span>
              <span>${sec.tableData.title}</span>
            </h3>
            <div class="overflow-x-auto rounded-2xl border border-slate-200 shadow-2xs">
              <table class="w-full text-left border-collapse text-xs sm:text-sm">
                <thead><tr class="bg-slate-800 text-white">${ths}</tr></thead>
                <tbody class="divide-y divide-slate-200 bg-white">${trs}</tbody>
              </table>
            </div>
          </div>`;
      }

      const quizOptsHTML = sec.quiz.options.map((opt, idx) => {
        const isSel = state.sectionQuizSelection === idx;
        const isAns = sec.quiz.answer === idx;
        let btnStyle = 'bg-slate-800 border-slate-700 hover:bg-slate-700 text-slate-100';
        if (state.sectionQuizSubmitted) {
          if (isAns) btnStyle = 'bg-emerald-900/80 border-emerald-400 text-emerald-100';
          else if (isSel && !isAns) btnStyle = 'bg-rose-900/80 border-rose-400 text-rose-100';
          else btnStyle = 'bg-slate-800/50 border-slate-700/50 text-slate-400';
        } else if (isSel) {
          btnStyle = 'bg-blue-600 border-blue-400 text-white';
        }
        return `
          <button onclick="selectSectionQuizOption(${idx})" class="w-full text-left p-3.5 rounded-xl border-2 text-xs sm:text-sm font-medium transition-all flex items-start gap-3 ${btnStyle}">
            <span class="font-extrabold shrink-0 mt-0.5">${['ア', 'イ', 'ウ', 'エ'][idx]}.</span>
            <span class="flex-1">${opt}</span>
            ${state.sectionQuizSubmitted && isAns ? '<span class="text-emerald-400 font-bold">⭕</span>' : ''}
            ${state.sectionQuizSubmitted && isSel && !isAns ? '<span class="text-rose-400 font-bold">❌</span>' : ''}
          </button>`;
      }).join('');

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <!-- モバイル節選択 -->
          <div class="lg:hidden">
            <button onclick="toggleMobileMenu()" class="w-full flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs font-bold text-slate-800">
              <span class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-extrabold">${sec.id}</span>
                <span>${sec.id}．${sec.title}</span>
              </span>
              <span>${state.mobileMenuOpen ? '▲' : '▼'}</span>
            </button>
          </div>

          <!-- 左サイドバー -->
          <aside class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-hidden ${state.mobileMenuOpen ? 'block' : 'hidden lg:block'}">
            <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
              <span class="font-bold text-sm">📘 詳細学習ガイド（全6節）</span>
              <span class="text-xs text-slate-300">達成率 ${pct}%</span>
            </div>
            <div class="w-full bg-slate-200 h-1.5">
              <div class="bg-blue-600 h-1.5 transition-all duration-500" style="width: ${pct}%"></div>
            </div>
            <div class="divide-y divide-slate-100">${sidebarItems}</div>
          </aside>

          <!-- 右メイン講義 -->
          <section class="lg:col-span-8 space-y-6">
            <div class="bg-white rounded-3xl border border-slate-200 shadow-2xs overflow-hidden">
              <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 p-6 sm:p-8 text-white">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-500/30 text-blue-200 border border-blue-400/30">
                    第7回 学習ガイド ・ 第${sec.id}節 / ${sec.category}
                  </span>
                  ${isDone ? '<span class="text-xs font-bold bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full border border-emerald-400/30">✅ マスター済み</span>' : ''}
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-2">${sec.id}．${sec.title}</h2>
                <p class="text-blue-200 text-sm sm:text-base font-medium">${sec.subtitle}</p>
              </div>

              <div class="p-6 sm:p-8 space-y-8">
                <!-- ポイント要約 -->
                <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-5 flex gap-4 items-start">
                  <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shrink-0 mt-0.5 text-lg">💡</div>
                  <div>
                    <h3 class="text-xs font-extrabold uppercase tracking-wider text-blue-700 mb-1">この節のコア・コンセプト</h3>
                    <p class="text-slate-800 text-sm sm:text-base leading-relaxed font-medium">${sec.summary}</p>
                  </div>
                </div>

                <!-- イラスト図解 -->
                ${sec.hasIllustration ? getSectionIllustration(sec.id) : ''}

                <!-- 詳細解説 -->
                <div class="space-y-4">
                  <h3 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
                    <span>📖</span>
                    <span>詳しく理解しよう（講義解説）</span>
                  </h3>
                  <div class="grid grid-cols-1 gap-4">${deepDiveHTML}</div>
                </div>

                <!-- 整理テーブル -->
                ${tableHTML}

                <!-- 節末チェッククイズ -->
                <div class="bg-slate-900 text-white rounded-3xl p-6 sm:p-7 space-y-4">
                  <div class="flex items-center gap-2 text-amber-400 font-extrabold text-sm">
                    <span>⭐ 第${sec.id}節 理解度チェッククイズ（正解で +60 XP）</span>
                  </div>
                  <p class="font-bold text-sm sm:text-base leading-relaxed whitespace-pre-line">${sec.quiz.question}</p>
                  <div class="space-y-2.5">${quizOptsHTML}</div>
                  ${!state.sectionQuizSubmitted ? `
                    <button onclick="submitSectionQuiz()" ${state.sectionQuizSelection === null ? 'disabled' : ''} class="w-full sm:w-auto px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 disabled:bg-slate-700 disabled:text-slate-500 text-slate-950 font-extrabold text-sm transition-colors">
                      回答を判定する
                    </button>
                  ` : `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-2">
                      <div class="font-extrabold text-sm">
                        ${state.sectionQuizSelection === sec.quiz.answer
                          ? '<span class="text-emerald-400">⭕ 正解です！ばっちり理解できています。</span>'
                          : '<span class="text-rose-400">❌ おしい！解説と図解を見直して定着させましょう。</span>'}
                      </div>
                      <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">${sec.quiz.explanation}</p>
                    </div>
                  `}
                </div>

                <!-- 前後ナビ -->
                <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                  <button onclick="selectSection(${Math.max(1, sec.id - 1)})" ${sec.id === 1 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:bg-slate-100 disabled:opacity-30">
                    ← 前の節へ
                  </button>
                  ${sec.id < GUIDE_SECTIONS.length ? `
                    <button onclick="selectSection(${sec.id + 1})" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-blue-600 text-white hover:bg-blue-700 shadow-2xs">
                      第${sec.id + 1}節へ進む →
                    </button>
                  ` : `
                    <button onclick="switchTab('worksheet')" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-emerald-600 text-white hover:bg-emerald-700 shadow-2xs">
                      ステージ2（ワークシート演習）へ進む →
                    </button>
                  `}
                </div>
              </div>
            </div>
          </section>
        </div>`;
    }

    function renderWorksheet() {
      const doneCount = Object.keys(state.completedWorksheet).length;
      const pct = Math.round((doneCount / WORKSHEET_QUESTIONS.length) * 100);

      const cardsHTML = WORKSHEET_QUESTIONS.map((item) => {
        const isDone = !!state.completedWorksheet[item.id];
        const isSub = !!state.wsSubmitted[item.id];
        const selIdx = state.wsSelections[item.id];
        const showHint = !!state.wsShowHint[item.id];

        const optsHTML = item.options.map((opt, idx) => {
          const isSel = selIdx === idx;
          const isCor = item.answer === idx;
          let style = 'bg-slate-50 border-slate-200 hover:border-emerald-400 text-slate-800';
          if (isSub) {
            if (isCor) style = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-extrabold';
            else if (isSel && !isCor) style = 'bg-rose-50 border-rose-500 text-rose-950';
            else style = 'bg-slate-50/50 border-slate-200/60 text-slate-400';
          } else if (isSel) {
            style = 'bg-emerald-50 border-emerald-600 text-emerald-950 ring-2 ring-emerald-100';
          }

          return `
            <button onclick="selectWsOption('${item.id}', ${idx})" class="w-full text-left p-3.5 rounded-xl border-2 text-xs sm:text-sm font-bold transition-all flex items-start gap-3 ${style}">
              <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${isSub && isCor ? 'bg-emerald-600 text-white' : isSel ? 'bg-emerald-600 text-white' : 'bg-white border border-slate-300 text-slate-600'}">
                ${['ア', 'イ', 'ウ'][idx]}
              </span>
              <span class="flex-1 leading-relaxed">${opt}</span>
              ${isSub && isCor ? '<span class="text-emerald-600 text-base">⭕</span>' : ''}
              ${isSub && isSel && !isCor ? '<span class="text-rose-600 text-base">❌</span>' : ''}
            </button>`;
        }).join('');

        return `
          <div class="bg-white rounded-3xl border ${isDone ? 'border-emerald-300' : 'border-slate-200'} shadow-2xs p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-lg bg-emerald-600 text-white text-xs font-extrabold">${item.num}</span>
                <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold">〔${item.ref}〕</span>
                <span class="font-extrabold text-sm text-slate-900">${item.title}</span>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="toggleWsHint('${item.id}')" class="text-xs font-bold px-3 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100">
                  💡 ${showHint ? 'ヒントを隠す' : 'ヒントを見る'}
                </button>
                ${isDone ? '<span class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">✅ クリア済</span>' : ''}
              </div>
            </div>

            <p class="text-sm sm:text-base font-bold text-slate-800 leading-relaxed whitespace-pre-line">${item.question}</p>

            ${showHint ? `
              <div class="bg-amber-50/80 border border-amber-200 rounded-xl p-3 text-xs sm:text-sm text-amber-900 font-medium">
                ${item.hint}
              </div>
            ` : ''}

            <div class="space-y-2.5">${optsHTML}</div>

            ${!isSub ? `
              <button onclick="submitWsQuestion('${item.id}')" ${selIdx === undefined ? 'disabled' : ''} class="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-extrabold text-xs sm:text-sm transition-colors">
                答え合わせをする（+50 XP）
              </button>
            ` : `
              <div class="bg-slate-900 text-white rounded-2xl p-4 space-y-1">
                <div class="text-xs font-extrabold text-emerald-400">
                  ${selIdx === item.answer ? '⭕ 正解！解説のポイント' : '❌ もう一度確認しよう！解説のポイント'}
                </div>
                <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${item.explanation}</p>
              </div>
            `}
          </div>`;
      }).join('');

      return `
        <div class="space-y-6">
          <div class="bg-gradient-to-r from-emerald-900 via-teal-900 to-slate-900 rounded-3xl p-6 sm:p-8 text-white flex flex-wrap items-center justify-between gap-4">
            <div class="space-y-1.5 max-w-2xl">
              <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/30 text-emerald-200 border border-emerald-400/30">
                第7回 ワークシート完全収録（問題1〜12 ＋ 総合チャレンジ13〜14）
              </span>
              <h2 class="text-2xl sm:text-3xl font-extrabold">ワークシート演習ラボ</h2>
              <p class="text-emerald-100 text-xs sm:text-sm">
                ワークシートの全14問をインタラクティブに解答できます。迷ったときはヒントを開いたり、ステージ1のガイドに戻って確認しよう！
              </p>
            </div>
            <div class="bg-white/10 backdrop-blur-xs border border-white/20 rounded-2xl p-4 text-center min-w-[140px]">
              <div class="text-xs text-emerald-200 font-bold">ワーク達成率</div>
              <div class="text-2xl font-black text-amber-400 mt-0.5">${pct}%</div>
              <div class="text-[11px] text-slate-300">${doneCount} / ${WORKSHEET_QUESTIONS.length} 問完了</div>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-5">${cardsHTML}</div>
        </div>`;
    }

    function renderCbt() {
      if (state.cbtMode === 'select') {
        return `
          <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-2xs p-6 sm:p-10 text-center space-y-6">
            <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-3xl">💻</div>
            <div class="space-y-2 max-w-xl mx-auto">
              <span class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
                実際のCBT試験画面を再現（見直しフラグ・問題一覧ナビ搭載）
              </span>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">ITパスポート 実戦CBT模擬試験</h2>
              <p class="text-slate-600 text-sm sm:text-base leading-relaxed">
                タイマーや制限時間のプレッシャーはありません。実際のCBT試験のように「見直しフラグ」や「問題番号ジャンプ」を使いながら、トレース計算・稼働率・システム開発テストの応用問題に挑戦しましょう！
              </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 max-w-2xl mx-auto text-left">
              <div class="border-2 border-slate-200 hover:border-blue-500 rounded-2xl p-6 flex flex-col justify-between transition-all bg-slate-50/60">
                <div class="space-y-2">
                  <span class="text-xs font-extrabold text-blue-700 bg-blue-100 px-2.5 py-1 rounded-md">標準CBT演習（全10問）</span>
                  <h3 class="text-lg font-extrabold text-slate-900">基本トレース＆用語マスター</h3>
                  <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">アルゴリズムのトレース、CPU・メモリ・SSDの区別を中心に10問出題します。</p>
                </div>
                <button onclick="startCbtExam(10)" class="mt-6 w-full py-3 rounded-xl bg-slate-900 hover:bg-blue-600 text-white font-extrabold text-sm transition-colors">
                  10問コースを開始する →
                </button>
              </div>

              <div class="border-2 border-amber-300 hover:border-amber-500 rounded-2xl p-6 flex flex-col justify-between transition-all bg-amber-50/30">
                <div class="space-y-2">
                  <span class="text-xs font-extrabold text-amber-800 bg-amber-200/80 px-2.5 py-1 rounded-md">本番完全模擬（全20問）</span>
                  <h3 class="text-lg font-extrabold text-slate-900">第7回全範囲＋総合事例CBT</h3>
                  <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">直列・並列の稼働率計算、4段階テストの事例判断、BCP複合問題まで全20問に挑みます！</p>
                </div>
                <button onclick="startCbtExam(20)" class="mt-6 w-full py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-sm transition-colors shadow-2xs">
                  20問完全模擬に挑む ⚡
                </button>
              </div>
            </div>
          </div>`;
      }

      if (state.cbtMode === 'running') {
        const q = state.cbtQuestions[state.currentCbtIdx];
        const isChecked = !!state.cbtChecked[state.currentCbtIdx];
        const selIdx = state.cbtAnswers[state.currentCbtIdx];
        const isFlagged = !!state.cbtFlags[state.currentCbtIdx];

        // CBT試験風の問題番号パレット
        const navGrid = state.cbtQuestions.map((_, idx) => {
          const cur = idx === state.currentCbtIdx;
          const ans = state.cbtAnswers[idx] !== undefined;
          const chk = !!state.cbtChecked[idx];
          const flg = !!state.cbtFlags[idx];
          let bg = 'bg-slate-100 text-slate-600 border-slate-200';
          if (chk) {
            bg = state.cbtAnswers[idx] === state.cbtQuestions[idx].answer
              ? 'bg-emerald-100 text-emerald-800 border-emerald-400'
              : 'bg-rose-100 text-rose-800 border-rose-400';
          } else if (ans) {
            bg = 'bg-blue-100 text-blue-800 border-blue-400';
          }
          if (cur) bg += ' ring-2 ring-slate-900 font-black';

          return `
            <button onclick="jumpToCbtQuestion(${idx})" class="relative h-9 rounded-lg border text-xs font-bold flex items-center justify-center transition-all ${bg}">
              ${idx + 1}
              ${flg ? '<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-amber-500 border border-white"></span>' : ''}
            </button>`;
        }).join('');

        const optsHTML = q.options.map((opt, idx) => {
          const isSel = selIdx === idx;
          const isCor = q.answer === idx;
          let style = 'bg-white border-slate-200 hover:border-blue-400 text-slate-800';
          if (isChecked) {
            if (isCor) style = 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-2 ring-emerald-200';
            else if (isSel && !isCor) style = 'bg-rose-50 border-rose-500 text-rose-950';
            else style = 'bg-slate-50 border-slate-200 text-slate-400';
          } else if (isSel) {
            style = 'bg-blue-50 border-blue-600 text-blue-950 ring-2 ring-blue-100';
          }

          return `
            <button onclick="selectCbtOption(${idx})" class="w-full text-left p-4 rounded-2xl border-2 font-bold text-sm sm:text-base transition-all flex items-start gap-3.5 ${style}">
              <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${isChecked && isCor ? 'bg-emerald-600 text-white' : isSel ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}">
                ${['ア', 'イ', 'ウ', 'エ'][idx]}
              </span>
              <span class="flex-1 leading-snug">${opt}</span>
              ${isChecked && isCor ? '<span class="text-emerald-600 text-lg">⭕</span>' : ''}
              ${isChecked && isSel && !isCor ? '<span class="text-rose-600 text-lg">❌</span>' : ''}
            </button>`;
        }).join('');

        return `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- 左：CBT問題番号パレット -->
            <aside class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-4 space-y-4 shadow-2xs">
              <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                <span class="text-xs font-extrabold text-slate-800">🖥️ CBT問題一覧ナビ</span>
                <button onclick="resetCbtToSelect()" class="text-[11px] text-slate-400 hover:text-slate-700 underline">中断して戻る</button>
              </div>
              <div class="grid grid-cols-5 gap-1.5">${navGrid}</div>
              <div class="text-[11px] text-slate-500 space-y-1 pt-2 border-t border-slate-100">
                <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> オレンジ点：見直しフラグ</div>
                <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-emerald-200 inline-block"></span> 緑：正解確定 ／ 赤：不正解</div>
              </div>
              <button onclick="finishCbtExam()" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-amber-600 text-white font-extrabold text-xs transition-colors">
                採点して成績レポートを見る 🏆
              </button>
            </aside>

            <!-- 右：CBT試験問題画面 -->
            <section class="lg:col-span-9 bg-white rounded-3xl border border-slate-200 shadow-2xs overflow-hidden">
              <div class="bg-slate-900 text-white px-6 py-4 flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2.5">
                  <span class="px-3 py-1 rounded-lg bg-amber-500 text-slate-950 font-extrabold text-xs">
                    問 ${state.currentCbtIdx + 1} / ${state.cbtQuestions.length}
                  </span>
                  <span class="text-xs text-slate-300 font-semibold">${q.category}（難易度：${q.difficulty}）</span>
                </div>
                <button onclick="toggleCbtFlag()" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors ${isFlagged ? 'bg-amber-500/20 border-amber-400 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'}">
                  🚩 ${isFlagged ? '見直しフラグ ON' : 'あとで見直す'}
                </button>
              </div>

              <div class="p-6 sm:p-8 space-y-6">
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5">
                  <p class="text-base sm:text-lg font-extrabold text-slate-900 leading-relaxed whitespace-pre-line">${q.question}</p>
                </div>

                <div class="space-y-3">${optsHTML}</div>

                ${!isChecked ? `
                  <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                    <div class="flex gap-2">
                      <button onclick="prevCbtQuestion()" ${state.currentCbtIdx === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-xs sm:text-sm text-slate-600 hover:bg-slate-50 disabled:opacity-30">
                        ← 前の問題
                      </button>
                      <button onclick="nextCbtQuestion()" ${state.currentCbtIdx === state.cbtQuestions.length - 1 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-xs sm:text-sm text-slate-600 hover:bg-slate-50 disabled:opacity-30">
                        次の問題 →
                      </button>
                    </div>
                    <button onclick="confirmCbtOption()" ${selIdx === undefined ? 'disabled' : ''} class="px-8 py-3 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-extrabold text-sm transition-colors shadow-2xs">
                      解答を確定して解説を見る
                    </button>
                  </div>
                ` : `
                  <div class="bg-slate-900 text-white rounded-2xl p-5 sm:p-6 space-y-3">
                    <div class="font-extrabold text-base">
                      ${selIdx === q.answer
                        ? `<span class="text-emerald-400">⭕ 正解！（選択肢 ${['ア', 'イ', 'ウ', 'エ'][q.answer]}）</span>`
                        : `<span class="text-rose-400">❌ 不正解（正解は選択肢 ${['ア', 'イ', 'ウ', 'エ'][q.answer]}）</span>`}
                    </div>
                    <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${q.explanation}</p>
                    <div class="pt-2 flex justify-between items-center">
                      <button onclick="prevCbtQuestion()" ${state.currentCbtIdx === 0 ? 'disabled' : ''} class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs disabled:opacity-30">
                        ← 前の問題
                      </button>
                      ${state.currentCbtIdx < state.cbtQuestions.length - 1 ? `
                        <button onclick="nextCbtQuestion()" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm">
                          次の問題へ進む →
                        </button>
                      ` : `
                        <button onclick="finishCbtExam()" class="px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm">
                          最終成績レポートを見る 🏆
                        </button>
                      `}
                    </div>
                  </div>
                `}
              </div>
            </section>
          </div>`;
      }

      if (state.cbtMode === 'result') {
        let totalCorrect = 0;
        const catStats = {};
        state.cbtQuestions.forEach((q, idx) => {
          if (!catStats[q.category]) catStats[q.category] = { total: 0, correct: 0 };
          catStats[q.category].total += 1;
          if (state.cbtAnswers[idx] === q.answer) {
            totalCorrect += 1;
            catStats[q.category].correct += 1;
          }
        });
        const scorePct = Math.round((totalCorrect / state.cbtQuestions.length) * 100);
        const passed = scorePct >= 60; // ITパスポート合格基準は600点/1000点（60%以上）

        const catBars = Object.entries(catStats).map(([cat, st]) => {
          const cPct = Math.round((st.correct / st.total) * 100);
          return `
            <div class="space-y-1">
              <div class="flex justify-between text-xs sm:text-sm font-bold">
                <span class="text-slate-800">${cat}</span>
                <span class="${cPct >= 60 ? 'text-emerald-600' : 'text-rose-600'}">${st.correct} / ${st.total} 問（${cPct}%）</span>
              </div>
              <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                <div class="h-2.5 rounded-full ${cPct >= 60 ? 'bg-emerald-500' : 'bg-rose-500'}" style="width: ${cPct}%"></div>
              </div>
            </div>`;
        }).join('');

        const reviewList = state.cbtQuestions.map((q, idx) => {
          const isRight = state.cbtAnswers[idx] === q.answer;
          return `
            <div class="p-4 bg-white flex items-start gap-3">
              <div class="mt-0.5 shrink-0 font-bold">${isRight ? '⭕' : '❌'}</div>
              <div class="space-y-1 text-xs sm:text-sm">
                <div class="font-bold text-slate-900">問${idx + 1}（${q.category}）：${q.question.split('\n')[0]}</div>
                <div class="text-slate-600">正解：<span class="font-bold text-emerald-700">${['ア', 'イ', 'ウ', 'エ'][q.answer]}. ${q.options[q.answer]}</span></div>
                <p class="text-slate-500 text-xs leading-relaxed">${q.explanation}</p>
              </div>
            </div>`;
        }).join('');

        return `
          <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-2xs p-6 sm:p-10 space-y-8">
            <div class="text-center space-y-3">
              <div class="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl ${passed ? 'bg-amber-100' : 'bg-blue-100'}">🏆</div>
              <div class="inline-block px-3.5 py-1 rounded-full text-xs font-extrabold bg-slate-900 text-amber-400">
                ${passed ? '🎉 ITパスポート合格基準（60%以上）突破！' : '📚 あと一歩！苦手分野をガイドで復習しよう'}
              </div>
              <h2 class="text-3xl sm:text-4xl font-black text-slate-900">
                正答率 ${scorePct}% <span class="text-lg font-bold text-slate-500">（${totalCorrect} / ${state.cbtQuestions.length} 問正解）</span>
              </h2>
            </div>

            <div class="bg-slate-50 rounded-2xl p-6 border border-slate-200 space-y-4">
              <h3 class="text-sm font-extrabold text-slate-900">📊 分野別スコア分析</h3>
              <div class="space-y-3.5">${catBars}</div>
            </div>

            <div class="space-y-3">
              <h3 class="text-sm font-extrabold text-slate-900">📝 全問振り返り＆解説</h3>
              <div class="divide-y divide-slate-200 border border-slate-200 rounded-2xl overflow-hidden">${reviewList}</div>
            </div>

            <div class="flex flex-wrap justify-center gap-3 pt-2">
              <button onclick="resetCbtToSelect()" class="px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm">
                もう一度CBT模擬試験に挑戦する
              </button>
              <button onclick="switchTab('lecture')" class="px-6 py-3 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 font-extrabold text-sm">
                図解学習ガイドで復習する
              </button>
            </div>
          </div>`;
      }
    }

    function render() {
      updateHeaderStats();
      const mainEl = document.getElementById('app-main');
      if (state.activeTab === 'lecture') {
        mainEl.innerHTML = renderLecture();
      } else if (state.activeTab === 'worksheet') {
        mainEl.innerHTML = renderWorksheet();
      } else if (state.activeTab === 'cbt') {
        mainEl.innerHTML = renderCbt();
      }
    }

    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
