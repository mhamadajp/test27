    // =========================================================================
    // 5. レベル＆XP計算・実績解除ロジック
    // =========================================================================
    function getLevelInfo() {
      // 100XPごとに1レベルアップ
      const level = Math.floor(appState.xp / 100) + 1;
      const currentLevelXp = appState.xp % 100;
      let rankTitle = '情報ビギナー';
      if (level >= 20) rankTitle = '情報Ⅰグランドマスター';
      else if (level >= 15) rankTitle = '伝説の提案ディレクター';
      else if (level >= 10) rankTitle = 'コード＆デザイン使い';
      else if (level >= 5) rankTitle = 'アイデア探究者';
      else if (level >= 2) rankTitle = '見習いクリエイター';
      return { level, currentLevelXp, rankTitle };
    }

    function updateHeaderStats() {
      const el = document.getElementById('header-player-stats');
      if (!el) return;
      const { level, currentLevelXp, rankTitle } = getLevelInfo();
      const comboHtml = appState.combo >= 2
        ? `<span class="px-2 py-0.5 rounded-full bg-amber-400 text-slate-950 font-black text-[11px] combo-glow">🔥 ${appState.combo} COMBO</span>`
        : `<span class="text-[11px] text-slate-400 font-bold">習得 ${appState.masteredIds.size}/100</span>`;

      el.innerHTML = `
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded-lg bg-brand-500 font-black text-[11px]">Lv.${level}</span>
          <span class="hidden md:inline font-bold text-slate-200">${rankTitle}</span>
          <div class="w-14 sm:w-20 bg-slate-700 h-2 rounded-full overflow-hidden" title="次のレベルまで ${100 - currentLevelXp} XP">
            <div class="bg-amber-400 h-2 rounded-full transition-all duration-300" style="width: ${currentLevelXp}%"></div>
          </div>
          ${comboHtml}
        </div>
      `;
    }

    function awardXpAndCheckTrophies(isCorrect, qId) {
      if (isCorrect) {
        appState.combo += 1;
        if (appState.combo > appState.maxCombo) {
          appState.maxCombo = appState.combo;
        }
        const bonus = Math.min(appState.combo * 5, 50);
        const gained = 20 + bonus;
        appState.xp += gained;
      } else {
        appState.combo = 0;
      }

      // 実績チェック
      const unlock = (id) => {
        if (!appState.unlockedTrophies.has(id)) {
          appState.unlockedTrophies.add(id);
          const t = TROPHIES.find(item => item.id === id);
          if (t) {
            showToast(`「${t.title}」を獲得しました！`, t.icon, '🏆 実績解除！');
          }
        }
      };

      if (appState.masteredIds.size >= 1) unlock('first_clear');
      if (appState.combo >= 5) unlock('combo_5');
      if (appState.combo >= 15) unlock('combo_15');
      if (appState.masteredIds.size >= 10) unlock('master_10');
      if (appState.masteredIds.size >= 50) unlock('master_50');
      if (appState.masteredIds.size >= 100) unlock('master_100');

      const checkCatComplete = (catId, trophyId) => {
        const catQs = QUESTIONS.filter(q => q.category === catId);
        if (catQs.every(q => appState.masteredIds.has(q.id))) {
          unlock(trophyId);
        }
      };
      checkCatComplete('cat2', 'cat2_clear');
      checkCatComplete('cat3', 'cat3_clear');
      checkCatComplete('cat5', 'cat5_clear');
      checkCatComplete('cat6', 'cat6_clear');
      checkCatComplete('cat8', 'cat8_clear');

      updateHeaderStats();
    }

    // =========================================================================
    // 6. ユーティリティ & モーダル・トースト制御
    // =========================================================================
    function showToast(text, icon = '✨', title = 'お知らせ') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-text').textContent = text;
      document.getElementById('toast-icon').textContent = icon;
      toast.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 3600);
    }

    function openConfirmModal(title, desc, onConfirm) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-desc').textContent = desc;
      const okBtn = document.getElementById('confirm-ok-btn');
      okBtn.onclick = () => {
        closeConfirmModal();
        onConfirm();
      };
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
    }

    function stopTimer() {
      if (appState.timerInterval) {
        clearInterval(appState.timerInterval);
        appState.timerInterval = null;
      }
    }

    function startTimer() {
      stopTimer();
      appState.examStartTime = Date.now();
      appState.examElapsedSec = 0;
      appState.timerInterval = setInterval(() => {
        appState.examElapsedSec = Math.floor((Date.now() - appState.examStartTime) / 1000);
        const timerEl = document.getElementById('exam-timer-display');
        if (timerEl) {
          timerEl.textContent = formatTime(appState.examElapsedSec);
        }
      }, 1000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

        return;
      }
      stopTimer();

      renderApp();
    }

      stopTimer();
      appState.screen = 'lab';
      renderApp();

      stopTimer();

    function openEncyclopedia() {
      stopTimer();
      appState.screen = 'encyclopedia';
      renderApp();
    }

    function setMode(mode) {
      appState.mode = mode;
      renderApp();
    }

    function startCourse(type, catId = null) {
      let selected = [];
      let title = '';

      if (type === 'all') {
        selected = [...QUESTIONS];
        title = '全100問 グランドクエスト（Q1〜Q100）';
      } else if (type === 'category') {
        const cat = CATEGORIES.find(c => c.id === catId);
        selected = QUESTIONS.filter(q => q.category === catId);
        title = `分野別クエスト：${cat.name}`;
      } else if (type === 'mock30') {
        // 添付課題と同じ全30問構成を全8分野から抽出
        selected = shuffleArray(QUESTIONS).slice(0, 30);
        title = '本番形式 30問模擬テスト（ランダム抽出）';
      } else if (type === 'quick10') {
        selected = shuffleArray(QUESTIONS).slice(0, 10);
        title = 'スキマ時間 クイック10問チャレンジ';
      } else if (type === 'wrong') {
        selected = QUESTIONS.filter(q => appState.wrongHistory.has(q.id));
        if (selected.length === 0) {
          showToast('現在、間違えた問題の履歴はありません！パーフェクト！', '👑', 'ミス問題ゼロ');
          return;
        }
        title = `弱点リベンジクエスト（全${selected.length}問）`;
      }

      appState.activeQuestions = selected.map(q => {
        const indexedOptions = q.options.map((text, idx) => ({
          text,
          isCorrect: idx === q.answer
        }));
        const shuffled = shuffleArray(indexedOptions);
        return {
          ...q,
          displayOptions: shuffled.map(o => o.text),
          displayAnswer: shuffled.findIndex(o => o.isCorrect)
        };
      });

      appState.courseTitle = title;
      appState.currentIndex = 0;
      appState.userAnswers = {};
      appState.revealedPractice = {};
      appState.showHint = {};
      appState.flagged = {};
      appState.examSubmitted = false;
      appState.screen = 'quiz';

      if (appState.mode === 'exam') {
        startTimer();
      } else {
        stopTimer();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

    function renderApp() {
      updateHeaderStats();

        home: 'btn-nav-home',
        lab: 'btn-nav-lab',
        trophies: 'btn-nav-trophy',
        encyclopedia: 'btn-nav-dict'
      };
      Object.values(navMap).forEach(btnId => {
        const el = document.getElementById(btnId);
        if (el) {
          el.classList.remove('bg-brand-50', 'text-brand-700');
          el.classList.add('text-slate-600');
        }
      });
      const activeBtnId = navMap[appState.screen] || 'btn-nav-home';

      if (activeEl) {
        activeEl.classList.add('bg-brand-50', 'text-brand-700');
        activeEl.classList.remove('text-slate-600');

      if (appState.screen === 'home') root.innerHTML = renderHomeView();
      else if (appState.screen === 'quiz') root.innerHTML = renderQuizView();
      else if (appState.screen === 'result') root.innerHTML = renderResultView();
      else if (appState.screen === 'lab') root.innerHTML = renderLabView();
      else if (appState.screen === 'trophies') root.innerHTML = renderTrophiesView();
      else if (appState.screen === 'encyclopedia') root.innerHTML = renderEncyclopediaView();

                if (isCurrent) btnCls += ' outline-2 outline-offset-1 outline-slate-900 font-black';

    // =========================================================================
    // 11. クイズ操作イベント
    // =========================================================================
    function selectOption(qId, optIdx) {
      const q = appState.activeQuestions.find(item => item.id === qId);
      if (!q) return;

      const alreadyRevealed = appState.revealedPractice[qId];
      appState.userAnswers[qId] = optIdx;

      if (appState.mode === 'practice') {
        appState.revealedPractice[qId] = true;
        const isCorrect = optIdx === q.displayAnswer;
        if (isCorrect) {
          appState.masteredIds.add(qId);
          appState.wrongHistory.delete(qId);
        } else {
          appState.wrongHistory.add(qId);
        }
        if (!alreadyRevealed) {
          awardXpAndCheckTrophies(isCorrect, qId);
        }
      }
      renderApp();
    }

    function toggleQuestionHint(qId) {
      appState.showHint[qId] = !appState.showHint[qId];
      renderApp();
    }

    function toggleQuestionFlag(qId) {
      appState.flagged[qId] = !appState.flagged[qId];
      renderApp();
    }

    function moveQuestion(delta) {
      const next = appState.currentIndex + delta;
      if (next >= 0 && next < appState.activeQuestions.length) {
        appState.currentIndex = next;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderApp();
      }
    }

    function jumpToQuestion(index) {
      appState.currentIndex = index;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

    function confirmFinishExam() {
      const total = appState.activeQuestions.length;
      const answered = Object.keys(appState.userAnswers).length;
      const unanswered = total - answered;

      const msg = unanswered > 0
        ? `まだ未解答の問題が ${unanswered} 問あります。このまま採点して結果を表示しますか？`
        : `全 ${total} 問の解答が完了しています。採点結果を表示しますか？`;

      openConfirmModal('試験を終了して採点する', msg, () => {
        stopTimer();
        appState.examSubmitted = true;
        let okCount = 0;
        appState.activeQuestions.forEach(q => {
          const ans = appState.userAnswers[q.id];
          const isOk = ans === q.displayAnswer;
          if (isOk) {
            okCount++;
            appState.masteredIds.add(q.id);
            appState.wrongHistory.delete(q.id);
          } else {
            appState.wrongHistory.add(q.id);
          }
          awardXpAndCheckTrophies(isOk, q.id);
        });
        const pct = Math.round((okCount / total) * 100);
        if (pct >= 80 && !appState.unlockedTrophies.has('exam_pass')) {
          appState.unlockedTrophies.add('exam_pass');
          showToast('「模擬試験合格者」を獲得しました！', '🎓', '🏆 実績解除！');
        }
        appState.screen = 'result';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderApp();
      });
    }

    function finishPractice() {
      stopTimer();
      appState.screen = 'result';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

                    &lt;br&gt;タグを ${appState.labHtmlBr ? '外す' : '入れる'}
                  </button>
                  <button onclick="appState.labHtmlHex = appState.labHtmlHex === '#66CC00' ? '#2563EB' : '#66CC00'; renderApp();" class="px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold text-xs">
                    色を切替 (#66CC00 / #2563EB)
                  </button>
                </div>
              </div>

              <div class="bg-slate-50 border-2 border-slate-200 p-4 rounded-2xl">
                <div class="text-xs font-bold text-slate-400 mb-2">ブラウザでの実際の表示結果：</div>
                <div class="text-xl font-black mb-2" style="color: ${appState.labHtmlHex};">文化祭へようこそ</div>
                <p class="text-sm text-slate-800">
                  1行目の文章です。${appState.labHtmlBr ? '<br/>' : ' '}2行目の文章です。
                </p>
                <div class="mt-3 text-[11px] text-slate-500">
                  ※${appState.labHtmlBr ? '&lt;br&gt;タグがあるため改行されています！' : 'Enterキーで改行しただけなので、ブラウザ上では1行につながっています！'}
                </div>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 14. 実績トロフィー図鑑画面
    // =========================================================================
    function renderTrophiesView() {
      return `
        <div class="space-y-6 animate-pop-in">
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div>
              <span class="text-xs font-extrabold text-amber-600">やり込みコレクション</span>
              <h2 class="text-xl sm:text-2xl font-black text-slate-900">🏆 実績トロフィー図鑑（獲得数：${appState.unlockedTrophies.size} / ${TROPHIES.length}）</h2>
            </div>
            <button onclick="goHome()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">
              ← クエスト選択へ戻る
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${TROPHIES.map(t => {
              const unlocked = appState.unlockedTrophies.has(t.id);
              return `
                <div class="p-5 rounded-2xl border-2 transition flex items-start gap-3.5 ${unlocked ? 'bg-white border-amber-400 shadow-xs' : 'bg-slate-100/70 border-slate-200 opacity-65'}">
                  <div class="text-3xl w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 ${unlocked ? 'bg-amber-100' : 'bg-slate-200 grayscale'}">
                    ${unlocked ? t.icon : '🔒'}
                  </div>
                  <div>
                    <span class="text-[10px] font-black px-2 py-0.5 rounded-full ${unlocked ? 'bg-amber-400 text-slate-950' : 'bg-slate-300 text-slate-600'}">
                      ${unlocked ? 'UNLOCKED!' : '未獲得'}
                    </span>
                    <h3 class="text-sm font-black text-slate-900 mt-1">${t.title}</h3>
                    <p class="text-xs text-slate-600 mt-0.5">${t.desc}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 15. 100問要点帳（検索・辞書リファレンス）
    // =========================================================================
    function renderEncyclopediaView() {
      const filtered = QUESTIONS.filter(q => {
        const matchCat = appState.dictFilterCat === 'all' || q.category === appState.dictFilterCat;
        const kw = appState.dictSearch.trim().toLowerCase();
        const matchKw = !kw ||
          q.question.toLowerCase().includes(kw) ||
          q.keyPoint.toLowerCase().includes(kw) ||
          q.termDetail.toLowerCase().includes(kw) ||
          q.concreteExample.toLowerCase().includes(kw);
        return matchCat && matchKw;
      });

      return `
        <div class="space-y-6 animate-pop-in">
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span class="text-xs font-extrabold text-brand-600">全100問の重要ポイント・解説・具体例を検索</span>
                <h2 class="text-xl sm:text-2xl font-black text-slate-900">📚 情報Ⅰ 第5章 100問要点帳</h2>
              </div>
              <button onclick="goHome()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">
                ← クエスト選択へ戻る
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <input type="text" value="${appState.dictSearch.replace(/"/g, '&quot;')}" oninput="appState.dictSearch = this.value; renderApp();" placeholder="キーワード検索（例：シアン、射影、API、range、著作権）" class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
              <select onchange="appState.dictFilterCat = this.value; renderApp();" class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-bold text-slate-700 bg-white">
                <option value="all" ${appState.dictFilterCat === 'all' ? 'selected' : ''}>すべての分野を表示（全100問）</option>
                ${CATEGORIES.map(c => `<option value="${c.id}" ${appState.dictFilterCat === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
            </div>
            <div class="text-xs font-bold text-slate-500">該当件数：${filtered.length} 件</div>
          </div>

          <div class="space-y-4">
            ${filtered.map(q => {
              const cat = CATEGORIES.find(c => c.id === q.category);
              return `
                <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-2.5">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="text-xs font-black text-brand-700">Q${q.id}</span>
                    <span class="text-[11px] font-bold px-2.5 py-0.5 rounded bg-slate-100 text-slate-600">${cat ? cat.name : ''}</span>
                  </div>
                  <div class="text-sm font-extrabold text-slate-900 whitespace-pre-line">${q.question}</div>
                  <div class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200">
                    ⭕ 正解：${q.options[q.answer]}
                  </div>
                  <div class="text-xs font-bold text-amber-950 bg-amber-50 px-3 py-2 rounded-lg border border-amber-200">
                    🔑 ポイント：${q.keyPoint}
                  </div>
                  <p class="text-xs text-slate-700 leading-relaxed"><strong>📘 解説：</strong>${q.termDetail}</p>
                  <p class="text-xs text-slate-600 leading-relaxed"><strong>🌟 具体例：</strong>${q.concreteExample}</p>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // 初期描画
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
