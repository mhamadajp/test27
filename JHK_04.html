<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情報Ⅰ データサイエンス 分野別完全制覇特訓ドリル</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-2">
        <span class="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-md tracking-wider">高校 情報Ⅰ</span>
        <h1 class="text-lg md:text-xl font-bold text-slate-800">データサイエンス 分野別特訓ドリル</h1>
      </div>
      <div class="flex items-center space-x-4 text-sm font-medium">
        <div class="flex items-center text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200">
          <span class="mr-1">🔥 連続正解:</span>
          <span id="streakCount" class="font-bold">0</span>
        </div>
        <div class="text-slate-600 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200">
          <span>スコア:</span>
          <span id="correctScore" class="font-bold text-blue-600">0</span> / <span id="totalAttempted">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- ナビゲーション・コントロールパネル -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-6">
      
      <!-- 分野選択タブ -->
      <div class="mb-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500">学習分野の選択</span>
          <span id="currentFilterCount" class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded">全40問</span>
        </div>
        <div class="flex flex-wrap gap-1.5 custom-scroll" id="categoryTabs">
          <button onclick="setCategory('all')" data-cat="all" class="cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-blue-600 text-white shadow-sm">
            🌐 全分野総合
          </button>
          <button onclick="setCategory('分析プロセス')" data-cat="分析プロセス" class="cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
            📁 1. 分析プロセス (8問)
          </button>
          <button onclick="setCategory('度数分布と代表値')" data-cat="度数分布と代表値" class="cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
            📊 2. 度数分布・代表値 (8問)
          </button>
          <button onclick="setCategory('散布図と相関')" data-cat="散布図と相関" class="cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
            📈 3. 散布図と相関 (8問)
          </button>
          <button onclick="setCategory('四分位数と箱ひげ図')" data-cat="四分位数と箱ひげ図" class="cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
            📦 4. 四分位数・箱ひげ図 (8問)
          </button>
          <button onclick="setCategory('公的統計とAPI')" data-cat="公的統計とAPI" class="cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-slate-100 text-slate-600 hover:bg-slate-200">
            🏛️ 5. 公的統計・API (8問)
          </button>
          <button onclick="setCategory('review')" data-cat="review" class="cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-amber-100 text-amber-700 hover:bg-amber-200">
            ⭐ 復習リスト (<span id="reviewBadge">0</span>)
          </button>
        </div>
      </div>

      <!-- 難易度と操作ボタン -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100 text-xs md:text-sm">
        <div class="flex items-center space-x-2">
          <span class="text-slate-500 font-medium">難易度:</span>
          <select id="levelFilter" onchange="setLevel(this.value)" class="bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1 text-slate-700 font-medium focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="all">すべて（基礎＋応用）</option>
            <option value="基礎">基礎マスターのみ</option>
            <option value="発展">応用・発展特訓のみ</option>
          </select>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="restartDrill()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition">
            🔄 最初から解く
          </button>
          <button onclick="randomizeCurrent()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition">
            🔀 シャッフル
          </button>
        </div>
      </div>

    </div>

    <!-- 進捗バー -->
    <div class="mb-4">
      <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
        <span>進捗: <span id="progressIndex">1</span> / <span id="totalQuestions">40</span> 問</span>
        <span>正答率: <span id="accuracyRate">0%</span></span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
        <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- クイズカード -->
    <div id="quizCard" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      
      <!-- カード上部ヘッダー -->
      <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center space-x-2">
          <span id="badgeCategory" class="text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800">分野</span>
          <span id="badgeLevel" class="text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">基礎</span>
          <span id="questionNumText" class="text-xs font-medium text-slate-500">第 1 問</span>
        </div>
        <button id="bookmarkBtn" onclick="toggleBookmark()" class="text-xs font-medium px-2.5 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-100 transition flex items-center gap-1">
          <span>⭐</span> <span id="bookmarkText">復習に追加</span>
        </button>
      </div>

      <!-- 問題文 -->
      <div class="p-6">
        <h2 id="questionText" class="text-base md:text-lg font-bold text-slate-800 leading-relaxed mb-4">
          問題文がここに読み込まれます
        </h2>

        <!-- ヒント表示アコーディオン -->
        <div class="mb-6">
          <button onclick="toggleHint()" class="inline-flex items-center text-xs md:text-sm font-semibold text-amber-600 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg border border-amber-200 transition">
            <span class="mr-1.5">💡</span>
            <span>ヒントを見る</span>
            <span id="hintArrow" class="ml-1 text-xs">▼</span>
          </button>
          <div id="hintContent" class="hidden mt-2 p-3 bg-amber-50/80 border border-amber-200/80 rounded-xl text-xs md:text-sm text-amber-900 leading-relaxed">
            ヒントの内容がここに表示されます。
          </div>
        </div>

        <!-- 選択肢コンテナ -->
        <div id="optionsContainer" class="space-y-3 mb-6">
          <!-- JSで動的にボタン生成 -->
        </div>

        <!-- 回答後フィードバック・詳細解説エリア -->
        <div id="feedbackContainer" class="hidden border-t border-slate-200 pt-6 mt-6">
          
          <div id="resultBanner" class="p-4 rounded-xl mb-4 font-bold text-sm md:text-base flex items-center">
            <!-- 正解・不正解表示 -->
          </div>

          <!-- 重要ポイント -->
          <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-3.5 mb-4">
            <div class="text-xs font-bold text-indigo-800 uppercase tracking-wider mb-1 flex items-center">
              <span class="mr-1">📌</span> 核心のポイント
            </div>
            <p id="keyPointText" class="text-xs md:text-sm text-indigo-950 font-medium leading-relaxed"></p>
          </div>

          <!-- 各選択肢の詳しい解説（なぜ間違いなのか・なぜ正しいのか） -->
          <div class="space-y-2 mb-6">
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">選択肢ごとの詳細分析（誤答の理由）</div>
            <div id="detailedRationales" class="space-y-2 text-xs md:text-sm"></div>
          </div>

          <!-- 次の問題へボタン -->
          <div class="flex justify-end">
            <button id="nextBtn" onclick="nextQuestion()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition flex items-center space-x-1">
              <span>次の問題へ進む</span>
              <span>➔</span>
            </button>
          </div>

        </div>

      </div>

    </div>

    <!-- 完了画面（非表示） -->
    <div id="summaryCard" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
      <div class="inline-block p-4 bg-blue-50 rounded-full text-4xl mb-4">🎉</div>
      <h2 class="text-2xl font-bold text-slate-800 mb-2">特訓ドリル修了！</h2>
      <p class="text-slate-600 text-sm mb-6">選択した分野の全問題を解き終えました。素晴らしい集中力です！</p>
      
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-lg mx-auto mb-8">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="text-xs text-slate-500 mb-1">解いた問題</div>
          <div id="sumTotal" class="text-xl font-bold text-slate-800">0</div>
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="text-xs text-slate-500 mb-1">正解数</div>
          <div id="sumCorrect" class="text-xl font-bold text-emerald-600">0</div>
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="text-xs text-slate-500 mb-1">正答率</div>
          <div id="sumAccuracy" class="text-xl font-bold text-blue-600">0%</div>
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div class="text-xs text-slate-500 mb-1">最大コンボ</div>
          <div id="sumStreak" class="text-xl font-bold text-amber-600">0</div>
        </div>
      </div>

      <div class="flex flex-wrap justify-center gap-3">
        <button onclick="restartDrill()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition">
          もう一度この分野を解く
        </button>
        <button onclick="setCategory('all')" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">
          全分野総合に挑戦
        </button>
      </div>
    </div>

  </main>

  <!-- フッター -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
    高等学校「情報Ⅰ」第2章 データサイエンスとデータの表現 準拠学習ドリル
  </footer>

  <script>
    // 40問の精選完全データ（5分野×各8問：基礎4問＋応用4問）
    const ALL_QUESTIONS = [
      // ==========================================
      // 分野1: 分析プロセス (8問)
      // ==========================================
      {
        id: 1,
        category: "分析プロセス",
        level: "基礎",
        question: "データ分析を進める際の標準的な4段階のプロセスとして、最も適切な順序はどれか。",
        hint: "データ集めを始める前に、まず「何のために行うか」を決定する必要があります。",
        keyPoint: "目的を明確に定めないままデータ収集を始めると、不要なデータを集めたり分析が迷走します。",
        options: [
          { text: "目的の設定 → データの収集 → データの整理 → 分析と解釈", isCorrect: true, exp: "正しい順序です。目的を定めてから収集し、表やグラフに整理した上で分析・解釈を行います。" },
          { text: "データの収集 → 目的の設定 → データの整理 → 分析と解釈", isCorrect: false, exp: "収集を先に行うと、どんな項目が必要かが定まらず、無駄な作業が発生してしまいます。" },
          { text: "目的の設定 → データの整理 → データの収集 → 分析と解釈", isCorrect: false, exp: "収集する前にデータを整理することは物理的に不可能です。" },
          { text: "データの収集 → 分析と解釈 → データの整理 → 目的の設定", isCorrect: false, exp: "整理せずにいきなり解釈したり、最後に目的を決めるのは順序が完全に逆転しています。" }
        ]
      },
      {
        id: 2,
        category: "分析プロセス",
        level: "基礎",
        question: "自ら実験を行って温度を記録したり、街頭で通行人数を目視で数えて得たデータの分類として最も適切なものはどれか。",
        hint: "誰かが作成・加工したデータではなく、自分で直接測定・取得した元データを指します。",
        keyPoint: "自分で直接取得したデータは「1次データ」、他者が作成・公表した既存データは「2次データ」です。",
        options: [
          { text: "1次データ（一次資料）", isCorrect: true, exp: "観測者自身が調査や実験によって直接取得した未加工のオリジナルデータです。" },
          { text: "2次データ（二次資料）", isCorrect: false, exp: "他人がすでに収集・公表している統計や加工済みのデータを指すため誤りです。" },
          { text: "質的カテゴリデータ", isCorrect: false, exp: "温度や通行人数は数値で表される「量的データ」であるため不適切です。" },
          { text: "オープンデータ", isCorrect: false, exp: "私的に計測した記録であり、公に自由に利用できる形式で公開されたデータではありません。" }
        ]
      },
      {
        id: 3,
        category: "分析プロセス",
        level: "基礎",
        question: "収集した生データに対して、表記揺れの統一、欠損値の穴埋めや削除、明らかな入力ミスの修正を行う作業の名称はどれか。",
        hint: "データを分析に適した清潔・健全な状態に整えるクリーニング作業のことです。",
        keyPoint: "データクレンジングを怠ると、異常値や表記の不一致によって分析結果が歪んでしまいます。",
        options: [
          { text: "データクレンジング", isCorrect: true, exp: "データの品質を高め、分析の正確性を担保するための重要な前処理プロセスです。" },
          { text: "データビジュアライゼーション", isCorrect: false, exp: "データをグラフや図として視覚化する工程のことです。" },
          { text: "データマイニング", isCorrect: false, exp: "大量のデータから統計やAIを用いて隠れたパターンを発掘する技術です。" },
          { text: "データモデリング", isCorrect: false, exp: "データベースの構造や数式モデルを設計・構築する作業です。" }
        ]
      },
      {
        id: 4,
        category: "分析プロセス",
        level: "基礎",
        question: "次のデータ項目のうち、計算（平均値や四則演算）を行うことが統計学的に意味を持つ「量的データ」はどれか。",
        hint: "足したり割ったりして平均値を求めることに意味がある数値を選びましょう。",
        keyPoint: "電話番号や郵便番号は数字で書かれていても、区別のための「質的データ（名義尺度）」です。",
        options: [
          { text: "走幅跳の跳躍距離（メートル）", isCorrect: true, exp: "数値そのものに連続的な量としての意味があり、平均値や差を求めることができる量的データです。" },
          { text: "生徒の出席番号", isCorrect: false, exp: "個人の識別のためのラベル（質的データ）であり、平均番号を計算しても意味がありません。" },
          { text: "アンケートの満足度（1:不満 〜 5:大満足）", isCorrect: false, exp: "順序には意味がありますが、等間隔な量とは言えない「順序尺度（質的データ）」です。" },
          { text: "自宅の郵便番号", isCorrect: false, exp: "地域を表す記号（名義尺度）であり、足し算や引き算は成立しません。" }

      },
      {
        id: 5,
        category: "分析プロセス",
        level: "発展",
        question: "Webサイトの任意アンケートで「利用者の92%が満足」という結果が出た。この数値を一般の利用者全体の実態と判断できない最大の統計的理由はどれか。",
        hint: "回答した人がどのような人物であるか（サンプルの偏り）に注目してください。",
        keyPoint: "自発的に回答する人は「熱心なファン」や「極端な不満を持つ人」に偏る「選択バイアス」が生じます。",
        options: [
          { text: "自発的に回答する熱心な利用者に偏る「選択バイアス」が生じるため", isCorrect: true, exp: "熱意のある人だけが自主的に回答するため、無関心層や一般ユーザーの意見が反映されません。" },
          { text: "アンケートの質問項目が5段階評価で作られていないため", isCorrect: false, exp: "尺度の形式ではなく、標本の集まり方（サンプリング方法）自体の歪みが問題です。" },
          { text: "Web上のデータはすべて1次データではなく2次データとして扱われるため", isCorrect: false, exp: "Web上で直接収集した回答は1次データであり、この分類は理由になりません。" },
          { text: "回答者の氏名や個人情報が特定されていないため", isCorrect: false, exp: "匿名調査であっても標本が偏っていなければ統計的推定は可能です。" }
        ]
      },
      {
        id: 6,
        category: "分析プロセス",
        level: "発展",
        question: "ある学習塾で、新アプリを利用した生徒群の平均点が、利用しなかった生徒群より15点高かった。これだけでは「アプリが成績を上げた」と結論できない理由はどれか。",
        hint: "「自主的にアプリを使うような生徒」は、もともとどのような性質を持っていたでしょうか。",
        keyPoint: "アプリ利用と成績の双方に影響を与える「本人の学習意欲」という交絡因子が存在する可能性があります。",
        options: [
          { text: "自主利用した生徒はもともと学習意欲が高いという交絡因子の存在", isCorrect: true, exp: "「意欲が高いからアプリも使い、勉強もして点数が高かった」という第三の変数が疑われます。" },
          { text: "生徒の得点は質的データであり、平均値を計算することが統計的に禁じられているため", isCorrect: false, exp: "テストの得点は量的データ（比率尺度）であり、平均値の計算は完全に妥当です。" },
          { text: "2つの生徒群の人数が同数でない場合、平均値の比較は一切無効になるため", isCorrect: false, exp: "群の人数が異なっていても平均値の比較自体は可能です。" },
          { text: "アプリの利用ログは公的統計（e-Stat）の基準を満たしていないため", isCorrect: false, exp: "社内・塾内のデータ検証に公的統計基準は直接関係ありません。" }
        ]
      },
      {
        id: 7,
        category: "分析プロセス",
        level: "発展",

        category: "公的統計とAPI",
        level: "発展",
        question: "統計グラフにおいて、縦軸のゼロ（原点）を省略して波線で途中を飛ばした棒グラフを見る際に警戒すべき罠はどれか。",
        hint: "差がほんの少ししかないのに、棒の長さの比率が極端に見えてしまいます。",
        keyPoint: "基底（0）を省略すると、ごく僅かな差が劇的な変化に見える「視覚的誇張」が生じます。",
        options: [
          { text: "ごく僅かな数値の差が、極めて巨大な差であるかのように誇張されること", isCorrect: true, exp: "例えば98点と99点の棒の長さが2倍に見えるような印象操作に騙されない注意が必要です。" },
          { text: "正の相関関係が自動的に負の相関関係に反転して見えること", isCorrect: false, exp: "棒グラフの基底省略によって相関の正負が反転するわけではありません。" },
          { text: "グラフのデータが1次データから2次データへ勝手に劣化すること", isCorrect: false, exp: "グラフの描画方法とデータの収集由来（1次/2次）は無関係です。" },
          { text: "すべてのデータの中央値と平均値が必ず等しくなってしまうこと", isCorrect: false, exp: "グラフの見せ方によって元のデータの統計量が変化することはありません。" }
        ]
      }
    ];

    // アプリケーション状態管理
    let activeCategory = 'all';
    let activeLevel = 'all';
    let currentQuestions = [];
    let currentIndex = 0;
    let selectedOptionIndex = null;
    let answeredCurrent = false;
    let reviewList = JSON.parse(localStorage.getItem('drill_review_ids') || '[]');
    let currentStreak = 0;
    let maxStreak = 0;
    let totalScore = 0;
    let totalAnswered = 0;

    // 初期化
    function init() {
      applyFilters();
      updateReviewBadge();
    }

    // フィルタリングの適用
    function applyFilters() {
      if (activeCategory === 'review') {
        currentQuestions = ALL_QUESTIONS.filter(q => reviewList.includes(q.id));
      } else if (activeCategory === 'all') {
        currentQuestions = [...ALL_QUESTIONS];
      } else {
        currentQuestions = ALL_QUESTIONS.filter(q => q.category === activeCategory);
      }

      // 難易度フィルタ
      if (activeLevel !== 'all') {
        currentQuestions = currentQuestions.filter(q => q.level === activeLevel);
      }

      currentIndex = 0;
      updateFilterHeader();
      loadQuestion();
    }

    function updateFilterHeader() {
      document.getElementById('currentFilterCount').innerText = `${currentQuestions.length}問中`;
      document.getElementById('totalQuestions').innerText = currentQuestions.length;
    }

    function setCategory(cat) {
      activeCategory = cat;
      // ボタンデザインの更新
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = "cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-blue-600 text-white shadow-sm";
        } else if (btn.getAttribute('data-cat') === 'review') {
          btn.className = "cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-amber-100 text-amber-700 hover:bg-amber-200";
        } else {
          btn.className = "cat-btn px-3 py-1.5 text-xs md:text-sm font-medium rounded-lg transition-all bg-slate-100 text-slate-600 hover:bg-slate-200";
        }
      });
      applyFilters();
    }

    function setLevel(lvl) {
      activeLevel = lvl;
      applyFilters();
    }

    function restartDrill() {
      currentIndex = 0;
      document.getElementById('summaryCard').classList.add('hidden');
      document.getElementById('quizCard').classList.remove('hidden');
      loadQuestion();
    }

    function randomizeCurrent() {
      for (let i = currentQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
      }
      restartDrill();
    }

    // 問題の読み込み表示
    function loadQuestion() {
      if (currentQuestions.length === 0) {
        showEmptyState();
        return;
      }

      if (currentIndex >= currentQuestions.length) {
        showSummary();
        return;
      }

      answeredCurrent = false;
      selectedOptionIndex = null;
      const q = currentQuestions[currentIndex];

      // UI表示の更新
      document.getElementById('quizCard').classList.remove('hidden');
      document.getElementById('summaryCard').classList.add('hidden');
      document.getElementById('feedbackContainer').classList.add('hidden');
      document.getElementById('hintContent').classList.add('hidden');
      document.getElementById('hintArrow').innerText = '▼';

      document.getElementById('progressIndex').innerText = currentIndex + 1;
      const progressPercent = ((currentIndex) / currentQuestions.length) * 100;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      document.getElementById('badgeCategory').innerText = q.category;
      document.getElementById('badgeLevel').innerText = q.level;
      if (q.level === '基礎') {
        document.getElementById('badgeLevel').className = "text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800";
      } else {
        document.getElementById('badgeLevel').className = "text-xs font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-800";
      }

      document.getElementById('questionNumText').innerText = `第 ${currentIndex + 1} 問 / 全 ${currentQuestions.length} 問`;
      document.getElementById('questionText').innerText = q.question;
      document.getElementById('hintContent').innerText = q.hint;
      document.getElementById('keyPointText').innerText = q.keyPoint;

      // ブックマークボタン状態
      updateBookmarkBtnState(q.id);

      // 選択肢の生成
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.id = `opt-${idx}`;
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 hover:border-blue-300 transition flex items-start text-sm md:text-base font-medium text-slate-800 group";
        btn.innerHTML = `
          <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold mr-3 mt-0.5 group-hover:bg-blue-600 group-hover:text-white transition">
            ${['A', 'B', 'C', 'D'][idx]}
          </span>
          <span class="flex-1 leading-relaxed">${opt.text}</span>
        `;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });
    }

    // ヒント開閉
    function toggleHint() {
      const hint = document.getElementById('hintContent');
      const arrow = document.getElementById('hintArrow');
      if (hint.classList.contains('hidden')) {
        hint.classList.remove('hidden');
        arrow.innerText = '▲';
      } else {
        hint.classList.add('hidden');
        arrow.innerText = '▼';
      }
    }

    // 選択肢をクリックした時の判定処理
    function selectOption(index) {
      if (answeredCurrent) return;
      answeredCurrent = true;
      selectedOptionIndex = index;
      totalAnswered++;

      const q = currentQuestions[currentIndex];
      const isCorrect = q.options[index].isCorrect;

      if (isCorrect) {
        totalScore++;
        currentStreak++;
        if (currentStreak > maxStreak) maxStreak = currentStreak;
      } else {
        currentStreak = 0;
        // 間違えた問題を自動で復習リストに追加
        if (!reviewList.includes(q.id)) {
          reviewList.push(q.id);
          saveReviewList();
          updateReviewBadge();
          updateBookmarkBtnState(q.id);
        }
      }

      // ヘッダースコア更新
      document.getElementById('correctScore').innerText = totalScore;
      document.getElementById('totalAttempted').innerText = totalAnswered;
      document.getElementById('streakCount').innerText = currentStreak;
      const acc = Math.round((totalScore / totalAnswered) * 100);
      document.getElementById('accuracyRate').innerText = `${acc}%`;

      // 選択肢ボタンのスタイル反映
      q.options.forEach((opt, idx) => {
        const btn = document.getElementById(`opt-${idx}`);
        btn.disabled = true;
        if (opt.isCorrect) {
          btn.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50/70 text-emerald-950 font-bold transition flex items-start text-sm md:text-base";
        } else if (idx === index) {
          btn.className = "w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50/70 text-rose-950 font-bold transition flex items-start text-sm md:text-base";
        } else {
          btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-slate-50 text-slate-400 opacity-60 flex items-start text-sm md:text-base";
        }
      });

      // 正解・不正解バナー
      const resultBanner = document.getElementById('resultBanner');
      if (isCorrect) {
        resultBanner.className = "p-4 rounded-xl mb-4 font-bold text-sm md:text-base flex items-center bg-emerald-100 text-emerald-900 border border-emerald-200";
        resultBanner.innerHTML = `
          <span class="text-xl mr-2">⭕</span>
          <span>正解です！見事な理解です。</span>
        `;
      } else {
        resultBanner.className = "p-4 rounded-xl mb-4 font-bold text-sm md:text-base flex items-center bg-rose-100 text-rose-900 border border-rose-200";
        resultBanner.innerHTML = `
          <span class="text-xl mr-2">❌</span>
          <span>おしい！不正解です。（復習リストに自動登録されました）</span>
        `;
      }

      // 詳細解説（なぜ正解か、なぜ誤答なのか）の描画
      const rationalesContainer = document.getElementById('detailedRationales');
      rationalesContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const div = document.createElement('div');
        div.className = opt.isCorrect 
          ? "p-3 rounded-lg bg-emerald-50/80 border border-emerald-200 text-emerald-950" 
          : "p-3 rounded-lg bg-slate-50 border border-slate-200 text-slate-700";
        
        div.innerHTML = `
          <div class="font-bold flex items-center mb-1">
            <span class="mr-1.5">${opt.isCorrect ? '✅ 正解' : '✖ 誤答'} [${['A','B','C','D'][idx]}]</span>
            <span class="text-xs ${opt.isCorrect ? 'text-emerald-700' : 'text-slate-500'} font-normal">${opt.text}</span>
          </div>
          <div class="text-xs md:text-sm leading-relaxed ${opt.isCorrect ? 'text-emerald-900 font-medium' : 'text-slate-600'}">
            ${opt.exp}
          </div>
        `;
        rationalesContainer.appendChild(div);
      });

      document.getElementById('feedbackContainer').classList.remove('hidden');
      document.getElementById('feedbackContainer').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function nextQuestion() {
      currentIndex++;
      loadQuestion();
    }

    // ブックマーク（復習）切り替え
    function toggleBookmark() {
      if (currentQuestions.length === 0) return;
      const q = currentQuestions[currentIndex];
      const idx = reviewList.indexOf(q.id);
      if (idx > -1) {
        reviewList.splice(idx, 1);
      } else {
        reviewList.push(q.id);
      }
      saveReviewList();
      updateReviewBadge();
      updateBookmarkBtnState(q.id);
    }

    function updateBookmarkBtnState(id) {
      const isSaved = reviewList.includes(id);
      const text = document.getElementById('bookmarkText');
      const btn = document.getElementById('bookmarkBtn');
      if (isSaved) {
        text.innerText = "復習リストから削除";
        btn.className = "text-xs font-medium px-2.5 py-1 rounded-md border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 transition flex items-center gap-1";
      } else {
        text.innerText = "復習に追加";
        btn.className = "text-xs font-medium px-2.5 py-1 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-100 transition flex items-center gap-1";
      }
    }

    function saveReviewList() {
      localStorage.setItem('drill_review_ids', JSON.stringify(reviewList));
    }

    function updateReviewBadge() {
      document.getElementById('reviewBadge').innerText = reviewList.length;
    }

    // 問題がない状態（復習リストが空など）
    function showEmptyState() {
      document.getElementById('quizCard').classList.add('hidden');
      document.getElementById('summaryCard').classList.remove('hidden');
      document.getElementById('summaryCard').innerHTML = `
        <div class="text-4xl mb-3">📂</div>
        <h3 class="text-lg font-bold text-slate-800 mb-2">該当する問題がありません</h3>
        <p class="text-sm text-slate-600 mb-6">復習リストが空か、選択された条件に合致する問題が存在しません。</p>
        <button onclick="setCategory('all')" class="px-5 py-2 bg-blue-600 text-white font-bold rounded-xl">
          全分野総合を表示
        </button>
      `;
    }

    // 全問終了時のサマリー画面
    function showSummary() {
      document.getElementById('quizCard').classList.add('hidden');
      document.getElementById('summaryCard').classList.remove('hidden');
      document.getElementById('progressBar').style.width = '100%';

      document.getElementById('sumTotal').innerText = currentQuestions.length;
      document.getElementById('sumCorrect').innerText = totalScore;
      const acc = totalAnswered > 0 ? Math.round((totalScore / totalAnswered) * 100) : 0;
      document.getElementById('sumAccuracy').innerText = `${acc}%`;
      document.getElementById('sumStreak').innerText = maxStreak;
    }

    // 開始
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
