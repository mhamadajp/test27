    // =========================================================================

    // =========================================================================
    function showToast(text, icon = '💡') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = text;
      document.getElementById('toast-icon').textContent = icon;
      toast.classList.remove('hidden');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 3500);
    }

    function openConfirmModal(title, desc, onConfirm) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-desc').textContent = desc;
      const okBtn = document.getElementById('confirm-ok-btn');
      okBtn.onclick = () => {
        closeConfirmModal();
        onConfirm();
      };
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
    }

    function stopTimer() {
      if (appState.timerInterval) {
        clearInterval(appState.timerInterval);
        appState.timerInterval = null;
      }
    }

    function startTimer() {
      stopTimer();
      appState.examStartTime = Date.now();
      appState.examElapsedSec = 0;
      appState.timerInterval = setInterval(() => {
        appState.examElapsedSec = Math.floor((Date.now() - appState.examStartTime) / 1000);
        const timerEl = document.getElementById('exam-timer-display');
        if (timerEl) {
          timerEl.textContent = formatTime(appState.examElapsedSec);
        }
      }, 1000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function goHome() {

        openConfirmModal(

            appState.screen = 'home';
            renderApp();

        return;

      stopTimer();
      appState.screen = 'home';
      renderApp();

    function openEncyclopedia() {
      stopTimer();
      appState.screen = 'encyclopedia';
      renderApp();
    }

    function setMode(mode) {
      appState.mode = mode;
      renderApp();
    }

    function startCourse(type, catId = null) {
      let selected = [];
      let title = '';

      if (type === 'all') {
        selected = [...QUESTIONS];
        title = '全100問 完全制覇コース（Q1〜Q100）';
      } else if (type === 'category') {
        const cat = CATEGORIES.find(c => c.id === catId);
        selected = QUESTIONS.filter(q => q.category === catId);
        title = `分野別特訓：${cat.name}`;
      } else if (type === 'mock34') {
        // 本番の報告書課題と同じ34問構成を全8分野からバランスよく抽出
        selected = shuffleArray(QUESTIONS).slice(0, 34);
        title = '本番形式 34問模擬テスト（ランダム抽出）';
      } else if (type === 'quick10') {
        selected = shuffleArray(QUESTIONS).slice(0, 10);
        title = 'スキマ時間 クイック10問チャレンジ';
      } else if (type === 'wrong') {
        selected = QUESTIONS.filter(q => appState.wrongHistory.has(q.id));
        if (selected.length === 0) {
          showToast('現在、間違えた問題の履歴はありません！素晴らしい！', '✨');
          return;
        }
        title = `弱点克服！間違えた問題リベンジ（全${selected.length}問）`;
      }

      // 各問題の選択肢表示順をシャッフルしつつ、正解インデックスを追跡する
      appState.activeQuestions = selected.map(q => {
        const indexedOptions = q.options.map((text, idx) => ({
          text,
          isCorrect: idx === q.answer
        }));
        const shuffled = shuffleArray(indexedOptions);
        return {
          ...q,
          displayOptions: shuffled.map(o => o.text),
          displayAnswer: shuffled.findIndex(o => o.isCorrect)
        };
      });

      appState.courseTitle = title;
      appState.currentIndex = 0;
      appState.userAnswers = {};
      appState.revealedPractice = {};
      appState.showHint = {};
      appState.flagged = {};
      appState.examSubmitted = false;
      appState.screen = 'quiz';

      if (appState.mode === 'exam') {
        startTimer();
      } else {
        stopTimer();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

      } else {

        btnHome.classList.remove('text-slate-600');
        btnDict.classList.remove('bg-primary-50', 'text-primary-700');

      } else if (appState.screen === 'encyclopedia') {

    function renderPracticeExplanation(q, isCorrect) {
      return `
        <div class="mt-5 rounded-3xl border-2 ${isCorrect ? 'border-emerald-300 bg-emerald-50/40' : 'border-rose-300 bg-rose-50/40'} p-5 sm:p-6 space-y-4 animate-slide-up">
          <div class="flex items-center justify-between border-b border-slate-200/80 pb-3">
            <div class="flex items-center gap-2">
              <span class="text-2xl">${isCorrect ? '🎉' : '💡'}</span>
              <div>
                <div class="text-base font-black ${isCorrect ? 'text-emerald-800' : 'text-rose-800'}">
                  ${isCorrect ? '正解です！判断の軸がしっかり身についています。' : '惜しい！ここで「なぜそうなるか」を整理しておこう。'}
                </div>
                <div class="text-xs font-bold text-slate-600">
                  正解の選択肢：<span class="text-slate-900 underline">${q.displayOptions[q.displayAnswer]}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 1. 覚えておくべきポイント -->
          <div class="bg-white rounded-2xl p-4 border border-amber-200 shadow-2xs">
            <div class="text-xs font-black text-amber-800 flex items-center gap-1.5 mb-1">
              <span>🔑 覚えておくべき重要ポイント（試験の決め手）</span>
            </div>
            <p class="text-sm font-extrabold text-slate-900 leading-relaxed">
              ${q.keyPoint}
            </p>
          </div>

          <!-- 2. 用語の深掘り解説 -->
          <div class="bg-white rounded-2xl p-4 border border-primary-200 shadow-2xs">
            <div class="text-xs font-black text-primary-800 flex items-center gap-1.5 mb-1">
              <span>📘 用語の深掘り解説・背景知識</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">
              ${q.termDetail}
            </p>
          </div>

          <!-- 3. 具体的な事例 -->
          <div class="bg-white rounded-2xl p-4 border border-emerald-200 shadow-2xs">
            <div class="text-xs font-black text-emerald-800 flex items-center gap-1.5 mb-1">
              <span>🌟 身近な具体例・応用シーン</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">
              ${q.concreteExample}
            </p>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. クイズ操作イベントハンドラ
    // =========================================================================
    function selectOption(qId, optIdx) {
      const q = appState.activeQuestions.find(item => item.id === qId);
      if (!q) return;

      appState.userAnswers[qId] = optIdx;

      if (appState.mode === 'practice') {
        appState.revealedPractice[qId] = true;
        if (optIdx === q.displayAnswer) {
          appState.masteredIds.add(qId);
          appState.wrongHistory.delete(qId);
        } else {
          appState.wrongHistory.add(qId);
        }
      }
      renderApp();
    }

    function toggleQuestionHint(qId) {
      appState.showHint[qId] = !appState.showHint[qId];
      renderApp();
    }

    function toggleQuestionFlag(qId) {
      appState.flagged[qId] = !appState.flagged[qId];
      renderApp();
    }

    function moveQuestion(delta) {
      const next = appState.currentIndex + delta;
      if (next >= 0 && next < appState.activeQuestions.length) {
        appState.currentIndex = next;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderApp();
      }
    }

    function jumpToQuestion(index) {
      appState.currentIndex = index;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

    function confirmFinishExam() {
      const total = appState.activeQuestions.length;
      const answered = Object.keys(appState.userAnswers).length;
      const unanswered = total - answered;

      const msg = unanswered > 0
        ? `まだ未解答の問題が ${unanswered} 問あります。このまま採点して結果を表示しますか？`
        : `全 ${total} 問の解答が完了しています。採点結果を表示しますか？`;

      openConfirmModal('試験を終了して採点する', msg, () => {
        stopTimer();
        appState.examSubmitted = true;
        // 履歴更新
        appState.activeQuestions.forEach(q => {
          const ans = appState.userAnswers[q.id];
          if (ans === q.displayAnswer) {
            appState.masteredIds.add(q.id);
            appState.wrongHistory.delete(q.id);
          } else {
            appState.wrongHistory.add(q.id);
          }
        });
        appState.screen = 'result';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        renderApp();
      });
    }

    function finishPractice() {
      stopTimer();
      appState.screen = 'result';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

    // =========================================================================
    // 11. 採点結果・分野別分析＆弱点復習画面
    // =========================================================================
    function renderResultView() {
      const qs = appState.activeQuestions;
      const total = qs.length;
      let correctCount = 0;

      qs.forEach(q => {
        if (appState.userAnswers[q.id] === q.displayAnswer) {
          correctCount++;
        }
      });

      const scorePct = Math.round((correctCount / total) * 100);
      let rank = 'C（基礎から復習しよう）';
      let rankColor = 'text-amber-600';
      if (scorePct >= 90) {
        rank = 'S（完全マスター！本番も満点レベル）';
        rankColor = 'text-emerald-600';
      } else if (scorePct >= 75) {
        rank = 'A（合格圏内！あと少しで完璧）';
        rankColor = 'text-primary-600';
      } else if (scorePct >= 50) {
        rank = 'B（基本はOK！間違えた分野を固めよう）';
        rankColor = 'text-indigo-600';
      }

      // 分野別集計
      const catStats = CATEGORIES.map(cat => {
        const sub = qs.filter(q => q.category === cat.id);
        if (sub.length === 0) return null;
        const ok = sub.filter(q => appState.userAnswers[q.id] === q.displayAnswer).length;
        return {
          ...cat,
          total: sub.length,
          ok,
          pct: Math.round((ok / sub.length) * 100)
        };
      }).filter(Boolean);

      return `
        <div class="space-y-6 animate-slide-up">
          <!-- Score Summary Banner -->
          <section class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-xs text-center space-y-4">
            <span class="inline-block text-xs font-extrabold px-3 py-1 rounded-full bg-slate-100 text-slate-700">
              ${appState.courseTitle}（${appState.mode === 'exam' ? '試験モード' : '練習モード'}）
            </span>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-900">採点結果レポート</h2>

            <div class="flex flex-wrap items-center justify-center gap-6 py-2">
              <div class="bg-slate-50 px-6 py-4 rounded-2xl border border-slate-200">
                <div class="text-xs font-bold text-slate-500">正答数</div>
                <div class="text-3xl sm:text-4xl font-black text-slate-900 mt-1">
                  ${correctCount} <span class="text-base font-bold text-slate-500">/ ${total} 問</span>
                </div>
              </div>
              <div class="bg-slate-50 px-6 py-4 rounded-2xl border border-slate-200">
                <div class="text-xs font-bold text-slate-500">正答率</div>
                <div class="text-3xl sm:text-4xl font-black text-primary-600 mt-1">${scorePct}%</div>
              </div>
              ${appState.mode === 'exam' ? `
                <div class="bg-slate-50 px-6 py-4 rounded-2xl border border-slate-200">
                  <div class="text-xs font-bold text-slate-500">解答時間</div>
                  <div class="text-3xl sm:text-4xl font-black text-slate-800 mt-1">${formatTime(appState.examElapsedSec)}</div>
                </div>
              ` : ''}
            </div>

            <div class="text-base sm:text-lg font-black ${rankColor}">
              評価ランク：${rank}
            </div>

            <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
              <button onclick="goHome()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm transition">
                🏠 コース選択へ戻る
              </button>
              ${appState.wrongHistory.size > 0 ? `
                <button onclick="setMode('practice'); startCourse('wrong');" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-sm transition shadow-xs">
                  📖 間違えた問題を「練習モード」で解説復習する
                </button>
              ` : ''}
            </div>
          </section>

          <!-- Category Breakdown -->
          <section class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs space-y-4">
            <h3 class="text-base sm:text-lg font-black text-slate-900">📊 分野別の正答率分析</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${catStats.map(st => `
                <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                  <div class="flex items-center justify-between text-xs font-extrabold mb-1.5">
                    <span class="text-slate-800">${st.name}</span>
                    <span class="${st.pct >= 80 ? 'text-emerald-600' : 'text-rose-600'}">${st.ok} / ${st.total} 問 (${st.pct}%)</span>
                  </div>
                  <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div class="${st.pct >= 80 ? 'bg-emerald-500' : 'bg-rose-500'} h-2 rounded-full" style="width: ${st.pct}%"></div>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- Full Question-by-Question Review with Explanations -->
          <section class="space-y-4">
            <h3 class="text-base sm:text-lg font-black text-slate-900">📝 全問の解答・ポイント・詳細解説振り返り</h3>
            ${qs.map((q, idx) => {
              const userAns = appState.userAnswers[q.id];
              const isOk = userAns === q.displayAnswer;
              const userText = userAns !== undefined ? q.displayOptions[userAns] : '（未解答）';
              const correctText = q.displayOptions[q.displayAnswer];
              return `
                <div class="bg-white rounded-2xl p-5 border-2 ${isOk ? 'border-emerald-200' : 'border-rose-300'} space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="text-xs font-black px-2.5 py-1 rounded-lg ${isOk ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                      ${isOk ? '⭕ 正解' : '❌ 不正解'} ｜ 第 ${idx + 1} 問 (Q${q.id})
                    </span>
                  </div>
                  <p class="text-sm sm:text-base font-extrabold text-slate-900">${q.question}</p>
                  <div class="text-xs space-y-1 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div><span class="font-bold text-slate-500">あなたの解答：</span><span class="font-bold ${isOk ? 'text-emerald-700' : 'text-rose-700'}">${userText}</span></div>
                    ${!isOk ? `<div><span class="font-bold text-slate-500">正しい答え：</span><span class="font-extrabold text-emerald-700">${correctText}</span></div>` : ''}
                  </div>
                  <div class="text-xs sm:text-sm space-y-2 pt-1">
                    <div class="p-3 rounded-xl bg-amber-50 border border-amber-200 font-bold text-amber-950">
                      🔑 <strong>ポイント：</strong>${q.keyPoint}
                    </div>
                    <p class="text-slate-700 leading-relaxed"><strong>📘 解説：</strong>${q.termDetail}</p>
                    <p class="text-slate-600 leading-relaxed"><strong>🌟 具体例：</strong>${q.concreteExample}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 12. 100問要点図鑑（全100問の検索・辞書モード）
    // =========================================================================
    function renderEncyclopediaView() {
      const filtered = QUESTIONS.filter(q => {
        const matchCat = appState.dictFilterCat === 'all' || q.category === appState.dictFilterCat;
        const kw = appState.dictSearch.trim().toLowerCase();
        const matchKw = !kw ||
          q.question.toLowerCase().includes(kw) ||
          q.keyPoint.toLowerCase().includes(kw) ||
          q.termDetail.toLowerCase().includes(kw) ||
          q.concreteExample.toLowerCase().includes(kw);
        return matchCat && matchKw;
      });

      return `
        <div class="space-y-6 animate-slide-up">
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span class="text-xs font-extrabold text-primary-600">テスト直前の総復習・用語検索</span>
                <h2 class="text-xl sm:text-2xl font-black text-slate-900">📚 100問要点図鑑 ＆ 詳細解説リファレンス</h2>
              </div>
              <button onclick="goHome()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">
                ← コース選択へ戻る
              </button>
            </div>

            <!-- Search & Category Filter -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <input type="text" value="${appState.dictSearch.replace(/"/g, '&quot;')}" oninput="appState.dictSearch = this.value; renderApp();" placeholder="キーワード検索（例：メラビアン、KJ法、機種依存文字、効率性）" class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />

              <select onchange="appState.dictFilterCat = this.value; renderApp();" class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-bold text-slate-700 bg-white">
                <option value="all" ${appState.dictFilterCat === 'all' ? 'selected' : ''}>すべての分野を表示（全100問）</option>
                ${CATEGORIES.map(c => `<option value="${c.id}" ${appState.dictFilterCat === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
            </div>
            <div class="text-xs font-bold text-slate-500">該当件数：${filtered.length} 件</div>
          </div>

          <div class="space-y-4">
            ${filtered.map(q => {
              const cat = CATEGORIES.find(c => c.id === q.category);
              return `
                <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-2.5">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="text-xs font-black text-primary-700">Q${q.id}</span>
                    <span class="text-[11px] font-bold px-2.5 py-0.5 rounded bg-slate-100 text-slate-600">${cat ? cat.name : ''}</span>
                  </div>
                  <div class="text-sm font-extrabold text-slate-900">${q.question}</div>
                  <div class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200">
                    ⭕ 正解：${q.options[q.answer]}
                  </div>
                  <div class="text-xs font-bold text-amber-950 bg-amber-50 px-3 py-2 rounded-lg border border-amber-200">
                    🔑 ポイント：${q.keyPoint}
                  </div>
                  <p class="text-xs text-slate-700 leading-relaxed"><strong>📘 解説：</strong>${q.termDetail}</p>
                  <p class="text-xs text-slate-600 leading-relaxed"><strong>🌟 具体例：</strong>${q.concreteExample}</p>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // 初期描画
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
