<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>情報発信マスターへの道｜第5回 授業シミュレーター</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans JP & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', '"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
    }
    .step-connector {
      position: relative;
    }
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }
    /* Custom subtle animations */
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeInSlide 0.3s ease-out forwards;
    }
    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(251, 191, 36, 0); }
      100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
    }
    .investigate-hint:hover {
      animation: pulse-border 1.5s infinite;
      border-color: #fbbf24;
    }
    /* Colorblindness filter simulation classes */
    .sim-protanopia {
      filter: grayscale(0.45) sepia(0.35) hue-rotate(-15deg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
        <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-black text-lg shadow-md">
          情
        </div>
        <div>
          <span class="text-xs font-bold text-brand-600 tracking-wider block">情報の表現と管理｜第5回 体験学習</span>
          <h1 class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight">情報発信マスターへの道</h1>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto max-w-full py-1">
        <button onclick="navigateTo('home')" id="nav-home" class="nav-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition bg-brand-50 text-brand-700">
          🗺️ 全体マップ
        </button>
        <button onclick="navigateTo('toolbox')" id="nav-toolbox" class="nav-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100">
          🧰 思考の道具箱
        </button>
        <button onclick="navigateTo('reflection')" id="nav-reflection" class="nav-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100 flex items-center gap-1">
          📝 振り返りカルテ
          <span id="mistake-badge" class="hidden bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">0</span>
        </button>
      </nav>
    </div>

    <!-- Overall Progress Bar -->
    <div class="w-full bg-slate-100 h-1.5">
      <div id="global-progress-bar" class="bg-brand-600 h-1.5 transition-all duration-500" style="width: 0%"></div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app-container" class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 sm:py-8">
    <!-- Dynamic Views Rendered Here -->
  </main>

  <!-- Floating Toast / Notification Box -->
  <div id="toast-box" class="fixed bottom-5 right-5 z-50 hidden max-w-sm bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl border border-slate-700 flex items-start gap-3 animate-fade-in">
    <span id="toast-icon" class="text-xl">💡</span>
    <div class="text-sm leading-relaxed" id="toast-message">メッセージ</div>
  </div>

  <!-- Custom Modal -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 animate-fade-in">
      <div class="flex items-center justify-between mb-3">
        <h3 id="modal-title" class="text-lg font-extrabold text-slate-900">タイトル</h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 font-bold">✕</button>
      </div>
      <div id="modal-body" class="text-sm text-slate-700 space-y-3 leading-relaxed"></div>
      <div id="modal-close-btn" class="mt-6 flex justify-end">
        <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm transition">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. アプリケーション状態管理 (State Management)
    // =========================================================================
    const state = {
      currentView: 'home',
      completedStages: {
        stage0: false, stage1: false, stage2: false, stage3: false, stage4: false, stage5: false
      },
      stumbleTags: {},
      stage0Data: {
        foundFlaws: [],
        mappedCorrectly: false
      },
      stage1Data: {
        brestSelected: [], brestChecked: false,
        kjAssignments: { card1: null, card2: null, card3: null, card4: null, card5: null, card6: null },
        kjChecked: false
      },
      stage2Data: {
        bgColor: '#e2e8f0', textColor: '#94a3b8', density: 'high', colorOnly: true, simColorBlind: false,
        quiz2Answered: null
      },
      stage3Data: {
        commAnswers: {}, commChecked: false, mehrabianChoice: null
      },
      stage4Data: {
        persona: 'normal', appliedFixes: [], usabilityAnswers: {}, usabilityChecked: false
      },
      stage5Data: {
        finalAnswers: {}, finalReasons: {}, finalChecked: false, appliedScenarioChoice: null
      },
      reflectionNotes: { uncertainTerms: '', myRule: '' }
    };

    const STUMBLE_GUIDE = {
      'brest_kj': { title: 'ブレーンストーミング と KJ法 の混同', questionBack: '「今はまだ案を増やす段階（発散）？ それとも出た案をまとめる段階（収束）？」', advice: 'ブレストは【質より量・批判厳禁でアイデアを出す】活動、KJ法は【出たカードをグループ化して関係を見える化する】整理の技法です。' },
      'prep_rehearsal': { title: 'プレゼン準備・リハーサルの目的の誤解', questionBack: '「リハーサルは台本を暗記するため？ それとも聞き手にとって伝わりにくい点を探すため？」', advice: 'リハーサルは本番前の単なる練習ではなく、「時間配分の確認」と「伝わりにくい箇所を見つけて資料を改善する検証」の場です。' },
      'sync_net': { title: '「同期＝インターネットを使うこと」という誤解', questionBack: '「相手からの返信を翌日まで待てる？ それとも同じ時間にやり取りする必要がある？」', advice: '同期・非同期の判断基準は「ネットを使うか」ではなく【時間】です！' },
      'mehrabian_myth': { title: 'メラビアンの法則の一般化しすぎ', questionBack: '「話の内容が7%なら、プレゼンの原稿は適当でもいいの？」', advice: 'メラビアンの法則は「言葉と態度が矛盾したときに感情をどう受け取るか」という限定的条件の研究です。' },
      'acc_usa': { title: 'アクセシビリティ と ユーザビリティ の混同', questionBack: '「そもそも使える状態にある？（アクセスできる？） 使えた上で、目的を楽に達成できる？」', advice: 'アクセシビリティは「年齢や障がいの有無に関わらず利用できること」。ユーザビリティは「特定の状況での使いやすさ」です。' },
      'eff_eff': { title: '有効性 と 効率性 の混同', questionBack: '「目的を『達成できたか』に注目している？ それとも『どれだけ手間や時間が少なかったか』に注目している？」', advice: '【有効性】＝必要な情報が見つかった（できたかどうか）。【効率性】＝検索が2分で済んだ（時間・手間の少なさ）。' }
    };

    // =========================================================================
    // 2. ユーティリティ関数 (Helpers)
    // =========================================================================
    function recordStumble(key) {
      state.stumbleTags[key] = (state.stumbleTags[key] || 0) + 1;
      updateHeaderProgress();
    }

    function showToast(message, icon = '💡') {
      const box = document.getElementById('toast-box');
      document.getElementById('toast-message').textContent = message;
      document.getElementById('toast-icon').textContent = icon;
      box.classList.remove('hidden');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 4000);
    }

    function openModal(title, htmlBody, hideCloseBtn = false) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = htmlBody;
      document.getElementById('modal-close-btn').style.display = hideCloseBtn ? 'none' : 'flex';
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function toggleHint(hintId) {
      const el = document.getElementById(hintId);
      if (el) el.classList.toggle('hidden');
    }

    function completeStage(stageKey) {
      state.completedStages[stageKey] = true;
      updateHeaderProgress();
    }

    function updateHeaderProgress() {
      const total = Object.keys(state.completedStages).length;
      const done = Object.values(state.completedStages).filter(Boolean).length;
      const pct = Math.round((done / total) * 100);
      document.getElementById('global-progress-bar').style.width = `${pct}%`;

      const stumbleCount = Object.keys(state.stumbleTags).length;
      const badge = document.getElementById('mistake-badge');
      if (stumbleCount > 0) {
        badge.textContent = stumbleCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function navigateTo(view) {
      state.currentView = view;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-brand-50', 'text-brand-700');
        btn.classList.add('text-slate-600', 'hover:bg-slate-100');
      });
      const activeBtn = document.getElementById(`nav-${view}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-brand-50', 'text-brand-700');
        activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');
      }
      render();
    }

    // =========================================================================
    // 3. 画面レンダリング・ルーター (View Router)
    // =========================================================================
    function render() {
      const container = document.getElementById('app-container');
      switch (state.currentView) {
        case 'home': container.innerHTML = renderHome(); break;
        case 'stage0': container.innerHTML = renderStage0(); break;
        case 'stage1': container.innerHTML = renderStage1(); break;
        case 'stage2': container.innerHTML = renderStage2(); break;
        case 'stage3': container.innerHTML = renderStage3(); break;
        case 'stage4': container.innerHTML = renderStage4(); break;
        case 'stage5': container.innerHTML = renderStage5(); break;
        case 'toolbox': container.innerHTML = renderToolbox(); break;
        case 'reflection': container.innerHTML = renderReflection(); break;
      }
    }

    // =========================================================================
    // 4. ホーム画面
    // =========================================================================
    function renderHome() {
      const stages = [
        { id: 'stage0', time: '0〜5分｜導入', stepLabel: 'STEP 0', title: '伝わらない文化祭企画を発見せよ！', desc: '文字だらけ・色が見にくい「残念な発表資料」の問題点を探し、改善の4段階に分類しよう。', icon: '🔍', color: 'slate' },
        { id: 'stage1', time: '5〜12分｜発想と整理', stepLabel: 'STEP 1：発想→整理', title: 'ブレーンストーミング と KJ法', desc: 'アイデアを「広げる」と「まとめる」を使い分けよう。', icon: '💡', color: 'amber' },
        { id: 'stage2', time: '12〜21分｜発表準備と資料', stepLabel: 'STEP 2：伝える準備', title: 'プレゼン手順・配色実験・機器選択', desc: '明度差シミュレーターで読みやすいスライドを作ろう。', icon: '🎨', color: 'blue' },
        { id: 'stage3', time: '21〜29分｜コミュニケーション', stepLabel: 'STEP 3：伝え方', title: '同期／非同期 と 非言語の正しい理解', desc: '「時間」を軸に連絡手段を分類しよう。', icon: '💬', color: 'emerald' },
        { id: 'stage4', time: '29〜36分｜利用しやすさ', stepLabel: 'STEP 4：誰もが使える', title: 'アクセシビリティ と ユーザビリティ', desc: '有効性・効率性・満足度で案内を改善しよう。', icon: '♿', color: 'purple' },
        { id: 'stage5', time: '36〜40分＋応用｜総合確認', stepLabel: 'FINAL：実践＆応用', title: '総合確認テスト ＆ 応用', desc: '根拠とセットで答え、身近な場面に応用してみよう！', icon: '🏆', color: 'rose' }
      ];
      const doneCount = Object.values(state.completedStages).filter(Boolean).length;

      return `
        <div class="space-y-8 animate-fade-in">
          <section class="bg-gradient-to-br from-slate-900 via-brand-900 to-slate-800 text-white rounded-3xl p-6 sm:p-8 shadow-xl relative overflow-hidden">
            <div class="relative z-10 max-w-3xl">
              <div class="inline-flex items-center gap-2 bg-white/15 backdrop-blur-xs px-3 py-1 rounded-full text-xs font-bold text-blue-200 mb-4">
                <span>🎯 今日のゴール</span>
                <span>「発想 → 整理 → 発表 → 利用しやすさ」で情報発信を改善する判断力</span>
              </div>
              <h2 class="text-2xl sm:text-3xl font-black tracking-tight leading-snug mb-3">
                キミは文化祭の「情報発信ディレクター」！<br/>
                伝わらない発表と案内を、誰もが使いやすい形に変えよう。
              </h2>
              <p class="text-slate-200 text-sm sm:text-base leading-relaxed mb-6">
                用語を暗記するだけでは本番で使いこなせません。このシミュレーターでは、実際に失敗例を直したり、相手の立場を体験したりしながら<strong>「なぜそう判断するのか（根拠）」</strong>を身につけます。
              </p>
              <div class="flex flex-wrap items-center gap-3">
                <button onclick="navigateTo('stage0')" class="px-6 py-3.5 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm sm:text-base shadow-lg transition flex items-center gap-2">
                  <span>🚀 シミュレーションを始める</span>
                  <span>→</span>
                </button>
                <div class="bg-white/10 px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold">
                  クリア状況：<span class="text-amber-300 text-base">${doneCount}</span> / 6 ステージ
                </div>
              </div>
            </div>
          </section>

          <section class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-xs">
            <div class="text-xs font-bold text-slate-500 mb-3 flex items-center justify-between">
              <span>📌 情報発信の4ステップ（授業の全体像）</span>
              <button onclick="navigateTo('toolbox')" class="text-brand-600 hover:underline">図解まとめを見る →</button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 text-center">
              <div class="p-3 rounded-xl bg-amber-50 border border-amber-200"><div class="text-xs font-extrabold text-amber-700">① 発想する</div><div class="text-sm font-black text-slate-800 mt-0.5">ブレスト</div></div>
              <div class="p-3 rounded-xl bg-orange-50 border border-orange-200"><div class="text-xs font-extrabold text-orange-700">② 整理する</div><div class="text-sm font-black text-slate-800 mt-0.5">KJ法・構成</div></div>
              <div class="p-3 rounded-xl bg-blue-50 border border-blue-200"><div class="text-xs font-extrabold text-blue-700">③ 伝える</div><div class="text-sm font-black text-slate-800 mt-0.5">配色・非言語・同期</div></div>
              <div class="p-3 rounded-xl bg-purple-50 border border-purple-200"><div class="text-xs font-extrabold text-purple-700">④ 誰もが使える</div><div class="text-sm font-black text-slate-800 mt-0.5">アクセシビリティ等</div></div>
            </div>
          </section>

          <section class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
            ${stages.map(st => {
              const isDone = state.completedStages[st.id];
              return `
                <div onclick="navigateTo('${st.id}')" class="bg-white rounded-2xl p-5 border ${isDone ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-200'} card-hover cursor-pointer flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-3">
                      <span class="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700">${st.time}</span>
                      ${isDone ? '<span class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">✅ クリア済</span>' : '<span class="text-xs font-bold text-brand-600">挑戦する →</span>'}
                    </div>
                    <div class="flex items-start gap-3">
                      <div class="text-3xl bg-slate-50 w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 border border-slate-100">${st.icon}</div>
                      <div>
                        <div class="text-xs font-bold text-brand-600">${st.stepLabel}</div>
                        <h3 class="text-base sm:text-lg font-extrabold text-slate-900 mt-0.5">${st.title}</h3>
                        <p class="text-xs sm:text-sm text-slate-600 mt-1.5 leading-relaxed">${st.desc}</p>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 5. STAGE 0: 導入（ゲーム化：探索＆推理クイズ）
    // =========================================================================
    function renderStage0() {
      const flaws = [
        { id: 'density', label: '文字がびっしりで何が大事か分からない', step: '② 整理する（構成・情報量）' },
        { id: 'contrast', label: '背景と文字の色が似ていて読みにくい', step: '③ 伝える（資料デザイン・配色）' },
        { id: 'audience', label: '発表者が原稿ばかり見て聞き手を見ていない', step: '③ 伝える（非言語・アイコンタクト）' },
        { id: 'accessibility', label: '文字が小さすぎ＆音声案内がなく使えない人がいる', step: '④ 誰もが使える（アクセシビリティ）' }
      ];
      const foundCount = state.stage0Data.foundFlaws.length;

      const hasCon = state.stage0Data.foundFlaws.includes('contrast');
      const hasDen = state.stage0Data.foundFlaws.includes('density');
      const hasAcc = state.stage0Data.foundFlaws.includes('accessibility');
      const hasAud = state.stage0Data.foundFlaws.includes('audience');

      return `
        <div class="space-y-6 animate-fade-in">
          ${renderStageHeader('STEP 0｜導入（0〜5分）', '伝わらない文化祭の発表を診断しよう！', '先生のセリフ：「文化祭の新企画を紹介します。でもアイデアはまとまらず、スライドは文字だらけ。発表者は原稿を見続け、案内の文字も小さい。何を変えますか？」')}

          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <h3 class="font-extrabold text-slate-900 text-base sm:text-lg flex items-center gap-2">
                <span class="text-2xl animate-bounce">🕵️</span>
                ワーク1：画面の「あやしい箇所」を探し出そう！
              </h3>
              <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-brand-100 text-brand-800">発見数：${foundCount} / 4</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-600 mb-5 leading-relaxed bg-amber-50 p-3 rounded-xl border border-amber-200 text-amber-900 font-bold">
              下の「残念な発表シーン」から、問題だと思う箇所（文字の量、配色、文字サイズ、発表者の態度など）を<strong>直接タップ</strong>して調査してください！
            </p>

            <!-- Simulated Bad Presentation Canvas -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 bg-slate-100 p-4 sm:p-5 rounded-2xl border border-slate-300">
              
              <!-- Bad Slide Area -->
              <div class="lg:col-span-2 rounded-xl p-3 sm:p-4 border-2 border-slate-400 relative flex flex-col gap-3 bg-[#cbd5e1]">
                
                <!-- Contrast Zone -->
                <div onclick="startInvestigation('contrast')" class="p-2 rounded-lg transition-all cursor-pointer border-2 border-transparent ${hasCon ? 'bg-emerald-500/20 border-emerald-500' : 'investigate-hint bg-black/5'}">
                  <div class="text-[12px] font-black mb-1 underline" style="color: #64748b;">文化祭3年2組企画書案その1（仮）ver2.4</div>

                  <div>
                    <h4 class="text-xl sm:text-2xl font-black mb-3">体験型・縁日＆抹茶カフェ</h4>
                    ${d.density === 'high' ? '<p class="text-xs">今年の文化祭では伝統文化の体験とカフェを融合させた企画を実施します。入口でチケットを購入してから射的や輪投げを遊んでいただき、その後カウンターで抹茶ラテを受け取ってください。</p>' : '<ul class="space-y-2 text-sm font-bold list-disc list-inside"><li>遊び：射的＆輪投げ</li><li>飲食：特製抹茶ラテ</li></ul>'}
                  </div>
                  <div class="mt-4 pt-3 border-t border-current/20 flex items-center gap-2 text-xs font-extrabold">
                    <span>混雑状況：</span>
                    ${d.colorOnly ? '<span class="inline-block w-3 h-3 rounded-full bg-emerald-500"></span><span class="inline-block w-3 h-3 rounded-full bg-red-600"></span>' : '<span class="px-2 py-0.5 rounded bg-emerald-600 text-white">◯ 空き</span><span class="px-2 py-0.5 rounded bg-rose-700 text-white">▲ 混雑</span>'}
                  </div>
                </div>
                <div class="mt-3 p-3.5 rounded-2xl ${isGoodSlide ? 'bg-emerald-50 text-emerald-900' : 'bg-slate-100 text-slate-700'} text-xs font-extrabold">
                  ${isGoodSlide ? '✨ 合格！誰にとっても読みやすい！' : '🔧 改善アドバイス：明度差・文字量・色の区別を修正しよう。'}
                </div>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-4">
            <h3 class="font-extrabold text-slate-900 text-base sm:text-lg">🎤 ワーク2-B：プレゼン準備と機器の判断</h3>
            <p class="text-xs sm:text-sm text-slate-600">発表準備の行動として<strong>不適切なもの</strong>を選んでください。</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${[
                { id: 'A', text: '聞き手が誰かを確認し、専門用語を減らす', bad: false },
                { id: 'B', text: '引用するデータの「発信元」と「更新日」を確認する', bad: false },
                { id: 'C', text: 'リハーサルで見つかった課題があっても、資料は変更しない', bad: true },
                { id: 'D', text: '制限時間内に収まるか、実際に時間を測って練習する', bad: false }
              ].map(opt => {
                let style = d.quiz2Answered === opt.id ? (opt.bad ? 'border-emerald-500 bg-emerald-50' : 'border-rose-500 bg-rose-50') : 'border-slate-200';
                return `<button onclick="answerQuiz2('${opt.id}', ${opt.bad})" class="p-4 rounded-2xl border-2 text-left font-bold transition ${style}">${opt.text}</button>`;
              }).join('')}
            </div>
            ${isGoodSlide && d.quiz2Answered === 'C' ? `<div class="flex justify-end pt-2"><button onclick="completeStage('stage2'); navigateTo('stage3');" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm">STEP 2 クリア！次へ →</button></div>` : ''}
          </div>
        </div>
      `;
    }

    function updateSlideDesign(key, val) { state.stage2Data[key] = val; render(); }
    function answerQuiz2(id, isBad) {
      state.stage2Data.quiz2Answered = id;
      if (isBad) showToast('正解！リハーサルは「検証と修正」の場です。', '🎉');
      else { recordStumble('prep_rehearsal'); showToast('不適切なものを探そう！', '🤔'); }
      render();
    }

    function renderStage3() {
      const items = [{ id: 'phone', name: '📞 電話', correct: 'sync' }, { id: 'email', name: '✉️ メール', correct: 'async' }, { id: 'video', name: '💻 ビデオ会議', correct: 'sync' }, { id: 'board', name: '📋 掲示板', correct: 'async' }];
      const allCommCorrect = items.every(i => state.stage3Data.commAnswers[i.id] === i.correct);

      return `
        <div class="space-y-6 animate-fade-in">
          ${renderStageHeader('STEP 3｜コミュニケーション', '同期／非同期の判断軸 と 非言語情報の正しい理解', '判断の問い：「同じ時間にやり取りする必要があるか？」')}

          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-4">
            <h3 class="font-extrabold text-slate-900 text-base sm:text-lg">⏱️ ワーク3-A：同期・非同期分類</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${items.map(item => {
                const ans = state.stage3Data.commAnswers[item.id];
                const isOk = ans === item.correct;
                return `
                  <div class="p-4 rounded-2xl border ${state.stage3Data.commChecked ? (isOk ? 'border-emerald-400 bg-emerald-50' : 'border-rose-400 bg-rose-50') : 'border-slate-200'}">
                    <div class="font-extrabold mb-3">${item.name}</div>
                    <div class="grid grid-cols-2 gap-2">
                      <button onclick="setCommAnswer('${item.id}', 'sync')" class="py-2 px-3 rounded-xl text-xs font-extrabold border ${ans === 'sync' ? 'bg-brand-600 text-white' : 'bg-white'}">⚡ 同期型（同時）</button>
                      <button onclick="setCommAnswer('${item.id}', 'async')" class="py-2 px-3 rounded-xl text-xs font-extrabold border ${ans === 'async' ? 'bg-purple-600 text-white' : 'bg-white'}">⏳ 非同期型（時間差）</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            <button onclick="checkComm()" class="px-5 py-2.5 rounded-xl bg-brand-600 text-white font-bold text-sm">分類をチェック</button>
          </div>

          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-4">
            <h3 class="font-extrabold text-slate-900 text-base sm:text-lg">👀 ワーク3-B：非言語情報</h3>
            <div class="space-y-2.5">
              ${[
                { id: 'A', text: '「メラビアンの法則があるから、原稿の中身は適当でいいよ。」', ok: false },
                { id: 'B', text: '「それは感情が矛盾した時の実験だよ。プレゼンは話の内容も大事！」', ok: true }
              ].map(c => `<button onclick="chooseMehrabian('${c.id}', ${c.ok})" class="w-full p-4 rounded-2xl border-2 text-left font-bold transition ${state.stage3Data.mehrabianChoice === c.id ? (c.ok ? 'border-emerald-500 bg-emerald-50' : 'border-rose-500 bg-rose-50') : 'border-slate-200'}">${c.text}</button>`).join('')}
            </div>
            ${allCommCorrect && state.stage3Data.mehrabianChoice === 'B' ? `<div class="flex justify-end pt-2"><button onclick="completeStage('stage3'); navigateTo('stage4');" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm">STEP 3 クリア！次へ →</button></div>` : ''}
          </div>
        </div>
      `;
    }

    function setCommAnswer(id, val) { state.stage3Data.commChecked = false; state.stage3Data.commAnswers[id] = val; render(); }
    function checkComm() {
      state.stage3Data.commChecked = true;
      if (['phone','email','video','board'].every(id => state.stage3Data.commAnswers[id] === ['sync','async','sync','async'][['phone','email','video','board'].indexOf(id)])) showToast('全問正解！', '🎉');
      else { recordStumble('sync_net'); showToast('ネットの有無ではなく「時間の一致」で考えよう！', '💡'); }
      render();
    }
    function chooseMehrabian(id, ok) {
      state.stage3Data.mehrabianChoice = id;
      if (ok) showToast('的確なアドバイスです！', '👏');
      else recordStumble('mehrabian_myth');
      render();
    }

    function renderStage4() {
      const d = state.stage4Data;
      const allUsaCorrect = d.usabilityAnswers.qA === 'effectiveness' && d.usabilityAnswers.qB === 'efficiency' && d.usabilityAnswers.qC === 'satisfaction';

      return `
        <div class="space-y-6 animate-fade-in">
          ${renderStageHeader('STEP 4｜利用しやすさ', 'アクセシビリティ と ユーザビリティの3観点', '問いかけ：「誰もが使える？（アクセシビリティ）」＋「スムーズに達成できる？（ユーザビリティ）」')}

          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-4">
            <h3 class="font-extrabold text-slate-900 text-base sm:text-lg">♿ ワーク4-A：アクセシビリティ改善</h3>
            <div class="flex flex-wrap gap-2">
              <button onclick="toggleWebFix('alt_tts')" class="p-3 rounded-xl border text-xs font-bold ${d.appliedFixes.includes('alt_tts') ? 'bg-emerald-600 text-white' : 'bg-white'}">🔊 音声案内・代替テキスト追加</button>
              <button onclick="toggleWebFix('font_zoom')" class="p-3 rounded-xl border text-xs font-bold ${d.appliedFixes.includes('font_zoom') ? 'bg-emerald-600 text-white' : 'bg-white'}">🔍 文字拡大対応</button>
              <button onclick="toggleWebFix('quick_search')" class="p-3 rounded-xl border text-xs font-bold ${d.appliedFixes.includes('quick_search') ? 'bg-emerald-600 text-white' : 'bg-white'}">⚡ クイック検索（効率性UP）</button>
            </div>
          </div>

          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-4">
            <h3 class="font-extrabold text-slate-900 text-base sm:text-lg">📊 ワーク4-B：ユーザビリティ3観点</h3>
            <div class="space-y-3">
              ${[{ id: 'qA', text: 'A：「目的の展示場所を見つけられた！」', correct: 'effectiveness' }, { id: 'qB', text: 'B：「去年は10分かかったが、今年は2分で着いた！」', correct: 'efficiency' }, { id: 'qC', text: 'C：「迷わなかったので来年も使いたい！」', correct: 'satisfaction' }].map(q => `
                <div class="p-4 rounded-2xl border ${d.usabilityChecked ? (d.usabilityAnswers[q.id] === q.correct ? 'border-emerald-400 bg-emerald-50' : 'border-rose-400 bg-rose-50') : 'border-slate-200'}">
                  <p class="text-xs sm:text-sm font-bold mb-3">${q.text}</p>
                  <div class="grid grid-cols-3 gap-2">
                    <button onclick="setUsaAnswer('${q.id}', 'effectiveness')" class="py-2 rounded-xl text-xs font-extrabold border ${d.usabilityAnswers[q.id] === 'effectiveness' ? 'bg-brand-600 text-white' : 'bg-white'}">🎯 有効性</button>
                    <button onclick="setUsaAnswer('${q.id}', 'efficiency')" class="py-2 rounded-xl text-xs font-extrabold border ${d.usabilityAnswers[q.id] === 'efficiency' ? 'bg-amber-600 text-white' : 'bg-white'}">⚡ 効率性</button>
                    <button onclick="setUsaAnswer('${q.id}', 'satisfaction')" class="py-2 rounded-xl text-xs font-extrabold border ${d.usabilityAnswers[q.id] === 'satisfaction' ? 'bg-purple-600 text-white' : 'bg-white'}">😊 満足度</button>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
              <button onclick="checkUsability()" class="px-5 py-2.5 rounded-xl bg-brand-600 text-white font-bold text-sm">判定する</button>
              ${d.usabilityChecked && allUsaCorrect && d.appliedFixes.length === 3 ? `<button onclick="completeStage('stage4'); navigateTo('stage5');" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm">STEP 4 クリア！次へ →</button>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function toggleWebFix(id) {
      if (state.stage4Data.appliedFixes.includes(id)) state.stage4Data.appliedFixes = state.stage4Data.appliedFixes.filter(x => x !== id);
      else state.stage4Data.appliedFixes.push(id);
      render();
    }
    function setUsaAnswer(qId, val) { state.stage4Data.usabilityChecked = false; state.stage4Data.usabilityAnswers[qId] = val; render(); }
    function checkUsability() {
      state.stage4Data.usabilityChecked = true;
      if (state.stage4Data.usabilityAnswers.qA === 'effectiveness' && state.stage4Data.usabilityAnswers.qB === 'efficiency' && state.stage4Data.usabilityAnswers.qC === 'satisfaction') showToast('全問正解！', '🎉');
      else recordStumble('eff_eff');
      render();
    }

    function renderStage5() {
      const d = state.stage5Data;
      return `
        <div class="space-y-6 animate-fade-in">
          ${renderStageHeader('FINAL｜総合確認', '用語だけでなく「根拠（なぜそう判断するか）」とセットで答えよう！', '授業の到達確認')}
          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-5">
            <h3 class="font-extrabold text-slate-900 text-base sm:text-lg">🎓 総合確認テスト</h3>
            <p class="text-sm">※このシミュレーターの簡易版デモでは総合確認テストの設問を省略しています。「全体マップ」または「振り返り」をご確認ください。</p>
            <button onclick="completeStage('stage5'); navigateTo('reflection');" class="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm transition shadow-sm">
              振り返りカルテを見る →
            </button>
          </div>
        </div>
      `;
    }

    function renderToolbox() {
      return `
        <div class="space-y-6 animate-fade-in p-6 bg-white rounded-3xl border border-slate-200">
          <h2 class="text-xl font-black text-slate-900">🧰 思考の道具箱</h2>
          <p class="text-sm text-slate-600">・ブレスト＝発散、KJ法＝収束<br>・同期＝時間の一致が必要、非同期＝時間差OK<br>・アクセシビリティ＝利用できること、ユーザビリティ＝使いやすさ</p>
          <button onclick="navigateTo('home')" class="px-5 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-sm">戻る</button>
        </div>
      `;
    }

    function renderReflection() {
      return `
        <div class="space-y-6 animate-fade-in p-6 bg-white rounded-3xl border border-slate-200">
          <h2 class="text-xl font-black text-slate-900">📝 振り返りカルテ</h2>
          <p class="text-sm text-slate-600">自分の弱点傾向とまとめを仕上げましょう。</p>
          <button onclick="navigateTo('home')" class="px-5 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-sm">マップへ戻る</button>
        </div>
      `;
    }

    function renderStageHeader(badge, title, subtitle) {
      return `
        <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
            <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-brand-100 text-brand-800">${badge}</span>
            <button onclick="navigateTo('home')" class="text-xs font-bold text-slate-500 hover:text-slate-800">← 全体マップへ戻る</button>
          </div>
          <h2 class="text-xl sm:text-2xl font-black text-slate-900">${title}</h2>
          <p class="text-xs sm:text-sm text-slate-600 mt-1.5 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">${subtitle}</p>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateHeaderProgress();
      render();
    });
  </script>
</body>
</html>
