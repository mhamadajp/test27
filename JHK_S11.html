<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>情報発信マスターへの道｜第5回 授業シミュレーター</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans JP & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', '"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
    }
    .step-connector {
      position: relative;
    }
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }
    /* Custom subtle animations */
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeInSlide 0.3s ease-out forwards;
    }
    /* Colorblindness filter simulation classes */
    .sim-protanopia {
      filter: grayscale(0.45) sepia(0.35) hue-rotate(-15deg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
        <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-black text-lg shadow-md">
          情
        </div>
        <div>
          <span class="text-xs font-bold text-brand-600 tracking-wider block">情報の表現と管理｜第5回 体験学習</span>
          <h1 class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight">情報発信マスターへの道</h1>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto max-w-full py-1">
        <button onclick="navigateTo('home')" id="nav-home" class="nav-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition bg-brand-50 text-brand-700">
          🗺️ 全体マップ
        </button>
        <button onclick="navigateTo('toolbox')" id="nav-toolbox" class="nav-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100">
          🧰 思考の道具箱
        </button>
        <button onclick="navigateTo('reflection')" id="nav-reflection" class="nav-btn px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100 flex items-center gap-1">
          📝 振り返りカルテ
          <span id="mistake-badge" class="hidden bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">0</span>
        </button>
      </nav>
    </div>

    <!-- Overall Progress Bar -->
    <div class="w-full bg-slate-100 h-1.5">
      <div id="global-progress-bar" class="bg-brand-600 h-1.5 transition-all duration-500" style="width: 0%"></div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app-container" class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 sm:py-8">
    <!-- Dynamic Views Rendered Here -->
  </main>

  <!-- Floating Toast / Notification Box (Replaces alert) -->
  <div id="toast-box" class="fixed bottom-5 right-5 z-50 hidden max-w-sm bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl border border-slate-700 flex items-start gap-3 animate-fade-in">
    <span id="toast-icon" class="text-xl">💡</span>
    <div class="text-sm leading-relaxed" id="toast-message">メッセージ</div>
  </div>

  <!-- Custom Modal for Detailed Explanations or Confirmations -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 animate-fade-in">
      <div class="flex items-center justify-between mb-3">
        <h3 id="modal-title" class="text-lg font-extrabold text-slate-900">タイトル</h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 font-bold">✕</button>
      </div>
      <div id="modal-body" class="text-sm text-slate-700 space-y-3 leading-relaxed"></div>
      <div class="mt-6 flex justify-end">
        <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm transition">
          納得した！閉じる
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. アプリケーション状態管理 (State Management)
    // =========================================================================
    const state = {
      currentView: 'home', // 'home' | 'stage0' | 'stage1' | 'stage2' | 'stage3' | 'stage4' | 'stage5' | 'toolbox' | 'reflection'
      completedStages: {
        stage0: false,
        stage1: false,
        stage2: false,
        stage3: false,
        stage4: false,
        stage5: false
      },
      // 生徒がつまずいたポイント（指導案の「指導上のつまずきと対応」と連動）
      stumbleTags: {}, // e.g., { 'brest_kj': 1, 'sync_net': 2 }
      // 各ステージの体験データ
      stage0Data: {
        foundFlaws: [], // ['density', 'contrast', 'audience', 'accessibility']
        mappedCorrectly: false
      },
      stage1Data: {
        brestSelected: [],
        brestChecked: false,
        kjAssignments: {
          card1: null, // 'attr'
          card2: null, // 'pr'
          card3: null, // 'ops'
          card4: null, // 'attr'
          card5: null, // 'pr'
          card6: null  // 'ops'
        },
        kjChecked: false,
        quiz1Answered: null,
        quiz1Reason: null
      },
      stage2Data: {
        bgColor: '#e2e8f0',
        textColor: '#94a3b8',
        density: 'high', // 'high' | 'low'
        colorOnly: true, // true | false
        simColorBlind: false,
        designChecked: false,
        quiz2Answered: null,
        toolMatched: {}
      },
      stage3Data: {
        commAnswers: {}, // { phone: 'sync', email: 'async', video: 'sync', board: 'async', chat: 'both' }
        commChecked: false,
        mehrabianChoice: null,
        eyeContactChoice: null
      },
      stage4Data: {
        persona: 'normal', // 'normal' | 'blind' | 'busy' | 'guest'
        appliedFixes: [], // ['alt_tts', 'search_filter', 'easy_jp']
        usabilityAnswers: {}, // { qA: 'effectiveness', qB: 'efficiency', qC: 'satisfaction' }
        usabilityChecked: false
      },
      stage5Data: {
        finalAnswers: {}, // { f1: 'bs', f2: 'kj', f3: 'acc', f4: 'eff' }
        finalReasons: {}, // 根拠の選択
        finalChecked: false,
        appliedScenarioChoice: null
      },
      reflectionNotes: {
        uncertainTerms: '',
        myRule: ''
      }
    };

    // 指導案に基づく「つまずき診断マスターデータ」
    const STUMBLE_GUIDE = {
      'brest_kj': {
        title: 'ブレーンストーミング と KJ法 の混同',
        questionBack: '「今はまだ案を増やす段階（発散）？ それとも出た案をまとめる段階（収束）？」',
        advice: 'ブレストは【質より量・批判厳禁でアイデアを出す】活動、KJ法は【出たカードをグループ化して関係を見える化する】整理の技法です。キーワードは「出す＝ブレスト」「まとめる＝KJ法」！'
      },
      'prep_rehearsal': {
        title: 'プレゼン準備・リハーサルの目的の誤解',
        questionBack: '「リハーサルは台本を暗記するため？ それとも聞き手にとって伝わりにくい点を探すため？」',
        advice: 'リハーサルは本番前の単なる練習ではなく、「時間配分の確認」と「伝わりにくい箇所を見つけて資料を改善する検証」の場です。修正してこそ完成度が上がります！'
      },
      'sync_net': {
        title: '「同期＝インターネットを使うこと」という誤解',
        questionBack: '「相手からの返信を翌日まで待てる？ それとも同じ時間にやり取りする必要がある？」',
        advice: '同期・非同期の判断基準は「ネットを使うか」ではなく【時間】です！電話（ネットなし）は同期、メールや掲示板（ネットあり）は非同期。チャットは使い方次第で両方になります。'
      },
      'mehrabian_myth': {
        title: 'メラビアンの法則の一般化しすぎ',
        questionBack: '「話の内容が7%なら、プレゼンの原稿は適当でもいいの？」',
        advice: 'メラビアンの法則（言語7%・聴覚38%・視覚55%）は、「言葉と態度が矛盾したときに感情をどう受け取るか」という限定的条件の研究です。プレゼンでは内容の論理性＋非言語（視線・声）の両方が不可欠です！'
      },
      'acc_usa': {
        title: 'アクセシビリティ と ユーザビリティ の混同',
        questionBack: '「そもそも使える状態にある？（アクセスできる？） 使えた上で、目的を楽に達成できる？」',
        advice: 'アクセシビリティは「年齢や障がいの有無に関わらず誰もが情報に到達・利用できること（字幕・音声読み上げ等）」。ユーザビリティは「特定の状況で目的を達成する際の使いやすさ」です。'
      },
      'eff_eff': {
        title: '有効性 と 効率性 の混同',
        questionBack: '「目的を『達成できたか（結果）』に注目している？ それとも『どれだけ手間や時間が少なかったか（コスト）』に注目している？」',
        advice: '【有効性】＝必要な情報が見つかった・達成できた（できたかどうか）。【効率性】＝10分かかっていた検索が2分で済んだ（時間・手間の少なさ）。【満足度】＝また使いたいと思った（気持ちよさ）。'
      }
    };

    // =========================================================================
    // 2. ユーティリティ関数 (Helpers)
    // =========================================================================
    function recordStumble(key) {
      state.stumbleTags[key] = (state.stumbleTags[key] || 0) + 1;
      updateHeaderProgress();
    }

    function showToast(message, icon = '💡') {
      const box = document.getElementById('toast-box');
      document.getElementById('toast-message').textContent = message;
      document.getElementById('toast-icon').textContent = icon;
      box.classList.remove('hidden');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 4000);
    }

    function openModal(title, htmlBody) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = htmlBody;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function toggleHint(hintId) {
      const el = document.getElementById(hintId);
      if (el) {
        el.classList.toggle('hidden');
      }
    }

    function completeStage(stageKey) {
      state.completedStages[stageKey] = true;
      updateHeaderProgress();
    }

    function updateHeaderProgress() {
      const total = Object.keys(state.completedStages).length;
      const done = Object.values(state.completedStages).filter(Boolean).length;
      const pct = Math.round((done / total) * 100);
      document.getElementById('global-progress-bar').style.width = `${pct}%`;

      const stumbleCount = Object.keys(state.stumbleTags).length;
      const badge = document.getElementById('mistake-badge');
      if (stumbleCount > 0) {
        badge.textContent = stumbleCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function navigateTo(view) {
      state.currentView = view;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Update nav buttons styling
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-brand-50', 'text-brand-700');
        btn.classList.add('text-slate-600', 'hover:bg-slate-100');
      });
      const activeBtn = document.getElementById(`nav-${view}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-brand-50', 'text-brand-700');
        activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');
      }

      render();
    }

    // =========================================================================
    // 3. 画面レンダリング・ルーター (View Router)
    // =========================================================================
    function render() {
      const container = document.getElementById('app-container');
      switch (state.currentView) {
        case 'home':
          container.innerHTML = renderHome();
          break;
        case 'stage0':
          container.innerHTML = renderStage0();
          break;
        case 'stage1':
          container.innerHTML = renderStage1();
          break;
        case 'stage2':
          container.innerHTML = renderStage2();
          break;
        case 'stage3':
          container.innerHTML = renderStage3();
          break;
        case 'stage4':
          container.innerHTML = renderStage4();
          break;
        case 'stage5':
          container.innerHTML = renderStage5();
          break;
        case 'toolbox':
          container.innerHTML = renderToolbox();
          break;
        case 'reflection':
          container.innerHTML = renderReflection();
          break;
      }
    }

    // =========================================================================
    // 4. ホーム画面（全体マップ＆ストーリー導入）
    // =========================================================================
    function renderHome() {
      const stages = [
        {
          id: 'stage0',
          time: '0〜5分｜導入',
          stepLabel: 'STEP 0',
          title: '伝わらない文化祭企画を発見せよ！',
          desc: '文字だらけ・色が見にくい「残念な発表資料」の問題点を探し、改善の4段階に分類しよう。',
          icon: '🔍',
          color: 'slate'
        },
        {
          id: 'stage1',
          time: '5〜12分｜発想と整理',
          stepLabel: 'STEP 1：発想→整理',
          title: 'ブレーンストーミング と KJ法',
          desc: 'アイデアを「広げる（ブレスト）」と「まとめる（KJ法）」を体験ワークで使い分けよう。',
          icon: '💡',
          color: 'amber'
        },
        {
          id: 'stage2',
          time: '12〜21分｜発表準備と資料',
          stepLabel: 'STEP 2：伝える準備',
          title: 'プレゼン手順・配色実験・機器選択',
          desc: '背景と文字の明度差シミュレーターで読みやすいスライドを作り、リハーサルの意味を掴もう。',
          icon: '🎨',
          color: 'blue'
        },
        {
          id: 'stage3',
          time: '21〜29分｜コミュニケーション',
          stepLabel: 'STEP 3：伝え方',
          title: '同期／非同期 と 非言語の正しい理解',
          desc: '「時間」を軸に連絡手段を分類し、メラビアンの法則やアイコンタクトの誤解を解き明かそう。',
          icon: '💬',
          color: 'emerald'
        },
        {
          id: 'stage4',
          time: '29〜36分｜利用しやすさ',
          stepLabel: 'STEP 4：誰もが使える',
          title: 'アクセシビリティ と ユーザビリティ3観点',
          desc: '視覚障がいや急いでいる来校者の視点に立ち、「有効性・効率性・満足度」で案内を改善しよう。',
          icon: '♿',
          color: 'purple'
        },
        {
          id: 'stage5',
          time: '36〜40分＋応用｜総合確認',
          stepLabel: 'FINAL：実践＆応用',
          title: '総合確認テスト ＆ 日常シーンへの応用',
          desc: '根拠とセットで4問に答え、さらに文化祭以外の身近な場面に知識を応用してみよう！',
          icon: '🏆',
          color: 'rose'
        }
      ];

      const doneCount = Object.values(state.completedStages).filter(Boolean).length;

      return `
        <div class="space-y-8 animate-fade-in">
          <!-- Hero Mission Banner -->
          <section class="bg-gradient-to-br from-slate-900 via-brand-900 to-slate-800 text-white rounded-3xl p-6 sm:p-8 shadow-xl relative overflow-hidden">
            <div class="relative z-10 max-w-3xl">
              <div class="inline-flex items-center gap-2 bg-white/15 backdrop-blur-xs px-3 py-1 rounded-full text-xs font-bold text-blue-200 mb-4">
                <span>🎯 今日のゴール</span>
                <span>「発想 → 整理 → 発表 → 利用しやすさ」で情報発信を改善する判断力</span>
              </div>
              <h2 class="text-2xl sm:text-3xl font-black tracking-tight leading-snug mb-3">
                キミは文化祭の「情報発信ディレクター」！<br/>
                伝わらない発表と案内を、誰もが使いやすい形に変えよう。
              </h2>
              <p class="text-slate-200 text-sm sm:text-base leading-relaxed mb-6">
                ただ用語を暗記するだけでは、本番で使いこなせません。このシミュレーターでは、実際に失敗例を直したり、相手の立場を体験したりしながら<strong>「なぜそう判断するのか（根拠）」</strong>を身につけます。
              </p>
              <div class="flex flex-wrap items-center gap-3">
                <button onclick="navigateTo('stage0')" class="px-6 py-3.5 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm sm:text-base shadow-lg transition flex items-center gap-2">
                  <span>🚀 シミュレーションを始める</span>
                  <span>→</span>
                </button>
                <div class="bg-white/10 px-4 py-2.5 rounded-2xl text-xs sm:text-sm font-bold">
                  クリア状況：<span class="text-amber-300 text-base">${doneCount}</span> / 6 ステージ
                </div>
              </div>
            </div>
          </section>

          <!-- Process Flow Visual Bar -->
          <section class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-xs">
            <div class="text-xs font-bold text-slate-500 mb-3 flex items-center justify-between">
              <span>📌 情報発信の4ステップ（授業の全体像）</span>
              <button onclick="navigateTo('toolbox')" class="text-brand-600 hover:underline">図解まとめを見る →</button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 text-center">
              <div class="p-3 rounded-xl bg-amber-50 border border-amber-200">
                <div class="text-xs font-extrabold text-amber-700">① 発想する</div>
                <div class="text-sm font-black text-slate-800 mt-0.5">ブレスト</div>
              </div>
              <div class="p-3 rounded-xl bg-orange-50 border border-orange-200">
                <div class="text-xs font-extrabold text-orange-700">② 整理する</div>
                <div class="text-sm font-black text-slate-800 mt-0.5">KJ法・構成</div>
              </div>
              <div class="p-3 rounded-xl bg-blue-50 border border-blue-200">
                <div class="text-xs font-extrabold text-blue-700">③ 伝える</div>
                <div class="text-sm font-black text-slate-800 mt-0.5">配色・非言語・同期</div>
              </div>
              <div class="p-3 rounded-xl bg-purple-50 border border-purple-200">
                <div class="text-xs font-extrabold text-purple-700">④ 誰もが使える</div>
                <div class="text-sm font-black text-slate-800 mt-0.5">アクセシビリティ等</div>
              </div>
            </div>
          </section>

          <!-- Stage Cards Grid -->
          <section class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
            ${stages.map(st => {
              const isDone = state.completedStages[st.id];
              return `
                <div onclick="navigateTo('${st.id}')" class="bg-white rounded-2xl p-5 border ${isDone ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-200'} card-hover cursor-pointer flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-3">
                      <span class="text-xs font-extrabold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700">${st.time}</span>
                      ${isDone
                        ? '<span class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">✅ クリア済</span>'
                        : '<span class="text-xs font-bold text-brand-600">挑戦する →</span>'}
                    </div>
                    <div class="flex items-start gap-3">
                      <div class="text-3xl bg-slate-50 w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 border border-slate-100">
                        ${st.icon}
                      </div>
                      <div>
                        <div class="text-xs font-bold text-brand-600">${st.stepLabel}</div>
                        <h3 class="text-base sm:text-lg font-extrabold text-slate-900 mt-0.5">${st.title}</h3>
                        <p class="text-xs sm:text-sm text-slate-600 mt-1.5 leading-relaxed">${st.desc}</p>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 5. STAGE 0: 導入（伝わらない発表の問題発見）
    // =========================================================================
    function renderStage0() {

            <span class="text-xs font-extrabold text-brand-600">いつでも見返せるリファレンス</span>
            <h2 class="text-xl sm:text-2xl font-black text-slate-900 mt-1">🧰 思考の道具箱（判断の合言葉まとめ）</h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">用語を丸暗記するのではなく、「どんな問いかけで判断するか（判断の軸）」を確認しよう。</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-2">
              <div class="text-xs font-extrabold text-amber-700 bg-amber-50 px-2.5 py-1 rounded-lg w-fit">① 発想と整理</div>
              <h3 class="font-extrabold text-slate-900">ブレーンストーミング vs KJ法</h3>
              <ul class="text-xs sm:text-sm text-slate-700 space-y-1.5 leading-relaxed">
                <li>・<strong>ブレスト（出す・発散）</strong>：批判厳禁／自由奔放／質より量／便乗歓迎。評価は後回し。</li>
                <li>・<strong>KJ法（まとめる・収束）</strong>：カード化 → 似たものを集める → 表札（見出し）付け → 関係図解。</li>
              </ul>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-2">
              <div class="text-xs font-extrabold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg w-fit">② 発表準備と配色</div>
              <h3 class="font-extrabold text-slate-900">リハーサルの意味・配色の鉄則</h3>
              <ul class="text-xs sm:text-sm text-slate-700 space-y-1.5 leading-relaxed">
                <li>・<strong>リハーサル</strong>：暗記ではなく「伝わりにくい箇所を探す検証」。見つけたら資料を改善！</li>
                <li>・<strong>配色と資料</strong>：背景と文字の十分な<strong>明度差</strong>／情報を詰め込まない／<strong>色だけで区別しない</strong>。</li>
              </ul>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-2">
              <div class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg w-fit">③ コミュニケーション</div>
              <h3 class="font-extrabold text-slate-900">同期／非同期 と メラビアンの法則</h3>
              <ul class="text-xs sm:text-sm text-slate-700 space-y-1.5 leading-relaxed">
                <li>・<strong>同期（同時）</strong>：電話・ビデオ会議。<strong>非同期（時間差）</strong>：メール・掲示板。</li>
                <li>・<strong>メラビアン（言語7%・声38%・視覚55%）</strong>：感情が食い違う限定条件の研究。話の中身も重要！</li>
              </ul>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-2">
              <div class="text-xs font-extrabold text-purple-700 bg-purple-50 px-2.5 py-1 rounded-lg w-fit">④ 利用しやすさ</div>
              <h3 class="font-extrabold text-slate-900">アクセシビリティ と ユーザビリティ3観点</h3>
              <ul class="text-xs sm:text-sm text-slate-700 space-y-1.5 leading-relaxed">
                <li>・<strong>アクセシビリティ</strong>：誰もが情報にアクセスして使えること（字幕・読み上げ・文字拡大）。</li>
                <li>・<strong>ユーザビリティ3観点</strong>：<strong>有効性</strong>（達成できたか）／<strong>効率性</strong>（手間・時間が少ないか）／<strong>満足度</strong>（また使いたいか）。</li>
              </ul>
            </div>
          </div>

          <div class="flex justify-center">
            <button onclick="navigateTo('home')" class="px-5 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-sm">
              ← 全体マップに戻る
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 12. 振り返りカルテ（つまずき分析＆自己評価メモ出力）
    // =========================================================================
    function renderReflection() {
      const stumbleKeys = Object.keys(state.stumbleTags);
      const doneCount = Object.values(state.completedStages).filter(Boolean).length;

      return `
        <div class="space-y-6 animate-fade-in">
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs">
            <span class="text-xs font-extrabold text-brand-600">形成的評価・自己分析ポートフォリオ</span>
            <h2 class="text-xl sm:text-2xl font-black text-slate-900 mt-1">📝 振り返りカルテ ＆ 弱点処方箋</h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">シミュレーション中の選択履歴から、キミが迷いやすいポイントと復習のアドバイスを自動生成しています。</p>
          </div>

          <!-- Auto-generated Stumble Prescription -->
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs space-y-4">
            <h3 class="font-extrabold text-slate-900 text-base sm:text-lg">🩺 AI先生からの「思考の処方箋」</h3>

            ${stumbleKeys.length === 0 ? `
              <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs sm:text-sm text-emerald-900">
                <div class="font-extrabold">✨ 現在、大きなつまずき履歴はありません！</div>
                <p class="mt-1">各ステージのワークに挑戦すると、迷った用語や混同しやすい概念を自動で分析してここに表示します。</p>
              </div>
            ` : `
              <div class="space-y-3">
                ${stumbleKeys.map(key => {
                  const info = STUMBLE_GUIDE[key];
                  if (!info) return '';
                  return `
                    <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 space-y-1.5">
                      <div class="flex items-center justify-between">
                        <span class="text-xs font-extrabold text-amber-900">⚠️ 注意ポイント：${info.title}</span>
                        <span class="text-[11px] font-bold bg-amber-200 text-amber-950 px-2 py-0.5 rounded-full">迷った回数：${state.stumbleTags[key]}回</span>
                      </div>
                      <p class="text-xs font-bold text-slate-800">👉 自分への問い返し：${info.questionBack}</p>
                      <p class="text-xs text-slate-700 leading-relaxed">${info.advice}</p>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <!-- Student Self-Reflection Form -->
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs space-y-4">
            <h3 class="font-extrabold text-slate-900 text-base sm:text-lg">✍️ 授業の振り返りメモ（提出・復習用）</h3>
            <p class="text-xs text-slate-600">授業の最後に「まだ少し迷う用語」や「自分の発表・日常で意識したいこと」を自分の言葉で書いてみよう。</p>

            <div class="space-y-3">
              <div>
                <label class="text-xs font-extrabold text-slate-700 block mb-1">1. まだ少し迷う用語・区別したいポイント</label>
                <input type="text" id="input-uncertain" value="${escapeHtml(state.reflectionNotes.uncertainTerms)}" oninput="state.reflectionNotes.uncertainTerms = this.value" placeholder="例：有効性と効率性の違い、非同期とチャットの扱い" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500" />
              </div>

              <div>
                <label class="text-xs font-extrabold text-slate-700 block mb-1">2. 自分の発表やSNS・日常の情報発信で活かしたい工夫（自分事化）</label>
                <textarea id="input-myrule" rows="3" oninput="state.reflectionNotes.myRule = this.value" placeholder="例：文化祭のスライドでは背景と文字の明度差を大きくし、色だけでなく記号も使って誰にでも伝わるようにしたい。" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">${escapeHtml(state.reflectionNotes.myRule)}</textarea>
              </div>
            </div>

            <div class="pt-2 flex flex-wrap items-center justify-between gap-3">
              <div class="text-xs font-bold text-slate-500">達成ステージ：${doneCount} / 6</div>
              <button onclick="copyReflectionSummary()" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm transition shadow-sm">
                📋 振り返りレポートをコピーする
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function copyReflectionSummary() {
      const doneCount = Object.values(state.completedStages).filter(Boolean).length;
      const stumbles = Object.keys(state.stumbleTags).map(k => STUMBLE_GUIDE[k]?.title).filter(Boolean).join('、') || 'なし';
      const report = [
        '【情報の表現と管理 第5回 学習振り返り】',
        `・クリアステージ数：${doneCount} / 6`,
        `・重点復習ポイント：${stumbles}`,
        `・まだ迷う用語：${state.reflectionNotes.uncertainTerms || '（未記入）'}`,
        `・自分の発信に活かしたいこと：${state.reflectionNotes.myRule || '（未記入）'}`
      ].join('\n');

      const textarea = document.createElement('textarea');
      textarea.value = report;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('振り返りレポートをクリップボードにコピーしました！提出フォーム等に貼り付けできます。', '📋');
      } catch (e) {
        showToast('コピーに失敗しました。手動で選択してコピーしてください。', '⚠️');
      }
      document.body.removeChild(textarea);
    }

    // =========================================================================
    // 13. 共通パーツ：ステージヘッダー
    // =========================================================================
    function renderStageHeader(badge, title, subtitle) {
      return `
        <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
            <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-brand-100 text-brand-800">${badge}</span>
            <button onclick="navigateTo('home')" class="text-xs font-bold text-slate-500 hover:text-slate-800">← 全体マップへ戻る</button>
          </div>
          <h2 class="text-xl sm:text-2xl font-black text-slate-900">${title}</h2>
          <p class="text-xs sm:text-sm text-slate-600 mt-1.5 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
            ${subtitle}
          </p>
        </div>
      `;
    }

    // 初期描画
    window.addEventListener('DOMContentLoaded', () => {
      updateHeaderProgress();
      render();
    });
  </script>
</body>
</html>
