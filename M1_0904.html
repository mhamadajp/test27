<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平方完成 面積パズル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        canvas {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 1rem;
            background-color: #ffffff;
            /* レスポンシブ対応：親要素の幅に合わせて縮小されるようにする */
            width: 100%;
            height: auto;
            max-width: 800px;
            aspect-ratio: 8/5;
        }
        .math-font {
            font-family: 'Georgia', serif;
            font-style: italic;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-gray-800 flex flex-col items-center">

    <div class="max-w-5xl w-full space-y-6">
        <header class="bg-white rounded-2xl shadow-sm p-6 border-t-4 border-blue-500">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 flex items-center gap-3">
                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
                平方完成 面積パズル (定数項あり)
            </h1>
            <p class="text-gray-600 mt-2">
                数式をパズルみたいに組み替えて、「正方形（平方）」を完成させてみよう！余った数字の処理にも注目です。
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 左側：説明パネル -->
            <div class="lg:col-span-5 flex flex-col justify-between bg-white rounded-2xl shadow-sm p-6">
                <div>
                    <div class="mb-6 bg-blue-50 p-5 rounded-xl border border-blue-100">
                        <label class="block text-sm font-bold text-gray-700 mb-3">パズルにする式を変えてみよう：</label>
                        <div class="text-center mb-5">
                            <span class="math-font text-2xl font-bold text-gray-800 tracking-wide">
                                x² + <span id="bValueDisplay" class="text-blue-600">6</span>x 
                                <span id="cValueDisplay" class="text-purple-600">+ 2</span>
                            </span>
                        </div>
                        
                        <!-- スライダーコントロール -->
                        <div class="space-y-5">
                            <div class="flex items-center gap-3">
                                <span class="text-gray-600 text-sm font-bold w-6 text-right">b</span>
                                <input type="range" id="bSlider" min="2" max="12" step="2" value="6" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-500">
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-gray-600 text-sm font-bold w-6 text-right">c</span>
                                <input type="range" id="cSlider" min="-20" max="20" step="1" value="2" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-500">
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mb-4">
                        <span id="stepBadge" class="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full">ステップ 1/5</span>
                    </div>
                    
                    <h2 id="stepTitle" class="text-xl font-bold mb-3 text-gray-800">最初の状態</h2>
                    <p id="stepDescription" class="text-gray-600 mb-6 min-h-[90px] leading-relaxed">
                        説明文がここに入ります。
                    </p>

                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <p class="text-sm text-gray-500 font-bold mb-2">現在の式:</p>
                        <p id="mathExpression" class="text-2xl text-center math-font font-bold text-gray-800 tracking-wider">
                            式がここに入ります
                        </p>
                    </div>
                </div>

                <div class="flex gap-4 mt-6">
                    <button id="btnPrev" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        ◀ 戻る
                    </button>
                    <button id="btnNext" class="flex-1 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        次へ ▶
                    </button>
                </div>
            </div>

            <!-- 右側：Canvas -->
            <div class="lg:col-span-7 bg-white rounded-2xl shadow-sm p-6 flex items-center justify-center">
                <!-- 論理サイズを大きくして、はみ出しを防ぐ -->
                <canvas id="simCanvas" width="800" height="500"></canvas>
            </div>
            
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let currentStep = 0;
        let bValue = 6;
        let cValue = 2;

        // 数式用に + と - を綺麗にフォーマットする関数
        function formatTerm(val, isFirst = false) {
            if (val === 0) return '';
            if (isFirst) return val.toString();
            return val > 0 ? `+ ${val}` : `- ${Math.abs(val)}`;
        }

        function getStepsData(b, c) {
            const half = b / 2;
            const sq = half * half;
            const finalC = c - sq;
            
            const cStr = formatTerm(c);
            const cHtml = c !== 0 ? `<span class='math-font font-bold text-purple-600'>${cStr}</span>` : '';
            
            return [
                {
                    title: "最初の状態",
                    desc: `まずは <span class='math-font font-bold text-blue-600'>x²</span> と <span class='math-font font-bold text-green-600'>${b}x</span> のブロックがあります。${c !== 0 ? `端っこには定数項（最初からある数字）の ${cHtml} が置いてあります。` : ''}`,
                    expr: `x² + ${b}x ${cStr}`
                },
                {
                    title: "長方形を半分に割る！",
                    desc: `正方形の縦と横にくっつけるために、<span class='math-font font-bold text-green-600'>${b}x</span> の長方形を「半分(<span class='math-font font-bold text-green-600'>${half}x</span>)」に割ります。`,
                    expr: `x² + ${half}x + ${half}x ${cStr}`
                },
                {
                    title: "下に移動させる",
                    desc: `割った半分を下に移動させて、大きな正方形の枠組みを作ります。右下に「欠け」ができてしまいました。`,
                    expr: `x² + ${half}x + ${half}x ${cStr}`
                },
                {
                    title: "足りないピースを足して、引く",
                    desc: `角の足りないピース(<span class='math-font font-bold text-red-500'>${half}² = ${sq}</span>)を無理やり足して「正方形」を完成！<br>勝手に足したので、外で <span class='math-font font-bold text-orange-500'>${sq}</span> を引いて帳尻を合わせます。`,
                    expr: `(x + ${half})² - ${sq} ${cStr}`
                },
                {
                    title: "外の数字をまとめる",
                    desc: `最後に、外に置いてある「引いた数字」と「最初からあった数字」を合体（計算）させます。<br><span class='math-font font-bold'>-${sq} ${cStr} = ${finalC}</span> となります！`,
                    expr: `(x + ${half})² ${formatTerm(finalC)}`
                }
            ];
        }

        // 角丸四角形を描画する関数
        function drawRoundedRect(x, y, width, height, radius, fillColor, strokeColor, text, textColor = '#333') {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            
            ctx.fillStyle = fillColor;
            ctx.fill();
            if (strokeColor) {
                ctx.lineWidth = 2;
                ctx.strokeStyle = strokeColor;
                ctx.stroke();
            }

            if (text) {
                // ボックスのサイズに応じてフォントサイズを動的に調整
                let fontSize = 24;
                const minDim = Math.min(width, height);
                if (minDim < 45) fontSize = 16;
                else if (minDim < 60) fontSize = 20;
                
                // テキストが長い場合はさらに縮小
                if (text.length > 3 && fontSize > 16) fontSize -= 4;

                ctx.fillStyle = textColor;
                ctx.font = `bold ${fontSize}px Georgia, serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x + width / 2, y + height / 2);
            }
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const half = bValue / 2;
            const sq = half * half;
            
            // 描画位置の基準設定 (Canvasが広くなったので左に寄せる)
            const xSize = 160;
            const startX = 60; 
            const startY = 80;
            const gap = 4;
            const xHalfSize = half * 26; // bの大きさに比例

            // 定数項 (c) の位置 (右上に固定)
            const cX = 660;
            const cY = 80;
            const cSize = 80;

            // 1. x² のブロック
            drawRoundedRect(startX, startY, xSize, xSize, 8, '#dbeafe', '#3b82f6', 'x²');

            // 2. bx または 分割された bx/2 ブロック
            if (currentStep === 0) {
                drawRoundedRect(startX + xSize + gap, startY, xHalfSize * 2, xSize, 8, '#dcfce7', '#22c55e', `${bValue}x`);
            } 
            else if (currentStep === 1) {
                drawRoundedRect(startX + xSize + gap, startY, xHalfSize, xSize, 8, '#dcfce7', '#22c55e', `${half}x`);
                drawRoundedRect(startX + xSize + gap + xHalfSize + gap, startY, xHalfSize, xSize, 8, '#dcfce7', '#22c55e', `${half}x`);
            }
            else if (currentStep >= 2) {
                drawRoundedRect(startX + xSize + gap, startY, xHalfSize, xSize, 8, '#dcfce7', '#22c55e', `${half}x`);
                drawRoundedRect(startX, startY + xSize + gap, xSize, xHalfSize, 8, '#dcfce7', '#22c55e', `${half}x`);
            }

            // 3. 定数項 c の描画 (ステップ0〜3まで)
            if (currentStep < 4 && cValue !== 0) {
                const cSign = cValue > 0 ? '+' : '';
                drawRoundedRect(cX, cY, cSize, cSize, 8, '#f3e8ff', '#a855f7', `${cSign}${cValue}`, '#7e22ce');
                
                // 定数項ラベル
                ctx.fillStyle = '#9ca3af';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText('最初からある', cX + cSize / 2, cY - 20);
                ctx.fillText('数字', cX + cSize / 2, cY - 5);
            }

            // 外で引くピースのX座標
            const outX = startX + xSize + gap + xHalfSize + 60;
            const outY = startY + xSize + gap;

            if (currentStep >= 3) {
                // 正方形を完成させる枠線
                ctx.beginPath();
                ctx.setLineDash([8, 8]);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ef4444'; 
                const frameSize = xSize + gap + xHalfSize;
                ctx.rect(startX - 6, startY - 6, frameSize + 12, frameSize + 12);
                ctx.stroke();
                ctx.setLineDash([]); 

                // (x + half)² のラベル
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 28px Georgia, serif';
                ctx.textAlign = 'center';
                ctx.fillText(`(x + ${half})²`, startX + frameSize / 2, startY - 25);
            }

            // ステップ3: 足りないピースと引くピースの出現
            if (currentStep === 3) {
                // 内側に足すピース
                drawRoundedRect(startX + xSize + gap, startY + xSize + gap, xHalfSize, xHalfSize, 8, '#fee2e2', '#ef4444', `+${sq}`, '#dc2626');
                // 外側で引くピース
                drawRoundedRect(outX, outY, Math.min(xHalfSize, 120), Math.min(xHalfSize, 120), 8, '#ffedd5', '#f97316', `-${sq}`, '#ea580c');
            }

            // ステップ4: 外の数字をまとめる
            if (currentStep === 4) {
                // 内側に足すピース(そのまま残す)
                drawRoundedRect(startX + xSize + gap, startY + xSize + gap, xHalfSize, xHalfSize, 8, '#fee2e2', '#ef4444', `+${sq}`, '#dc2626');

                const finalC = cValue - sq;
                const finalX = outX + 20; 
                const finalY = startY + xSize / 2 - 20;
                
                // 大きな合体ブロックを描画
                drawRoundedRect(finalX, finalY, 150, 90, 12, '#f1f5f9', '#64748b', `${finalC > 0 ? '+' : ''}${finalC}`, '#334155');
                
                // 計算過程のラベル
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 20px Georgia, serif';
                const cSignStr = cValue >= 0 ? `+ ${cValue}` : `- ${Math.abs(cValue)}`;
                ctx.fillText(`-${sq} ${cSignStr} = ${finalC}`, finalX + 75, finalY - 20);
                
                // ラベル
                ctx.fillStyle = '#9ca3af';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText('数字を合体！', finalX + 75, finalY + 110);
            }
        }

        function updateUI() {
            const stepsData = getStepsData(bValue, cValue);
            const data = stepsData[currentStep];
            
            document.getElementById('stepBadge').innerText = `ステップ ${currentStep + 1} / 5`;
            document.getElementById('stepTitle').innerHTML = data.title;
            document.getElementById('stepDescription').innerHTML = data.desc;
            document.getElementById('mathExpression').innerHTML = data.expr;

            document.getElementById('btnPrev').disabled = (currentStep === 0);
            document.getElementById('btnNext').disabled = (currentStep === 4);

            drawCanvas();
        }

        function onSliderChange() {
            bValue = parseInt(document.getElementById('bSlider').value);
            cValue = parseInt(document.getElementById('cSlider').value);
            
            document.getElementById('bValueDisplay').innerText = bValue;
            document.getElementById('cValueDisplay').innerText = formatTerm(cValue, false);
            
            currentStep = 0; // 式を変えたら最初に戻す
            updateUI();
        }

        document.getElementById('bSlider').addEventListener('input', onSliderChange);
        document.getElementById('cSlider').addEventListener('input', onSliderChange);

        document.getElementById('btnNext').addEventListener('click', () => {
            if (currentStep < 4) {
                currentStep++;
                updateUI();
            }
        });

        document.getElementById('btnPrev').addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        window.onload = () => {
            updateUI();
        };

    </script>
</body>
</html>
