<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重心の本質探究ラボ｜家具設計ミッションから入試問題へ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', 'sans-serif'],
            mono: ['JetBrains Mono', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    /* 数式組版スタイル */
    .math-var {
      font-family: 'Times New Roman', serif;
      font-style: italic;
      font-weight: 700;
      padding: 0 1px;
    }
    .math-frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 0.2em;
      font-family: 'Times New Roman', serif;
      line-height: 1.05;
      font-size: 0.95em;
    }
    .math-frac > .num {
      border-bottom: 1.5px solid currentColor;
      padding: 0 0.25em 0.08em;
    }
    .math-frac > .den {
      padding: 0.08em 0.25em 0;
    }
    input[type="range"] {
      accent-color: #0d9488;
    }
    /* アニメーション定義 */
    @keyframes drawLine {
      from { stroke-dashoffset: 500; }
      to { stroke-dashoffset: 0; }
    }
    .animate-draw {
      stroke-dasharray: 500;
      stroke-dashoffset: 0;
      animation: drawLine 0.8s ease-out forwards;
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      80% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: popIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(245, 158, 11, 0.4)); }
      50% { filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.9)); }
    }
    .glow-active {
      animation: pulseGlow 1.8s infinite;
    }
    .seesaw-beam {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 220px 140px;
    }
    .table-tilt {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- トップヘッダー -->
  <header class="bg-white/95 dark:bg-slate-900/95 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 backdrop-blur px-4 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-teal-600 to-emerald-600 flex items-center justify-center text-white font-serif font-extrabold text-xl shadow-md">
          G
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2 flex-wrap">
            重心の本質探究ラボ
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-teal-100 dark:bg-teal-950 text-teal-800 dark:text-teal-300 border border-teal-300 dark:border-teal-700">高校数学A｜50分授業</span>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-700">🪑 家具設計ミッション</span>
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">「真ん中」を問い直し、面積・シーソー・中線・2:1の証明から入試レベルの面積比へ</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- 生徒用ポイント・解説ノート表示切替 -->
        <button type="button" id="studyGuideToggleBtn" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition bg-amber-50 dark:bg-amber-950/60 border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-300 hover:bg-amber-100">
          📖 ポイント・解説ノート: OFF
        </button>

        <!-- 背景テーマ切替 -->
        <div class="flex items-center bg-slate-200/80 dark:bg-slate-800 p-0.5 rounded-xl border border-slate-300 dark:border-slate-700 text-[11px] font-bold">
          <button type="button" id="themeLightBtn" data-theme="light" class="px-2 py-1 rounded-lg transition">☀️ ライト</button>
          <button type="button" id="themeDarkBtn" data-theme="dark" class="px-2 py-1 rounded-lg transition">🌙 ダーク</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 50分授業タイムライン・ナビゲーション（8単元） -->
  <nav class="bg-slate-100 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 px-4 py-2.5">
    <div class="max-w-6xl mx-auto flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar">
      <button type="button" data-step="1" id="tab-1" class="step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left">
        <div class="text-[10px] opacity-80">0〜4分</div>
        <div>01 真ん中と面積</div>
      </button>
      <button type="button" data-step="2" id="tab-2" class="step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left">
        <div class="text-[10px] opacity-80">4〜13分</div>
        <div>02 シーソーと分布</div>
      </button>
      <button type="button" data-step="3" id="tab-3" class="step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left">
        <div class="text-[10px] opacity-80">13〜17分</div>
        <div>03 中線と重心発見</div>
      </button>
      <button type="button" data-step="4" id="tab-4" class="step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left">
        <div class="text-[10px] opacity-80">17〜23分</div>
        <div>04 なぜ 2：1 か</div>
      </button>
      <button type="button" data-step="5" id="tab-5" class="step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left">
        <div class="text-[10px] opacity-80">23〜28分</div>
        <div>05 比の基礎演習</div>
      </button>
      <button type="button" data-step="6" id="tab-6" class="step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left">
        <div class="text-[10px] opacity-80">28〜39分</div>
        <div>06 提示問題に挑戦</div>
      </button>
      <button type="button" data-step="7" id="tab-7" class="step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left">
        <div class="text-[10px] opacity-80">39〜46分</div>
        <div>07 発展演習 A〜D</div>
      </button>
      <button type="button" data-step="8" id="tab-8" class="step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left">
        <div class="text-[10px] opacity-80">46〜50分</div>
        <div>08 出口課題・評価</div>
      </button>
    </div>
  </nav>

  <!-- 生徒用ポイント・解説ノート（トグル表示） -->
  <div id="studyGuideBanner" class="hidden bg-amber-50 dark:bg-amber-950/70 border-b border-amber-200 dark:border-amber-800 px-4 py-3">
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
      <div class="bg-white/95 dark:bg-slate-900/95 p-3.5 rounded-xl border border-amber-200 dark:border-amber-800 shadow-sm">
        <div class="font-extrabold text-teal-700 dark:text-teal-300 mb-1.5 flex items-center gap-1.5">
          <span>🎯 この単元で押さえるべき核心ポイント</span>
        </div>
        <div id="studyKeyPointText" class="text-slate-700 dark:text-slate-200 leading-relaxed space-y-1"></div>
      </div>
      <div class="bg-white/95 dark:bg-slate-900/95 p-3.5 rounded-xl border border-amber-200 dark:border-amber-800 shadow-sm">
        <div class="font-extrabold text-rose-700 dark:text-rose-300 mb-1.5 flex items-center gap-1.5">
          <span>⚠️ よくあるミス＆問題攻略のコツ</span>
        </div>
        <div id="studyPitfallText" class="text-slate-700 dark:text-slate-200 leading-relaxed space-y-1"></div>
      </div>
    </div>
  </div>

  <!-- メインコンテンツ領域 -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4">
    <div id="stepContentContainer"></div>

    <!-- 下部ナビゲーション -->
    <div class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
      <button type="button" id="prevStepBtn" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition disabled:opacity-40">
        &larr; 前の単元へ
      </button>
      <div class="text-xs font-bold text-slate-500 dark:text-slate-400 text-center flex-1">
        🎯 このステップのゴール：<span id="goalIndicatorText" class="text-teal-700 dark:text-teal-400"></span>
      </div>
      <button type="button" id="nextStepBtn" class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-teal-600 hover:bg-teal-500 text-white shadow-md transition disabled:opacity-40">
        次の単元へ &rarr;
      </button>
    </div>
  </main>

  <script>
    /* =========================================================================
       グローバル状態管理
       ========================================================================= */
    let currentStep = 1;
    let showStudyGuide = false;

    // Step 1: 天板バランス & ピザ面積
    let s1Shape = 'trapezoid'; // 'circle', 'rect', 'trapezoid'
    let s1LegPos = 'none'; // 'none', 'diag', 'centroid', 'left'
    let s1PizzaSlices = 3; // 1〜6切れ
    let s1Quiz1 = null;
    let s1Quiz2 = null;

    // Step 2: シーソー & 25枚タイル分布
    let s2Mode = 'adult'; // 'adult' (60kg vs 30kg) or 'practice' (60kg vs 40kg)
    let s2DistLeft = 2.0; // 左の人の距離(m)
    let s2DistRight = 2.0; // 右の人の距離(m)
    let s2TileSplitShown = false; // 中央線で上下の重さを可視化

    // Step 3: 細い帯から中線・重心を発見する7段階探究ストーリー
    let s3StoryStage = 1; // 1:長方形, 2:台形, 3:連続変形, 4:不等辺三角形の帯, 5:なぜ中線上か, 6:中線上のどこ?, 7:見方を変えて交点G
    let s3ShowMidLine1 = false; // Stage 1, 2 用：中央を結ぶ線を表示
    let s3MorphT = 0; // Stage 3 用：0(長方形) 〜 50(台形) 〜 100(不等辺三角形)
    let s3AnimFrame = null;
    let s3TriDotCount = 0; // Stage 4 用：0〜5個の帯の中点●を打つ
    let s3TriLineDrawn = false; // Stage 4 用：定規で中線ADを引く
    let s3WhyQuiz = null; // Stage 5 用：「なぜ中線上か」誤解解消クイズ ('area' or 'strips')
    let s3Candidate = null; // Stage 6 用：候補1(30cm), 2(45cm), 3(60cm)
    let s3Predict90 = null; // 90cm予想 (30, 45, 60, 75) -> Step 4 の答え合わせと連動
    let s3ViewMode = 'bc'; // Stage 7 用：'bc'(1回目), 'ca'(2回目・CA平行帯), 'both'(交点G), 'all'(3本目CF)
    let s3RightTab = 'guide'; // 右パネル切替：'guide'(探究課題), 'drill'(確認演習), 'compare'(3つの線の区別)
    let s3CompareLine = 'median'; // 'median', 'perp', 'bisector'
    let s3DrillRevealed = {}; // 確認演習の解答トグル状態

    // Step 4: 2:1の証明アニメーション
    let s4ProofPhase = 1; // 1:中点連結DE, 2:対頂角・錯角(相似), 3:回転・2倍拡大重ね合わせ, 4:3種類の比と90cm検証
    let s4MorphProgress = 0; // 0〜100% 相似三角形モーフィング用
    let s4AnimFrame = null;

    // Step 5: 比の基礎演習（4問）+ 相似への橋渡し
    const S5_PROBLEMS = [
      { id: 1, cond: 'GD = 5', ask1: 'AG', ans1: 10, ask2: 'AD', ans2: 15, hint: 'GDは「1個分」なので5。AGは2個分、ADは3個分です！' },
      { id: 2, cond: 'AD = 21', ask1: 'AG', ans1: 14, ask2: 'GD', ans2: 7, hint: 'ADは全体の「3個分」で21。まず1個分（21÷3=7）を求めよう！' },
      { id: 3, cond: 'AG = 14', ask1: 'GD', ans1: 7, ask2: 'AD', ans2: 21, hint: 'AGは「2個分」で14。1個分はその半分の7です！' },
      { id: 4, cond: '【追加】AG = 9', ask1: 'GD', ans1: 4.5, ask2: 'AD', ans2: 13.5, hint: '2個分が9なので、1個分は 9÷2 = 4.5。全体3個分は 4.5×3 = 13.5！' }
    ];
    let s5Inputs = { 1: { v1: '', v2: '' }, 2: { v1: '', v2: '' }, 3: { v1: '', v2: '' }, 4: { v1: '', v2: '' } };
    let s5Checked = { 1: false, 2: false, 3: false, 4: false };
    let s5BridgeQuiz = null; // '2:1' or '2:3'

    // Step 6: 提示問題（BD=6, AG=8）ステップ解説
    let s6Phase = 1; // 1:条件整理＆GD, 2:相似発見＆GQ, 3:面積比4:9グリッド
    let s6AreaGuess = null; // '2:3', '4:9', '4:6'
    let s6ShowGrid = false;

    // Step 7: 発展演習 A〜D
    let s7SubTab = 'A'; // 'A', 'B', 'C', 'D'
    let s7AGuess = null; // 'same' or 'diff'
    let s7AShowMoment = false;
    let s7BInput = '';
    let s7BChecked = false;
    let s7CStage = 1; // 1〜3
    let s7DMode = 'three'; // 'three' (3等分) or 'six' (6等分)
    let s7DInput1 = '';
    let s7DInput2 = '';
    let s7DChecked = false;

    // Step 8: 出口課題（AD=18, BC=15, △ABC=81）
    let s8Ans = { q1: '', q2: '', q3: '', q4: '', q5: '', reason: '' };
    let s8Submitted = false;
    let s8SelfChecks = { draw: false, sim: false, area: false };

    /* =========================================================================
       自習用ポイント・解説データ（核心ポイント・よくあるミス対策・ゴール）
       ========================================================================= */
    const STEP_META = {
      1: {
        goal: '「均質・同じ厚さ」なら面積の比＝重さ（質量）の比になることを理解する',
        keyPoint: '・円や長方形は対称な形なので「見た目ど真ん中（対角線の交点）」でつり合います。<br>・しかし<strong>台形のように形が偏っている図形</strong>では、面積（重さ）が多く集まる側へ支点をずらさないと倒れてしまいます。<br>・同じ材料・同じ厚さの板なら、<strong>「面積が2倍・3倍 ⇒ 重さも2倍・3倍」</strong>として考えるのが重心の出発点です。',
        pitfall: '❌ <strong>「どんな四角形でも対角線の交点が重心」と思い込むミス</strong>に注意！左の実験で台形の「対角線の交点」を押して傾く様子を確かめよう。<br>💡 また、<strong>厚さや材料が違う板</strong>では「面積比＝重さの比」は使えないこともセットで覚えておこう。'
      },
      2: {
        goal: 'つり合いは「重さ」だけでなく「支点からの距離」の両方で決まると説明できる',
        keyPoint: '・シーソーがつり合う条件は <strong>「左の重さ × 距離 ＝ 右の重さ × 距離」</strong>（モーメントのつり合い）です。<br>・つまり、<strong>重い方は支点に近く、軽い方は支点から遠く</strong>にあるとバランスが取れます。<br>・三角形は底辺側に面積（重さ）が集中しているため、支点（重心）は高さの半分より<strong>底辺寄り</strong>になります。',
        pitfall: '❌ <strong>「面積を半分に分ける線の上なら必ずつり合う」と勘違いしやすい！</strong><br>💡 25枚の階段ブロック実験で「中央線より上と下を比べる」を押し、上半分(6.5kg)と下半分(18.5kg)の重さの偏りを自分の目で確認してみよう。'
      },
      3: {
        goal: '細い帯のつり合いから「中線」と「重心（中線の交点）」を自分で発見する',
        keyPoint: '・<strong>発見の流れ</strong>：長方形 → 台形 → 三角形と形が変わっても、「細い帯に分ければ各帯は中央でつり合う」という原理は変わりません。<br>・すべての帯の中央●を結ぶと、頂点と対辺の中点を結ぶ直線（<strong>中線</strong>）になります。<br>・底辺を BC から CA に見方を変えて同じことをすると2本目の中線 BE が現れ、<strong>AD と BE の交点 G が全体の重心</strong>になります。',
        pitfall: '❌ <strong>よくある誤解①</strong>：「中線が面積を半分にするから重心がある」は不十分！面積が半分でもつり合うとは限りません。<strong>「すべての細い帯の重心が中線AD上に並んでいるから」</strong>が正しい理由です。<br>❌ <strong>よくある誤解②</strong>：中線は必ず垂直（垂直二等分線）でも、角を二等分する線でもありません。右の「3つの線の比較」で確認しよう！'
      },
      4: {
        goal: '中点連結定理と相似（△GAB ∽ △GDE）から、AG：GD＝2：1 になる理由を説明できる',
        keyPoint: '・証明の2ステップ：①中点連結定理より <strong>AB // DE</strong> かつ <strong>AB：DE ＝ 2：1</strong>。②平行線の錯角と対頂角が等しいので <strong>△GAB ∽ △GDE</strong>（砂時計型の相似）。<br>・よって対応する辺の比から <strong>AG：GD ＝ 2：1</strong> が導かれます。<br>・入試で使い分ける3つの比：<strong>AG：GD＝2：1（部分：部分）</strong>、<strong>AG：AD＝2：3（部分：全体）</strong>、<strong>GD：AD＝1：3</strong>。',
        pitfall: '❌ <strong>「頂点側が2、辺の中点側が1」の向きを逆にしてしまうミス</strong>が多い！<br>💡 「頂点Aは尖っていて軽いから遠い（2）、底辺D側は広くて重いから近い（1）」とシーソーの原理で覚えれば一生忘れません！Step 3の回転・拡大アニメも必ず再生しよう。'
      },
      5: {
        goal: '中線を「3個分」に分けて考え、どんな数値でも AG・GD・AD を素早く正確に求める',
        keyPoint: '・長さ計算の最強ワザは<strong>「まず1個分（GD）を求めること」</strong>です。<br>・中線AD全体＝<strong>3個分</strong>、頂点側AG＝<strong>2個分</strong>、中点側GD＝<strong>1個分</strong>。<br>・例：AD＝21なら「3個分で21 ⇒ 1個分は 21÷3＝7 ⇒ AGは2個分で14、GDは7」と暗算レベルで解けます！',
        pitfall: '❌ <strong>「AG：AD」を「2：1」と間違えるミス</strong>が相似問題で一番多い落とし穴です！<br>💡 小さい三角形の中線は AG（2個分）、大きい三角形全体の中線は <strong>AD（3個分）</strong>。下にある「橋渡しチェック」で 2：3 になる感覚を確実に掴んでから次へ進もう。'
      },
      6: {
        goal: '平行線から相似な三角形ペアを見つけ、相似比 2：3 と面積比 4：9 を根拠付きで求める',
        keyPoint: '・<strong>手順①</strong>：問題文に書かれていない長さ（DC＝6 や <strong>AD＝8＋4＝12</strong> など）も先にすべて図に書き込む。<br>・<strong>手順②</strong>：PQ // BC より <strong>△AGQ ∽ △ADC</strong>（相似比 AG：AD＝2：3）を使って GQ を求める。<br>・<strong>手順③</strong>：△APQ と △ABC は底辺も高さもそれぞれ 2/3 倍なので、面積比は <strong>2²：3² ＝ 4：9</strong> になります。',

    /* =========================================================================
       テーマ・ガイド・ステップ移動制御
       ========================================================================= */
    function setTheme(mode) {
      const root = document.documentElement;
      if (mode === 'dark') root.classList.add('dark');
      else root.classList.remove('dark');

      const activeCls = 'px-2 py-1 rounded-lg transition bg-white dark:bg-slate-900 text-teal-600 dark:text-teal-400 shadow-sm';
      const inactiveCls = 'px-2 py-1 rounded-lg transition text-slate-600 dark:text-slate-400 hover:text-slate-900';
      document.getElementById('themeLightBtn').className = mode === 'light' ? activeCls : inactiveCls;
      document.getElementById('themeDarkBtn').className = mode === 'dark' ? activeCls : inactiveCls;
      renderCurrentStep();
    }

    function toggleStudyGuide() {
      showStudyGuide = !showStudyGuide;
      const banner = document.getElementById('studyGuideBanner');
      const btn = document.getElementById('studyGuideToggleBtn');
      if (showStudyGuide) {
        banner.classList.remove('hidden');
        btn.textContent = '📖 ポイント・解説ノート: ON';
        btn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold border transition bg-amber-500 border-amber-500 text-white shadow-sm';
      } else {
        banner.classList.add('hidden');
        btn.textContent = '📖 ポイント・解説ノート: OFF';
        btn.className = 'px-3 py-1.5 rounded-xl text-xs font-bold border transition bg-amber-50 dark:bg-amber-950/60 border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-300 hover:bg-amber-100';
      }
    }

    function goStep(stepNum) {
      if (stepNum < 1 || stepNum > 8) return;
      if (s3AnimFrame) {
        cancelAnimationFrame(s3AnimFrame);
        s3AnimFrame = null;
      }
      if (s4AnimFrame) {
        cancelAnimationFrame(s4AnimFrame);
        s4AnimFrame = null;
      }
      currentStep = stepNum;

      for (let i = 1; i <= 8; i++) {
        const tab = document.getElementById(`tab-${i}`);
        if (i === currentStep) {
          tab.className = 'step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left bg-teal-600 text-white shadow-md';
        } else {
          tab.className = 'step-tab shrink-0 px-3 py-2 rounded-xl text-xs font-bold transition text-left bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700';
        }
      }

      document.getElementById('prevStepBtn').disabled = currentStep === 1;
      document.getElementById('nextStepBtn').disabled = currentStep === 8;
      document.getElementById('goalIndicatorText').textContent = STEP_META[currentStep].goal;
      document.getElementById('studyKeyPointText').innerHTML = STEP_META[currentStep].keyPoint;
      document.getElementById('studyPitfallText').innerHTML = STEP_META[currentStep].pitfall;

      renderCurrentStep();
    }

    function renderCurrentStep() {
      const container = document.getElementById('stepContentContainer');
      switch (currentStep) {
        case 1: container.innerHTML = renderStep1(); break;
        case 2: container.innerHTML = renderStep2(); break;
        case 3: container.innerHTML = renderStep3(); break;
        case 4: container.innerHTML = renderStep4(); break;
        case 5: container.innerHTML = renderStep5(); break;
        case 6: container.innerHTML = renderStep6(); break;
        case 7: container.innerHTML = renderStep7(); break;
        case 8: container.innerHTML = renderStep8(); break;
      }
    }

       ========================================================================= */

                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       STEP 2: 02 重さと位置の両方を見る（4〜13分）
       ========================================================================= */
    function renderStep2() {
      const leftMass = 60;
      const rightMass = s2Mode === 'adult' ? 30 : 40;
      const momentLeft = Math.round(leftMass * s2DistLeft * 10) / 10;
      const momentRight = Math.round(rightMass * s2DistRight * 10) / 10;
      const diff = momentRight - momentLeft; // 正なら右が下がる
      const isBalanced = Math.abs(diff) < 0.01;
      const tiltAngle = isBalanced ? 0 : Math.max(-16, Math.min(16, diff * 0.25));

      // シーソー上の座標（支点 x=220, y=140, 1m = 65px）
      const leftX = 220 - s2DistLeft * 65;
      const rightX = 220 + s2DistRight * 65;

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <!-- 左：4〜8分 シーソー実験 -->
          <div class="lg:col-span-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">
            <div class="border-b border-slate-100 dark:border-slate-800 pb-3 flex items-center justify-between flex-wrap gap-2">
              <div>
                <span class="text-xs font-extrabold text-teal-600 dark:text-teal-400">02（4〜8分）｜シーソーの予想と検証</span>
                <h2 class="text-base font-extrabold text-slate-900 dark:text-white">重い方と軽い方、どうすればつり合う？</h2>

                <button type="button" data-s2-mode="practice" class="px-2.5 py-1 rounded-lg text-xs font-bold border transition ${s2Mode === 'practice' ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-50 dark:bg-slate-800 border-slate-300 dark:border-slate-700'}">追加演習: 60kg vs 40kg</button>
              </div>
            </div>

            <!-- シーソーSVGアニメーション -->
            <div class="bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800 p-2">
              <svg viewBox="0 0 440 205" class="w-full h-auto max-h-[210px] select-none">
                <!-- 地面 -->
                <line x1="30" y1="185" x2="410" y2="185" stroke="#94a3b8" stroke-width="2" />
                <!-- 支点 -->
                <polygon points="220,140 200,185 240,185" fill="#0f766e" />
                <text x="220" y="199" text-anchor="middle" font-size="11" font-weight="800" class="fill-slate-600 dark:fill-slate-400">支点</text>

                <!-- 動くシーソーの板と乗っている人 -->
                <g class="seesaw-beam" style="transform: rotate(${tiltAngle}deg);">
                  <line x1="40" y1="140" x2="400" y2="140" stroke="${isBalanced ? '#10b981' : '#334155'}" stroke-width="8" stroke-linecap="round" />
                  <!-- 目盛り -->
                  ${[-2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2].map(m => `
                    <line x1="${220 + m * 65}" y1="135" x2="${220 + m * 65}" y2="145" stroke="#94a3b8" stroke-width="1.5" />
                  `).join('')}

                  <!-- 左のおもり（60kg） -->
                  <circle cx="${leftX}" cy="112" r="24" fill="#fb923c" stroke="#c2410c" stroke-width="2.5" />
                  <text x="${leftX}" y="116" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">${leftMass}kg</text>
                  <text x="${(leftX + 220) / 2}" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">${s2DistLeft.toFixed(1)} m</text>

                  <!-- 右のおもり（30kg or 40kg） -->
                  <circle cx="${rightX}" cy="116" r="${s2Mode === 'adult' ? 18 : 20}" fill="#2dd4bf" stroke="#0f766e" stroke-width="2.5" />
                  <text x="${rightX}" y="120" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">${rightMass}kg</text>

                  <rect x="135" y="12" width="170" height="28" rx="14" fill="#10b981" class="animate-pop" />

            </div>

            <!-- 距離操作スライダー -->
            <div class="grid grid-cols-2 gap-3 text-xs bg-slate-50 dark:bg-slate-800/60 p-3 rounded-xl border border-slate-200 dark:border-slate-700">

                <div class="mt-1 font-mono text-[11px]">左のモーメント: <strong>${leftMass} × ${s2DistLeft.toFixed(1)} = ${momentLeft}</strong></div>
              </div>
              <div>
                <label class="font-bold text-teal-700 dark:text-teal-400 block mb-1">右 (${rightMass}kg) の距離: ${s2DistRight.toFixed(1)} m</label>

                <div class="mt-1 font-mono text-[11px]">右のモーメント: <strong>${rightMass} × ${s2DistRight.toFixed(1)} = ${momentRight}</strong></div>
              </div>
            </div>

            <div class="p-3 rounded-xl text-xs font-bold border ${isBalanced ? 'bg-emerald-50 dark:bg-emerald-950/60 border-emerald-400 text-emerald-900 dark:text-emerald-200' : 'bg-amber-50 dark:bg-amber-950/60 border-amber-300 text-amber-900 dark:text-amber-200'}">
              ${isBalanced
                ? `⭕ <strong>つり合いの法則成立！</strong> ${leftMass}×${s2DistLeft.toFixed(1)} ＝ ${rightMass}×${s2DistRight.toFixed(1)}（＝${momentLeft}）。<br><strong>「重い方は支点に近く、軽い方は支点から遠く」</strong>でつり合います！`
                : `💡 ヒント：${s2Mode === 'adult' ? '子ども(30kg)を 2.0m に固定すると、大人(60kg)は何mでつり合うかな？' : '40kgを 1.5m にしたとき、60kgは何mでつり合うかな？（40×1.5=60）'}`}
            </div>
          </div>

          <!-- 右：8〜13分 同じ25枚なのに支点が違う？ -->
          <div class="lg:col-span-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm space-y-4">

              </div>
              <button type="button" data-action="s2-toggle-split" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${s2TileSplitShown ? 'bg-orange-500 border-orange-500 text-white' : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600'}">

            <!-- 25枚の正方形ブロック比較SVG -->
            <div class="bg-slate-50 dark:bg-slate-950 rounded-xl border border-slate-200 dark:border-slate-800 p-3">

                <!-- 左：5×5の長方形（25枚） -->
                <g transform="translate(30, 22)">
                  ${Array.from({ length: 5 }).map((_, row) =>

                      <rect x="${col * 24}" y="${row * 24}" width="21" height="21" rx="2" fill="#99f6e4" stroke="#0f766e" stroke-width="1.5" />
                    `).join('')
                  ).join('')}

                  <text x="60" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f766e">各段 5・5・5・5・5 枚</text>
                  ${s2TileSplitShown ? `
                    <line x1="-10" y1="60" x2="130" y2="60" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 3" />
                    <circle cx="60" cy="60" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5" />
                    <text x="60" y="-6" text-anchor="middle" font-size="10.5" font-weight="800" fill="#0f766e">上 12.5kg ＝ 下 12.5kg</text>
                  ` : ''}
                </g>

                <!-- 右：階段状（上から 1, 3, 5, 7, 9 = 25枚） -->
                <g transform="translate(215, 22)">
                  ${[1, 3, 5, 7, 9].map((count, row) => {
                    const startX = (9 - count) * 11;
                    return Array.from({ length: count }).map((_, col) => `
                      <rect x="${startX + col * 22}" y="${row * 24}" width="19" height="21" rx="2" fill="${row >= 3 ? '#fb923c' : '#fed7aa'}" stroke="#c2410c" stroke-width="1.5" />
                    `).join('') + `<text x="206" y="${row * 24 + 15}" font-size="10" font-weight="800" fill="#c2410c">${count}枚</text>`;
                  }).join('')}
                  <text x="98" y="142" text-anchor="middle" font-size="11.5" font-weight="800" class="fill-slate-800 dark:fill-slate-200">三角形に近い階段：25枚</text>
                  <text x="98" y="158" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">底辺側に重さが集中！</text>
                  ${s2TileSplitShown ? `
                    <line x1="-5" y1="60" x2="200" y2="60" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 3" />
                    <circle cx="98" cy="82" r="5.5" fill="#10b981" stroke="#fff" stroke-width="1.5" class="animate-pop" />
                    <text x="98" y="-6" text-anchor="middle" font-size="10.5" font-weight="800" fill="#c2410c">上半分 6.5kg ≪ 下半分 18.5kg！</text>
                    <text x="98" y="98" text-anchor="middle" font-size="9.5" font-weight="800" fill="#047857">支点は底辺側へ移動！</text>
                  ` : ''}
                </g>
              </svg>
            </div>

            <div class="space-y-2 text-xs leading-relaxed">
              <div class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200 dark:border-indigo-800 text-slate-800 dark:text-slate-200">
                <div class="font-extrabold text-indigo-700 dark:text-indigo-300 mb-1">💡 ここから分かる「三角形の重心」の大ヒント！</div>
                左も右も同じ 25kg ですが、三角形に近い右の形は<strong>底辺側に重さが集中</strong>しています。<br>
                シーソーの原理（重い方が支点に近い）を思い出すと、三角形の天板をつり合わせる支点（重心）は<strong>「高さのど真ん中」ではなく「少し底辺寄り」</strong>に来るはずです！
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       STEP 3: 03 中線と重心を発見する（13〜17分）
       長方形 → 台形 → 不等辺三角形の細い帯から自然に中線と重心へ至る7ステップ
       ========================================================================= */
    function renderStep3() {
      // 不等辺三角形の共通頂点座標（Aは左寄りにして非対称を明確化）
      const A = { x: 155, y: 34 };
      const B = { x: 45, y: 214 };
      const C = { x: 375, y: 214 };
      const D = { x: (B.x + C.x) / 2, y: (B.y + C.y) / 2 }; // (210, 214)
      const E = { x: (A.x + C.x) / 2, y: (A.y + C.y) / 2 }; // (265, 124)
      const F = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 }; // (100, 124)
      const G = { x: (A.x + B.x + C.x) / 3, y: (A.y + B.y + C.y) / 3 }; // (191.7, 154)

      const stages = [
        { id: 1, short: '① 長方形' },
        { id: 2, short: '② 台形' },
        { id: 3, short: '③ 連続変形' },
        { id: 4, short: '④ 帯→中線' },
        { id: 5, short: '⑤ 中線上の理由' },
        { id: 6, short: '⑥ どこが重心?' },
        { id: 7, short: '⑦ 見方を変える' }
      ];

      // --- 左メインSVGの構築（7ステージそれぞれに最適化されたインタラクティブ図） ---
      let mainSvg = '';
      let controlsHtml = '';
      let stageTitle = '';
      let stageLead = '';

      if (s3StoryStage === 1) {
        // 1. 長方形のテーブルを4枚の細長い板に分ける
        stageTitle = '1. まず、長方形のテーブルを「細長い板」に分けて考える';
        stageLead = '細長い板を1枚だけ取り出して指1本で支えるなら、どこを支えますか？ それぞれの板の中央（●）を結ぶと一直線になります！';
        const rx = 95, rw = 230, ry = 36, rh = 176;
        const bands = 4;
        const bh = rh / bands;
        let bandsSvg = '';
        for (let i = 0; i < bands; i++) {
          const y0 = ry + i * bh;
          const cy = y0 + bh / 2;
          bandsSvg += `
            <rect x="${rx}" y="${y0 + 2}" width="${rw}" height="${bh - 4}" rx="4" fill="rgba(45, 212, 191, 0.22)" stroke="#0f766e" stroke-width="2" />
            <circle cx="${rx + rw / 2}" cy="${cy}" r="5.5" fill="#f59e0b" stroke="#fff" stroke-width="1.5" class="animate-pop" />
            <text x="${rx + rw + 12}" y="${cy + 4}" font-size="10.5" font-weight="bold" class="fill-slate-500 dark:fill-slate-400">板${i + 1}の中央</text>
          `;
        }
        mainSvg = `
          ${bandsSvg}
          ${s3ShowMidLine1 ? `
            <line x1="${rx + rw / 2}" y1="${ry - 10}" x2="${rx + rw / 2}" y2="${ry + rh + 10}" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 3" class="animate-draw" />
            <rect x="122" y="${ry + rh + 14}" width="176" height="22" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
            <text x="210" y="${ry + rh + 29}" text-anchor="middle" font-size="11" font-weight="800" fill="#dc2626">左右のつり合いはこの直線上！</text>
          ` : `
            <text x="210" y="${ry + rh + 24}" text-anchor="middle" font-size="11.5" font-weight="bold" class="fill-slate-500">4枚の細長い板：それぞれの●は真ん中（同じ重さ）</text>
          `}
        `;
        controlsHtml = `
          <div class="flex flex-wrap gap-2">
            <button type="button" data-action="s3-toggle-midline1" class="flex-1 py-2.5 px-3 rounded-xl text-xs font-extrabold shadow-sm transition ${s3ShowMidLine1 ? 'bg-rose-600 hover:bg-rose-500 text-white' : 'bg-teal-600 hover:bg-teal-500 text-white'}">
              ${s3ShowMidLine1 ? '📏 中央の点●を結んだ直線を表示中（上下はまだ決まらない）' : '📏 各板のつり合う点●を直線で結んでみよう！'}
            </button>
            <button type="button" data-s3-story="2" class="py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-extrabold shadow-sm transition">
              ② 台形へ進む &rarr;
            </button>
          </div>
        `;
      } else if (s3StoryStage === 2) {
        // 2. 台形のテーブルで考える（帯の長さが違う！）
        stageTitle = '2. 今度は、台形のテーブルで考える（板の長さが違う！）';
        stageLead = '板の長さが違っていても、均質な細長い板なら「それぞれの中央（●）」でつり合います。ただし下の板ほど長くて重い点に注目！';
        const bands = 4;
        const topY = 36, botY = 212, h = botY - topY;
        const tlX = 145, trX = 275, blX = 65, brX = 355;
        let bandsSvg = '';
        for (let i = 0; i < bands; i++) {
          const t0 = i / bands;
          const t1 = (i + 1) / bands;
          const tm = (t0 + t1) / 2;
          const y0 = topY + h * t0 + 1.5;
          const y1 = topY + h * t1 - 1.5;
          const x0L = tlX + (blX - tlX) * t0;
          const x0R = trX + (brX - trX) * t0;
          const x1L = tlX + (blX - tlX) * t1;
          const x1R = trX + (brX - trX) * t1;
          const mx = ((tlX + (blX - tlX) * tm) + (trX + (brX - trX) * tm)) / 2;
          const my = topY + h * tm;
          const weightLabels = ['軽い', 'やや軽い', 'やや重い', '一番重い!'];
          const rDot = 4 + i * 1.6;
          bandsSvg += `
            <polygon points="${x0L.toFixed(1)},${y0.toFixed(1)} ${x0R.toFixed(1)},${y0.toFixed(1)} ${x1R.toFixed(1)},${y1.toFixed(1)} ${x1L.toFixed(1)},${y1.toFixed(1)}" fill="rgba(251, 146, 60, ${0.18 + i * 0.08})" stroke="#c2410c" stroke-width="2" />
            <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${rDot}" fill="#ea580c" stroke="#fff" stroke-width="1.5" class="animate-pop" />
            <text x="${(x1R + 8).toFixed(1)}" y="${(my + 4).toFixed(1)}" font-size="10" font-weight="800" fill="#c2410c">${weightLabels[i]}</text>
          `;
        }
        mainSvg = `
          ${bandsSvg}
          ${s3ShowMidLine1 ? `
            <line x1="210" y1="26" x2="210" y2="222" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 3" class="animate-draw" />
            <rect x="95" y="226" width="230" height="22" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
            <text x="210" y="241" text-anchor="middle" font-size="10.5" font-weight="800" fill="#c2410c">長さが違っても、中央●を結ぶ直線上に重心がある！</text>
          ` : `
            <text x="210" y="238" text-anchor="middle" font-size="11" font-weight="bold" class="fill-slate-500">下の板ほど長い＝重い（だから上下の中央とは限らない）</text>
          `}
        `;
        controlsHtml = `
          <div class="flex flex-wrap gap-2">
            <button type="button" data-action="s3-toggle-midline1" class="flex-1 py-2.5 px-3 rounded-xl text-xs font-extrabold shadow-sm transition ${s3ShowMidLine1 ? 'bg-orange-600 text-white' : 'bg-teal-600 hover:bg-teal-500 text-white'}">
              ${s3ShowMidLine1 ? '📏 各帯の中央を結ぶ直線を表示中' : '📏 長さの違う板の中央●も結んでみよう！'}
            </button>
            <button type="button" data-s3-story="3" class="py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-extrabold shadow-sm transition">
              ③ 連続変形へ &rarr;
            </button>
          </div>
        `;
      } else if (s3StoryStage === 3) {
        // 3. 台形の上辺をどんどん短くしてみる（長方形 → 台形 → 不等辺三角形）
        stageTitle = '3. 台形の上辺をどんどん短くして、1つの点にしてみよう！';
        stageLead = '上の辺を縮めていくと「長方形 → 台形 → 三角形」に変身します。どの瞬間でも、細い帯の中央●が1本の直線に並び続けることに注目！';
        const t = s3MorphT / 100; // 0:長方形, 0.5:台形, 1.0:不等辺三角形
        const tlX = 75 + (A.x - 75) * t;
        const trX = 345 + (A.x - 345) * t;
        const blX = 75 + (B.x - 75) * t;
        const brX = 345 + (C.x - 345) * t;
        const topY = A.y, botY = B.y;
        const topMidX = (tlX + trX) / 2;
        const botMidX = (blX + brX) / 2; // 常に 210

    /* =========================================================================
       Step 3 連続変形アニメーション（長方形 → 台形 → 不等辺三角形）
       ========================================================================= */
    function playS3MorphAnimation() {
      if (s3AnimFrame) cancelAnimationFrame(s3AnimFrame);
      s3MorphT = 0;
      const startTime = performance.now();
      const duration = 2000; // 2秒かけて滑らかに変形

      function tick(now) {
        const elapsed = now - startTime;
        const ratio = Math.min(1, elapsed / duration);
        const eased = ratio < 0.5 ? 4 * ratio * ratio * ratio : 1 - Math.pow(-2 * ratio + 2, 3) / 2;
        s3MorphT = eased * 100;
        renderCurrentStep();
        if (ratio < 1 && currentStep === 3 && s3StoryStage === 3) {
          s3AnimFrame = requestAnimationFrame(tick);
        } else {
          s3AnimFrame = null;
        }
      }
      s3AnimFrame = requestAnimationFrame(tick);
    }

    /* =========================================================================
       Phase 3 相似モーフィング・アニメーション制御
       ========================================================================= */
    function playMorphAnimation() {
      if (s4AnimFrame) cancelAnimationFrame(s4AnimFrame);
      s4MorphProgress = 0;
      const startTime = performance.now();
      const duration = 1400; // 1.4秒かけて回転・拡大

      function tick(now) {
        const elapsed = now - startTime;
        const ratio = Math.min(1, elapsed / duration);
        // easeInOutCubic
        const eased = ratio < 0.5 ? 4 * ratio * ratio * ratio : 1 - Math.pow(-2 * ratio + 2, 3) / 2;
        s4MorphProgress = eased * 100;
        renderCurrentStep();
        if (ratio < 1 && currentStep === 4 && s4ProofPhase === 3) {
          s4AnimFrame = requestAnimationFrame(tick);
        } else {
          s4AnimFrame = null;
        }
      }
      s4AnimFrame = requestAnimationFrame(tick);
    }

    /* =========================================================================
       数値入力の正規化ヘルパー（全角数字・小数点も許容）
       ========================================================================= */
    function parseNumInput(str) {
      if (str === null || str === undefined) return NaN;
      const normalized = String(str)
        .trim()
        .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/．/g, '.');
      if (normalized === '') return NaN;
      return Number(normalized);
    }

    function escapeAttr(str) {
      return String(str || '').replace(/"/g, '&quot;');
    }

      `;
    }

    /* =========================================================================
       イベント委譲（構文エラーのないクリーンなイベント処理）
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      document.addEventListener('click', (e) => {
        if (e.target.closest('#studyGuideToggleBtn')) {
          toggleStudyGuide();
          return;
        }
        const themeBtn = e.target.closest('[data-theme]');
        if (themeBtn) {
          setTheme(themeBtn.dataset.theme);
          return;
        }
        const stepTab = e.target.closest('[data-step]');
        if (stepTab) {
          goStep(parseInt(stepTab.dataset.step, 10));
          return;
        }
        if (e.target.closest('#prevStepBtn')) {
          goStep(currentStep - 1);
          return;
        }
        if (e.target.closest('#nextStepBtn')) {
          goStep(currentStep + 1);
          return;
        }

        // Step 1
        const s1ShapeBtn = e.target.closest('[data-s1-shape]');
        if (s1ShapeBtn) {
          s1Shape = s1ShapeBtn.dataset.s1Shape;
          s1LegPos = 'none';
          renderCurrentStep();
          return;
        }
        const s1LegBtn = e.target.closest('[data-s1-leg]');
        if (s1LegBtn) {
          s1LegPos = s1LegBtn.dataset.s1Leg;
          renderCurrentStep();
          return;
        }
        const s1PizzaBtn = e.target.closest('[data-s1-pizza]');
        if (s1PizzaBtn) {
          s1PizzaSlices = parseInt(s1PizzaBtn.dataset.s1Pizza, 10);
          renderCurrentStep();
          return;
        }
        const s1Q1Btn = e.target.closest('[data-s1-q1]');
        if (s1Q1Btn) {
          s1Quiz1 = s1Q1Btn.dataset.s1Q1;
          renderCurrentStep();
          return;
        }
        const s1Q2Btn = e.target.closest('[data-s1-q2]');
        if (s1Q2Btn) {
          s1Quiz2 = s1Q2Btn.dataset.s1Q2;
          renderCurrentStep();
          return;
        }

        // Step 2
        const s2ModeBtn = e.target.closest('[data-s2-mode]');
        if (s2ModeBtn) {
          s2Mode = s2ModeBtn.dataset.s2Mode;
          if (s2Mode === 'adult') {
            s2DistLeft = 2.0;
            s2DistRight = 2.0;
          } else {
            s2DistLeft = 2.0;
            s2DistRight = 1.5;
          }
          renderCurrentStep();
          return;
        }

        // Step 3（7段階探究ストーリー＆演習＆3つの線の区別）
        const s3StoryBtn = e.target.closest('[data-s3-story]');
        if (s3StoryBtn) {
          if (s3AnimFrame) { cancelAnimationFrame(s3AnimFrame); s3AnimFrame = null; }
          s3StoryStage = parseInt(s3StoryBtn.dataset.s3Story, 10);
          s3ShowMidLine1 = false;
          renderCurrentStep();
          return;
        }
        const s3MorphPreset = e.target.closest('[data-s3-morph-preset]');
        if (s3MorphPreset) {
          if (s3AnimFrame) { cancelAnimationFrame(s3AnimFrame); s3AnimFrame = null; }
          s3MorphT = parseInt(s3MorphPreset.dataset.s3MorphPreset, 10);
          renderCurrentStep();
          return;
        }
        const s3WhyBtn = e.target.closest('[data-s3-why]');
        if (s3WhyBtn) { s3WhyQuiz = s3WhyBtn.dataset.s3Why; renderCurrentStep(); return; }
        const s3CandBtn = e.target.closest('[data-s3-cand]');
        if (s3CandBtn) {
          const cid = parseInt(s3CandBtn.dataset.s3Cand, 10);
          s3Candidate = cid;
          s3Predict90 = cid === 1 ? 30 : (cid === 2 ? 45 : 60);
          renderCurrentStep();
          return;
        }
        const s3ViewBtn = e.target.closest('[data-s3-view]');
        if (s3ViewBtn) { s3ViewMode = s3ViewBtn.dataset.s3View; renderCurrentStep(); return; }
        const s3RTabBtn = e.target.closest('[data-s3-rtab]');
        if (s3RTabBtn) { s3RightTab = s3RTabBtn.dataset.s3Rtab; renderCurrentStep(); return; }
        const s3DrillCard = e.target.closest('[data-s3-drill]');
        if (s3DrillCard) {
          const did = parseInt(s3DrillCard.dataset.s3Drill, 10);
          s3DrillRevealed[did] = !s3DrillRevealed[did];
          renderCurrentStep();
          return;
        }
        const s3LineBtn = e.target.closest('[data-s3-line]');
        if (s3LineBtn) { s3CompareLine = s3LineBtn.dataset.s3Line; renderCurrentStep(); return; }

        // Step 4
        const s4PhaseBtn = e.target.closest('[data-s4-phase]');
        if (s4PhaseBtn) {
          s4ProofPhase = parseInt(s4PhaseBtn.dataset.s4Phase, 10);
          s4MorphProgress = 0;
          renderCurrentStep();
          return;
        }

        // Step 5
        const s5CheckBtn = e.target.closest('[data-s5-check]');
        if (s5CheckBtn) {
          s5Checked[parseInt(s5CheckBtn.dataset.s5Check, 10)] = true;
          renderCurrentStep();
          return;
        }
        const s5BridgeBtn = e.target.closest('[data-s5-bridge]');
        if (s5BridgeBtn) { s5BridgeQuiz = s5BridgeBtn.dataset.s5Bridge; renderCurrentStep(); return; }

        // Step 6
        const s6PhaseBtn = e.target.closest('[data-s6-phase]');
        if (s6PhaseBtn) { s6Phase = parseInt(s6PhaseBtn.dataset.s6Phase, 10); renderCurrentStep(); return; }
        const s6GuessBtn = e.target.closest('[data-s6-guess]');
        if (s6GuessBtn) { s6AreaGuess = s6GuessBtn.dataset.s6Guess; renderCurrentStep(); return; }

        // Step 7
        const s7TabBtn = e.target.closest('[data-s7-tab]');
        if (s7TabBtn) { s7SubTab = s7TabBtn.dataset.s7Tab; renderCurrentStep(); return; }
        const s7AGuessBtn = e.target.closest('[data-s7-aguess]');
        if (s7AGuessBtn) { s7AGuess = s7AGuessBtn.dataset.s7Aguess; renderCurrentStep(); return; }
        const s7CBtn = e.target.closest('[data-s7-c]');
        if (s7CBtn) { s7CStage = parseInt(s7CBtn.dataset.s7C, 10); renderCurrentStep(); return; }
        const s7DBtn = e.target.closest('[data-s7-dmode]');
        if (s7DBtn) { s7DMode = s7DBtn.dataset.s7Dmode; renderCurrentStep(); return; }

        // Step 8
        const s8SelfBtn = e.target.closest('[data-s8-self]');
        if (s8SelfBtn) {
          const k = s8SelfBtn.dataset.s8Self;
          s8SelfChecks[k] = !s8SelfChecks[k];
          renderCurrentStep();
          return;
        }

        // 汎用アクションボタン
        const actionBtn = e.target.closest('[data-action]');
        if (actionBtn) {
          const act = actionBtn.dataset.action;
          if (act === 's2-toggle-split') { s2TileSplitShown = !s2TileSplitShown; renderCurrentStep(); }
          else if (act === 's3-toggle-midline1') { s3ShowMidLine1 = !s3ShowMidLine1; renderCurrentStep(); }
          else if (act === 's3-play-morph') { playS3MorphAnimation(); }
          else if (act === 's3-add-tridot') {
            s3TriDotCount = s3TriDotCount < 5 ? s3TriDotCount + 1 : 0;
            if (s3TriDotCount === 0) s3TriLineDrawn = false;
            renderCurrentStep();
          }
          else if (act === 's3-draw-triline') {
            if (s3TriDotCount < 5) s3TriDotCount = 5;
            s3TriLineDrawn = !s3TriLineDrawn;
            renderCurrentStep();
          }
          else if (act === 's4-play-morph') { playMorphAnimation(); }
          else if (act === 's6-toggle-grid') { s6ShowGrid = !s6ShowGrid; renderCurrentStep(); }
          else if (act === 's7-toggle-moment') { s7AShowMoment = !s7AShowMoment; renderCurrentStep(); }
          else if (act === 's7-check-b') { s7BChecked = true; renderCurrentStep(); }
          else if (act === 's7-check-d') { s7DChecked = true; renderCurrentStep(); }
          else if (act === 's8-submit') { s8Submitted = true; renderCurrentStep(); }
        }
      });

      document.addEventListener('input', (e) => {
        const inp = e.target.dataset.input;
        if (inp === 's1-pizza') { s1PizzaSlices = parseInt(e.target.value, 10); renderCurrentStep(); return; }
        if (inp === 's2-left') { s2DistLeft = parseFloat(e.target.value); renderCurrentStep(); return; }
        if (inp === 's2-right') { s2DistRight = parseFloat(e.target.value); renderCurrentStep(); return; }
        if (inp === 's3-morph') { s3MorphT = parseFloat(e.target.value); renderCurrentStep(); return; }
        if (inp === 's4-morph') { s4MorphProgress = parseFloat(e.target.value); renderCurrentStep(); return; }
        if (inp === 's7-b') { s7BInput = e.target.value; return; }
        if (inp === 's7-d1') { s7DInput1 = e.target.value; return; }
        if (inp === 's7-d2') { s7DInput2 = e.target.value; return; }

        const s5Inp = e.target.dataset.s5Input;
        if (s5Inp) {
          const [pid, field] = s5Inp.split('-');
          s5Inputs[parseInt(pid, 10)][field === '1' ? 'v1' : 'v2'] = e.target.value;
          return;
        }

        const s8Inp = e.target.dataset.s8Input;
        if (s8Inp) {
          s8Ans[s8Inp] = e.target.value;
        }
      });

      setTheme('light');
      goStep(1);
    });
  </script>
</body>
</html>
