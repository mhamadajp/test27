    function shuffleList(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // STEP 0 の選択肢順序をランダム化し、正解が常に先頭にならないようにする
    function randomizeS0Options() {

          S0_SPOTS[k].whyOptions = shuffleList(S0_SPOTS[k].whyOptions);
          S0_SPOTS[k].rewriteOptions = shuffleList(S0_SPOTS[k].rewriteOptions);
        }
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

      const box = document.getElementById('toast-box');
      const msgEl = document.getElementById('toast-msg');
      const iconEl = document.getElementById('toast-icon');
      if (!box || !msgEl || !iconEl) return;
      msgEl.textContent = msg;
      iconEl.textContent = icon;
      box.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 3800);
    }

    function buildSearchUrl(query, engine = 'google') {
      const q = String(query || '').trim();
      if (engine === 'gov') {
        return `https://www.google.com/search?q=${encodeURIComponent(q + ' site:go.jp')}`;
      }
      if (engine === 'scholar') {
        return `https://scholar.google.co.jp/scholar?q=${encodeURIComponent(q)}`;
      }
      return `https://www.google.com/search?q=${encodeURIComponent(q)}`;
    }

      if (state.s5.myTheme.trim().length > 0) done++;
      if (Object.keys(state.s6.sortedCards).length >= 6) done++;

                  自分の予想に都合のよい回答だけを見て「やっぱり自分の考えが正しい！」と思い込むと、探究で最も大切な<strong>反対意見や別の原因</strong>を見落としてしまいます。
                </div>
              </div>
            </div>
          </div>

          <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-2xs space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              ${Object.entries(S4_PROMPTS).map(([key, item]) => {
                const isSelected = s.activePromptTab === key;
                const tested = s.testedPrompts.includes(key);
                return `
                  <button onclick="testS4Prompt('${key}')" class="p-4 rounded-2xl border-2 text-left transition flex flex-col justify-between gap-2 ${isSelected ? 'border-brand-600 bg-brand-50/70 ring-2 ring-brand-200' : 'border-slate-200 hover:border-slate-300 bg-white'}">
                    <div class="flex items-center justify-between">
                      <span class="text-[11px] font-black px-2 py-0.5 rounded bg-slate-800 text-white">${item.badge}</span>
                      <span class="text-xs font-bold">${tested ? '✅ 実験済' : '▶️ 試す'}</span>
                    </div>
                    <p class="text-xs sm:text-sm font-extrabold text-slate-900">${item.prompt}</p>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- AI Reply & Live Bias Meter Display -->
            <div class="p-5 rounded-2xl bg-slate-900 text-slate-100 space-y-3.5 animate-fade-slide">
              <!-- Live Bias Gauge -->
              <div class="p-3 rounded-xl bg-white/5 border border-white/10 space-y-1.5">
                <div class="flex flex-wrap items-center justify-between gap-2 text-xs font-extrabold">
                  <div class="flex items-center gap-2">
                    <span class="text-slate-300">🎚️ AI回答の偏り度（バイアス）メーター</span>
                    <button onclick="document.getElementById('s4-bias-guide')?.scrollIntoView({ behavior: 'smooth', block: 'center' });" class="px-2 py-0.5 rounded-md bg-white/10 hover:bg-white/20 text-[10px] font-bold text-indigo-200 transition">
                      ❓ バイアスとは？
                    </button>
                  </div>
                  <span class="text-amber-300">${activeData.biasLabel}</span>
                </div>
                <div class="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
                  <div class="h-2.5 rounded-full transition-all duration-300 ${activeData.biasColor}" style="width: ${activeData.biasScore}%"></div>
                </div>
              </div>

              <div class="text-xs font-black text-teal-300">🤖 ${activeData.badge} に対するAIの返答：</div>
              <p class="text-xs sm:text-sm leading-relaxed whitespace-pre-line bg-white/10 p-4 rounded-xl border border-white/15">
                ${activeData.reply}
              </p>
              <div class="p-3 rounded-xl bg-amber-400/20 border border-amber-400/40 text-xs font-bold text-amber-200">
                ${activeData.observation}
              </div>
            </div>
          </section>

          ${renderWorksheetBridge('STEP 4 の2つの記入欄', [
            '「AとBの回答は、どこが違った？」：誘導的（片側の前提を押し付けた聞き方）と中立的（両面を整理させる聞き方）で、返ってきた理由の偏りがどう違ったか書こう。',
            '「AIへの質問を作るときに気をつけたいことは？」：自分の思い込みを「〜ですよね？」と確認するのではなく、どんな聞き方をすべきか自分の言葉でまとめよう！'
          ])}

          <div class="flex justify-between items-center">
            <button onclick="goStep('step3')" class="px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 font-bold text-xs sm:text-sm">← STEP 3</button>
            <button onclick="goStep('step5')" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-xs sm:text-sm shadow-xs">
              STEP 5（自分の探究テーマで質問を設計する）へ →
            </button>
          </div>
        </div>
      `;
    }

    function testS4Prompt(key) {
      state.s4.activePromptTab = key;
      if (!state.s4.testedPrompts.includes(key)) {
        state.s4.testedPrompts.push(key);
      }
      renderApp();
    }

    // =========================================================================
    // 11. STEP 5: 自分の探究テーマで使う（NG質問 vs OK質問 比較＆実Web検証）
    // =========================================================================
    function renderS5PromptCompare() {
      const s = state.s5;
      const themeText = s.myTheme.trim() || '（例：通学路の自転車事故を減らす方法）';
      const unknownText = s.myUnknown.trim() || '（例：事故が多い時間帯や他自治体の対策事例）';
      const realQuery = `${s.myTheme.trim() || '高校 探究'} ${s.myUnknown.trim() || '統計 調査'}`.trim();

      const badPrompt = `「${themeText}」の結論と解決策をすべて教えて。レポートにそのまま使えるように書いて。`;
      const goodPrompt = `私は高校生です。「${themeText}」について探究しています。現在「${unknownText}」がわかっていません。結論は出さず、中立的な視点から【${s.selectedTask}】を提案してください。あわせて公的機関や統計を調べるための検索語も教えてください。`;

      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
          <div class="p-4 rounded-2xl bg-rose-50/70 border border-rose-200 space-y-1.5">
            <div class="text-xs font-black text-rose-800">❌ 避けたい聞き方（答えを丸投げ）</div>
            <p class="text-xs text-slate-800 leading-relaxed bg-white p-3 rounded-xl border border-rose-200">
              ${escapeHtml(badPrompt)}
            </p>
            <div class="text-[11px] text-rose-700 font-bold">→ これでは根拠不明な作文が返ってきて自分の探究になりません。</div>
          </div>

          <div class="p-4 rounded-2xl bg-emerald-50/70 border-2 border-emerald-400 space-y-2">
            <div class="flex flex-wrap items-center justify-between gap-1.5">
              <span class="text-xs font-black text-emerald-900">⭕ 探究を広げる聞き方（推奨プロンプト）</span>
              <button onclick="copyPromptText()" class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-extrabold">
                📋 コピーしてGeminiへ
              </button>
            </div>
            <p id="s5-good-prompt" class="text-xs text-slate-900 font-bold leading-relaxed bg-white p-3 rounded-xl border border-emerald-200">
              ${escapeHtml(goodPrompt)}
            </p>
            <div class="flex flex-wrap gap-2 pt-1">
              <a href="${buildSearchUrl(realQuery, 'google')}" target="_blank" rel="noopener noreferrer" onclick="markRealWebTried('s5')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-extrabold">
                🌐 自分のテーマを実際のGoogle検索で調べる
              </a>
              <a href="${buildSearchUrl(realQuery, 'scholar')}" target="_blank" rel="noopener noreferrer" onclick="markRealWebTried('s5')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-blue-700 hover:bg-blue-600 text-white text-[11px] font-extrabold">
                🎓 Google Scholarで研究論文を探す
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function updateS5Input(field, val) {
      state.s5[field] = val;
      const compareArea = document.getElementById('s5-prompt-compare');
      if (compareArea) {
        compareArea.innerHTML = renderS5PromptCompare();
      }
      updateNavUI();
    }

    function renderStep5() {
      const s = state.s5;
      const tasks = ['問いの言い換え', '観点出し', '検索語づくり', '反対意見', '確認すべき点'];

      return `
        <div class="space-y-6 animate-fade-slide">
          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-2xs">
            <span class="text-xs font-black px-3 py-1 rounded-full bg-brand-100 text-brand-800">体験⑥｜STEP 5 自分の探究テーマで使う（約15分）</span>
            <h2 class="text-lg sm:text-2xl font-black text-slate-900 mt-2">
              自分の探究テーマを入れて、「答え丸投げ（NG）」と「探究を広げる質問（OK）」を比べよう！
            </h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">
              ※最初のルール確認：個人名・学校内部資料・生データは入力しません。
            </p>
          </div>

          <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-2xs space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-black text-slate-800 block mb-1">① 自分の探究テーマを入力してみよう：</label>
                <input type="text" value="${escapeHtml(s.myTheme)}" oninput="updateS5Input('myTheme', this.value)" placeholder="例：校内の食品ロスを減らす工夫" class="w-full p-3 rounded-xl border border-slate-300 text-xs sm:text-sm font-bold focus:border-brand-500 focus:outline-none" />
              </div>
              <div>
                <label class="text-xs font-black text-slate-800 block mb-1">② まだわからないこと・調べたいこと：</label>
                <input type="text" value="${escapeHtml(s.myUnknown)}" oninput="updateS5Input('myUnknown', this.value)" placeholder="例：食べ残しが多いメニューや他校の事例" class="w-full p-3 rounded-xl border border-slate-300 text-xs sm:text-sm font-bold focus:border-brand-500 focus:outline-none" />
              </div>
            </div>

            <div>
              <label class="text-xs font-black text-slate-800 block mb-1.5">③ AIに頼む役割を選ぶ（1つ）：</label>
              <div class="flex flex-wrap gap-2">
                ${tasks.map(t => `
                  <button onclick="state.s5.selectedTask = '${t}'; renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-extrabold border-2 transition ${s.selectedTask === t ? 'bg-brand-600 text-white border-brand-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-brand-400'}">
                    ${s.selectedTask === t ? '☑️ ' : '☐ '}${t}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Comparison of Bad vs Good Prompt -->
            <div id="s5-prompt-compare">
              ${renderS5PromptCompare()}
            </div>
          </section>

          ${renderWorksheetBridge('STEP 5 のワークシート記入ガイド', [
            '「自分の探究テーマ」「今わかっていること」「まだわからないこと」を紙のワークシートに書こう。',
            '実際にGeminiへ入力した質問と、AIから得た「答え」ではなく【次に自分で調べること（3つ）】を書き、実際にWeb検索で一次資料（発信者・日付）を確かめてみよう！'
          ])}

          <div class="flex justify-between items-center">
            <button onclick="goStep('step4')" class="px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 font-bold text-xs sm:text-sm">← STEP 4</button>
            <button onclick="goStep('step6')" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-xs sm:text-sm shadow-xs">
              STEP 6（AI利用ルール＆EXIT TICKET）へ →
            </button>
          </div>
        </div>
      `;
    }

    function copyPromptText() {
      const el = document.getElementById('s5-good-prompt');
      if (!el) return;
      const ta = document.createElement('textarea');
      ta.value = el.textContent.trim();
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('質問文をコピーしました！本物のGeminiに貼り付けて試せます。', '📋');
      } catch (e) {
        showToast('コピーに失敗しました。', '⚠️');
      }
      document.body.removeChild(ta);
    }

    // =========================================================================
    // 12. STEP 6 & EXIT TICKET: ドラッグ＆ドロップ対応ルール仕分けボード
    // =========================================================================
    function renderStep6() {
      const s = state.s6;
      const columns = [
        { id: 'useful', title: '⭕ AIを使うと便利な場面', color: 'border-emerald-400 bg-emerald-50/50', badge: 'bg-emerald-600 text-white' },
        { id: 'notFinish', title: '⚠️ AIだけで終えてはいけない場面', color: 'border-amber-400 bg-amber-50/50', badge: 'bg-amber-500 text-slate-950' },
        { id: 'neverInput', title: '🚫 入力してはいけないもの', color: 'border-rose-400 bg-rose-50/50', badge: 'bg-rose-600 text-white' }
      ];

      const unsortedCards = S6_RULE_CARDS.filter(c => !s.sortedCards[c.id]);
      const allSorted = unsortedCards.length === 0;
      const allCorrect = S6_RULE_CARDS.every(c => s.sortedCards[c.id] === c.target);

      return `
        <div class="space-y-6 animate-fade-slide">
          <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-2xs">
            <span class="text-xs font-black px-3 py-1 rounded-full bg-brand-100 text-brand-800">体験⑦｜STEP 6 利用ルール作成 ＆ EXIT TICKET</span>
            <h2 class="text-lg sm:text-2xl font-black text-slate-900 mt-2">
              6枚のカードを3つのルール枠へドラッグ＆ドロップ（またはタップ移動）で仕分けよう！
            </h2>
            <p class="text-xs sm:text-sm text-slate-600 mt-1">
              PCではカードを下の枠へ<strong>ドラッグ＆ドロップ</strong>、スマホ・タブレットでは<strong>カードをタップして選択 → 入れたい枠をタップ</strong>で移動できます。
            </p>
          </div>

          <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-2xs space-y-5">
            <!-- Unsorted Card Pool -->
            <div class="p-4 rounded-2xl bg-slate-100 border border-slate-200 space-y-2.5">
              <div class="flex items-center justify-between text-xs font-black text-slate-700">
                <span>🃏 未分類の行動カード（残り ${unsortedCards.length} / ${S6_RULE_CARDS.length} 枚）</span>
                ${s.selectedCardId ? '<span class="text-brand-700 animate-pulse">👇 下の3つの枠のどれかをタップして配置しよう！</span>' : ''}
              </div>
              ${unsortedCards.length === 0 ? `
                <div class="text-xs font-bold text-emerald-700 py-2">✨ すべてのカードを3つのルール枠に配置しました！</div>
              ` : `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${unsortedCards.map(card => {
                    const isPicked = s.selectedCardId === card.id;
                    return `
                      <div draggable="true" ondragstart="handleS6DragStart(event, '${card.id}')" onclick="selectS6Card('${card.id}')" class="p-3.5 rounded-xl border-2 cursor-grab active:cursor-grabbing transition select-none ${isPicked ? 'border-brand-600 bg-brand-50 ring-2 ring-brand-200 font-black text-brand-950' : 'border-slate-300 bg-white hover:border-brand-400 font-extrabold text-slate-900'} text-xs sm:text-sm">
                        ⠿ ${card.text}
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <!-- 3 Drop Zones -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
              ${columns.map(col => {
                const placedCards = S6_RULE_CARDS.filter(c => s.sortedCards[c.id] === col.id);
                return `
                  <div ondragover="event.preventDefault()" ondrop="handleS6Drop(event, '${col.id}')" onclick="placeSelectedS6Card('${col.id}')" class="p-4 rounded-2xl border-2 border-dashed min-h-[190px] transition cursor-pointer flex flex-col justify-between gap-3 ${col.color}">
                    <div class="space-y-2.5">
                      <div class="inline-block px-2.5 py-1 rounded-lg text-xs font-black ${col.badge}">
                        ${col.title}
                      </div>
                      <div class="space-y-2">
                        ${placedCards.length === 0 ? `
                          <div class="text-[11px] text-slate-500 py-6 text-center">ここにカードをドロップ<br/>（またはタップで配置）</div>
                        ` : placedCards.map(pc => {
                          const ok = pc.target === col.id;
                          return `
                            <div onclick="event.stopPropagation(); removeS6Card('${pc.id}');" title="クリックで未分類に戻す" class="p-3 rounded-xl border-2 bg-white text-xs font-extrabold shadow-2xs flex items-start justify-between gap-2 ${ok ? 'border-emerald-500 text-slate-900' : 'border-rose-500 text-rose-900'}">
                              <span>${ok ? '⭕ ' : '❌ '}${pc.text}</span>
                              <span class="text-[10px] text-slate-400 shrink-0">✕</span>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            ${allSorted && allCorrect ? `
              <div class="p-4 rounded-2xl bg-emerald-100 border border-emerald-400 text-xs sm:text-sm font-extrabold text-emerald-950 animate-fade-slide">
                🏆 全6枚のルール仕分けが完璧に完了しました！この3つの柱を自分の言葉にして、手元の紙のワークシートSTEP 6とEXIT TICKETを仕上げよう！
              </div>
            ` : ''}

            <!-- 6-Step Troubleshooting & Slogan Summary -->
            <div class="p-5 rounded-2xl bg-gradient-to-br from-slate-900 to-brand-950 text-white space-y-2.5">
              <div class="text-xs font-black text-amber-300">🧭 今日の合言葉 ＆ 困ったときの進め方（ワークシート末尾）</div>
              <div class="text-sm sm:text-base font-black text-teal-200">
                「AI で広げる → 検索で確かめる → 元の資料に戻る → 自分で判断する」
              </div>
              <p class="text-xs text-slate-200 leading-relaxed">
                ① AIに「答え」ではなく「次に調べること」を聞く → ② 検索語を自分で直す → ③ Web検索する → ④ 発信者・日付を見る → ⑤ できれば元の統計・論文・公式資料へ戻る → ⑥ 複数の資料を比べて自分で判断する
              </p>
            </div>
          </section>

          ${renderWorksheetBridge('STEP 6 の3列ルール表 ＆ EXIT TICKET（①〜③）', [
            'STEP 6 の表：「AIを使うと便利な場面」「AIだけで終えてはいけない場面」「入力してはいけないもの」を、自分の探究活動に合わせて自分の言葉で書こう。',
            'EXIT TICKET ① 次の探究で、AIはどこに使う？ ／ ② AIが答えを返したら、そのあと何をする？ ／ ③ 今日いちばん重要だと思ったこと：を記入して提出しよう！'
          ])}

          <div class="flex justify-between items-center">
            <button onclick="goStep('step5')" class="px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 font-bold text-xs sm:text-sm">← STEP 5</button>
            <button onclick="goStep('step0')" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-extrabold text-xs sm:text-sm">
              🏠 最初のルール（トップ）に戻る
            </button>
          </div>
        </div>
      `;
    }

    function handleS6DragStart(e, cardId) {
      e.dataTransfer.setData('text/plain', cardId);
      state.s6.selectedCardId = cardId;
    }

    function handleS6Drop(e, colId) {
      e.preventDefault();
      const cardId = e.dataTransfer.getData('text/plain') || state.s6.selectedCardId;
      if (cardId) {
        sortS6Card(cardId, colId);
      }
    }

    function selectS6Card(cardId) {
      state.s6.selectedCardId = (state.s6.selectedCardId === cardId) ? null : cardId;
      renderApp();
    }

    function placeSelectedS6Card(colId) {
      if (state.s6.selectedCardId) {
        sortS6Card(state.s6.selectedCardId, colId);
      }
    }

    function removeS6Card(cardId) {
      delete state.s6.sortedCards[cardId];
      renderApp();
    }

    function sortS6Card(cardId, colId) {
      state.s6.sortedCards[cardId] = colId;
      state.s6.selectedCardId = null;
      const card = S6_RULE_CARDS.find(c => c.id === cardId);
      if (card && card.target === colId) {
        showToast('その通り！バッチリ分類できました。', '⭕');
      } else {
        showToast('おっと！これまでの体験（STEP 0〜4）を思い出してもう一度考えてみよう（✕で戻せます）。', '🤔');
      }
      renderApp();
    }

    // 初期描画（選択肢の並び順をランダム化してから表示）
    window.addEventListener('DOMContentLoaded', () => {
      randomizeS0Options();
      renderApp();
    });
  </script>
</body>
</html>
