            <div class="text-xs font-semibold text-slate-600 mt-1">合計得点 $= 57$ 点 ／ 20人 $\\implies$ 平均 $= 2.85$ 点、最頻値 $= 3$ 点</div>

        concept: `

          <p><strong>2. 最頻値（Mode）：</strong> 最も度数（人数）が大きい階級・値。ヒストグラムで最も柱が高い箇所です。</p>

        steps: `

          {
            text: "【類題3】平均値が 6、分散が 4 である 10 個のデータがある。すべてのデータに 3 を足した新しいデータの平均値と分散の組み合わせとして正しいものを選びなさい。",

              "平均値: 9, 分散: 4",

            correctIdx: 1,
            explanation: "すべてのデータに定数 $c$ を足すと、平均値は $+c$ されますが、散らばり具合（分散・標準偏差）は変化しません。よって平均値は $6 + 3 = 9$、分散は $4$ のまま不変です。"

        ]
      },
      {

        title: "問12: 集合と命題（真偽と反例）",
        category: "集合と論理",

        visual: `
          <div class="w-full flex flex-col items-center">
            <div class="text-xs font-bold text-slate-600 mb-2">【仮定を満たし結論を満たさない反例の存在】</div>
            <div class="bg-amber-50 border border-amber-300 rounded-xl p-4 w-full max-w-sm text-center">
              <div class="text-xs font-bold text-amber-800">反例の検証： $a = 2, b = -2$</div>
              <div class="text-xs text-slate-700 mt-2 space-y-1">
                <div>仮定： $a^2 = 2^2 = 4$, $\\; b^2 = (-2)^2 = 4$ $\\implies a^2 = b^2$ <strong>(成立)</strong></div>

              </div>
            </div>
            <div class="text-xs font-semibold text-rose-600 mt-2">1つでも例外（反例）が存在すれば命題は「偽」</div>
          </div>
        `,
        concept: `
          <p><strong>1. 命題の真偽の定義：</strong><br>
             ・<strong>真（True）：</strong> 仮定を満たすすべての場合において結論が必ず成立する。<br>
             ・<strong>偽（False）：</strong> 仮定を満たすが結論を満たさない具体例（<strong>反例</strong>）が少なくとも1つ存在する。</p>
          <p><strong>2. 二乗の同値変形：</strong> 実数において $a^2 = b^2 \\iff a^2 - b^2 = 0 \\iff (a - b)(a + b) = 0 \\iff a = b \\text{ または } a = -b$ です。</p>
        `,
        steps: `
          <p>① $a^2 = b^2$ を因数分解して同値変形すると：<br>
             $$a^2 - b^2 = 0 \\iff (a - b)(a + b) = 0$$<br>
             したがって、$a = b$ だけでなく $a = -b$ でも仮定を満たします。</p>
          <p>② 具体的な反例を1つ挙げます：<br>
             $$a = 1, \\; b = -1$$<br>
             このとき $a^2 = 1, b^2 = 1$ より $a^2 = b^2$ は成り立ちますが、$a \\ne b$ です。</p>
          <p>③ したがって、この命題は <strong>偽</strong> であり、反例は $(a, b) = (1, -1)$ などです。</p>
        `,
        correctAnswer: "偽（反例: $a = 1, b = -1$ など符号違いの数）",
        quizzes: [
          {

            options: [
              "真である",
              "偽である（反例: $x = -3$）",
              "偽である（反例: $x = 0$）",
              "偽である（反例: $x = 2$）"
            ],
            correctIdx: 1,
            explanation: "$x = -3$ のとき $(-3)^2 = 9 > 4$ となり仮定を満たしますが、$-3 > 2$ ではないため結論を満たしません。よって偽です。"
          },
          {
            text: "【類題2】命題「整数 $n$ について、$n$ が 4 の倍数ならば $n$ は偶数である」の真偽を判定しなさい。",
            options: [
              "真である",

              "偽である（反例: $n = 6$）",
              "偽である（反例: $n = 0$）"
            ],
            correctIdx: 0,
            explanation: "$n = 4k = 2(2k)$ と表せるため、4の倍数は例外なくすべて偶数です。反例は存在せず、命題は「真」です。"

            options: [
              "対偶は「$\\bar{P} \\implies \\bar{Q}$」であり、真偽は一致しない",
              "対偶は「$\\bar{Q} \\implies \\bar{P}$」であり、必ず真である",
              "対偶は「$Q \\implies P$」であり、必ず真である",
              "対偶の真偽は元の命題と無関係である"
            ],
            correctIdx: 1,
            explanation: "命題とその対偶「$\\bar{Q} \\implies \\bar{P}$」は真偽が完全に一致します。元の命題が真なら対偶も必ず真となります。"
          }
        ]
      }
    ];

    // State Variables
    let currentQIndex = 0;
    let currentSubQuizIndex = 0;
    const completedQuizzes = new Set();
    const userAnswers = {};

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      renderNavTabs();
      loadQuestion(0);
      updateProgressDisplay();
    });

    function renderNavTabs() {
      const navContainer = document.getElementById('nav-tabs');
      navContainer.innerHTML = '';
      examData.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.id = `nav-btn-${idx}`;
        btn.className = `tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all border ${
          idx === 0 ? 'active' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'
        }`;
        btn.textContent = `問${q.id}`;
        btn.onclick = () => {
          loadQuestion(idx);
        };
        navContainer.appendChild(btn);
      });
    }

    function switchSubQuiz(subIdx) {
      currentSubQuizIndex = subIdx;

      [0, 1, 2].forEach(i => {
        const btn = document.getElementById(`subquiz-btn-${i}`);
        if (!btn) return;
        const quizKey = `${currentQIndex}_${i}`;
        const isDone = completedQuizzes.has(quizKey);

        if (i === subIdx) {
          btn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg transition bg-white text-indigo-700 shadow-sm border border-indigo-200';
        } else {
          btn.className = `flex-1 py-1.5 text-xs font-bold rounded-lg transition ${
            isDone ? 'text-emerald-700 bg-emerald-50 border border-emerald-200' : 'text-slate-600 hover:text-slate-900 border border-transparent'
          }`;
        }
      });

      const q = examData[currentQIndex];
      renderCurrentSubQuiz(q.quizzes[subIdx]);
    }

    function loadQuestion(index) {
      if (index < 0 || index >= examData.length) return;
      currentQIndex = index;
      currentSubQuizIndex = 0;
      const data = examData[index];

      // Update Tabs styling
      examData.forEach((_, idx) => {
        const b = document.getElementById(`nav-btn-${idx}`);
        if (!b) return;
        b.classList.remove('active');
        const allDone = [0, 1, 2].every(si => completedQuizzes.has(`${idx}_${si}`));
        if (allDone) {
          b.className = 'tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all border border-emerald-400 text-emerald-800 bg-emerald-50';
        } else {
          b.className = 'tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all border bg-white text-slate-700 border-slate-200 hover:bg-slate-100';
        }
        if (idx === index) {
          b.className = 'tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all active';
        }
      });

      // Update Question display
      document.getElementById('q-title').textContent = data.title;
      document.getElementById('badge-category').textContent = data.category;
      document.getElementById('q-score').textContent = `配点: ${data.score} 点`;
      document.getElementById('q-problem-text').innerHTML = data.problemText;
      document.getElementById('visual-container').innerHTML = data.visual;
      document.getElementById('q-concept').innerHTML = data.concept;
      document.getElementById('q-steps').innerHTML = data.steps;
      document.getElementById('q-answer-correct').innerHTML = data.correctAnswer;
      document.getElementById('q-counter').textContent = `${index + 1} / ${examData.length}`;

      switchSubQuiz(0);
      safeRenderMathJax();
    }

    function renderCurrentSubQuiz(quiz) {
      document.getElementById('quiz-question-text').innerHTML = quiz.text;
      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';

      const feedbackBox = document.getElementById('quiz-feedback');
      feedbackBox.classList.add('hidden');

      const quizKey = `${currentQIndex}_${currentSubQuizIndex}`;
      const savedAnswer = userAnswers[quizKey];
      const isAlreadyCompleted = completedQuizzes.has(quizKey);

      updateQuizBadge(isAlreadyCompleted);

      quiz.options.forEach((opt, idx) => {
        const label = document.createElement('label');
        label.className = `flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer transition hover:bg-slate-100 ${
          savedAnswer === idx ? 'bg-indigo-50 border-indigo-400 font-medium' : 'bg-white'
        }`;

        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `quiz-opt-${quizKey}`;
        radio.value = idx;
        radio.className = 'w-4 h-4 text-indigo-600 focus:ring-indigo-500 mr-3';
        if (savedAnswer === idx) {
          radio.checked = true;
        }
        radio.onchange = () => {
          userAnswers[quizKey] = idx;
          Array.from(container.children).forEach(c => c.classList.remove('bg-indigo-50', 'border-indigo-400', 'font-medium'));
          label.classList.add('bg-indigo-50', 'border-indigo-400', 'font-medium');
        };

        const span = document.createElement('span');
        span.className = 'text-xs sm:text-sm text-slate-800 flex-1';
        span.innerHTML = opt;

        label.appendChild(radio);
        label.appendChild(span);
        container.appendChild(label);
      });

      if (isAlreadyCompleted) {
        showFeedback(savedAnswer === quiz.correctIdx, quiz.explanation);
      }

      safeRenderMathJax();
    }

    function checkAnswer() {
      const quizKey = `${currentQIndex}_${currentSubQuizIndex}`;
      const selected = userAnswers[quizKey];
      const currentQuiz = examData[currentQIndex].quizzes[currentSubQuizIndex];

      if (selected === undefined) {
        showMessageBox("選択肢を選んでから「解答をチェックする」を押してください。");
        return;
      }

      const isCorrect = (selected === currentQuiz.correctIdx);
      if (isCorrect) {
        completedQuizzes.add(quizKey);
      } else {
        completedQuizzes.delete(quizKey);
      }

      updateProgressDisplay();
      updateQuizBadge(isCorrect);
      showFeedback(isCorrect, currentQuiz.explanation);
      switchSubQuiz(currentSubQuizIndex);
    }

    function showFeedback(isCorrect, explanationText) {
      const feedbackBox = document.getElementById('quiz-feedback');
      const titleElem = document.getElementById('feedback-title');
      const textElem = document.getElementById('feedback-explanation');

      feedbackBox.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-300', 'bg-rose-50', 'border-rose-300');

      if (isCorrect) {
        feedbackBox.classList.add('bg-emerald-50', 'border', 'border-emerald-300');
        titleElem.className = 'flex items-center space-x-1.5 font-bold text-sm text-emerald-800 mb-1';
        titleElem.innerHTML = `
          <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>正解です！公式・解法プロセスを正しく適用できています</span>
        `;
      } else {
        feedbackBox.classList.add('bg-rose-50', 'border', 'border-rose-300');
        titleElem.className = 'flex items-center space-x-1.5 font-bold text-sm text-rose-800 mb-1';
        titleElem.innerHTML = `
          <svg class="w-4 h-4 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>惜しい！下の途中式・解説を確認して再チャレンジしましょう</span>
        `;
      }

      textElem.innerHTML = `<strong>【類題の途中式・解説】</strong><br>${explanationText}`;
      safeRenderMathJax();
    }

    function resetCurrentQuiz() {
      const quizKey = `${currentQIndex}_${currentSubQuizIndex}`;
      delete userAnswers[quizKey];
      completedQuizzes.delete(quizKey);
      updateProgressDisplay();
      renderCurrentSubQuiz(examData[currentQIndex].quizzes[currentSubQuizIndex]);
    }

    function updateQuizBadge(isCompleted) {
      const badge = document.getElementById('quiz-status-badge');
      if (isCompleted) {
        badge.textContent = `類題${currentSubQuizIndex + 1} クリア`;
        badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold border border-emerald-300";
      } else {
        badge.textContent = `類題${currentSubQuizIndex + 1} 未クリア`;
        badge.className = "text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-medium";
      }
    }

    function updateProgressDisplay() {
      const count = completedQuizzes.size;
      const total = examData.length * 3; // 12 * 3 = 36 quizzes
      const pct = Math.round((count / total) * 100);

      document.getElementById('progress-indicator').textContent = `${count} / ${total} 問クリア (${pct}%)`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
    }

    function safeRenderMathJax() {
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise().catch((err) => console.log('MathJax typeset notice:', err));
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        loadQuestion(currentQIndex - 1);
      }
    }

    function nextQuestion() {
      if (currentQIndex < examData.length - 1) {
        loadQuestion(currentQIndex + 1);
      }
    }

    function showMessageBox(message) {
      let modal = document.getElementById('custom-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'custom-modal';
        modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4';
        modal.innerHTML = `
          <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center transform transition-all">
            <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-lg">!</div>
            <p id="custom-modal-text" class="text-sm text-slate-800 mb-4 font-medium"></p>
            <button onclick="document.getElementById('custom-modal').classList.add('hidden')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-xl text-sm transition">確認</button>
          </div>
        `;
        document.body.appendChild(modal);
      }
      document.getElementById('custom-modal-text').textContent = message;
      modal.classList.remove('hidden');
    }
  </script>
</body>
