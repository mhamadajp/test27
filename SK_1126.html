<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数学検定3級・準2級 完全攻略＆類題マスター道場</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes popIn {
      0% { transform: translateY(14px) scale(0.96); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.25s ease-out forwards;
    }
    .math-font {
      font-family: 'Times New Roman', 'Inter', serif;
    }
    /* 数式オブジェクト用スタイル（分数・根号・指数） */
    .math-expr {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      font-family: 'Times New Roman', 'Noto Sans JP', serif;
      line-height: 1.2;
      margin: 0 2px;
    }
    .math-frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 3px;
      font-size: 0.92em;
      line-height: 1.05;
    }
    .math-frac > .num {
      border-bottom: 1.5px solid currentColor;
      padding: 0 4px 1px;
      text-align: center;
      display: block;
    }
    .math-frac > .den {
      padding: 2px 4px 0;
      text-align: center;
      display: block;
    }
    .math-sqrt {
      display: inline-flex;
      align-items: stretch;
      vertical-align: middle;
      margin: 0 2px;
    }
    .math-sqrt > .rad-sign {
      font-size: 1.15em;
      line-height: 1;
      padding-right: 1px;
      transform: translateY(1px);
    }
    .math-sqrt > .rad-body {
      border-top: 1.5px solid currentColor;
      padding: 1px 3px 0 2px;
      display: inline-flex;
      align-items: center;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 selection:bg-indigo-100 selection:text-indigo-900 pb-20">

  <!-- トースト通知 -->

  <!-- トップヘッダー（時間表示・タイマーなし） -->

        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 via-blue-600 to-emerald-600 flex items-center justify-center text-white shadow-md shrink-0 font-black text-lg">
          ∑
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-extrabold tracking-wider uppercase px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
              図解＋公式＋無限類題トレーニング
            </span>
          </div>
          <h1 class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight mt-0.5">
            数学検定3級・準2級 完全攻略＆類題マスター道場

        </div>
      </div>

      <!-- ステータス＆ランク表示 -->
      <div class="flex items-center gap-3 sm:gap-5">
        <div class="hidden md:flex items-center gap-4 text-xs font-semibold text-slate-600 bg-slate-100 px-3.5 py-2 rounded-xl border border-slate-200">
          <div class="flex items-center gap-1.5">
            <span class="text-emerald-600 font-bold">📘 3級:</span>

            📐

          <div class="leading-tight">
            <div id="rank-title" class="text-[10px] text-slate-300 font-medium">Lv.1 数学チャレンジャー</div>
            <div class="text-xs sm:text-sm font-extrabold text-amber-400 flex items-center gap-1">
              <span>⚡</span>
              <span id="xp-display">0 XP</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- メイン3モード切り替えタブ -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 border-t border-slate-100 bg-slate-50/80">
      <nav class="flex overflow-x-auto no-scrollbar gap-1.5 py-2" aria-label="学習モード">
        <button id="tab-btn-3kyu" onclick="switchTab('3kyu')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap bg-emerald-600 text-white shadow-xs">
          <span>📘 数学検定3級（全10問＋図解＆類題）</span>
          <span id="tab-badge-3kyu" class="text-xs px-2 py-0.5 rounded-full bg-emerald-500 text-white">0/10</span>
        </button>

        <button id="tab-btn-j2kyu" onclick="switchTab('j2kyu')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap text-slate-600 hover:bg-white hover:text-slate-900">
          <span>📗 数学検定準2級（全10問＋図解＆類題）</span>
          <span id="tab-badge-j2kyu" class="text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">0/10</span>
        </button>

        <button id="tab-btn-mix" onclick="switchTab('mix')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap text-slate-600 hover:bg-white hover:text-slate-900">
          <span>🏆 実戦ミックス模試（数値を変えた本番テスト）</span>
          <span id="tab-badge-mix" class="hidden text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-800"></span>
        </button>
      </nav>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main id="app-main" class="max-w-7xl mx-auto px-4 sm:px-6 pt-6"></main>

  <script>
    // ==========================================
    // 0. HTML数式オブジェクト変換ヘルパー（分数・根号を数式HTMLに変換）
    // ==========================================
    function frac(num, den) {
      return `<span class="math-frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
    }

    function sqrt(body) {
      return `<span class="math-sqrt"><span class="rad-sign">√</span><span class="rad-body">${body}</span></span>`;
    }

    function formatMath(text) {
      if (!text) return '';
      let out = String(text);

      // 括弧付き分数 (a)/(b) や (12√3)/3 など
      out = out.replace(/\(([^()]+)\)\/\(([^()]+)\)/g, (_, n, d) => frac(n, d));
      out = out.replace(/\(([^()]+)\)\/([0-9a-zA-Z√]+)/g, (_, n, d) => frac(n, d));
      out = out.replace(/([0-9a-zA-Z√]+)\/\(([^()]+)\)/g, (_, n, d) => frac(n, d));

      // 通常の分数 a/b（BC/sinA, 4/5, 1/√3 など。日付や「／」全角スラッシュは対象外）
      out = out.replace(/([0-9a-zA-Z√]+)\/([0-9a-zA-Z√]+)/g, (_, n, d) => frac(n, d));

      // 括弧付き根号 √( ... )
      out = out.replace(/√\(([^()]+)\)/g, (_, body) => sqrt(body));

      // 通常の根号 √90, √3, √2 など
      out = out.replace(/√([0-9a-zA-Z]+)/g, (_, body) => sqrt(body));

      return out;
    }

    // ==========================================
    // 1. カスタムSVGイラスト図解・グラフ生成関数（文字重なりゼロ・完全レイアウト版）
    // ==========================================
    // SVG専用の根号（√）描画ヘルパー
    function svgSqrt(x, y, body, color = '#1E40AF', fontSize = 12) {
      const w = String(body).length * (fontSize * 0.62) + 6;
      const topY = y - fontSize * 0.88;
      const botY = y + 2;
      const midY = y - fontSize * 0.35;
      return `
        <g>
          <path d="M ${x - 13} ${midY} L ${x - 9} ${botY} L ${x - 3} ${topY} L ${x + w} ${topY}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          <text x="${x}" y="${y}" font-size="${fontSize}" font-weight="bold" fill="${color}" text-anchor="start">${body}</text>
        </g>`;
    }

    // SVG専用の縦積み分数描画ヘルパー
    function svgFrac(cx, cy, num, den, color = '#1E40AF', fontSize = 11) {
      const halfW = Math.max(String(num).length, String(den).length) * (fontSize * 0.36) + 5;
      return `
        <g text-anchor="middle" font-weight="bold" fill="${color}" font-size="${fontSize}">
          <text x="${cx}" y="${cy - 4}">${num}</text>
          <line x1="${cx - halfW}" y1="${cy}" x2="${cx + halfW}" y2="${cy}" stroke="${color}" stroke-width="1.5" />
          <text x="${cx}" y="${cy + fontSize + 1}">${den}</text>
        </g>`;
    }

    function renderProblemSVG(code) {
      switch (code) {
        // ---------- 3級 問1〜問10 ----------
        case '3-1':
          return `
            <div class="bg-emerald-50/70 border-2 border-emerald-200 rounded-2xl p-4">
              <div class="text-xs font-extrabold text-emerald-900 mb-2">📊 図解：7個のデータを小さい順に並べて4等分する位置（箱ひげ図のイメージ）</div>
              <svg viewBox="0 0 460 140" class="w-full max-w-xl mx-auto h-36 bg-white rounded-xl border border-emerald-100">
                <g font-size="11" font-weight="bold" text-anchor="middle">
                  <text x="40" y="16" font-size="8.5" fill="#64748B">最小値</text>
                  <rect x="18" y="22" width="44" height="28" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
                  <text x="40" y="40" fill="#334155">4</text>

                  <text x="103" y="16" font-size="8.5" fill="#1D4ED8">第1四分位数</text>
                  <rect x="81" y="22" width="44" height="28" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" />
                  <text x="103" y="40" fill="#1E40AF">7</text>

                  <rect x="144" y="22" width="44" height="28" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
                  <text x="166" y="40" fill="#334155">7</text>

                  <text x="230" y="16" font-size="8.5" fill="#B45309">中央値(第2)</text>
                  <rect x="208" y="22" width="44" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" />
                  <text x="230" y="40" fill="#B45309">8</text>

                  <rect x="272" y="22" width="44" height="28" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
                  <text x="294" y="40" fill="#334155">9</text>

                  <text x="357" y="16" font-size="8.5" fill="#1D4ED8">第3四分位数</text>
                  <rect x="335" y="22" width="44" height="28" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" />
                  <text x="357" y="40" fill="#1E40AF">11</text>

                  <text x="420" y="16" font-size="8.5" fill="#64748B">最大値</text>
                  <rect x="398" y="22" width="44" height="28" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
                  <text x="420" y="40" fill="#334155">12</text>
                </g>
                <!-- 箱ひげ図 -->
                <line x1="40" y1="82" x2="103" y2="82" stroke="#334155" stroke-width="2" />
                <line x1="40" y1="72" x2="40" y2="92" stroke="#334155" stroke-width="2" />
                <rect x="103" y="66" width="254" height="32" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" />
                <line x1="230" y1="66" x2="230" y2="98" stroke="#D97706" stroke-width="3" />
                <line x1="357" y1="82" x2="420" y2="82" stroke="#334155" stroke-width="2" />
                <line x1="420" y1="72" x2="420" y2="92" stroke="#334155" stroke-width="2" />
                <!-- 四分位範囲 -->
                <path d="M107 112 H353" stroke="#059669" stroke-width="2" />
                <polygon points="103,112 110,108 110,116" fill="#059669" />
                <polygon points="357,112 350,108 350,116" fill="#059669" />
                <text x="230" y="129" font-size="10.5" font-weight="bold" fill="#065F46" text-anchor="middle">四分位範囲 ＝ 第3四分位数(11) − 第1四分位数(7) ＝ 4</text>
              </svg>
            </div>`;

        case '3-2':
          return `
            <div class="bg-sky-50/70 border-2 border-sky-200 rounded-2xl p-4">
              <div class="text-xs font-extrabold text-sky-900 mb-2">🐟 図解：池全体の割合と、捕獲した標本の割合は等しい（比例式）</div>
              <svg viewBox="0 0 440 115" class="w-full max-w-xl mx-auto h-28 bg-white rounded-xl border border-sky-100">
                <ellipse cx="115" cy="58" rx="92" ry="42" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5" />
                <text x="115" y="44" font-size="11.5" font-weight="bold" fill="#0369A1" text-anchor="middle">池全体：x 匹</text>
                <rect x="65" y="54" width="100" height="24" rx="12" fill="#FDE047" stroke="#CA8A04" stroke-width="1.5" />
                <text x="115" y="70" font-size="10.5" font-weight="bold" fill="#854D0E" text-anchor="middle">うち印付き 50 匹</text>

                <text x="232" y="64" font-size="20" font-weight="900" fill="#334155" text-anchor="middle">＝</text>

                <rect x="262" y="18" width="156" height="78" rx="14" fill="#F0FDF4" stroke="#059669" stroke-width="2.5" />
                <text x="340" y="44" font-size="11.5" font-weight="bold" fill="#065F46" text-anchor="middle">再捕獲：80 匹</text>
                <rect x="290" y="54" width="100" height="24" rx="12" fill="#FDE047" stroke="#CA8A04" stroke-width="1.5" />
                <text x="340" y="70" font-size="10.5" font-weight="bold" fill="#854D0E" text-anchor="middle">うち印付き 10 匹</text>
              </svg>
            </div>`;

        case '3-3':
          return `
            <div class="bg-amber-50/70 border-2 border-amber-200 rounded-2xl p-4">
              <div class="text-xs font-extrabold text-amber-900 mb-2">📏 図解：2乗の数（平方数）ではさんで大きさを比べる</div>
              <svg viewBox="0 0 460 110" class="w-full max-w-xl mx-auto h-28 bg-white rounded-xl border border-amber-100">
                <line x1="35" y1="58" x2="425" y2="58" stroke="#475569" stroke-width="2.5" />
                <!-- 9 = √81 -->
                <circle cx="95" cy="58" r="6" fill="#2563EB" />
                <text x="88" y="36" font-size="13" font-weight="bold" fill="#1E40AF" text-anchor="end">9 ＝</text>
                ${svgSqrt(105, 36, '81', '#1E40AF', 13)}
                <text x="95" y="84" font-size="10.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">超えない最大の整数！</text>
                <!-- √90 -->
                <circle cx="230" cy="58" r="7" fill="#DC2626" />
                ${svgSqrt(186, 36, '90', '#DC2626', 14)}
                <text x="215" y="36" font-size="12" font-weight="900" fill="#DC2626" text-anchor="start">（約 9.48…）</text>
                <!-- 10 = √100 -->
                <circle cx="365" cy="58" r="6" fill="#2563EB" />
                <text x="355" y="36" font-size="13" font-weight="bold" fill="#1E40AF" text-anchor="end">10 ＝</text>
                ${svgSqrt(372, 36, '100', '#1E40AF', 13)}
              </svg>
            </div>`;

        case '3-4':
          return `
            <div class="bg-indigo-50/70 border-2 border-indigo-200 rounded-2xl p-4">
              <div class="text-xs font-extrabold text-indigo-900 mb-2">📈 図解：2直線の交点 ＝ 連立方程式の解</div>
              <svg viewBox="0 0 380 160" class="w-full max-w-md mx-auto h-40 bg-white rounded-xl border border-indigo-100">
                <line x1="40" y1="132" x2="350" y2="132" stroke="#64748B" stroke-width="1.5" />
                <line x1="75" y1="15" x2="75" y2="148" stroke="#64748B" stroke-width="1.5" />
                <text x="63" y="145" font-size="10" fill="#475569">O</text>
                <!-- y = 2x - 1 -->
                <line x1="65" y1="145" x2="225" y2="22" stroke="#2563EB" stroke-width="2.5" />
                <text x="232" y="28" font-size="11" font-weight="bold" fill="#1D4ED8">y = 2x − 1</text>
                <!-- y = -x + 8 -->
                <line x1="70" y1="28" x2="305" y2="140" stroke="#059669" stroke-width="2.5" />
                <text x="295" y="122" font-size="11" font-weight="bold" fill="#047857">y = −x + 8</text>
                <!-- 交点 (3, 5) -->
                <line x1="165" y1="68" x2="165" y2="132" stroke="#94A3B8" stroke-dasharray="3,3" />
                <line x1="75" y1="68" x2="165" y2="68" stroke="#94A3B8" stroke-dasharray="3,3" />
                <circle cx="165" cy="68" r="5.5" fill="#DC2626" />
                <text x="165" y="146" font-size="11" font-weight="bold" fill="#DC2626" text-anchor="middle">3</text>
                <text x="63" y="72" font-size="11" font-weight="bold" fill="#DC2626" text-anchor="end">5</text>
                <rect x="178" y="54" width="88" height="24" rx="6" fill="#FEE2E2" stroke="#EF4444" />
                <text x="222" y="70" font-size="11" font-weight="900" fill="#B91C1C" text-anchor="middle">交点 (3, 5)</text>
              </svg>
            </div>`;

        case '3-5':
          return `
            <div class="bg-rose-50/70 border-2 border-rose-200 rounded-2xl p-4">
              <div class="text-xs font-extrabold text-rose-900 mb-2">🎱 図解：「少なくとも1個が赤」は、全体(1)から「1個も赤が出ない」を引く！</div>
              <svg viewBox="0 0 460 125" class="w-full max-w-xl mx-auto h-32 bg-white rounded-xl border border-rose-100">
                <rect x="12" y="12" width="246" height="100" rx="10" fill="#FFE4E6" stroke="#F43F5E" stroke-width="2" />
                <text x="135" y="34" font-size="11" font-weight="bold" fill="#BE123C" text-anchor="middle">求める確率：少なくとも1個が赤</text>
                <text x="102" y="68" font-size="13.5" font-weight="900" fill="#9F1239" text-anchor="end">1 −</text>
                ${svgFrac(118, 63, '1', '5', '#9F1239', 11.5)}
                <text x="142" y="68" font-size="13.5" font-weight="900" fill="#9F1239" text-anchor="middle">＝</text>
                ${svgFrac(166, 63, '4', '5', '#9F1239', 12.5)}
                <text x="135" y="98" font-size="10" font-weight="bold" fill="#BE123C" text-anchor="middle">（全15通り中 12通り）</text>

                <rect x="268" y="12" width="180" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
                <text x="358" y="34" font-size="10.5" font-weight="bold" fill="#1E40AF" text-anchor="middle">余事象（赤が0個）</text>
                <text x="358" y="52" font-size="9.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">青2・白1の計3個から2個</text>
                <text x="382" y="83" font-size="10" font-weight="900" fill="#1E3A8A" text-anchor="end">3通り ÷ 15通り ＝</text>
                ${svgFrac(402, 78, '1', '5', '#1E3A8A', 11)}
              </svg>
            </div>`;

        case '3-6':
          return `
            <div class="bg-blue-50/70 border-2 border-blue-200 rounded-2xl p-4">
              <div class="text-xs font-extrabold text-blue-900 mb-2">⭕ 図解：円の外部の1点から引いた2本の接線の長さは等しい（△OAP ≡ △OBP）</div>
              <svg viewBox="0 0 400 165" class="w-full max-w-md mx-auto h-40 bg-white rounded-xl border border-blue-100">
                <circle cx="130" cy="82" r="52" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" />

      toastTimer = setTimeout(() => {
        container.classList.add('hidden');
      }, 3200);
    }

    function switchTab(tab) {
      state.activeTab = tab;
      const tabs = ['3kyu', 'j2kyu', 'mix'];
      const activeColors = {
        '3kyu': 'bg-emerald-600 text-white shadow-xs',
        'j2kyu': 'bg-indigo-600 text-white shadow-xs',
        'mix': 'bg-amber-600 text-white shadow-xs'
      };
      tabs.forEach((t) => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tab) {
          btn.className = `flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeColors[t]}`;
        } else {
          btn.className = 'flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm transition-all whitespace-nowrap text-slate-600 hover:bg-white hover:text-slate-900';
        }
      });
      render();

    // ==========================================
    // 4. イベントハンドラ
    // ==========================================
    function selectProblemIndex(level, idx) {
      if (level === '3kyu') state.selectedIdx3 = idx;
      else state.selectedIdxJ2 = idx;
      render();
    }

    function selectOrigOption(code, optIdx) {
      if (state.origSubmitted[code]) return;
      state.origSelection[code] = optIdx;
      render();
    }

    function submitOrigProblem(level, code) {
      const sel = state.origSelection[code];
      if (sel === undefined) return;
      state.origSubmitted[code] = true;

      const list = level === '3kyu' ? PROBLEMS_3KYU : PROBLEMS_J2KYU;
      const prob = list.find((p) => p.code === code);
      if (sel === prob.originalAnswer) {
        const solvedMap = level === '3kyu' ? state.solved3Kyu : state.solvedJ2Kyu;
        if (!solvedMap[code]) {
          solvedMap[code] = true;
          state.xp += 50;
          showToast(`🎉 ${prob.num}（${prob.topic}）クリア！ +50 XP 獲得！`);
        } else {
          showToast('✨ 正解です！類題にも挑戦してみよう！');
        }
      }
      // まだ類題が生成されていなければ1問目を自動生成しておく
      if (!state.activeDrill[code]) {
        state.activeDrill[code] = prob.generateSimilar();
      }
      render();
    }

    function createNewDrill(level, code) {
      const list = level === '3kyu' ? PROBLEMS_3KYU : PROBLEMS_J2KYU;
      const prob = list.find((p) => p.code === code);
      state.activeDrill[code] = prob.generateSimilar();
      delete state.drillSelection[code];
      delete state.drillSubmitted[code];
      render();
    }

    function selectDrillOption(code, optIdx) {
      if (state.drillSubmitted[code]) return;
      state.drillSelection[code] = optIdx;
      render();
    }

    function submitDrillProblem(code) {
      const sel = state.drillSelection[code];
      if (sel === undefined) return;
      state.drillSubmitted[code] = true;
      const drill = state.activeDrill[code];
      if (sel === drill.answer) {
        state.drillSolvedCount += 1;
        state.xp += 40;
        showToast('🔥 類題クリア！自力で解ける力がつきました！ +40 XP');
      }
      render();
    }

    // 実戦ミックス模試開始（各問の類題生成ロジックを使って毎回違う数値の10問テストを作成）
    function startMixExam(targetLevel) {
      let pool = [];
      if (targetLevel === '3kyu') {
        pool = PROBLEMS_3KYU.map((p) => ({
          tag: `3級 ${p.num}`,
          topic: p.topic,
          code: p.code,
          ...p.generateSimilar()
        }));
      } else if (targetLevel === 'j2kyu') {
        pool = PROBLEMS_J2KYU.map((p) => ({
          tag: `準2級 ${p.num}`,
          topic: p.topic,
          code: p.code,
          ...p.generateSimilar()
        }));
      } else {
        // 3級5問 + 準2級5問のミックス10問
        const p3 = [...PROBLEMS_3KYU].sort(() => Math.random() - 0.5).slice(0, 5).map((p) => ({
          tag: `3級 ${p.num}`,
          topic: p.topic,
          code: p.code,
          ...p.generateSimilar()
        }));
        const pj2 = [...PROBLEMS_J2KYU].sort(() => Math.random() - 0.5).slice(0, 5).map((p) => ({
          tag: `準2級 ${p.num}`,
          topic: p.topic,
          code: p.code,
          ...p.generateSimilar()
        }));
        pool = [...p3, ...pj2];
      }
      state.mixQuestions = pool;
      state.mixIdx = 0;
      state.mixAnswers = {};
      state.mixChecked = {};
      state.mixMode = 'running';
      render();
    }

    function selectMixOption(optIdx) {
      if (state.mixChecked[state.mixIdx]) return;
      state.mixAnswers[state.mixIdx] = optIdx;
      render();
    }

    function confirmMixOption() {
      if (state.mixAnswers[state.mixIdx] === undefined) return;
      state.mixChecked[state.mixIdx] = true;
      render();
    }

    function nextMixQuestion() {
      if (state.mixIdx < state.mixQuestions.length - 1) {
        state.mixIdx += 1;
        render();
      }
    }

    function finishMixExam() {
      let correctCount = 0;
      state.mixQuestions.forEach((q, idx) => {
        if (state.mixAnswers[idx] === q.answer) correctCount++;
      });
      const score = correctCount * 10; // 各10点・100点満点
      const earned = correctCount * 35;
      state.xp += earned;
      if (state.bestMixScore === null || score > state.bestMixScore) {
        state.bestMixScore = score;
      }
      state.mixMode = 'result';
      showToast(`🏆 実戦テスト採点完了！ ${score}点 / 100点（+${earned} XP）`);
      render();
    }

    function resetMixToSelect() {
      state.mixMode = 'select';
      render();
    }

    // ==========================================

      const themeAccent = is3 ? 'emerald' : 'indigo';

      // 上部問題セレクター（問1〜問10）
      const navButtons = list.map((item, idx) => {

          </button>`;
      }).join('');

      // 本題の選択肢HTML
      const origSel = state.origSelection[prob.code];
      const origSub = !!state.origSubmitted[prob.code];
      const origOptsHTML = prob.originalOptions.map((opt, oIdx) => {
        const isSel = origSel === oIdx;
        const isCor = prob.originalAnswer === oIdx;
        let cls = 'bg-slate-50 border-slate-200 hover:border-indigo-400 text-slate-800';
        if (origSub) {
          if (isCor) cls = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-extrabold';

        } else if (isSel) {
          cls = `bg-${themeAccent}-50 border-${themeAccent}-600 text-${themeAccent}-950 ring-2 ring-${themeAccent}-100`;

        return `

            }">${['ア', 'イ', 'ウ', 'エ'][oIdx]}</span>
            <span class="flex-1 leading-relaxed">${formatMath(opt)}</span>
            ${origSub && isCor ? '<span class="text-emerald-600 text-base">⭕</span>' : ''}
            ${origSub && isSel && !isCor ? '<span class="text-rose-600 text-base">❌</span>' : ''}
          </button>`;
      }).join('');

      // ステップ解説リスト
      const stepsHTML = prob.stepByStep.map((st, sIdx) => `
        <li class="flex items-start gap-2.5 text-xs sm:text-sm text-slate-200 leading-relaxed">
          <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-extrabold text-xs shrink-0 mt-0.5">Step ${sIdx + 1}</span>
          <span>${formatMath(st)}</span>

        state.activeDrill[prob.code] = prob.generateSimilar();
      }
      const drill = state.activeDrill[prob.code];
      const drillSel = state.drillSelection[prob.code];
      const drillSub = !!state.drillSubmitted[prob.code];

      const drillOptsHTML = drill.options.map((opt, oIdx) => {
        const isSel = drillSel === oIdx;
        const isCor = drill.answer === oIdx;
        let cls = 'bg-white border-slate-200 hover:border-amber-400 text-slate-800';
        if (drillSub) {
          if (isCor) cls = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-extrabold ring-2 ring-emerald-200';
          else if (isSel && !isCor) cls = 'bg-rose-50 border-rose-500 text-rose-950';
          else cls = 'bg-slate-50 border-slate-200 text-slate-400';
        } else if (isSel) {
          cls = 'bg-amber-50 border-amber-500 text-amber-950 ring-2 ring-amber-100';
        }
        return `
          <button onclick="selectDrillOption('${prob.code}', ${oIdx})" class="w-full text-left p-3.5 rounded-xl border-2 text-xs sm:text-sm font-bold transition-all flex items-center gap-3 ${cls}">
            <span class="w-6 h-6 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 ${
              drillSub && isCor ? 'bg-emerald-600 text-white' : isSel ? 'bg-amber-500 text-slate-950' : 'bg-slate-100 text-slate-600'
            }">${['ア', 'イ', 'ウ', 'エ'][oIdx]}</span>
            <span class="flex-1 leading-relaxed">${formatMath(opt)}</span>
            ${drillSub && isCor ? '<span class="text-emerald-600 text-base">⭕</span>' : ''}
            ${drillSub && isSel && !isCor ? '<span class="text-rose-600 text-base">❌</span>' : ''}
          </button>`;
      }).join('');

      return `
        <div class="space-y-6">
          <!-- 問題番号ナビゲーション（10問グリッド） -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-extrabold text-slate-600">
                ${is3 ? '📘 数学検定3級 模擬テスト 第3回（全10問）' : '📗 数学検定準2級 模擬テスト 第3回（全10問）'}
              </span>
              <span class="text-xs font-bold text-${themeAccent}-700">
                クリア状況：${Object.keys(solvedMap).length} / 10 問
              </span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">${navButtons}</div>
          </div>

          <!-- メイン学習カード（本題 ＋ 図解・公式 ＋ 類題道場） -->
          <div class="bg-white rounded-3xl border border-slate-200 shadow-2xs overflow-hidden">
            <!-- ヘッダー -->
            <div class="bg-gradient-to-r ${is3 ? 'from-emerald-900 via-teal-900 to-slate-900' : 'from-indigo-950 via-blue-950 to-slate-900'} p-6 sm:p-8 text-white">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-white/15 text-white border border-white/20">
                  ${is3 ? '数学検定3級' : '数学検定準2級'} ・ ${prob.num}（配点10点相当）
                </span>
                ${solvedMap[prob.code] ? '<span class="text-xs font-bold bg-emerald-500/25 text-emerald-300 px-3 py-1 rounded-full border border-emerald-400/30">✅ 本題クリア済</span>' : ''}
              </div>
              <h2 class="text-xl sm:text-2xl font-extrabold">${prob.num}　${prob.topic}</h2>
            </div>

            <div class="p-6 sm:p-8 space-y-8">
              <!-- 1. 模試の本題 -->
              <div class="space-y-4">
                <div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-5">
                  <div class="text-xs font-extrabold text-slate-500 mb-1.5">📝 模擬テストの問題</div>
                  <p class="text-base sm:text-lg font-extrabold text-slate-900 leading-relaxed whitespace-pre-line">${formatMath(prob.originalQuestion)}</p>
                </div>

                <!-- 視覚図解・グラフ -->
                ${renderProblemSVG(prob.code)}

                <!-- 選択肢 -->
                <div class="space-y-2.5">${origOptsHTML}</div>

                ${!origSub ? `
                  <button onclick="submitOrigProblem('${level}', '${prob.code}')" ${origSel === undefined ? 'disabled' : ''} class="px-7 py-3 rounded-xl bg-slate-900 hover:bg-${themeAccent}-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-extrabold text-sm transition-colors shadow-2xs">
                    解答を判定して「解き方のポイント」を見る（+50 XP）
                  </button>
                ` : `
                  <!-- 解き方のポイント＆途中式ステップ解説 -->
                  <div class="bg-slate-900 text-white rounded-3xl p-6 space-y-4 shadow-md">
                    <div class="flex items-center justify-between flex-wrap gap-2">
                      <span class="font-extrabold text-base ${origSel === prob.originalAnswer ? 'text-emerald-400' : 'text-rose-400'}">
                        ${origSel === prob.originalAnswer ? '⭕ 大正解！解法のポイントを完璧に押さえよう！' : '❌ おしい！下の公式とステップを見て解き方を身につけよう！'}
                      </span>
                    </div>

                    <div class="bg-indigo-950/90 border border-indigo-500/40 rounded-2xl p-4 space-y-1.5">
                      <div class="text-xs font-extrabold text-amber-400">🔑 今後同じ問題が出たときの鉄則：【${formatMath(prob.formulaTitle)}】</div>
                      <p class="text-xs sm:text-sm text-indigo-100 leading-relaxed whitespace-pre-line">${formatMath(prob.formulaDesc)}</p>
                    </div>

                    <div class="space-y-2">
                      <div class="text-xs font-extrabold text-slate-400">📋 途中式・考え方の流れ</div>
                      <ul class="space-y-2">${stepsHTML}</ul>
                    </div>
                  </div>
                `}
              </div>

              <!-- 2. 知識を定着させる「無限類題トレーニング」 -->
              <div class="bg-gradient-to-br from-amber-50/90 via-orange-50/50 to-yellow-50/80 border-2 border-amber-300 rounded-3xl p-6 sm:p-7 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <span class="px-3 py-1 rounded-full bg-amber-500 text-slate-950 text-xs font-extrabold">
                      🔥 類題チャレンジ道場（+40 XP）
                    </span>
                    <h3 class="text-base sm:text-lg font-extrabold text-slate-900 mt-2">
                      同じパターンの類題を自力で解いて完全定着させよう！
                    </h3>
                  </div>
                  <button onclick="createNewDrill('${level}', '${prob.code}')" class="px-4 py-2 rounded-xl bg-white hover:bg-amber-100 border border-amber-300 text-amber-900 font-extrabold text-xs shadow-2xs transition-colors">
                    🔄 別の数値の類題を出す
                  </button>
                </div>

                <div class="bg-white border border-amber-200 rounded-2xl p-4">
                  <p class="text-sm sm:text-base font-extrabold text-slate-900 leading-relaxed whitespace-pre-line">${formatMath(drill.question)}</p>
                </div>

                <div class="space-y-2.5">${drillOptsHTML}</div>

                ${!drillSub ? `
                  <button onclick="submitDrillProblem('${prob.code}')" ${drillSel === undefined ? 'disabled' : ''} class="px-6 py-3 rounded-xl bg-amber-600 hover:bg-amber-500 disabled:bg-slate-200 disabled:text-slate-400 text-white font-extrabold text-sm transition-colors">
                    類題の答え合わせをする
                  </button>
                ` : `
                  <div class="bg-slate-900 text-white rounded-2xl p-4 space-y-1.5">
                    <div class="text-xs font-extrabold ${drillSel === drill.answer ? 'text-emerald-400' : 'text-rose-400'}">
                      ${drillSel === drill.answer ? '⭕ 類題突破！同じパターンが出てももう大丈夫！' : '❌ 類題の解説を確認して、上の「別の数値の類題を出す」でリベンジしよう！'}
                    </div>
                    <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${formatMath(drill.explanation)}</p>
                  </div>
                `}
              </div>

              <!-- 前後の問題ナビ -->
              <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                <button onclick="selectProblemIndex('${level}', ${Math.max(0, curIdx - 1)})" ${curIdx === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:bg-slate-100 disabled:opacity-30">
                  ← 前の問題へ
                </button>
                ${curIdx < list.length - 1 ? `
                  <button onclick="selectProblemIndex('${level}', ${curIdx + 1})" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-${themeAccent}-600 text-white hover:bg-${themeAccent}-700 shadow-2xs">
                    次の問題（${list[curIdx + 1].num}）へ →
                  </button>
                ` : `
                  <button onclick="switchTab('mix')" class="px-5 py-2.5 rounded-xl font-bold text-sm bg-amber-600 text-white hover:bg-amber-700 shadow-2xs">
                    🏆 実戦ミックス模試に挑戦する →
                  </button>
                `}
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderMixExam() {
      if (state.mixMode === 'select') {
        return `
          <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-2xs p-6 sm:p-10 text-center space-y-6">
            <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-3xl">🏆</div>
            <div class="space-y-2 max-w-xl mx-auto">
              <span class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
                数値が毎回自動生成される実戦テスト（100点満点・時間制限なし）
              </span>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">実戦ミックス模擬テスト</h2>
              <p class="text-slate-600 text-sm sm:text-base leading-relaxed">
                模擬テスト第3回の全単元から、数値や条件を変えた実戦問題（10問×10点＝100点満点）を出題します。答えの丸暗記ではなく「解き方の手順」が身についているか試しましょう！
              </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 text-left">
              <div class="border-2 border-emerald-200 hover:border-emerald-500 rounded-2xl p-5 flex flex-col justify-between bg-emerald-50/30">
                <div class="space-y-1.5">
                  <span class="text-xs font-extrabold text-emerald-800 bg-emerald-100 px-2.5 py-0.5 rounded">3級 100点模試</span>
                  <h3 class="text-base font-extrabold text-slate-900">数学検定3級 実戦10問</h3>
                  <p class="text-xs text-slate-600 leading-relaxed">資料・標本調査・平方根・一次関数・確率・円・三平方・相似・散布図の類題10問。</p>
                </div>
                <button onclick="startMixExam('3kyu')" class="mt-5 w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm">
                  3級模試を始める →
                </button>
              </div>

              <div class="border-2 border-indigo-200 hover:border-indigo-500 rounded-2xl p-5 flex flex-col justify-between bg-indigo-50/30">
                <div class="space-y-1.5">
                  <span class="text-xs font-extrabold text-indigo-800 bg-indigo-100 px-2.5 py-0.5 rounded">準2級 100点模試</span>
                  <h3 class="text-base font-extrabold text-slate-900">数学検定準2級 実戦10問</h3>
                  <p class="text-xs text-slate-600 leading-relaxed">集合・絶対値不等式・判別式・二次関数・三角比・正弦定理・反復試行・対偶の類題10問。</p>
                </div>
                <button onclick="startMixExam('j2kyu')" class="mt-5 w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs sm:text-sm">
                  準2級模試を始める →
                </button>
              </div>

              <div class="border-2 border-amber-300 hover:border-amber-500 rounded-2xl p-5 flex flex-col justify-between bg-amber-50/40">
                <div class="space-y-1.5">
                  <span class="text-xs font-extrabold text-amber-800 bg-amber-200/80 px-2.5 py-0.5 rounded">総合ミックス</span>
                  <h3 class="text-base font-extrabold text-slate-900">3級＋準2級 総合10問</h3>
                  <p class="text-xs text-slate-600 leading-relaxed">3級から5問、準2級から5問をランダム選抜！幅広い単元対応力を試します。</p>
                </div>
                <button onclick="startMixExam('mix')" class="mt-5 w-full py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-xs sm:text-sm">
                  総合ミックスに挑む ⚡
                </button>
              </div>
            </div>
          </div>`;
      }

      if (state.mixMode === 'running') {
        const q = state.mixQuestions[state.mixIdx];
        const isChecked = !!state.mixChecked[state.mixIdx];
        const selIdx = state.mixAnswers[state.mixIdx];
        const pct = Math.round(((state.mixIdx + 1) / state.mixQuestions.length) * 100);

        const optsHTML = q.options.map((opt, idx) => {
          const isSel = selIdx === idx;
          const isCor = q.answer === idx;
          let style = 'bg-white border-slate-200 hover:border-indigo-400 text-slate-800';
          if (isChecked) {
            if (isCor) style = 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-2 ring-emerald-200';
            else if (isSel && !isCor) style = 'bg-rose-50 border-rose-500 text-rose-950';
            else style = 'bg-slate-50 border-slate-200 text-slate-400';
          } else if (isSel) {
            style = 'bg-indigo-50 border-indigo-600 text-indigo-950 ring-2 ring-indigo-100';
          }
          return `
            <button onclick="selectMixOption(${idx})" class="w-full text-left p-4 rounded-2xl border-2 font-bold text-sm sm:text-base transition-all flex items-center gap-3.5 ${style}">
              <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 ${
                isChecked && isCor ? 'bg-emerald-600 text-white' : isSel ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
              }">${['ア', 'イ', 'ウ', 'エ'][idx]}</span>
              <span class="flex-1 leading-snug">${formatMath(opt)}</span>
              ${isChecked && isCor ? '<span class="text-emerald-600 text-lg">⭕</span>' : ''}
              ${isChecked && isSel && !isCor ? '<span class="text-rose-600 text-lg">❌</span>' : ''}
            </button>`;
        }).join('');

        return `
          <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-2xs overflow-hidden">
            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-extrabold text-xs">
                  第 ${state.mixIdx + 1} 問 / 全 ${state.mixQuestions.length} 問（各10点）
                </span>
                <span class="text-xs text-slate-300 font-semibold">${q.tag}：${q.topic}</span>
              </div>
              <button onclick="resetMixToSelect()" class="text-xs text-slate-400 hover:text-white underline">コース選択へ戻る</button>
            </div>
            <div class="w-full bg-slate-200 h-2">
              <div class="bg-amber-500 h-2 transition-all duration-300" style="width: ${pct}%"></div>
            </div>

            <div class="p-6 sm:p-8 space-y-6">
              <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5">
                <p class="text-base sm:text-lg font-extrabold text-slate-900 leading-relaxed whitespace-pre-line">${formatMath(q.question)}</p>
              </div>

              <div class="space-y-3">${optsHTML}</div>

              ${!isChecked ? `
                <button onclick="confirmMixOption()" ${selIdx === undefined ? 'disabled' : ''} class="px-8 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-extrabold text-sm transition-colors">
                  解答を確定して解説を見る
                </button>
              ` : `
                <div class="space-y-4">
                  ${renderProblemSVG(q.code)}
                  <div class="bg-slate-900 text-white rounded-2xl p-5 space-y-3">
                    <div class="font-extrabold text-base">
                      ${selIdx === q.answer
                        ? '<span class="text-emerald-400">⭕ 正解！（+10点）</span>'
                        : `<span class="text-rose-400">❌ 不正解（正解は ${['ア', 'イ', 'ウ', 'エ'][q.answer]}）</span>`}
                    </div>
                    <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${formatMath(q.explanation)}</p>
                    <div class="pt-2 flex justify-end">
                      ${state.mixIdx < state.mixQuestions.length - 1 ? `
                        <button onclick="nextMixQuestion()" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm">
                          次の問題へ進む →
                        </button>
                      ` : `
                        <button onclick="finishMixExam()" class="px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm">
                          100点満点レポートを見る 🏆
                        </button>
                      `}
                    </div>
                  </div>
                </div>
              `}
            </div>
          </div>`;
      }

      if (state.mixMode === 'result') {
        let totalCorrect = 0;
        state.mixQuestions.forEach((q, idx) => {
          if (state.mixAnswers[idx] === q.answer) totalCorrect++;
        });
        const score = totalCorrect * 10;
        const passed = score >= 60; // 数検一次合格ライン目安（60〜70%）

        const reviewHTML = state.mixQuestions.map((q, idx) => {
          const isRight = state.mixAnswers[idx] === q.answer;
          return `
            <div class="p-4 bg-white flex items-start gap-3">
              <div class="mt-0.5 shrink-0 font-bold">${isRight ? '⭕' : '❌'}</div>
              <div class="space-y-1 text-xs sm:text-sm">
                <div class="font-bold text-slate-900">問${idx + 1}（${q.tag}・${q.topic}）</div>
                <div class="text-slate-600">正解：<span class="font-bold text-emerald-700">${formatMath(q.options[q.answer])}</span></div>
                <p class="text-slate-500 text-xs leading-relaxed">${formatMath(q.explanation)}</p>
              </div>
            </div>`;
        }).join('');

        return `
          <div class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-2xs p-6 sm:p-10 space-y-8">
            <div class="text-center space-y-3">
              <div class="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl ${passed ? 'bg-amber-100' : 'bg-indigo-100'}">🏆</div>
              <div class="inline-block px-3.5 py-1 rounded-full text-xs font-extrabold bg-slate-900 text-amber-400">
                ${passed ? '🎉 合格ライン突破！解法のパターンが身についています！' : '📚 あと一歩！間違えた単元の「類題道場」で復習しよう！'}
              </div>
              <h2 class="text-3xl sm:text-4xl font-black text-slate-900">
                得点 ${score} 点 <span class="text-lg font-bold text-slate-500">（100点満点中 ・ ${totalCorrect}/10問正解）</span>
              </h2>
            </div>

            <div class="space-y-3">
              <h3 class="text-sm font-extrabold text-slate-900">📝 全問振り返り＆解説</h3>
              <div class="divide-y divide-slate-200 border border-slate-200 rounded-2xl overflow-hidden">${reviewHTML}</div>
            </div>

            <div class="flex flex-wrap justify-center gap-3 pt-2">
              <button onclick="resetMixToSelect()" class="px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm">
                新しい数値で再テストする 🔄
              </button>
              <button onclick="switchTab('3kyu')" class="px-6 py-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-extrabold text-sm">
                3級・類題道場へ
              </button>
              <button onclick="switchTab('j2kyu')" class="px-6 py-3 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-extrabold text-sm">
                準2級・類題道場へ
              </button>
            </div>
          </div>`;
      }
    }

    function render() {
      updateHeaderStats();
      const mainEl = document.getElementById('app-main');
      if (state.activeTab === '3kyu') {
        mainEl.innerHTML = renderGradeWorkspace('3kyu');
      } else if (state.activeTab === 'j2kyu') {
        mainEl.innerHTML = renderGradeWorkspace('j2kyu');
      } else if (state.activeTab === 'mix') {
        mainEl.innerHTML = renderMixExam();
      }
    }

    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
