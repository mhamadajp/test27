<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出力を育てるプロンプティング 練習アプリ（50問）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-900 border-b border-slate-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="w-2.5 h-6 bg-indigo-500 rounded-full inline-block"></span>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight">出力を育てるプロンプティング</h1>
                    <p class="text-xs text-slate-400 hidden sm:block">生成AIパスポート対策｜変換・評価・改善を「なぜ」で理解する</p>
                </div>
            </div>
            <div id="header-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-indigo-300 border border-slate-700">
                全50問・詳細解説付
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-6 sm:py-8 flex flex-col justify-center">

        <!-- ================= 1. HOME SCREEN ================= -->
        <section id="screen-home" class="fade-in block">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8">
                <div class="text-center mb-8">
                    <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-full mb-3 border border-indigo-100">
                        プロンプトエンジニアリング応用編
                    </span>
                    <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">学習カテゴリを選択してください</h2>
                    <p class="text-sm text-slate-500 mt-2 max-w-lg mx-auto">
                        「答え合わせ」で終わらせず、「なぜその指示にするのか」「どう検証すべきか」の判断力を養う50本ノックです。
                    </p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4 mb-4">
                    <button class="cat-select-btn group p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 bg-white hover:bg-indigo-50/40 transition-all text-left flex flex-col justify-between" data-category="文章の変換・要約・校正">
                        <div class="flex items-center justify-between w-full mb-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-sky-100 text-sky-800">第1章</span>
                            <span class="text-xs text-slate-400 font-medium">12問</span>
                        </div>
                        <h3 class="font-bold text-slate-800 group-hover:text-indigo-600 text-base">文章の変換・要約・校正</h3>
                        <p class="text-xs text-slate-500 mt-1">目的別の情報優先順位、事実追加禁止、トーン変更</p>
                    </button>

                    <button class="cat-select-btn group p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 bg-white hover:bg-indigo-50/40 transition-all text-left flex flex-col justify-between" data-category="評価と検証・ファクトチェック">
                        <div class="flex items-center justify-between w-full mb-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">第2章</span>
                            <span class="text-xs text-slate-400 font-medium">13問</span>
                        </div>
                        <h3 class="font-bold text-slate-800 group-hover:text-indigo-600 text-base">評価と検証・ファクトチェック</h3>
                        <p class="text-xs text-slate-500 mt-1">流暢さと正確さの乖離、文字数・計算・参照元の検算</p>
                    </button>

                    <button class="cat-select-btn group p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 bg-white hover:bg-indigo-50/40 transition-all text-left flex flex-col justify-between" data-category="改善とフィードバック・反復">
                        <div class="flex items-center justify-between w-full mb-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800">第3章</span>
                            <span class="text-xs text-slate-400 font-medium">12問</span>
                        </div>
                        <h3 class="font-bold text-slate-800 group-hover:text-indigo-600 text-base">改善とフィードバック・反復</h3>
                        <p class="text-xs text-slate-500 mt-1">具体的ズレの指摘、自己点検リスト、反復設計</p>
                    </button>

                    <button class="cat-select-btn group p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 bg-white hover:bg-indigo-50/40 transition-all text-left flex flex-col justify-between" data-category="質問型プロンプトと意思決定">
                        <div class="flex items-center justify-between w-full mb-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-800">第4章</span>
                            <span class="text-xs text-slate-400 font-medium">13問</span>
                        </div>
                        <h3 class="font-bold text-slate-800 group-hover:text-indigo-600 text-base">質問型プロンプトと意思決定</h3>
                        <p class="text-xs text-slate-500 mt-1">推測の防止、生成と意思決定の分離、最終チェック5点</p>
                    </button>
                </div>

                <button class="cat-select-btn w-full p-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-sm hover:shadow transition-all flex items-center justify-center space-x-2" data-category="すべて">
                    <span>全50問 総合実力判定テスト</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </button>
            </div>
        </section>

        <!-- ================= 2. QUIZ SCREEN ================= -->
        <section id="screen-quiz" class="hidden">
            <div class="mb-4">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-600 mb-1.5">
                    <span id="score-counter" class="text-indigo-600">正解: 0</span>
                    <span id="progress-text">1 / 50</span>
                </div>
                <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div id="progress-bar-fill" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
                </div>
            </div>

            <!-- Quiz Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-7">
                <div class="flex items-center justify-between pb-3.5 mb-4 border-b border-slate-100">
                    <span id="q-number" class="text-xs font-extrabold text-indigo-600 tracking-wider">第 1 問</span>
                    <span id="q-category" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100">カテゴリ</span>
                </div>

                <h2 id="q-text" class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed mb-6">
                    問題文がここに入ります。
                </h2>

                <!-- Options -->
                <div id="options-container" class="space-y-3 mb-6">
                    <!-- Buttons inserted dynamically -->
                </div>

                <!-- Explanation Box -->
                <div id="explanation-box" class="hidden rounded-xl p-4 sm:p-5 border-l-4 mb-6 fade-in">
                    <div id="res-title" class="font-extrabold text-base mb-1.5 flex items-center space-x-1.5"></div>
                    <div id="exp-text" class="text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line font-medium"></div>
                </div>

                <!-- Actions -->
                <div class="flex flex-col sm:flex-row items-center gap-3">
                    <button id="btn-next" class="hidden w-full py-3.5 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm sm:text-base shadow-sm transition-all text-center">
                        次の問題へ進む
                    </button>
                    <button id="btn-quit" class="w-full sm:w-auto py-2.5 px-4 text-xs font-semibold text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-all text-center">
                        中断してホームに戻る
                    </button>
                </div>
            </div>
        </section>

        <!-- ================= 3. RESULT SCREEN ================= -->
        <section id="screen-result" class="hidden fade-in">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8 text-center">
                <span class="inline-block px-3 py-1 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-full mb-3 border border-emerald-100">
                    TEST COMPLETED
                </span>
                <h2 id="result-title" class="text-xl sm:text-2xl font-black text-slate-900">演習完了！</h2>
                
                <div class="my-6 inline-flex flex-col items-center justify-center w-36 h-36 rounded-full bg-slate-50 border-4 border-indigo-500 shadow-inner">
                    <span id="final-score" class="text-3xl sm:text-4xl font-black text-indigo-600 tracking-tight">0 / 0</span>
                    <span id="final-percentage" class="text-xs font-bold text-slate-400 mt-0.5">0%</span>
                </div>

                <div id="eval-box" class="bg-slate-50 rounded-xl p-4 sm:p-5 border border-slate-200/60 max-w-md mx-auto mb-6 text-left">
                    <h4 class="text-xs font-bold text-indigo-600 tracking-wider uppercase mb-1">講評・フィードバック</h4>
                    <p id="eval-msg" class="text-xs sm:text-sm text-slate-700 leading-relaxed font-medium"></p>
                </div>

                <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                    <button id="btn-retry" class="w-full sm:w-auto py-3.5 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow transition-all">
                        同じカテゴリをやり直す
                    </button>
                    <button id="btn-home-from-result" class="w-full sm:w-auto py-3.5 px-6 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition-all">
                        ホームに戻る
                    </button>
                </div>
            </div>
        </section>

    </main>

    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200">
        生成AIパスポート 試験対策｜出力を育てるプロンプティング演習
    </footer>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const quizData = [
            // ==========================================
            // 第1章: 文章の変換・要約・校正 (12問)
            // ==========================================
            {
                c: "文章の変換・要約・校正",
                q: "文章の処理において、「校正」と「要約」の決定的な違いとして最も適切なものはどれか？",
                o: [
                    "校正は誤字脱字や表現の不備を整える作業であり、要約は重要点を残しながら文章を短く圧縮する作業である",
                    "校正は文字数を半分以下にする作業であり、要約は新しい情報を付け足してわかりやすくする作業である",
                    "校正は小学生向けに行う作業であり、要約は専門家向けに行う作業である",
                    "校正と要約は同義語であり、AIに対するプロンプト上の効果や指示内容に違いはない"
                ],
                a: 0,
                e: "【解説】\n校正は「内容を変えずに誤字・表現の不備を整える作業」、要約は「重要点を残して短くする作業」です。同じ文章を対象にしていても、AIに求めるInstruction（動作）が根本から異なります。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "同じ元文を要約させる場合でも、「テスト前の復習用」と「保護者向け案内」でプロンプトの設計を変えるべき理由は何か？",
                o: [
                    "読み手と利用目的に応じて、残すべき情報の「優先順位」が根本的に変化するから",
                    "AIは同じプロンプトを2回以上処理すると文字化けを起こす性質があるから",
                    "保護者向けの要約では、必ず元文に存在しない新しい事実を創作して補う必要があるから",
                    "テスト前の復習用プロンプトでは、Temperatureを最大値（2.0）に設定しなければならないから"
                ],
                a: 0,
                e: "【解説】\n要約とは単に「文字を削る」ことではなく、目的に応じて残す情報の優先順位を決める作業です。復習用なら専門用語や定義、保護者向けなら日程や持ち物など、残す情報が変わるためContext（目的・読者）の指定が不可欠です。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "高校生向けの教材文を「小学生向けに説明して」とAIに指示する場合、プロンプトの4要素（Instruction / Context / Input Data / Output Indicator）のうち、どの要素の変更に該当するか？",
                o: [
                    "Context（前提・対象者の変更）",
                    "Instruction（動作指示の変更）",
                    "Input Data（処理対象データの変更）",
                    "Output Indicator（出力文字数のみの変更）"
                ],
                a: 0,
                e: "【解説】\n読み手を高校生から小学生へ切り替える指示は、「文章の対象者（読者層）」という前提条件を変更しているためContextに該当します。語彙や説明レベルを制御する基準となります。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "要約や文章変換を依頼するプロンプトで、「元文にない事実は追加しないでください」と明記する実務上の最大のメリットは何か？",
                o: [
                    "AIが一般知識や推測で勝手に内容を補完し、ハルシネーション（幻覚）を起こすリスクを抑えられる",
                    "AIの処理速度が100倍以上高速化され、サーバーの負荷がゼロになる",
                    "AIが自動的にインターネット上の最新ニュースを全件検索して添付してくれるようになる",
                    "文字数が必ず指定文字数のピッタリ1文字の狂いもなく一致するようになる"
                ],
                a: 0,
                e: "【解説】\n「元文の範囲内だけで答える」「事実を追加しない」とInput Dataの範囲を厳格に制約（グラウンディング）することで、AIが過去の学習知識から勝手に推測して意図しない嘘を混ぜるリスクを大幅に低減できます。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "「次の探究学習の流れから、①問い ②仮説 ③データ収集 ④修正 のように4ステップの箇条書きにしてください」という指示において、「4ステップの箇条書き」は何の要素に該当するか？",
                o: [
                    "Output Indicator（出力形式の指定）",
                    "Context（前提背景の指定）",
                    "Input Data（入力データの指定）",
                    "Role（ペルソナの指定）"
                ],
                a: 0,
                e: "【解説】\n「4ステップ」「箇条書き」などの出力件数や返答のフォーマットを指定するものはOutput Indicatorに該当します。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "説明文を「先輩と新入生の会話形式」に変換させるプロンプトを作成する際、AIの出力のブレを防ぐために設定すべき項目として最も適切なものはどれか？",
                o: [
                    "話者の設定（誰と誰か）、会話の目的、および往復数（例：4往復以内）",
                    "AIのサーバー設置場所と通信プロトコル",
                    "モデルの事前学習パラメータの重み行列",
                    "プロンプトのフォントサイズと背景色"
                ],
                a: 0,
                e: "【解説】\n会話形式への変換では、「誰が誰に」「何のために話すか」「何往復でまとめるか」という話者設定・目的・形式制限を明確にすることで、まとまりのある実用的な会話文が生成されます。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "抽象的な概念を「部活動の作戦改善」などの『例え話（アナロジー）』を用いて説明させるプロンプトの工夫として、最も本質的なものはどれか？",
                o: [
                    "元の構造（例：問い→仮説→検証→見直し）と、例え先の対応関係が明確に分かるように指示する",
                    "例え話の中にできるだけ多くの有名人の名前を登場させる",
                    "文字数を無制限にし、AIに自由に架空の物語を作らせる",
                    "AIに対して「人間らしい感情を込めて感動的に書いて」とだけ指示する"
                ],
                a: 0,
                e: "【解説】\n効果的な例え話は「構造の対応関係（元の概念Aが例え先のBに対応する）」が一致している必要があります。対応関係を指定することで、わかりやすく論理的な比喩表現を引き出せます。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "長文の誤字脱字をチェックさせるプロンプトで、AIが勝手に文章の意味や構成を書き換えてしまうのを防ぐ最も安全な指示はどれか？",
                o: [
                    "「元文の内容・構成は改変せず、修正箇所と修正理由を表形式で出力してください」と指示する",
                    "「とにかく最高に美しい文章に書き直してください」と指示する",
                    "「文字数を必ず元の文章の2倍に増やしてください」と指示する",
                    "「誤字を見つけたら、新しいエピソードを勝手に追加してください」と指示する"
                ],
                a: 0,
                e: "【解説】\n「校正」と「内容改変」を明確に分離するため、「元の文意を変えない」という制約と、「修正箇所と理由の表を出力させる」という形式指定を組み合わせるのが実務上最も安全です。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "AIに「この文章をビジネスメール調に変換して」と指示する際のリスクと対策として、最も適切なものはどれか？",
                o: [
                    "事実関係が変わったり誇張されたりするリスクがあるため、「元文の事実のみを残し、挨拶と文体だけを整えること」と制約する",
                    "メール送信ボタンが自動で押されてしまうリスクがあるため、パソコンの電源を切る",
                    "ビジネスメールに変換すると文字化けするリスクがあるため、英語で指示する",
                    "敬語を使うとAIのトークン消費量が100倍になるため、タメ口で出力させる"
                ],
                a: 0,
                e: "【解説】\n文体変換（トーンの変更）を依頼すると、AIが勝手な挨拶や未確定の約束事を付け足すリスクがあります。「元文の事実範囲を超えない」制約を設けることが肝要です。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "「次の案内文から重要語句を3つ抽出し、それぞれ箇条書きで1行で解説してください」というプロンプトに含まれるOutput Indicatorはどれか？",
                o: [
                    "「3つ」「箇条書き」「1行で解説」という形式・件数・長さの指定",
                    "「次の案内文」という入力データの指定",
                    "「抽出する」「解説する」という動作の指定",
                    "「案内文を読む対象者」という背景の指定"
                ],
                a: 0,
                e: "【解説】\n抽出する件数（3つ）、表示形式（箇条書き）、各項目の長さ（1行）はすべて返答の形状を指定するOutput Indicatorです。"
            },
            {
                c: "文章の変換・要約・校正",
                q: "文章のトーン変換（例：論文調から中学生向けへ）を行う際、プロンプトエンジニアリングにおけるAIの内部動作の理解として適切なものはどれか？",
                o: [
                    "ターゲット層に適した語彙や説明レベルの確率分布へ絞り込むためのContext（文脈）を与えている",
                    "AIの内部プログラムコードを直接書き換えて新しい専用AIを作成している",
                    "AIの物理的な計算クロック数を上昇させて知能を高めている",
                    "インターネット上のすべてのブログをリアルタイムで検索して切り貼りしている"
                ],
                a: 0,
                e: "【解説】\nトーン変換の指示は、AIが次に来る単語を予測する際の確率分布を「中学生にわかりやすい語彙・文構造」の領域へと絞り込むContextとして機能します。"
            },

                const badge = document.createElement('span');
                badge.className = "w-6 h-6 rounded-full bg-white border border-slate-300 text-slate-600 text-xs flex items-center justify-center flex-shrink-0 mt-0.5 font-bold";
                badge.textContent = String.fromCharCode(65 + idx); // A, B, C, D

                const textSpan = document.createElement('span');
                textSpan.className = "flex-grow leading-snug";
                textSpan.textContent = opt.text;

                btn.appendChild(badge);
                btn.appendChild(textSpan);

                btn.addEventListener('click', () => handleAnswer(opt, btn, options));
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedOpt, selectedBtn, allOptions) {
            if (isAnswered) return;
            isAnswered = true;

            const buttons = optionsContainer.querySelectorAll('.opt-btn');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:border-slate-300', 'hover:bg-slate-100/80');
                b.classList.add('opacity-60', 'cursor-default');
            });

            selectedBtn.classList.remove('opacity-60');

            if (selectedOpt.isCorrect) {
                score++;
                selectedBtn.classList.remove('border-slate-200', 'bg-slate-50/50');
                selectedBtn.classList.add('border-emerald-500', 'bg-emerald-50/70', 'text-emerald-950');
                
                resTitle.className = "font-extrabold text-base mb-1 text-emerald-700 flex items-center space-x-1";
                resTitle.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg><span>正解です！</span>`;
                expBox.classList.add('bg-emerald-50/60', 'border-emerald-500');
            } else {
                selectedBtn.classList.remove('border-slate-200', 'bg-slate-50/50');
                selectedBtn.classList.add('border-rose-500', 'bg-rose-50/70', 'text-rose-950');

                resTitle.className = "font-extrabold text-base mb-1 text-rose-700 flex items-center space-x-1";
                resTitle.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg><span>不正解...</span>`;
                expBox.classList.add('bg-rose-50/60', 'border-rose-500');

                // Highlight the correct one
                buttons.forEach((b, idx) => {
                    if (allOptions[idx].isCorrect) {
                        b.classList.remove('opacity-60', 'border-slate-200');
                        b.classList.add('border-emerald-500', 'bg-emerald-50/70', 'text-emerald-950', 'ring-2', 'ring-emerald-400');
                    }
                });
            }

            scoreCounter.textContent = `正解: ${score}`;
            expText.textContent = currentList[currentIndex].e;
            expBox.classList.remove('hidden');

            if (currentIndex === currentList.length - 1) {
                btnNext.textContent = "総合結果を見る";
            } else {
                btnNext.textContent = "次の問題へ進む";
            }
            btnNext.classList.remove('hidden');
        }

        btnNext.addEventListener('click', () => {
            currentIndex++;
            renderQuestion();
        });

        btnQuit.addEventListener('click', () => {
            switchScreen(screenHome);
        });

        btnHomeFromResult.addEventListener('click', () => {
            switchScreen(screenHome);
        });

        btnRetry.addEventListener('click', () => {
            startQuiz(selectedCategory);
        });

        function showResult() {
            switchScreen(screenResult);
            const total = currentList.length;
            const pct = Math.round((score / total) * 100);

            resultTitle.textContent = `${selectedCategory} 完了！`;
            finalScore.textContent = `${score} / ${total}`;
            finalPercentage.textContent = `正答率: ${pct}%`;

            let msg = "";
            if (pct >= 90) {
                msg = "完璧です！プロンプトの変換・評価・改善の本質（なぜその指示にするのか）が完全に身についています。実務でも試験でも迷わず判断できるレベルです。";
            } else if (pct >= 75) {
                msg = "合格ライン突破！要約の優先順位やファクトチェックの検証観点など、主要な論点を的確に捉えられています。間違えた問題の「なぜ」を確認しておきましょう。";
            } else if (pct >= 50) {
                msg = "基礎は理解できています。「流暢さと正確さの違い」「質問型プロンプトの主導権の所在」など、引っかかりやすい論点を解説で再確認してみましょう。";
            } else {
                msg = "解説をじっくり読んで復習しましょう。単に指示を出すだけでなく、「AIがどう推論するか」「出力後に何で検算するか」を意識すると一気に理解が深まります。";
            }
            evalMsg.textContent = msg;
        }
    });
    </script>
</body>
</html>
