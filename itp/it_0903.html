                    <span>全50問 総合実力診断テスト</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>

        <!-- ================= 2. QUIZ SCREEN ================= -->
        <section id="screen-quiz" class="hidden">

                    <div id="exp-text" class="text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line font-medium"></div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row items-center gap-3">

            </div>
        </section>

        <!-- ================= 3. RESULT SCREEN ================= -->
        <section id="screen-result" class="hidden fade-in">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8 text-center">
                <span class="inline-block px-3 py-1 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-full mb-3 border border-emerald-100">
                    TEST COMPLETED
                </span>
                <h2 id="result-title" class="text-xl sm:text-2xl font-black text-slate-900">演習完了！</h2>
                
                <div class="my-6 inline-flex flex-col items-center justify-center w-36 h-36 rounded-full bg-slate-50 border-4 border-blue-500 shadow-inner">
                    <span id="final-score" class="text-3xl sm:text-4xl font-black text-blue-600 tracking-tight">0 / 0</span>
                    <span id="final-percentage" class="text-xs font-bold text-slate-400 mt-0.5">0%</span>
                </div>

                <div class="bg-slate-50 rounded-xl p-4 sm:p-5 border border-slate-200/60 max-w-md mx-auto mb-6 text-left">

                    </button>
                    <button id="btn-home-from-result" class="w-full sm:w-auto py-3.5 px-6 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition-all">
                        ホームに戻る
                    </button>
                </div>
            </div>

    </main>

    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200">
        ITパスポート試験対策｜テクノロジ系 基礎マスター50本ノック
    </footer>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const quizData = [
            // ========================================================
            // 第1章: データ表現と基数変換 (10問)
            // ========================================================
            {
                c: "データ表現と基数変換",
                q: "コンピュータが内部の情報を処理・保持する際に、すべてのデータを「0」と「1」の2進数で表現する物理的な理由として最も適切なものはどれか？",
                o: [
                    "電圧の高低や電流のON/OFFなど、電気回路の物理的な2つの状態を判別・制御するのが最も簡単で誤作動が少ないから",
                    "世界中の数学者が話し合い、10進数よりも2進数のほうが人間にとって直感的に理解しやすいと決定したから",
                    "0と1以外の数字を使うと、コンピュータのハードディスクの物理的な重さが急激に重くなってしまうから",
                    "インターネットの通信ケーブルには、0と1の形をした物理的なカプセルしか通過できない構造になっているから"
                ],
                a: 0,
                e: "【解説】\nコンピュータは半導体素子（トランジスタ）のスイッチON/OFF（電圧の高/低、磁気の向きなど）を利用して情報を扱います。物理的に「2つの状態」を区別するのが最も回路構造を単純化でき、ノイズによる誤作動を劇的に防ぐことができるためです。"
            },
            {
                c: "データ表現と基数変換",
                q: "コンピュータが扱うデータの最小単位である「ビット（bit）」と「バイト（Byte）」の関係について、正しい説明はどれか？",
                o: [
                    "1バイト（Byte）は 8ビット（bit）をまとめた単位である",
                    "1ビット（bit）は 8バイト（Byte）をまとめた単位である",
                    "ビットとバイトは同義語であり、どちらも16ビットのデータを表す",
                    "1バイトは10進数の10桁分（10ビット）をまとめた単位である"
                ],
                a: 0,
                e: "【解説】\n0または1の1桁を「1ビット（bit）」と呼び、8個のビットをまとめたものを「1バイト（Byte）」と呼びます。「1 Byte = 8 bits」はデータ容量計算の最も重要な基本公式です。"
            },
            {
                c: "データ表現と基数変換",
                q: "8ビット（1バイト）のデータを用いて表現できる情報の組み合わせ（状態）の総数として、正しいものはどれか？",
                o: [
                    "256通り（2の8乗）",
                    "8通り（2の3乗）",
                    "64通り（2の6乗）",
                    "1024通り（2の10乗）"
                ],
                a: 0,
                e: "【解説】\nnビットで表現できる組み合わせの数は「2のn乗通り」です。8ビットの場合は 2^8 = 256通り となります（0〜255の整数値、または256種類の文字コードや色情報などを表せます）。"
            },
            {
                c: "データ表現と基数変換",
                q: "8ビットの符号なし整数（マイナス符号を含まない0以上の整数）で表現できる数値の「最大値」はいくつになるか？",
                o: [
                    "255",
                    "256",
                    "128",
                    "512"
                ],
                a: 0,
                e: "【解説】\n【ひっかけ注意！】\n表現できる組み合わせの数は「256通り」ですが、最小値「0」から数え始めるため、表現できる数値の範囲は「0〜255」となり、最大値は「255」になります。"
            },
            {
                c: "データ表現と基数変換",
                q: "2進数の「1011」を10進数で表した値として、正しいものはどれか？",
                o: [
                    "11",
                    "13",
                    "9",
                    "15"
                ],
                a: 0,
                e: "【解説】\n2進数は右から「1の位、2の位、4の位、8の位」の重みを持ちます。\n2進数 1011 = (1 × 8) + (0 × 4) + (1 × 2) + (1 × 1) = 8 + 0 + 2 + 1 = 11 となります。"
            },
            {
                c: "データ表現と基数変換",
                q: "2進数の「1100」を10進数で表した値として、正しいものはどれか？",
                o: [
                    "12",
                    "14",
                    "6",
                    "10"
                ],
                a: 0,
                e: "【解説】\n2進数 1100 は、8の位が1、4の位が1、2の位が0、1の位が0です。\nしたがって、8 + 4 + 0 + 0 = 12 となります。"
            },
            {
                c: "データ表現と基数変換",
                q: "10進数の「13」を4ビットの2進数で表した値として、正しいものはどれか？",
                o: [
                    "1101",
                    "1011",
                    "1110",
                    "0111"
                ],
                a: 0,
                e: "【解説】\n10進数 13 を「8, 4, 2, 1」の組み合わせに分解すると、13 = 8 + 4 + 1 です。\nよって、8の位=1, 4の位=1, 2の位=0, 1の位=1 となり、2進数では「1101」になります。"
            },
            {
                c: "データ表現と基数変換",
                q: "4ビットのデータで表現できる情報の組み合わせ（状態）の総数は何通りか？",
                o: [
                    "16通り",
                    "8通り",
                    "4通り",
                    "32通り"
                ],
                a: 0,
                e: "【解説】\n4ビットで表せる組み合わせは、2^4 = 2 × 2 × 2 × 2 = 16通り です。値の範囲としては「0〜15」の16種類の整数を表現できます。"
            },
            {
                c: "データ表現と基数変換",
                q: "コンピュータのデータ容量の単位について、小さい順から大きい順へと正しく並んでいるものはどれか？",
                o: [
                    "バイト (B) ＜ キロバイト (KB) ＜ メガバイト (MB) ＜ ギガバイト (GB) ＜ テラバイト (TB)",
                    "バイト (B) ＜ メガバイト (MB) ＜ キロバイト (KB) ＜ テラバイト (TB) ＜ ギガバイト (GB)",
                    "ビット (bit) ＜ ギガバイト (GB) ＜ メガバイト (MB) ＜ キロバイト (KB)",
                    "キロバイト (KB) ＜ テラバイト (TB) ＜ ギガバイト (GB) ＜ メガバイト (MB)"
                ],
                a: 0,
                e: "【解説】\nデータ量の単位は、Byte ＜ KB (10^3または2^10) ＜ MB (10^6または2^20) ＜ GB (10^9または2^30) ＜ TB (10^12または2^40) の順に大きくなります（およそ1,000倍ずつ桁が上がります）。写真データはMB、動画やストレージ容量はGBやTBがよく使われます。"
            },
            {
                c: "データ表現と基数変換",
                q: "2進数「01001011」を10進数に直した値として、正しい計算結果はどれか？（位の重み：128, 64, 32, 16, 8, 4, 2, 1）",
                o: [
                    "75",
                    "67",
                    "83",
                    "139"
                ],
                a: 0,
                e: "【解説】\n01001011 でビットが「1」になっている位を足し合わせます。\n64の位(1) + 8の位(1) + 2の位(1) + 1の位(1) = 64 + 8 + 2 + 1 = 75 となります。"
            },

            // ========================================================
            // 第2章: コンピュータシステムとOS (10問)
            // ========================================================
            {
                c: "コンピュータシステムとOS",
                q: "コンピュータの「頭脳」にあたり、主記憶からプログラムの命令を順次読み出して解釈し、計算や各装置のコントロールを行う装置はどれか？",
                o: [
                    "CPU（中央処理装置）",
                    "SSD（補助記憶装置）",
                    "GPU（描画専用チップ）",
                    "電源ユニット"
                ],
                a: 0,
                e: "【解説】\nCPU（Central Processing Unit：中央処理装置）は、プログラムの命令を読み取って処理するコンピュータの中心装置です。主な役割は「制御」と「演算」の2つです。"
            },
            {
                c: "コンピュータシステムとOS",
                q: "主記憶装置（メインメモリ/RAM）の性質や役割に関する説明として、最も適切なものはどれか？",
                o: [
                    "CPUが今まさに作業しているプログラムやデータを一時的に置く場所であり、電源を切ると内容が消滅（揮発）する",
                    "写真や動画などのデータを長期間保存する場所であり、電源を切ってもデータは半永久的に残る",
                    "インターネットから送られてくる不正なウイルスを自動的に検知・消去する装置である",
                    "キーボードやマウスなどの入力信号を直接電気エネルギーに変換する発電装置である"
                ],
                a: 0,
                e: "【解説】\n主記憶（RAM）は「作業机」に例えられます。CPUが直接アクセスして高速に読み書きできますが、電源を切るとデータが消える「揮発性」を持ちます。机が広い（メモリ容量が大きい）ほど、たくさんのアプリを同時に快適に開くことができます。"
            },
            {
                c: "コンピュータシステムとOS",
                q: "補助記憶装置（SSDやHDD）の性質や役割に関する説明として、最も適切なものはどれか？",
                o: [
                    "電源を切ってもデータが消えず、OSやアプリケーション、写真などのファイルを長期間保存できる",
                    "CPUと全く同じ速度で計算処理を行うため、メインメモリの代わりにすべての演算を実行する",
                    "コンピュータのディスプレイ画面に映像を描画するための専用回路である",

        let currentList = [];
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;
        let selectedCategory = '';

        const screenHome = document.getElementById('screen-home');
        const screenQuiz = document.getElementById('screen-quiz');
        const screenResult = document.getElementById('screen-result');

        const qNumber = document.getElementById('q-number');
        const qCategory = document.getElementById('q-category');
        const qText = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options-container');
        const expBox = document.getElementById('explanation-box');
        const resTitle = document.getElementById('res-title');
        const expText = document.getElementById('exp-text');
        const btnNext = document.getElementById('btn-next');
        const btnQuit = document.getElementById('btn-quit');

        const scoreCounter = document.getElementById('score-counter');
        const progressText = document.getElementById('progress-text');
        const progressBarFill = document.getElementById('progress-bar-fill');

        const resultTitle = document.getElementById('result-title');
        const finalScore = document.getElementById('final-score');
        const finalPercentage = document.getElementById('final-percentage');
        const evalMsg = document.getElementById('eval-msg');
        const btnRetry = document.getElementById('btn-retry');
        const btnHomeFromResult = document.getElementById('btn-home-from-result');

        function switchScreen(toScreen) {
            screenHome.classList.add('hidden');
            screenQuiz.classList.add('hidden');
            screenResult.classList.add('hidden');

            toScreen.classList.remove('hidden');
            toScreen.classList.add('fade-in');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        document.querySelectorAll('.cat-select-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const cat = btn.getAttribute('data-category');
                startQuiz(cat);
            });
        });

        function startQuiz(category) {
            selectedCategory = category;
            if (category === 'すべて') {
                currentList = [...quizData];
            } else {
                currentList = quizData.filter(item => item.c === category);
            }

            shuffle(currentList);
            currentIndex = 0;
            score = 0;

            switchScreen(screenQuiz);
            renderQuestion();
        }

        function renderQuestion() {
            if (currentIndex >= currentList.length) {
                showResult();
                return;
            }

            isAnswered = false;
            const q = currentList[currentIndex];

            // Reset UI states
            expBox.classList.add('hidden');
            expBox.classList.remove('bg-emerald-50', 'border-emerald-500', 'bg-rose-50', 'border-rose-500');
            btnNext.classList.add('hidden');
            optionsContainer.innerHTML = '';

            // Update Labels
            qNumber.textContent = `第 ${currentIndex + 1} 問`;
            qCategory.textContent = q.c;
            qText.textContent = q.q;

            scoreCounter.textContent = `正解: ${score}`;
            progressText.textContent = `${currentIndex + 1} / ${currentList.length}`;
            const pct = ((currentIndex + 1) / currentList.length) * 100;
            progressBarFill.style.width = `${pct}%`;

            // Prepare shuffled options
            const options = q.o.map((text, idx) => ({ text, isCorrect: idx === q.a }));
            shuffle(options);

            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "opt-btn w-full p-4 rounded-xl border-2 border-slate-200 hover:border-slate-300 bg-slate-50/50 hover:bg-slate-100/80 text-left text-sm sm:text-base font-semibold text-slate-800 transition-all flex items-start space-x-3";
                
                const badge = document.createElement('span');
                badge.className = "w-6 h-6 rounded-full bg-white border border-slate-300 text-slate-600 text-xs flex items-center justify-center flex-shrink-0 mt-0.5 font-bold";
                badge.textContent = String.fromCharCode(65 + idx); // A, B, C, D

                const textSpan = document.createElement('span');
                textSpan.className = "flex-grow leading-snug";
                textSpan.textContent = opt.text;

                btn.appendChild(badge);
                btn.appendChild(textSpan);

                btn.addEventListener('click', () => handleAnswer(opt, btn, options));
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedOpt, selectedBtn, allOptions) {
            if (isAnswered) return;
            isAnswered = true;

            const buttons = optionsContainer.querySelectorAll('.opt-btn');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:border-slate-300', 'hover:bg-slate-100/80');
                b.classList.add('opacity-60', 'cursor-default');
            });

            selectedBtn.classList.remove('opacity-60');

            if (selectedOpt.isCorrect) {
                score++;
                selectedBtn.classList.remove('border-slate-200', 'bg-slate-50/50');
                selectedBtn.classList.add('border-emerald-500', 'bg-emerald-50/70', 'text-emerald-950');
                
                resTitle.className = "font-extrabold text-base mb-1 text-emerald-700 flex items-center space-x-1";
                resTitle.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg><span>正解です！</span>`;
                expBox.classList.add('bg-emerald-50/60', 'border-emerald-500');
            } else {
                selectedBtn.classList.remove('border-slate-200', 'bg-slate-50/50');
                selectedBtn.classList.add('border-rose-500', 'bg-rose-50/70', 'text-rose-950');

                resTitle.className = "font-extrabold text-base mb-1 text-rose-700 flex items-center space-x-1";
                resTitle.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg><span>不正解...</span>`;
                expBox.classList.add('bg-rose-50/60', 'border-rose-500');

                // Highlight the correct one
                buttons.forEach((b, idx) => {
                    if (allOptions[idx].isCorrect) {
                        b.classList.remove('opacity-60', 'border-slate-200');
                        b.classList.add('border-emerald-500', 'bg-emerald-50/70', 'text-emerald-950', 'ring-2', 'ring-emerald-400');
                    }
                });
            }

            scoreCounter.textContent = `正解: ${score}`;
            expText.textContent = currentList[currentIndex].e;
            expBox.classList.remove('hidden');

            if (currentIndex === currentList.length - 1) {
                btnNext.textContent = "総合結果を見る";
            } else {
                btnNext.textContent = "次の問題へ進む";
            }
            btnNext.classList.remove('hidden');
        }

        btnNext.addEventListener('click', () => {
            currentIndex++;
            renderQuestion();
        });

        btnQuit.addEventListener('click', () => {
            switchScreen(screenHome);
        });

        btnHomeFromResult.addEventListener('click', () => {
            switchScreen(screenHome);
        });

        btnRetry.addEventListener('click', () => {
            startQuiz(selectedCategory);
        });

        function showResult() {
            switchScreen(screenResult);
            const total = currentList.length;
            const pct = Math.round((score / total) * 100);

            resultTitle.textContent = `${selectedCategory} 完了！`;
            finalScore.textContent = `${score} / ${total}`;
            finalPercentage.textContent = `正答率: ${pct}%`;

            let msg = "";
            if (pct >= 90) {
                msg = "完璧です！テクノロジ系の基礎（基数変換、システム構造、ネットワーク、セキュリティの区別）が完全に身についています。本試験でも高得点が期待できるレベルです。";
            } else if (pct >= 75) {
                msg = "合格ライン突破！主要な概念（主キーの条件、DNS/HTTPSの役割、認証と認可の区別など）を的確に理解できています。間違えた問題の解説を確認してさらに盤石にしましょう。";
            } else if (pct >= 50) {
                msg = "基礎は理解できています。「暗号化とハッシュの違い」「2進数の桁の重み計算」「主記憶と補助記憶の役割」など、混同しやすい論点を解説で再確認してみましょう。";
            } else {
                msg = "解説をじっくり読んで復習しましょう。用語を丸暗記するのではなく、「机＝メモリ」「電話帳＝DNS」「誰か＝認証」などの日常の例えに置き換えて整理すると一気に解きやすくなります。";
            }
            evalMsg.textContent = msg;
        }
    });
    </script>
