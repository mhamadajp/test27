<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10mの崖とはしごの選択</title><style>body{margin:0;background:#f6f5f0;font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;color:#304456}main{max-width:1100px;margin:20px auto;padding:12px}h1{text-align:center;font-size:clamp(22px,3vw,32px)}svg{width:100%;height:auto;background:#e8f6ff;border-radius:20px;box-shadow:0 8px 25px #9ab4c455}button{border:0;border-radius:12px;padding:12px 22px;background:#527eaa;color:white;font-size:17px;cursor:pointer}button:focus-visible{outline:3px solid orange}.controls{text-align:center;margin:15px}.note{text-align:center;font-size:19px;min-height:2em;font-weight:bold}.sub{text-align:center;color:#667}.ladder{stroke:#b77c48;stroke-width:9;stroke-linecap:round}.rung{stroke:#dfaa6f;stroke-width:6;stroke-linecap:round}.label{font-weight:bold;font-size:22px;fill:#344b60}.tiny{font-size:16px;fill:#526b7c}.pick{cursor:pointer}.pick:focus{outline:none}.pick:focus rect{stroke:#f39c49;stroke-width:5}</style></head><body><main><h1>10mの崖に登るには、どのはしご？</h1><p class="sub">最初に4本を比べてから、順番に試してみよう。</p><svg id="scene" viewBox="0 0 1100 620" role="img" aria-label="10メートルの崖と5、8、18、12メートルのはしごのアニメーション"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d9efff"/><stop offset="1" stop-color="#fff7e9"/></linearGradient></defs><rect width="1100" height="620" fill="url(#sky)"/><circle cx="935" cy="95" r="45" fill="#ffe6a2"/><path d="M0 495H720V180H1100V620H0Z" fill="#b8d5a8"/><path d="M720 180H1100V620H720Z" fill="#d3b79c"/><path d="M720 180V620" stroke="#9d8068" stroke-width="7"/><path d="M720 180H1100" stroke="#88ae78" stroke-width="12"/><text x="785" y="155" class="label">崖の高さ 10m</text><path d="M750 185h30m-15 0v310m-15 0h30" stroke="#587c8f" stroke-width="3" fill="none" stroke-dasharray="6 6"/><g id="choices"></g><g id="active"></g><g id="person" transform="translate(610 440)"><circle cy="-28" r="18" fill="#f2bfa4"/><path d="M0 -10v54m0-32-22 19m22-19 22 19M0 44l-20 31m20-31 20 31" stroke="#4b708b" stroke-width="9" stroke-linecap="round" fill="none"/></g><rect x="32" y="25" width="405" height="64" rx="18" fill="#ffffffdf"/><text x="52" y="66" id="headline" class="label">どんなはしごがあるかな？</text><text x="30" y="580" id="caption" class="label">4本の長さを見比べよう</text></svg><div class="controls"><button id="play">▶ はじめから再生</button> <button id="next">次の場面 →</button> <button id="pause">⏸ 一時停止</button></div><p id="note" class="note" aria-live="polite">まずは、5m・8m・18m・12mの4本を確認しよう。</p><p class="sub">※崖は垂直で、はしごは斜めに立てかけるため、10mちょうどでは足りません。長さだけでなく角度と安定性も大切です。</p></main><script>
const ns='http://www.w3.org/2000/svg', choices=document.getElementById('choices'),active=document.getElementById('active'),person=document.getElementById('person');let step=0,timer=null;const lengths=[5,8,18,12], colors=['#d9a36d','#9cb2cd','#d5b18d','#90bda7'];function el(tag,attrs,parent){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e}function ladder(parent,x1,y1,x2,y2,width=16){const dx=x2-x1,dy=y2-y1,n=Math.hypot(dx,dy),px=-dy/n*width/2,py=dx/n*width/2;for(const s of [-1,1])el('line',{x1:x1+s*px,y1:y1+s*py,x2:x2+s*px,y2:y2+s*py,class:'ladder'},parent);for(let d=20;d<n-8;d+=28){let x=x1+dx*d/n,y=y1+dy*d/n;el('line',{x1:x-px,y1:y-py,x2:x+px,y2:y+py,class:'rung'},parent)}}function text(parent,x,y,str,cls='label'){let t=el('text',{x,y,class:cls,'text-anchor':'middle'},parent);t.textContent=str}function draw(){choices.innerHTML='';active.innerHTML='';document.getElementById('headline').textContent=step===0?'どんなはしごがあるかな？':`${lengths[step-1]}m のはしごを試す`;const notes=['まずは4本を見比べよう。どれが使いやすいかな？','5m：崖の上まで届かない！','8m：これも高さが足りない！','18m：届くけれど、長くて取り回しが大変。','12m：上端が届き、18mより扱いやすい！'];document.getElementById('note').textContent=notes[step];document.getElementById('caption').textContent=step===0?'5m　　8m　　18m　　12m':notes[step];if(step===0){lengths.forEach((v,i)=>{let x=75+i*143,base=493,height=[115,185,310,255][i];const g=el('g',{},choices);ladder(g,x,base,x+28,base-height);text(g,x+14,base-height-20,v+'m');text(g,x+14,525,['①','②','③','④'][i])});person.setAttribute('transform','translate(610 440)')}else{let v=lengths[step-1],endX,endY,startX,startY=494;if(v===5){startX=580;endX=698;endY=390}else if(v===8){startX=510;endX=698;endY=280}else if(v===18){startX=210;endX=748;endY=181}else{startX=480;endX=742;endY=181}ladder(active,startX,startY,endX,endY,22);text(active,startX+30,540,v+'m');if(step===4){el('circle',{cx:745,cy:185,r:31,fill:'#ffffffa0'},active);text(active,745,195,'✓');person.setAttribute('transform','translate(770 112)')}else{person.setAttribute('transform',`translate(${startX-38} 440)`)}}}function advance(){step=(step+1)%5;draw()}function stop(){clearInterval(timer);timer=null}document.getElementById('play').onclick=()=>{stop();step=0;draw();timer=setInterval(advance,3500)};document.getElementById('next').onclick=()=>{stop();advance()};document.getElementById('pause').onclick=stop;draw();</script></body></html>
