<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花火はマンションの上に見える？</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:#11151c;
  color:#eef3f8;
}
.app{
  width:100%;
  padding:24px;
}
.wrap{max-width:1100px;margin:auto}
h1{font-size:clamp(24px,4vw,36px);margin:0 0 8px}
.desc{color:#b5c0ca;line-height:1.7;margin:0 0 16px}
.grid{
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);
  gap:18px
}
.panel{
  background:#1b2028;
  border:1px solid #343b46;
  border-radius:18px;
  padding:16px
}
.controls{display:grid;gap:14px}
.control label{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:14px;
  font-weight:700
}
.val{font-variant-numeric:tabular-nums;color:#9bd2ef}
input[type=range]{
  width:100%;
  min-height:36px;
  accent-color:#2f779c
}
.reset{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:12px;
  background:#2f779c;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  padding:10px 16px
}
.reset:hover{filter:brightness(1.08)}
.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-top:16px
}
.stat{
  background:#1b2028;
  border:1px solid #343b46;
  border-radius:15px;
  padding:14px
}
.k{font-size:12px;color:#adb8c1}
.v{font-size:24px;font-weight:800;margin-top:4px}
.explain{
  margin-top:14px;
  background:#282317;
  border:1px solid #5c5032;
  padding:15px;
  border-radius:15px;
  line-height:1.75
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:8px;
  font-size:12px;
  color:#b7c1ca
}
.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px
}
svg{display:block;width:100%;height:auto}
.yes{color:#61d68a}
.no{color:#ff7c6f}
.note{
  margin-top:12px;
  color:#aeb9c3;
  font-size:12px;
  line-height:1.6
}
@media(max-width:760px){
  .app{padding:14px}
  .grid,.stats{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<div class="wrap">
<h1>花火はマンションの上に見える？</h1>
<p class="desc">花火の中心高度と、マンション屋上ぎりぎりの必要高度を比較します。条件を変えると、図と「見える／隠れる」の判定が連動します。</p>

<div class="grid">
<section class="panel">
<svg viewBox="0 0 920 540" role="img" aria-label="自宅からマンション越しに花火を見る断面図">
<defs>
  <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101c31"/>
    <stop offset=".62" stop-color="#274965"/>
    <stop offset="1" stop-color="#5d7c84"/>
  </linearGradient>
  <radialGradient id="core2">
    <stop offset="0" stop-color="#fffde1"/>
    <stop offset=".35" stop-color="#ffd56a"/>
    <stop offset="1" stop-color="#ef755f"/>
  </radialGradient>
</defs>

<rect width="920" height="540" rx="16" fill="url(#sky2)"/>
<rect y="435" width="920" height="105" fill="#1d2928"/>

<!-- 自宅 -->
<g>
  <rect x="42" y="385" width="78" height="50" fill="#ddc6a6"/>
  <polygon points="34,385 81,348 128,385" fill="#a85c55"/>
  <circle id="eye2" cx="113" cy="400" r="6" fill="#67d5ff"/>
  <text x="42" y="333" fill="#fff" font-size="19" font-weight="700">自宅</text>
</g>

<!-- マンション -->
<g>
  <rect id="bld2" x="250" y="264" width="112" height="171" rx="4" fill="#aab4bd"/>
  <text id="bHeight2" x="273" y="289" fill="#1a2732" font-size="17" font-weight="800">30m</text>
  <text id="bLabel2" x="224" y="239" fill="#fff" font-size="18" font-weight="700">10階建マンション</text>
</g>

<!-- 打ち上げ地点 -->
<g>
  <rect x="805" y="416" width="34" height="19" rx="3" fill="#4a5557"/>
  <line x1="822" y1="416" x2="822" y2="396" stroke="#bbc6ca" stroke-width="5"/>
  <text x="742" y="475" fill="#fff" font-size="18" font-weight="700">花火の打ち上げ地点</text>
</g>

<!-- 打ち上げ軌道 -->
<path id="trail2" d="M822 408 C815 350,822 300,820 250"
      fill="none" stroke="#f0a64c" stroke-width="4" stroke-dasharray="8 8"/>

<!-- 花火 -->
<g id="burst2">
  <circle cx="820" cy="145" r="17" fill="url(#core2)"/>
  <g stroke-linecap="round" stroke-width="5">
    <line x1="820" y1="126" x2="820" y2="78" stroke="#ffd768"/>
    <line x1="820" y1="164" x2="820" y2="212" stroke="#ff8e68"/>
    <line x1="801" y1="145" x2="748" y2="145" stroke="#f7c95f"/>
    <line x1="839" y1="145" x2="892" y2="145" stroke="#f7c95f"/>
    <line x1="806" y1="131" x2="767" y2="92" stroke="#ff9573"/>
    <line x1="834" y1="159" x2="873" y2="198" stroke="#ff9573"/>
    <line x1="834" y1="131" x2="873" y2="92" stroke="#ffe278"/>
    <line x1="806" y1="159" x2="767" y2="198" stroke="#ffe278"/>
  </g>
  <circle cx="820" cy="145" r="5" fill="#fffce6"/>
</g>

<text id="fhLabel2" x="740" y="50" fill="#fff" font-size="18" font-weight="800">花火 150m</text>

<!-- 視線 -->
<line id="actual2" x1="113" y1="400" x2="820" y2="145" stroke="#62d5ff" stroke-width="4"/>
<line id="threshold2" x1="113" y1="400" x2="820" y2="195" stroke="#ffd767" stroke-width="3" stroke-dasharray="9 8"/>
<circle id="roofpt2" cx="290" cy="264" r="6" fill="#ffd767"/>
<text x="675" y="205" fill="#ffe58a" font-size="15" font-weight="700">見える境界</text>

<!-- 距離 -->
<line x1="113" y1="492" x2="290" y2="492" stroke="#e7eef2"/>
<line x1="290" y1="492" x2="822" y2="492" stroke="#e7eef2"/>
<text id="dA2" x="170" y="518" fill="#fff" font-size="16">500m</text>
<text id="dB2" x="520" y="518" fill="#fff" font-size="16">残り1500m</text>
</svg>

<div class="legend">
  <span><i class="dot" style="background:#62d5ff"></i>実際の花火への視線</span>
  <span><i class="dot" style="background:#ffd767"></i>マンション屋上ぎりぎりの境界</span>
</div>
</section>

<section class="panel controls">
  <div class="control">
    <label for="bh2">マンション高さ <span class="val" id="bv2">30m</span></label>
    <input id="bh2" type="range" min="20" max="60" step="1" value="30">
  </div>
  <div class="control">
    <label for="eh2">見る位置の高さ <span class="val" id="ev2">2m</span></label>
    <input id="eh2" type="range" min="1" max="30" step="1" value="2">
  </div>
  <div class="control">
    <label for="bd2">自宅→マンション <span class="val" id="bdv2">500m</span></label>
    <input id="bd2" type="range" min="200" max="1500" step="50" value="500">
  </div>
  <div class="control">
    <label for="fd2">自宅→花火 <span class="val" id="fdv2">2000m</span></label>
    <input id="fd2" type="range" min="1000" max="4000" step="100" value="2000">
  </div>
  <div class="control">
    <label for="fh2">花火が開く高さ <span class="val" id="fhv2">150m</span></label>
    <input id="fh2" type="range" min="30" max="400" step="5" value="150">
  </div>
  <button type="button" class="reset" id="reset2">↺ 初期値にリセット</button>
</section>
</div>

<div class="stats">
  <div class="stat">
    <div class="k">見える境界</div>
    <div class="v" id="req2">114.0m</div>
  </div>
  <div class="stat">
    <div class="k">判定</div>
    <div class="v yes" id="vis2">見える</div>
  </div>
  <div class="stat">
    <div class="k">境界との差</div>
    <div class="v" id="mar2">+36.0m</div>
  </div>
</div>

<div class="explain">
  <strong id="summary2"></strong><br>
  <span id="detail2"></span>
</div>

<div class="note">
※ 地面は水平、マンションと花火がほぼ同じ方向にあるという単純モデルです。花火の直径や地形差は考慮していません。
</div>
</div>
</div>

<script>
(() => {
  const q = id => document.getElementById(id);

  const e = {
    bh:q('bh2'),
    eh:q('eh2'),
    bd:q('bd2'),
    fd:q('fd2'),
    fh:q('fh2')
  };

  const YGROUND=435;
  const TOP=55;
  const MAXH=400;
  const yFromHeight = h => YGROUND-(h/MAXH)*(YGROUND-TOP);

  function update(){
    let bh=+e.bh.value;
    let eh=+e.eh.value;
    let bd=+e.bd.value;
    let fd=+e.fd.value;
    let fh=+e.fh.value;

    if(bd>=fd){
      bd=Math.max(200,fd-100);
      e.bd.value=bd;
    }

    const required = eh + (bh-eh)*(fd/bd);
    const margin = fh-required;
    const visible = margin >= 0;

    q('bv2').textContent=bh+'m';
    q('ev2').textContent=eh+'m';
    q('bdv2').textContent=bd+'m';
    q('fdv2').textContent=fd+'m';
    q('fhv2').textContent=fh+'m';

    q('req2').textContent=required.toFixed(1)+'m';
    q('vis2').textContent=visible?'見える':'隠れる';
    q('vis2').className='v '+(visible?'yes':'no');
    q('mar2').textContent=(margin>=0?'+':'')+margin.toFixed(1)+'m';

    q('summary2').textContent = visible
      ? `花火の中心 ${fh}m は、見える境界 ${required.toFixed(1)}m より高いので「見える」と判定します。`
      : `花火の中心 ${fh}m は、見える境界 ${required.toFixed(1)}m より低いので「隠れる」と判定します。`;

    q('detail2').textContent =
      `計算：必要高さ = ${eh} + (${bh} − ${eh}) × ${fd} ÷ ${bd} = ${required.toFixed(1)}m`;

    const xH=113;
    const xF=820;
    const xB=xH+(xF-xH)*(bd/fd);

    const eyeY=yFromHeight(eh);
    const roofY=yFromHeight(bh);
    const fireY=yFromHeight(fh);
    const thresholdY=yFromHeight(required);

    q('bld2').setAttribute('x',xB-56);
    q('bld2').setAttribute('y',roofY);
    q('bld2').setAttribute('height',YGROUND-roofY);

    q('bHeight2').setAttribute('x',xB-28);
    q('bHeight2').setAttribute('y',roofY+24);
    q('bHeight2').textContent=bh+'m';

    q('eye2').setAttribute('cy',eyeY);

    q('actual2').setAttribute('y1',eyeY);
    q('actual2').setAttribute('y2',fireY);

    q('threshold2').setAttribute('y1',eyeY);
    q('threshold2').setAttribute('y2',thresholdY);

    q('roofpt2').setAttribute('cx',xB);
    q('roofpt2').setAttribute('cy',roofY);

    q('burst2').setAttribute('transform',`translate(0 ${fireY-145})`);
    q('fhLabel2').textContent='花火 '+fh+'m';

    q('trail2').setAttribute(
      'd',
      `M822 408 C815 350,822 300,820 ${Math.min(390,fireY+95)}`
    );

    q('dA2').textContent=bd+'m';
    q('dB2').textContent='残り'+(fd-bd)+'m';
  }

  Object.values(e).forEach(el => el.addEventListener('input', update));

  q('reset2').addEventListener('click', () => {
    e.bh.value=30;
    e.eh.value=2;
    e.bd.value=500;
    e.fd.value=2000;
    e.fh.value=150;
    update();
  });

  update();
})();
</script>
</body>
</html>
