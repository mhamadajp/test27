<!-- ... existing code ... -->
    function redraw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);

      drawGrid(rect);

      switch(currentTab) {
        case 'slope':
          drawSlopeMode();
          break;
        case 'formula':
          drawFormulaMode();
          break;
        case 'points':
          drawPointsMode();
          break;
        case 'parallel_perp':
          drawParallelPerpMode();
          break;
        case 'distance':
          drawDistanceMode();
          break;
        case 'exercises':
          drawExercisesMode();
          break;
        case 'worksheet_answers':
          drawWorksheetAnswerMode();
          break;
      }
    }

    function drawWorksheetAnswerMode() {
      const legend = document.getElementById('pointsLegend');
      const badge = document.getElementById('canvasBadge');

      if (selectedAnswerSection === 'ans1') {
        // Section 1: Points as addresses forming a line
        ctx.beginPath();
        ctx.moveTo(toScreenX(-2), toScreenY(-4));
        ctx.lineTo(toScreenX(6), toScreenY(12));
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#6366f1';
        ctx.stroke();

        // Draw multiple points with step paths from origin
        const pts = [{x: 0, y: 0}, {x: 1, y: 2}, {x: 2, y: 4}, {x: 3, y: 6}, {x: 4, y: 8}];
        pts.forEach((p, idx) => {
          if (idx > 0) {
            ctx.beginPath();
            ctx.setLineDash([3, 3]);
            ctx.strokeStyle = '#38bdf888';
            ctx.lineWidth = 1.5;
            ctx.moveTo(toScreenX(p.x), toScreenY(0));
            ctx.lineTo(toScreenX(p.x), toScreenY(p.y));
            ctx.stroke();
            ctx.setLineDash([]);
          }
          drawPoint(p.x, p.y, `(${p.x}, ${p.y})`, '#38bdf8', false, 5);
        });

        legend.innerHTML = `
          <div class="text-indigo-600 font-bold">1. 座標と直線</div>
          <div class="text-slate-600">各点の住所が規則正しく並ぶ</div>
        `;
        badge.innerHTML = `<span class="text-sky-300 font-bold">直線上には無限の点がある</span>：すべて $y = 2x$ の住所ルールに従っている！`;
      }
      else if (selectedAnswerSection === 'ans2') {
        // Section 2: Delta x = 3, Delta y = 6, Slope = 2
        const A = { x: 1, y: 2 };
        const B = { x: 4, y: 8 };

        // Line
        ctx.beginPath();
        ctx.moveTo(toScreenX(-1), toScreenY(-2));
        ctx.lineTo(toScreenX(5.5), toScreenY(11));
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#38bdf8';
        ctx.stroke();

        // Delta triangle
        ctx.beginPath();
        ctx.setLineDash([5, 4]);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#60a5fa'; // dx
        ctx.moveTo(toScreenX(A.x), toScreenY(A.y));
        ctx.lineTo(toScreenX(B.x), toScreenY(A.y));
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = '#fbbf24'; // dy
        ctx.moveTo(toScreenX(B.x), toScreenY(A.y));
        ctx.lineTo(toScreenX(B.x), toScreenY(B.y));
        ctx.stroke();
        ctx.setLineDash([]);

        // Unit stairs "1進んで2上がる"
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          const cx = A.x + i;
          const cy = A.y + i * 2;
          ctx.beginPath();
          ctx.moveTo(toScreenX(cx), toScreenY(cy));
          ctx.lineTo(toScreenX(cx + 1), toScreenY(cy));
          ctx.lineTo(toScreenX(cx + 1), toScreenY(cy + 2));
          ctx.stroke();
        }

        // Labels
        ctx.font = 'bold 12px JetBrains Mono';
        ctx.fillStyle = '#93c5fd';
        ctx.fillText('dx = 3 (横に3進む)', toScreenX(2.5) - 35, toScreenY(A.y) + 18);
        ctx.fillStyle = '#fde68a';
        ctx.fillText('dy = 6 (縦に6進む)', toScreenX(B.x) + 8, toScreenY(5));

        ctx.fillStyle = '#34d399';
        ctx.fillText('1進んで2上がる階段', toScreenX(2) - 40, toScreenY(7));

        drawPoint(A.x, A.y, 'A(1, 2)', '#ef4444', false, 7);
        drawPoint(B.x, B.y, 'B(4, 8)', '#ef4444', false, 7);

        legend.innerHTML = `
          <div class="text-indigo-600 font-bold">2. 傾き = 縦 ÷ 横</div>
          <div>$m = 6 / 3 = 2$</div>
        `;
        badge.innerHTML = `横の変化 $dx = 4 - 1 = \\mathbf{3}$、縦の変化 $dy = 8 - 2 = \\mathbf{6}$ $\\implies$ 傾き $m = \\mathbf{2}$`;
      }
      else if (selectedAnswerSection === 'ans3') {
        // Section 3: Formula derivation A(1,2) to arbitrary point P(3.5, 7)
        const A = { x: 1, y: 2 };
        const P = { x: 3.5, y: 7 };

        ctx.beginPath();
        ctx.moveTo(toScreenX(-1), toScreenY(-2));
        ctx.lineTo(toScreenX(5.5), toScreenY(11));
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#6366f1';
        ctx.stroke();

        // Dashed lines to P(x, y)
        ctx.beginPath();
        ctx.setLineDash([5, 4]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#60a5fa';
        ctx.moveTo(toScreenX(A.x), toScreenY(A.y));
        ctx.lineTo(toScreenX(P.x), toScreenY(A.y));
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = '#fbbf24';
        ctx.moveTo(toScreenX(P.x), toScreenY(A.y));
        ctx.lineTo(toScreenX(P.x), toScreenY(P.y));
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = 'bold 12px JetBrains Mono';
        ctx.fillStyle = '#93c5fd';
        ctx.fillText('横の変化: x - 1', toScreenX(2.2) - 25, toScreenY(A.y) + 16);
        ctx.fillStyle = '#fde68a';
        ctx.fillText('縦の変化: y - 2', toScreenX(P.x) + 8, toScreenY(4.5));

        drawPoint(A.x, A.y, '基準点 A(1, 2)', '#ef4444', false, 7);
        drawPoint(P.x, P.y, '直線上の点 P(x, y)', '#10b981', false, 7);

        legend.innerHTML = `
          <div class="text-indigo-600 font-bold">3. 式の導出</div>
          <div>$y - 2 = 2(x - 1)$</div>
        `;
        badge.innerHTML = `「縦の変化 $= 2 \\times$ 横の変化」より $y - 2 = 2(x - 1) \\implies \\mathbf{y = 2x}$`;
      }
      else if (selectedAnswerSection === 'ans6') {
        // Section 6: Parallel and Perpendicular
        // Line 1: y = 2x
        ctx.beginPath();
        ctx.moveTo(toScreenX(-3), toScreenY(-6));
        ctx.lineTo(toScreenX(5), toScreenY(10));
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#38bdf8'; // blue
        ctx.stroke();

        // Line 2: y = 2x + 3 (Parallel)
        ctx.beginPath();
        ctx.moveTo(toScreenX(-4), toScreenY(-5));
        ctx.lineTo(toScreenX(3.5), toScreenY(10));
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#818cf8'; // purple
        ctx.stroke();

        // Line 3: y = -0.5x + 2 (Perpendicular)
        ctx.beginPath();
        ctx.moveTo(toScreenX(-3), toScreenY(3.5));
        ctx.lineTo(toScreenX(7), toScreenY(-1.5));
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#f87171'; // red
        ctx.stroke();

        // Labels
        ctx.font = 'bold 11px JetBrains Mono';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('y = 2x (傾き 2)', toScreenX(2.5), toScreenY(5) - 8);
        ctx.fillStyle = '#818cf8';
        ctx.fillText('平行線: y = 2x + 3 (傾き 2)', toScreenX(-0.5), toScreenY(5) + 12);
        ctx.fillStyle = '#f87171';
        ctx.fillText('垂直線: y = -0.5x + 2 (傾き -1/2)', toScreenX(3), toScreenY(0.5) - 8);

        // 90 deg marker at intersection (0.8, 1.6)
        const intX = 0.8, intY = 1.6;
        drawPoint(intX, intY, '', '#ffffff', false, 4);

        const angle = Math.atan(2);
        const len = 14;
        ctx.save();
        ctx.translate(toScreenX(intX), toScreenY(intY));
        ctx.rotate(-angle);
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, len, -len);
        ctx.restore();

        legend.innerHTML = `
          <div class="text-indigo-600 font-bold">6. 平行と垂直</div>
          <div>平行: 傾き等しい</div>
          <div>垂直: $m_1 m_2 = -1$</div>
        `;
        badge.innerHTML = `平行な直線は<span class="text-sky-300">傾きが同じ (2)</span>、垂直な直線は<span class="text-red-300">傾きが $-\\frac{1}{2}$</span>！`;
      }
      else if (selectedAnswerSection === 'ans7') {
        // Section 7: Distance to line y = x from P(2, 5)
        ctx.beginPath();
        ctx.moveTo(toScreenX(-2), toScreenY(-2));
        ctx.lineTo(toScreenX(7), toScreenY(7));
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#64748b';
        ctx.stroke();

        const P = { x: 2, y: 5 };
        const H = { x: 3.5, y: 3.5 };
        const otherPoint = { x: 5, y: 5 }; // Longer path for contrast

        // Contrast: long non-perpendicular line
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#f8717188';
        ctx.moveTo(toScreenX(P.x), toScreenY(P.y));
        ctx.lineTo(toScreenX(otherPoint.x), toScreenY(otherPoint.y));
        ctx.stroke();

        // Shortest perpendicular line PH
        ctx.beginPath();
        ctx.setLineDash([]);
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#10b981'; // green
        ctx.moveTo(toScreenX(P.x), toScreenY(P.y));
        ctx.lineTo(toScreenX(H.x), toScreenY(H.y));
        ctx.stroke();

        // Right angle mark at H
        const ang = Math.PI / 4;
        const size = 12;
        ctx.save();
        ctx.translate(toScreenX(H.x), toScreenY(H.y));
        ctx.rotate(-ang);
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, size, -size);
        ctx.restore();

        // Text
        ctx.font = 'bold 11px JetBrains Mono';
        ctx.fillStyle = '#10b981';
        ctx.fillText('最短距離 (垂直な垂線)', toScreenX(2.8), toScreenY(4.5));
        ctx.fillStyle = '#f87171';
        ctx.fillText('斜めは遠回り', toScreenX(3.5), toScreenY(5.2));

        drawPoint(P.x, P.y, 'P(2, 5)', '#ef4444', false, 7);
        drawPoint(H.x, H.y, '垂線の足 H(3.5, 3.5)', '#10b981', false, 7);

        legend.innerHTML = `
          <div class="text-teal-600 font-bold">7. 最短距離</div>
          <div>直線と垂線 ($90^\\circ$)</div>
        `;
        badge.innerHTML = `点Pから直線への距離は<span class="text-emerald-300 font-bold">もっとも短い線分</span>で、直線と<span class="text-amber-300 font-bold">垂直（$90^\\circ$）</span>に交わる！`;
      }
      else if (selectedAnswerSection === 'ans8') {
        // Section 8: Exit Problem 1 and 2
        // Line 1: y = 2x - 1 through A(2,3), B(6,11)
        ctx.beginPath();
        ctx.moveTo(toScreenX(-1), toScreenY(-3));
        ctx.lineTo(toScreenX(6.5), toScreenY(12));
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#f59e0b';
        ctx.stroke();

        // Line 2: y = 2x - 2 through (0,-2)
        ctx.beginPath();
        ctx.moveTo(toScreenX(-1), toScreenY(-4));
        ctx.lineTo(toScreenX(6.5), toScreenY(11));
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#818cf8';
        ctx.stroke();

        drawPoint(2, 3, 'A(2, 3)', '#f59e0b', false, 6);
        drawPoint(6, 11, 'B(6, 11)', '#f59e0b', false, 6);
        drawPoint(0, -2, '(0, -2)', '#818cf8', false, 6);

        ctx.font = 'bold 11px JetBrains Mono';
        ctx.fillStyle = '#f59e0b';
        ctx.fillText('① y = 2x - 1', toScreenX(4), toScreenY(7) + 16);
        ctx.fillStyle = '#818cf8';
        ctx.fillText('② y = 2x - 2 (平行)', toScreenX(3.5), toScreenY(5) + 16);

        legend.innerHTML = `
          <div class="text-amber-600 font-bold">8. 出口問題</div>
          <div>① $y = 2x - 1$</div>
          <div>② $y = 2x - 2$</div>
        `;
        badge.innerHTML = `① $A, B$ を通る直線 $y = 2x - 1$ &nbsp;|&nbsp; ② 平行で $(0,-2)$ を通る直線 $y = 2x - 2$`;
      }
